[project]
name = "ngdesign"
version = "0.1.0"
description = "Natural gas processing design suite: sim -> PFD -> P&ID -> piping -> isometric"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "thermo>=0.4",
    "fluids>=1.0",
    "ht>=1.0",
    "CoolProp>=6.6",
    "pyyaml>=6.0",
    "ezdxf>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=1.17.0",
    "sqlmodel>=0.0.22",
    "redis>=5.0",
]

[project.optional-dependencies]
# Postgres driver for STOMATO_DATABASE_URL=postgresql+psycopg:// (spec P3-01).
postgres = [
    "psycopg[binary]>=3.1",
]
saft = [
    "teqp>=0.22",
]
# Helmholtz-family evaluation extra (spec T-04). CoolProp currently ships as a
# core dependency as well; this extra declares the optional-evaluation contract
# for the family (rows load and refuse with CoolPropUnavailable without it).
coolprop = [
    "CoolProp>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "import-linter>=2.0",
]

[project.scripts]
ngdesign = "ngdesign.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngdesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup --timeout=120 -p no:cacheprovider"
markers = [
    "slice: end-to-end vertical slice (S-35, landed)",
]
xfail_strict = false

[tool.ruff]
line-length = 110
# Prose with illustrative code blocks; not formatted.
exclude = ["specs", "docs"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
strict = true
files = ["src", "tests"]
