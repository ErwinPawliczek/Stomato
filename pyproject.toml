[project]
name = "ngdesign"
version = "0.1.0"
description = "Natural gas processing design suite: sim -> PFD -> P&ID -> piping -> isometric"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "thermo>=0.4",
    "fluids>=1.0",
    "ht>=1.0",
    "CoolProp>=6.6",
    "pyyaml>=6.0",
    "ezdxf>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngdesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --timeout=120 -p no:cacheprovider"
markers = [
    "slice: end-to-end vertical slice (xfail until the slice lands)",
]
xfail_strict = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
files = ["src"]
