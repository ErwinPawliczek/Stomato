name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'data/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'openapi.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi.json'
            deploy:
              - 'deploy/**'
              - 'Dockerfile'
              - 'frontend/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/release.yml'

  guard:
    # Agents may not edit oracles/contracts, and one PR may not mix frontend and backend.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locked paths untouched
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'contract-change') }}
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          locked=$(echo "$changed" | grep -E '^(data/golden/|data/validation/|tests/golden/test_|tests/property/|\.github/|AGENTS\.md|frontend/AGENTS\.md|CLAUDE\.md|pyproject\.toml|uv\.lock|frontend/package\.json)' || true)
          if [ -n "$locked" ]; then
            echo "::error::PR edits locked files (needs human 'contract-change' label):"; echo "$locked"; exit 1
          fi
      - name: Frontend and backend not mixed
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'contract-change') }}
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -v '^specs/' || true)
          fe=$(echo "$changed" | grep -c '^frontend/' || true)
          be=$(echo "$changed" | grep -vc '^frontend/' || true)
          if [ "$fe" -gt 0 ] && [ "$be" -gt 0 ] && [ -n "$changed" ]; then
            echo "::error::PR touches both frontend/ and backend files. Split it."; echo "$changed"; exit 1
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # The thermo-catalogue audit test grows with the row count (65 rows: the
    # backend job measured 7 min 10 s on 2026-10-21); 20 min leaves headroom
    # for the T-02/T-04/T-05 families without hiding a genuine hang.
    # Raised to 30 on 2026-10-23: the suite measured 19 min 08 s once the
    # exothermic amine continuation landed (P1-11 R1, PR #204).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --extra saft
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -rs --durations=25
      - name: openapi.json up to date
        run: uv run python scripts/export_openapi.py && git diff --exit-code openapi.json

  audit:
    # The thermo-catalogue audit (L0 self-consistency on every row, L4 cross-model
    # pairs, every bound validation case) is its own job: inside pytest it grew
    # with the row count until the backend job hit its timeout at 120 rows
    # (2026-10-22). The audit script is the single owner of those checks.
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups --extra saft
      - run: uv run python scripts/validate_properties.py --audit
      # The unit-catalogue audit (U-00): V0 self-consistency on every implemented
      # row/level plus a freshness check on the generated docs/units pages.
      - run: uv run python scripts/validate_units.py --audit

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match openapi.json
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Spec P3-03: the chart must stay lintable and renderable on every change to
  # the deployables.
  helm:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/stomato
      - run: helm template stomato deploy/helm/stomato

  # Required status check for branch protection: passes when every job that ran passed.
  ci-ok:
    if: always()
    needs: [guard, backend, audit, frontend, helm]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then exit 1; fi
