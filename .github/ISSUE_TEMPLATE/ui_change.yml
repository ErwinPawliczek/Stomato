name: UI change (agent builds it)
description: Ask an agent to change the frontend. It opens a PR; CI must pass before merge.
labels: [frontend, agent]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Keep the @claude line to dispatch an agent. Delete it to just file the request.
      value: |
        @claude Implement this UI change. Follow frontend/AGENTS.md. Only edit files under frontend/. Open a PR titled "FE: <short title>".

        What to change:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How you will check it in the browser.
      placeholder: "- The PFD tab shows ... \n- Dragging V-101 keeps its position after refresh"
    validations:
      required: true
  - type: input
    id: layer
    attributes:
      label: Layer
      placeholder: L1 .. L8
