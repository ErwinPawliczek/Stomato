# --- L2: MeOH + H2O isobaric VLE (Gao 2012) — CPA-SRK row ------------------------------------
# Re-anchored on 2026-10-22 (issue #100 resolution): the retired Bennett (1929) 97.99 kPa
# points are inconsistent with every independent modern reference (Perry's 1-atm table and
# the ChemSep NRTL/UNIQUAC/Wilson parameterisations, PR #150 review finding). Replacement:
# Gao, Zhang, Lücking, Sun, Si, Zhu, Chen & Shi (2012) J. Thermodynamics, Article ID 641251,
# DOI 10.1155/2012/641251, methanol/water at 101.325 kPa, retrieved 2026-10-22 (open access).
# Three points of the published table; the root nrtl file carries the same source at all
# eight published x points, so this set deliberately overlaps it to give the CPA row binary
# coverage.
# pending:cpa_srk — crashes on the bridge's Wilson seed (SaturationError: no two-phase
# state at T=179.68 K, P=101325 Pa; measured T-15c 2026-10-22). Binds back when the
# saturation seed follows the regression (crashes are not declarable).
- id: meohh2o-101.325kPa-353.25K
  package: pending:cpa_srk
  components:
  - MeOH
  - H2O
  z:
    MeOH: 0.2380
    H2O: 0.762
  P: 101325.0
  source: literature:Gao, Zhang, Lücking, Sun, Si, Zhu, Chen & Shi (2012) J. Thermodynamics, Article ID 641251, DOI 10.1155/2012/641251, Table 3, isobaric 101.325 kPa (T, x measured by pump ebulliometer; y calculated via the T,p,x,HmE indirect method); open access; retrieved 2026-10-22
  expected:
    bubble_T: 353.25
    vapor_comp:
      MeOH: 0.6237
  tolerance:
    bubble_T: 0.005
