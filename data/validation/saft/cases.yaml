# T-13 validation reference cases — family F: SAFT / CPA association models.
# Spec: specs/backend/T-13-validation-data-saft.md. Schema: data/validation/cases.yaml header.
#
# Units: T [K], P [Pa abs], density [kg/m3], Cp [J/(mol K)], compositions [mole fraction].
# Tolerances follow the fixed P1-05 policy (bubble/dew P 3 %, rho 3 % liquid / 8 % vapour,
# Cp 5 %, composition 0.02 abs); isobaric bubble-temperature cases override bubble_T to 0.5 %
# and vapour composition to 0.02 abs, mirroring the root nrtl isobaric cases.
#
# Pure-fluid cases are machine-generated with the harness's CoolProp formula
# (scripts/validate_properties.py regen_coolprop, CoolProp 8.0.0) — never hand-typed.
# Binary and canonical cases are hand-typed from the cited open sources with the retrieval
# date; sources were not machine-fetched into the expected values.
#
# Layer assignment (per spec L1/L2/L3):
#   L1 pure          : pure-C1-*, pure-CO2-* (PC-SAFT row), pure-H2O-*, pure-MeOH-* (CPA-SRK row).
#   L2 binary        : c1co2-* (Petropoulou 2018, PC-SAFT row) and
#                      meohh2o-*101.325kPa* (Gao 2012, CPA-SRK row).
#   L3 canonical     : meohh2o-*322.91K* (Bayer 1927 isotherm; near-pure-MeOH rectification
#                      region where CPA association chemistry dominates — the family's
#                      L3-associating case).
#
# The pc_saft / cpa_srk bindings went live in T-15c (2026-10-22): the 16 pure-C1/CO2
# cases bind to pc_saft and the 19 MeOH cases to cpa_srk (TeqpPackage rows, T-07 PR #156)
# with both rows promoted to provisional; every failing case/property pair carries a
# row-level `assessed` entry with the measured numbers in saft.yaml. Three of the 19
# MeOH cases went back to `pending:cpa_srk` the same day: they crash
# (SaturationError: no two-phase state at the Wilson seed T=179.68 K on the 101.325 kPa
# isobar) and crashes are not declarable — the same policy as the four former
# pending:teqp-gerg2008 cases in data/validation/helmholtz/cases.yaml. The other
# saft.yaml rows (pc_saft_polar, saft_vr_mie, cpa_pr, multifluid) inherit this family's
# coverage through their `validation:` lists in data/thermo_models/saft.yaml and the
# root package:all pure cases.
