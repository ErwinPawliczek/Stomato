# T-18 teqp-backed row bindings (spec specs/backend/T-18-teqp-backed-promotions.md).
#
# Each case is a COPY of an existing case in data/validation/ (saft/ or helmholtz/)
# rebound to the teqp-backed row that runs it: same components, z, T and `expected`
# values, only `package:` changed. Pure cases keep the harness's CoolProp-generated
# expected values (never hand-typed); binary and AGA8 cases keep the original cited
# literature sources verbatim. Never edit `expected` here — edit (or regenerate) the
# original binding and copy again.
#
# - saft_vr_mie      : pure C1/C2-class alkane psat points, pure CO2, C1/CO2 VLE (Petropoulou 2018)
# - multifluid       : C1/CO2 VLE (Petropoulou 2018), C1/N2 VLE (Janisch 2007), AGA8 binary dew points
# - multifluid_pure  : pure-fluid NIST points (CH4, CO2 via CoolProp reference; H2O via NIST WebBook)
# - gerg2008_teqp    : GERG-2008 model-calculated check values from the NIST AGA8 distribution
#   (AGA Report No. 8 Parts 1&2 supplementary tables, GERG-2008 column; the open,
#   public-domain check-value source for the Kunz & Wagner 2012 formulation) plus the
#   Janisch 2007 C1/N2 VLE point
