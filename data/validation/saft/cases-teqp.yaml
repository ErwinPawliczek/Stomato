# T-18 teqp-backed row bindings (spec specs/backend/T-18-teqp-backed-promotions.md).
#
# Each case is a COPY of an existing case in data/validation/ (saft/ or helmholtz/)
# rebound to the teqp-backed row that runs it: same components, z, T and `expected`
# values, only `package:` changed. Pure cases keep the harness's CoolProp-generated
# expected values (never hand-typed); binary and AGA8 cases keep the original cited
# literature sources verbatim. Never edit `expected` here — edit (or regenerate) the
# original binding and copy again.
#
# Measured in T-18 and NOT bound (crashes and solver artifacts are not declarable):
# - saft_vr_mie c1co2 at 298.142K/7.508MPa, 303.145K/7.306MPa, 303.144K/7.361MPa —
#   SaturationError (bubble point: no convergence) on the near-critical Petropoulou points
# - multifluid c1co2 at the same five near-critical points — same SaturationError
# - multifluid_pure pure-CO2-265.0K/285.0K/288.9K — the bridge's pure-fluid saturation
#   scan loses the CO2 loop above ~250 K on the multi-fluid surface (returns a wrong
#   root, e.g. 196479 Pa at 285 K where the reference is 4712303 Pa, or refuses with
#   "at/above Tc" at 265 K); the model itself is exact where the scan works (250 K:
#   1785034 Pa measured, reference 1785000 Pa class)
# - gerg2008_teqp aga8-ng2-165.933K/169.184K-dew — with the AGA8 trace hexane
#   (C6+ = 2e-5) teqp's dew collapses to a spurious low-pressure root (81.97 kPa vs
#   1.17898 MPa and 0.610 vs 2.0497 MPa; without the trace C6+ the same feed converges
#   sanely) — teqp's bundled binary-pair file carries no Kunz-Wagner C1/nC6 pair (bare
#   Lorentz-Berthelot); aga8-ng2-176.240K-dew — SaturationError, no convergence
