# Propane + dimethyl ether isothermal VLE for the pc_saft_polar row (val-saft2, 2026-11-09).
#
# Horstmann, Birke & Fischer (2004) J. Chem. Eng. Data 49, 38-42: total pressure over the liquid
# composition at 313.19 K by the static (closed-cell) method. Values transcribed by script from the
# NIST TRC ThermoML XML of the paper (retrieved 2026-11-09): P kPa -> Pa (x1000), x as printed
# (propane), DME = 1 - x_propane. Every interior point of the isotherm is bound (no selection); the
# pure end points are pure Psat, not binary cases. The paper's vapour compositions are not used:
# a static synthetic P-x measurement does not sample the vapour, so y is a derived quantity.
# Model inputs: DME from the Gross & Vrabec (2006) polar set, propane from Gross & Sadowski (2001)
# Table 1 (the pc_saft block), k_ij = 0 — nothing fitted to these points. Tolerance: the fixed P1-05
# bubble_P policy (3 %).
