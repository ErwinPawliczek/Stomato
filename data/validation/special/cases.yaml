# hoc_dimer / hf_hexamer L1 (pure_cases): pure-acid saturation through the row's own flash
# (bubble point of the pure associating component; the PhiSat liquid makes it the row's
# Psat correlation). Antoine values are evaluated from the NIST-printed coefficients at the
# stated T (log10(P/bar) = A - B/(T/K + C)) - the coefficients are NIST's fit to the cited
# authors' data, inside its stated range. These test the vapour-pressure correlation the
# row runs on, not the association constants (no harness case type exists for the
# associated-vapour Z or the latent heat; see the rows' notes).
- id: acoh-pure-tboil-nist
  package: [hoc_dimer]
  components: [AcOH]
  z: {AcOH: 1.0}
  P: 101325.0
  expected:
    bubble_T: 391.2
  source: >-
    NIST Chemistry WebBook (SRD 69), acetic acid, Phase change data table, T boil = 391.2 +/- 0.6 K
    (AVG of 80 of 90 values); https://webbook.nist.gov/cgi/cbook.cgi?ID=C64197&Mask=4, retrieved 2026-11-04.
- id: acoh-pure-psat-320K-mcdonald
  package: [hoc_dimer]
  components: [AcOH]
  z: {AcOH: 1.0}
  T: 320.0
  expected:
    bubble_P: 6618.9
  source: >-
    NIST Chemistry WebBook (SRD 69), acetic acid, Phase change data, Antoine Equation Parameters table
    (290.26-391.01 K: A 4.68206, B 1642.54, C -39.764; NIST fit to McDonald, Shrader et al. 1959),
    evaluated at 320.0 K; https://webbook.nist.gov/cgi/cbook.cgi?ID=C64197&Mask=4, retrieved 2026-11-04.
- id: acoh-pure-psat-360K-mcdonald
  package: [hoc_dimer]
  components: [AcOH]
  z: {AcOH: 1.0}
  T: 360.0
  expected:
    bubble_P: 35719.5
  source: >-
    NIST Chemistry WebBook (SRD 69), acetic acid, Phase change data, Antoine Equation Parameters table
    (290.26-391.01 K: A 4.68206, B 1642.54, C -39.764; NIST fit to McDonald, Shrader et al. 1959),
    evaluated at 360.0 K; https://webbook.nist.gov/cgi/cbook.cgi?ID=C64197&Mask=4, retrieved 2026-11-04.
- id: hf-pure-tboil-streng
