# Family H (special) validation cases (spec T-14 #145; bound 2026-11-04, val-special).
#
# History: this file was empty while data/validation/ was locked; the candidate list
# and why each stayed unbound is in docs/thermo-catalogue-plan.md (special family) and
# the rows' notes in data/thermo_models/special.yaml.
#
# ideal_solid (SLE, solubility(cid, T) surface; harness case type `solubility`,
# TOLERANCE_POLICY 5 %):
#   L1 (pure_cases): the pure solute's melting point, the one pure-component
#     observable of an ideal-solubility row: x_sat(T) = 1 at the published Tfus.
#     Read the band honestly: 5 % in x at Tm is +/- ~2.7 K in Tm for naphthalene
#     (d ln x/dT = dHfus/(R Tm^2)); it checks the row's tabulated Tm against an
#     independent evaluated value and does NOT test dHfus (the L2 slope does).
#   L2 (binary_cases): IUPAC-NIST Solubility Database points for aromatic solids in
#     benzene. The rows were picked by position before the model was run (all
#     McLaughlin & Zainal rows; every fourth Ward row; the single-point and
#     evaluated values), not by result. The row has no fitted parameters (tabulated
#     Tm / CRC Hfus), so every point is independent evidence.
#   Component numbering on the NIST pages: the page header lists "(1) Benzene
#     (2) <solute>" alphabetically, but the tabulated x1 is the SOLUTE mole fraction
#     (the evaluations state "Ln x1 ... for variation of <solute> solubility"); x1
#     is entered as the solute fraction here.

meta:
  coolprop_version: 8.0.0

pure_cases:
- id: sle-pure-naphthalene-tfus-nist
  package: [ideal_solid]
  components: [naphthalene]
  z: {naphthalene: 1.0}
  T: 353.2
  expected:
    solubility: {naphthalene: 1.0}
  source: >-
    NIST Chemistry WebBook, NIST Standard Reference Database 69 (Linstrom & Mallard eds.),
    naphthalene, Phase change data table, T fus = 353.2 +/- 0.7 K (average of 55 of 57 values), AVG;
    https://webbook.nist.gov/cgi/cbook.cgi?ID=C91203&Mask=4, retrieved 2026-11-04.
  note: >-
    Melting point as x_sat = 1 (pure solid in equilibrium with its own melt); checks the
    row's tabulated Tm only (see header).
