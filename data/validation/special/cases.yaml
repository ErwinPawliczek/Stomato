    (Streng, J. Chem. Eng. Data 16, 357 (1971); TRC uncertainty 0.25 K);
    https://webbook.nist.gov/cgi/cbook.cgi?ID=C7664393&Mask=4, retrieved 2026-11-04.
- id: hf-pure-psat-278.15K-sheft
  package: [hf_hexamer]
  components: [HF]
  z: {HF: 1.0}
  T: 278.15
  expected:
    bubble_P: 58422.6
  source: >-
