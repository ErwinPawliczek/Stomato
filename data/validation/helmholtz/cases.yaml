# T-13 validation reference cases — family D: Helmholtz / reference equations.
# Spec: specs/backend/T-13-validation-data-helmholtz.md. Schema: data/validation/cases.yaml header.
#
# Units: T [K], P [Pa abs], density [kg/m3], Cp [J/(mol K)], compositions [mole fraction].
# Tolerances follow the fixed P1-05 policy (bubble/dew P 3 %, rho 3 % liquid / 8 % vapour,
# Cp 5 %, composition 0.02 abs); no per-case overrides are used in this file.
#
# Pure-fluid cases are machine-generated with the harness's CoolProp formula
# (scripts/validate_properties.py regen_coolprop, CoolProp 8.0.0) — never hand-typed.
# Binary and canonical cases below are hand-typed from the cited open sources with the
# retrieval date; sources were not machine-fetched into the expected values.
#
# Layer assignment (per spec L1/L2/L3):
#   L1 pure          : pure-C1-*  (BWRS row), pure-CO2-* (GERG-2008 row); H2O pure coverage for
#                      the IAPWS row also comes from the root cases.yaml pure-H2O-* (package: all)
#                      plus the hand-typed NIST water points below.
#   L2 binary        : c1n2-* (Janisch 2007), c1co2-* (Petropoulou 2018), aga8-c1n2-* (AGA8).
#   L3 canonical     : aga8-ng2-* (GERG-2008 natural-gas boundary points) and
#                      h2o-nist-* (NIST WebBook water saturation points, IAPWS row).
#
# `package: pending:<id>` cases stay skipped until the registering spec lands (T-01/T-12
# pending convention). The pending ids and the rows they are meant to bind to (T-04 owns
# data/thermo_models/helmholtz.yaml):
#   pending:iapws95  -> IAPWSPackage (IAPWS-95 water)
#   pending:gerg2008 -> GERG-2008 mixture row (CoolProp HEOS GERG mixture backend / teqp multifluid)
#   pending:bwrs     -> BWRSPackage (Starling 1973)
# If T-04 registers different row ids, update these `package:` fields in the same PR.
#
# T-04 binding decisions (row ids registered as named above):
#   - h2o-nist-* bound to iapws95; pure-CO2-* and the L2 binaries + aga8-c1n2-* bound to
#     gerg2008 (the row evaluates CoolProp's multifluid mixture model; deviations against
#     the GERG-2008/AGA8 reference values are within the case tolerances or reported in
#     the validation findings).
#   - pure-C1-* stay pending:bwrs: the 1973-databasis BWRS vapour-pressure fit does not
#     reproduce the CoolProp references within the 3 % tolerance; kept for the L1 follow-up.
#   - aga8-ng2-* stay pending:gerg2008: the cases map hexane+heptane to C6+, which the
#     GERG row refuses until the teqp bridge (T-07) brings the C6+ mapping.
