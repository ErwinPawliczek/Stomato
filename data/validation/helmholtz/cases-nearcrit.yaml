# Near-critical CO2 + N2 bubble points (val-aqueous, 2026-11-09). These crashed the CoolProp-path
# saturation solver (SaturationError) before the composition-continuation fallback in
# _HelmholtzSurface._ss_solve; values parsed from the ThermoML XML (fetched 2026-11-09).
# The Westman 269.997 K / 9557.1 kPa dew point (y_CO2 0.58169 +/- 0.00401) is not bound: the
# model's lowest dew-curve CO2 fraction at that T is about 0.5822 (PT flash at 9.72 MPa), so a
# vapour of y 0.58169 has no dew point in EOS-CG / GERG-2008 (a 0.0005 difference, inside the
# stated uncertainty, but not a computable dew pressure). Tolerance: policy bubble_P 3 %.
binary_cases:
- id: helm-co2n2-298.161K-7.100MPa-bubble
  package: [eos_cg, coolprop_heos, gerg2008]
  components: [CO2, N2]
  z: {CO2: 0.98384, N2: 0.01616}
  T: 298.161
  source: 'literature:Westman, S. F., Stang, H. G. J., Lovseth, S. W., Austegard, A., Snustad, I., Storset, S. O., Ertesvag, I. S., "Vapor-liquid equilibrium data for the carbon dioxide and nitrogen (CO2+N2) system at the temperatures 223, 270, 298 and 303 K and pressures up to 18 MPa", Fluid Phase Equilib. 409, 207-241, 2016, doi:10.1016/j.fluid.2015.09.034; NIST TRC ThermoML archive record https://trc.nist.gov/ThermoML/10.1016/j.fluid.2015.09.034.xml, PureOrMixtureData dataset 2 (liquid-phase CO2 mole fraction), T = 298.161 K, p = 7100.3 kPa, CO2 mole fraction 0.98384 (U 0.00056); retrieved 2026-11-09'
  expected:
    bubble_P: 7100300.0
- id: helm-co2n2-298.162K-7.419MPa-bubble
  package: [eos_cg, coolprop_heos, gerg2008]
  components: [CO2, N2]
  z: {CO2: 0.97525, N2: 0.02475}
  T: 298.162
  source: 'literature:Westman, S. F., Stang, H. G. J., Lovseth, S. W., Austegard, A., Snustad, I., Storset, S. O., Ertesvag, I. S., "Vapor-liquid equilibrium data for the carbon dioxide and nitrogen (CO2+N2) system at the temperatures 223, 270, 298 and 303 K and pressures up to 18 MPa", Fluid Phase Equilib. 409, 207-241, 2016, doi:10.1016/j.fluid.2015.09.034; NIST TRC ThermoML archive record https://trc.nist.gov/ThermoML/10.1016/j.fluid.2015.09.034.xml, PureOrMixtureData dataset 2 (liquid-phase CO2 mole fraction), T = 298.162 K, p = 7419.1 kPa, CO2 mole fraction 0.97525 (U 0.00057); retrieved 2026-11-09'
  expected:
    bubble_P: 7419100.0
