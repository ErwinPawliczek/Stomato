# T-12 mixing-rule family (C) validation reference cases (spec
# specs/backend/T-12-validation-data-gamma_phi.md; layers per docs/thermo-catalogue-plan.md sec. 3).
#
# All nine predictive gE-mixing rows (PSRK, VTPR, PR-MHV1, PR-MHV2, SRK-MHV2, PR-Wong-Sandler,
# SRK-Wong-Sandler, PR-Huron-Vidal, LCVM) are planned catalogue rows that do not exist on main
# yet, so every case is package: pending:<id> (id = snake_case method name from the plan).
# The harness SKIPS pending cases until the id registers; cases go live unchanged.
#
# Each row gets >= 4 L1 pure cases, 2 L2 binary points (MeOH/H2O) and the family's
# L3-polar-high-P case (C1/H2O methane solubility in water at 13.1 / 45.0 MPa, the polar
# compound water at high pressure). The same case pool serves all rows; the row `validation:`
# lists in data/thermo_models/mixing.yaml reference these case ids.
#
# Sections and units: T [K], P [Pa abs], compositions [mole fraction]. Tolerances fixed per
# the P1-05 conventions BEFORE running: bubble_T 0.5 % relative, y 0.02 absolute, bubble/dew P
# 3 %, liquid_comp 0.02 absolute (see docs/validation.md).
#
# Pure-fluid `expected` values were machine-generated with CoolProp 8.0.0 PropsSI at Q=0/1
# exactly as `scripts/validate_properties.py --regen-coolprop` does for the root
# data/validation/cases.yaml (that command manages only the root file; this file's pure values
# were generated by the same path and are never hand-typed).
