# Shared gE-mixing-rule reference cases (val-cubic-mixing, 2026-11-04).
# Programmatic copies of root data/validation/cases.yaml cases (same expected values and citations),
# with `package:` lists binding all nine mixing rows: the full Gao et al. 2012 MeOH/H2O 101.325 kPa
# isobar (8 points, independent of the ChemSep NRTL and UNIFAC parameter sets) and pure-limit
# CoolProp points (the rules reduce to their host cubic for a pure fluid). The UNIFAC rows refuse
# C3 (no group assignment), so the C3 point binds only the NRTL-hosted rows.
pure_cases:
- id: mix-pure-nC4-280K
  fluid: nC4
  coolprop_fluid: n-Butane
  package: &id001
  - psrk
  - vtpr
  - lcvm
  - pr_huron_vidal
  - pr_wong_sandler
  - srk_wong_sandler
  - pr_mhv1
  - pr_mhv2
  - srk_mhv2
  components:
  - nC4
  z:
    nC4: 1.0
  T: 280.0
  source: coolprop:n-Butane
  expected:
    bubble_P: 132816.54823974936
    dew_P: 132816.54823974936
    rho_V: 3.4895818108256678
    rho_L: 593.2939677646473
    Cp: 136.27982819611634
- id: mix-pure-C3-240K
  fluid: C3
  coolprop_fluid: Propane
  package:
  - pr_huron_vidal
  - pr_wong_sandler
  - srk_wong_sandler
  - pr_mhv1
  - pr_mhv2
  - srk_mhv2
  components:
  - C3
  z:
    C3: 1.0
  T: 240.0
  source: coolprop:Propane
  expected:
    bubble_P: 147999.7318177371
    dew_P: 147999.7318177371
    rho_V: 3.438295755767666
    rho_L: 570.393722906484
    Cp: 100.94294433491739
