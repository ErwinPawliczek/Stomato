  package: pending:cosmo_sac_ig
  components:
  - H2O
  - MEG
  z:
    H2O: 0.999
    MEG: 0.001
  P: 100000.0
  source: "literature:Chouireb et al. (2018) J. Chem. Eng. Data 63(7), 2394 ff., DOI 10.1021/acs.jced.7b00945, SI Table S1, 0.1 MPa column; retrieved 2026-11-04"
  expected:
    bubble_T: 372.60
  tolerance:
    bubble_T: 0.005
