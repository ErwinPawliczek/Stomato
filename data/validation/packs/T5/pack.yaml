# T5 pack — COSMO-SAC independent validation (VLE cases).
#
# Task T5 (agents/BOARD.md, branch agents-board). Independent of Hsieh et al. (2014)
# Table 6 and of the NIST COSMOSAC repository's own validation outputs (both already
# used elsewhere): the sources below are open experimental measurements, retrieved and
# transcribed 2026-11-04 (see README.md for full citations and retrieval trail).
#
# Cases are named `pending:cosmo_sac_ig` — the planned catalogue row for COSMO-SAC with
# ideal-gas vapour phase (docs/thermo-catalogue-plan.md family B, row 6, currently unbuilt
# pending sigma-profile licensing). The harness skips these until the row registers;
# this pack is bound by the Stomato bot (data packs use pack.yaml, not cases*.yaml).
#
# Systems: water(1) + ethylene glycol(2) and water(1) + triethylene glycol(2), isobaric
# ebulliometric T-x at nominal 0.1 MPa. No vapour compositions are tabulated in the open
# source (only gamma_H2O derived from boiling temperatures), so `expected` carries
# bubble_T only.
#
# Source (both systems): Chouireb, Crespo, Pereira, Tafat-Igoudjilene, Vega, Coutinho &
# Carvalho, "Measurement and Modeling of Isobaric Vapor-Liquid Equilibrium of Water +
# Glycols", J. Chem. Eng. Data 2018, 63(7), 2394 ff., DOI 10.1021/acs.jced.7b00945,
# Supporting Information Tables S1 (H2O + EG) and S3 (H2O + TriEG), 0.1 MPa columns.
# SI URL (open access):
# https://pubs.acs.org/jceaax/article-supplement/1567794/pdf/je7b00945_si_001/
# Retrieved 2026-11-04. Reported uncertainties: u(x) = 0.001, u(T) = 1 K, ur(p) = 0.005.
# Units: T [K], P [Pa abs], mole fractions. 0.1 MPa transcribed as 100000 Pa.
#
# Tolerances: bubble_T 0.5 % relative (P1-05 convention, docs/validation.md). The 1 K
# measurement uncertainty is <= 0.5 % at these temperatures, so it fits the default.
