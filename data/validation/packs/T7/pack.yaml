# T7 validation pack: acetic acid / water VLE for the hoc_dimer row
# (Hayden-O'Connell-family dimerizing-acid gamma-phi, data/thermo_models/special.yaml).
# Generated 2026-11-04 by Obvious (task T7). Units: T [K], P [Pa abs], mole fractions.
#
# Contents:
#  - 23 isobaric binary points at atmospheric pressure, Sebastiani & Lacquaniti,
#    Chem. Eng. Sci. 22 (1967) 1155-1162, Table 1, p. 1157
#    (DOI 10.1016/0009-2509(67)80182-9; open PDF). x,y are WATER mole fractions
#    as printed; z/vapor_comp here are keyed per component.
#  - 44 isothermal binary bubble-pressure points (no measured vapour composition;
#    static-analytical p-x), Román-Ramírez & Leeke, J. Chem. Eng. Data 61 (2016)
#    2078-2082, Table 2 (DOI 10.1021/acs.jced.5b01104; open copy on Cranfield
#    CERES). Pure-water anchors (x_AcOH = 0) are in data.csv only, not cases.
#  - 8 pure-acetic-acid saturation cases: Antoine-equation evaluations computed
#    from the McDonald, Shrader & Stull (1959) parameters as published on the
#    NIST Chemistry WebBook (marked 'computed' - derived values, not measurements),
#    plus two measured anchors (NIST TRC T_boil average; Sebastiani reagent b.p.).
#
# Every value is transcribed from a source retrieved on 2026-11-04; see data.csv
# for the per-point citation (DOI/URL, table, page, retrieval date). Nothing is
# fitted, tuned or interpolated. OCR caveats for the 1967 table (open PDF text
# layer): '0440'->0.440 and '0641'->0.641 leading-zero artefacts; all other digits
# legible. The 1967 runs state 'atmospheric pressure' without a barometric reading;
# P = 101325 Pa is the standard-atmosphere convention, flagged per point in data.csv.
#
# Binding notes for the Stomato bot:
#  - package: hoc_dimer is the registered special row (ngdesign.thermo.special:
#    HaydenOConnellDimerPackage, component key AcOH in
#    data/thermo_params/special/association.yaml). data/components.yaml has NO
#    AcOH entry - cases will not resolve until AcOH is curated (NOT FOUND there;
#    CAS 64-19-7).
#  - Per the hoc_dimer row notes (T-19), this package's liquid side is ideal on
#    apparent composition and liquid non-ideality dominates the AcOH/H2O K-values;
#    binding these binary cases as pass/fail acceptance needs either a regressed
#    GE pair with this vapour model or widened tolerances - the decision is not
#    made here. The pack pins the DATA, independent of that decision.
#  - Tolerances follow the P1-05 conventions: bubble_T 0.5 % relative, y 0.02
#    absolute, bubble/dew P 3 % relative.
