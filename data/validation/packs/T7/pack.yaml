  - H2O
  z:
    AcOH: 0.135
    H2O: 0.865
  P: 101325
  source: "literature:Sebastiani, E.; Lacquaniti, L., Chem. Eng. Sci. 22 (1967) 1155-1162, DOI 10.1016/0009-2509(67)80182-9, Table 1 'Experimental runs', p. 1157; open PDF: https://webdelprofesor.ula.ve/ingenieria/marquezronald/wp-content/uploads/Chemical-Engineering-Science-Volume-22-issue-9-1967-E.-Sebastiani-Acetic-acid%E2%80%94water-system-thermodynamical-correlation-of-vapor%E2%80%94liquid-equilibrium-data.pdf; retrieved 2026-11-04"
  expected:
    bubble_T: 373.95
    vapor_comp:
      H2O: 0.907
  tolerance:
    bubble_T: 0.005
    vapor_comp: 0.02
