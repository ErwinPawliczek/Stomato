# T6 data pack — polymer-solvent VLE (solvent activity / total pressure) from open
# sources INDEPENDENT of Kiss et al. (2009) and of Lieu/Prausnitz/Gauthier LBNL-43073.
#
# Contents: three systems, 59 binary cases (pure-solvent anchors live only in data.csv).
#   S1  toluene (1) + polystyrene (2) at 363.15 / 373.15 / 383.15 K
#       Pavlicek, Bogdanic & Wichterle, Chem. Biochem. Eng. Q. 29 (2015) 1-4, Table 2, p. 2,
#       doi:10.15255/CABEQ.2015.2183 — open full text https://hrcak.srce.hr/file/202639.
#       Ebulliometric total pressure; polymer Mw = 250,000 g/mol (Mw/Mn = 1.2), Table 1, p. 2.
#       Paper prints a1 = P1/P1o; a1 reproduces from the printed P columns to 4 decimals
#       (spot-checked all three isotherms, retrieval 2026-11-04).
#   S2  four binaries at 323.15 K (50 C): chloroform+PS, acetone+PMMA,
#       methyl acetate+PS, methyl acetate+PMMA.
#       Tanbonliong, J. O.; Prausnitz, J. M., "Vapor-Liquid Equilibria for Some Binary and
#       Ternary Polymer Solutions", eScholarship (University of California) 1996,
#       https://escholarship.org/uc/item/8wq3x5wd — Table 2 "Vapor-Liquid Equilibrium Data for
#       Binary Polymer+Solvent Systems at 50 C", p. 18; pure-solvent vapour pressures from
#       Table 1 ("Polymer Characteristics and Solvent Vapor Pressures at 50 C"), p. 18.
#       Gravimetric-sorption method; polymer Mw: PS 50,000 / PMMA 125,000 g/mol (Table 1).
#       Only rows the thesis reports as new measurements of THIS work are packed here.
#   S3  2-butanone (1) + poly(methyl methacrylate) (2) at 333.15 / 343.15 / 353.15 K
#       Pavlicek, Bogdanic & Wichterle, Chem. Biochem. Eng. Q. 28 (2014) 447-450, Table 2,
#       p. 448, doi:10.15255/CABEQ.2014.19388 — open full text https://hrcak.srce.hr/file/195544.
#       Ebulliometric total pressure; polymer Mw = 15,000 g/mol (Mw/Mn = 1.18), Table 1, p. 448.
#
# Units: T [K], P [Pa abs], compositions [mole fraction] (weight fractions are in data.csv,
# one row per point, with the same citations). All temperatures are exactly the published
# isotherms; pressures are the published kPa values x 1000.
#
# Mole fractions: computed from the published weight fractions with polymer Mw as stated
# above and solvent Mw from NIST WebBook (retrieval 2026-11-04): toluene 92.1384
# (CAS 108-88-3), acetone 58.0791 (CAS 67-64-1), 2-butanone 72.1057 (CAS 78-93-3),
# chloroform 119.378 (CAS 67-66-3), methyl acetate 74.0785 (CAS 79-20-9).
# The solvent and polymer pseudo-component z below are mole fractions of the
# solvent molecule and the polymer CHAIN (one polymer molecule per chain).
#
# Package bindings (intentionally pending, per the pack policy):
#   S1 -> pending:polymer_pc_saft  : PC-SAFT parameters for toluene + POLY_PS exist
#        (data/thermo_params/special/polymer.yaml, Gross & Sadowski 2001 toluene /
#        AlHammadi & Abutaqiya 2020 PS Mw = 400,000) with k_ij = 0; the bridge runs blind.
#        NOTE: the packed PS sample is Mw = 250,000 while the shipped POLY_PS
#        pseudo-component is Mw = 400,000; the polymer-MW sensitivity of an ideal-mixing
#        k_ij = 0 flash is what binding would test. No k_ij value is shipped (tuning is
#        forbidden).
#   S2/S3 -> pending:flory_huggins : NO FH chi (or any) parameters exist in
#        data/thermo_params/special/polymer.yaml for chloroform/PS, acetone/PMMA,
#        methyl acetate/PS, methyl acetate/PMMA or 2-butanone/PMMA — NOT FOUND this session
#        (no open published parameter transcription located); no pair was fitted.
#        Binding awaits parameter curation by the Stomato bot.
#
# NOT FOUND this session (searched 2026-11-04, open-web + NIST ThermoML/TRC + eScholarship):
# - polyisobutylene/pentane and polyethylene/hexane open numeric tables with polymer MW
#   stated: the classic PIB sources (e.g. Flory-type vapour-sorption isotherms, J. Polym.
#   Sci. Polym. Phys. Ed. 20 (1982) — doi:10.1002/pol.1982.180200503, PIB Mw = 4.7e6) are
#   paywalled; NOT FOUND (paywalled: https://doi.org/10.1002/pol.1982.180200503 and the
#   Wohlfarth/Landolt-Boernstein compilations, doi:10.1007/978-3-540-88057-8_264 et seq.).
# - Pseudo-component registrations for PMMA (any Mw): NOT FOUND in this repo (only POLY_PS
#   of P1-07 exists). S2/S3 cases name POLY_PMMA_125K / POLY_PMMA_15K as the pseudo-component
#   ids a future curation would register; they are construction-refused until then, which is
#   the intended fail-loud behaviour.
#
# Retrieval date for every value below: 2026-11-04. Sources were read as open full text
# (HrCak PDFs, eScholarship essay page); nothing was machine-fetched into the expected values.

meta:
  pack: T6
  family: special
  basis: weight-fraction solvent/polymer data converted to mole fractions as noted above
  retrieved: '2026-11-04'
  independent_of: [Kiss et al. 2009, Lieu/Prausnitz/Gauthier LBNL-43073]

