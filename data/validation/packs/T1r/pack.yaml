# T1r validation pack: ethanol(1) + water(2) isobaric VLE at 101.3 kPa for the
# registered NRTL package (task T1r, agents/BOARD.md branch agents-board).
# Generated 2026-11-04 by Obvious. Units: T [K], P [Pa abs], mole fractions.
#
# Source (all points): Lai, H.-S.; Lin, Y.-F.; Tu, C.-H., "Isobaric (vapor + liquid)
# equilibria for the ternary system of (ethanol + water + 1,3-propanediol) and three
# constituent binary systems at P = 101.3 kPa", J. Chem. Thermodyn. 68 (2014) 13-19,
# DOI 10.1016/j.jct.2013.08.020. Transcribed 1:1 from the open NIST ThermoML XML
# (https://trc.nist.gov/ThermoML/10.1016/j.jct.2013.08.020.xml), retrieved 2026-11-04:
#   dataset 9  - boiling temperature vs liquid mole fraction (16 points);
#   dataset 10 - vapour mole fraction vs liquid mole fraction (16 points);
#   dataset 11 - azeotropic temperature 351.32 K at 101.3 kPa;
#   dataset 12 - azeotropic composition x_EtOH = 0.891 at 101.3 kPa.
# The ThermoML record's ethanol basis was verified against the pure-component anchors
# (x=1: 351.45 K = ethanol n.b.p.; x=0: 373.15 K = water n.b.p.) and the azeotrope
# composition (0.891, consistent with the known ~0.895 ethanol azeotrope).
#
# The source pressure is 101.3 kPa as printed (title and ThermoML constraint 101.3);
# it is recorded as 101300 Pa. It is NOT silently upgraded to 101.325 kPa.
#
# Cases: 14 interior binary points + the azeotrope = 15. The two pure anchors
# (x = 0 and 1) are in data.csv only, not cases (pure vapour-pressure checks are
# covered by other packs).
#
# Binding notes for the Stomato bot:
#  - package: nrtl is the registered NRTL package (these cases RUN when bound).
#  - 2026-11-09 (val-gphi2): the same points are also bound to the van Laar rows
#    (vanlaar_ig/rk/hoc/nothnagel/pr; list-valued package), whose EtOH/H2O pair was fitted
#    to a different measurement (the Bayer 1927 azeotrope), so these are independent L2 for them.
#  - EtOH is NOT in the curated data/components.yaml slate (locked) - the cases will
#    not resolve until EtOH is curated (CAS 64-17-5). This mirrors the existing
#    gamma-phi case nrtl-ig-etohh2o-azeotrope-101.325kPa, which uses the same id.
#  - Tolerances follow the P1-05 conventions (docs/validation.md): bubble_T 0.5 %
#    relative, y 0.02 absolute.
#  - Pack (a) of task T1r (ethane/propane binary VLE for Peng-Robinson) is NOT FOUND -
#    see README.md in this directory for the full retrieval trail.

