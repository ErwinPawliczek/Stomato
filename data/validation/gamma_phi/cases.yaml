# T-12 gamma-phi family (B) validation reference cases (spec
# specs/backend/T-12-validation-data-gamma_phi.md; layers per docs/thermo-catalogue-plan.md sec. 3).
#
# This file pools the L1 (pure), L2 (binary) and L3 (azeotropic distillation) literature
# cases for the gamma-phi catalogue rows. Package naming:
#   package: nrtl          -- the registered NRTL package; these cases RUN today.
#   package: pending:<id>  -- a planned thermo-catalogue row id from
#     docs/thermo-catalogue-plan.md family B (snake_case of the method name). The harness
#     SKIPS these until <id> registers in the registry; they then go live unchanged.
# The five vapour-model pairings of each liquid model (ideal gas / Hayden-O'Connell /
# Nothnagel virial / RK / PR vapour, ids <liquid>_ig, <liquid>_hoc, <liquid>_nothnagel,
# <liquid>_rk, <liquid>_pr) share the same case pool; each row's `validation:` list in
# data/thermo_models/gamma_phi.yaml references these case ids.
#
# Sections and units: T [K], P [Pa abs], compositions [mole fraction]. Tolerances fixed per
# the P1-05 conventions BEFORE running: bubble_T 0.5 % relative, y 0.02 absolute,
# bubble/dew P 3 % (see docs/validation.md). A case may override per property via `tolerance`.
#
# Pure-fluid `expected` values were machine-generated with CoolProp 8.0.0 PropsSI at Q=0/1
# exactly as `scripts/validate_properties.py --regen-coolprop` does for the root
# data/validation/cases.yaml (that command manages only the root file; this file's pure
# values were generated by the same path and are never hand-typed).
#
# Known gaps (documented deviations, see PR / issue):
# - ethanol/water, acetone/chloroform, benzene/toluene, water/toluene LLE cases from the spec's
#   aspirational list need component ids that are not in the locked curated component set
#   (data/components.yaml); the ethanol/water azeotrope L3 case is included and goes live when
#   EtOH is curated and the rows register.
# - TEG/water: no open numeric source retrievable; omitted.
# - MeOH/nC4 Courtial point measured on the registered nrtl package: bubble_P 323521 Pa vs
#   336600 Pa expected (3.9 % > 3 % tolerance) - filed as a GitHub issue; the case is kept as
#   pending:nrtl_pr with the measured value recorded in the PR body.
pure_cases:
- id: pure-MeOH-305K-nrtl
  package: nrtl
  fluid: MeOH
  coolprop_fluid: Methanol
  components:
  - MeOH
  z:
    MeOH: 1.0
  T: 305.0
  source: coolprop:Methanol
  expected:
    bubble_P: 24026.271404293875
    dew_P: 24026.271404293875
    rho_V: 0.31236941117164824
    rho_L: 779.8052758222088
    Cp: 82.61348725710509
