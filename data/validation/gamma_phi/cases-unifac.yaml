# UNIFAC-family (gamma-phi) validation cases: the 30 rows unifac_*, unifac_dortmund_*,
# unifac_psrk_*, unifac_nist_*, unifac_lle_*, unifac_lyngby_* x {ig, rk, hoc, nothnagel, pr}.
#
# Every number below is experimental and was extracted programmatically (not hand-typed)
# from the NIST TRC ThermoML XML of the cited open-data record (ThermoML.v2020-09-30 archive,
# https://data.nist.gov/od/ds/mds2-2422/ThermoML.v2020-09-30.tgz, retrieved 2026-11-04),
# then re-checked against the extracted XML text. Units converted only kPa -> Pa.
#
# UNIFAC variants are group-contribution predictions: no parameter in the thermo 0.6.1
# tables was regressed for this repository, so these points are independent validation in
# the sense of the promotion rule (PR #150 ruling), not regression pins.
#
# Point-selection rule, fixed BEFORE any model run: for each chosen isobar/isotherm, the
# measured points whose liquid mole fraction of the ThermoML variable component is nearest
# 0.25, 0.50 and 0.75; the pure endpoints (x = 0 / 1) of the same series are the L1 pure
# cases (bubble_P at the measured T; for an isobar the measured boiling T at the fixed P).
# Tolerances: the fixed TOLERANCE_POLICY (bubble_T 0.5 % rel, bubble_P 3 % rel, y 0.02 abs).
#
# Model-side fix made with these cases (2026-11-04): data/thermo_params/unifac/groups.yaml now
# assigns methanol the whole-molecule CH3OH subgroup and ethylene glycol the DOH subgroup where
# the variant's table carries them (they were split into CH3/CH2 + OH); see that file's header.
#
# Binding: `package:` lists every UNIFAC row whose curated group map
# (data/thermo_params/unifac/groups.yaml) covers both components. unifac_lle_* covers only
# H2O and nC4, so it carries only the H2O and nC4 pure cases (no open H2O+nC4 LLE record was
# found in the ThermoML archive; see the row notes).
#
# Bound only where the case runs. Excluded (row, case) combinations, measured 2026-11-04:
#   unifac-etohnc4-333.2K-xnC40.2524: unifac_dortmund_hoc, unifac_dortmund_nothnagel, unifac_hoc, unifac_lyngby_hoc, unifac_lyngby_nothnagel, unifac_nist_hoc, unifac_nist_nothnagel, unifac_nothnagel, unifac_psrk_hoc, unifac_psrk_nothnagel -> virial P_max
#   unifac-etohnc4-333.2K-xnC40.4551: unifac_dortmund_hoc, unifac_dortmund_nothnagel, unifac_hoc, unifac_lyngby_hoc, unifac_lyngby_nothnagel, unifac_nist_hoc, unifac_nist_nothnagel, unifac_nothnagel, unifac_psrk_hoc, unifac_psrk_nothnagel -> virial P_max
#   unifac-etohnc4-333.2K-xnC40.7548: unifac_dortmund_hoc, unifac_dortmund_nothnagel, unifac_hoc, unifac_lyngby_hoc, unifac_lyngby_nothnagel, unifac_nist_hoc, unifac_nist_nothnagel, unifac_nothnagel, unifac_psrk_hoc, unifac_psrk_nothnagel -> virial P_max
#   unifac-meohnc4-364.5K-xnC40.2239: unifac_dortmund_hoc, unifac_dortmund_nothnagel, unifac_hoc, unifac_lyngby_hoc, unifac_lyngby_nothnagel, unifac_nist_hoc, unifac_nist_nothnagel, unifac_nothnagel, unifac_psrk_hoc, unifac_psrk_nothnagel -> virial P_max
#   unifac-meohnc4-364.5K-xnC40.4969: unifac_rk -> UnconvergedError
#   unifac-meohnc4-364.5K-xnC40.4969: unifac_dortmund_hoc, unifac_dortmund_nothnagel, unifac_hoc, unifac_lyngby_hoc, unifac_lyngby_nothnagel, unifac_nist_hoc, unifac_nist_nothnagel, unifac_nothnagel, unifac_psrk_hoc, unifac_psrk_nothnagel -> virial P_max
#   unifac-meohnc4-364.5K-xnC40.745: unifac_dortmund_hoc, unifac_dortmund_nothnagel, unifac_hoc, unifac_lyngby_hoc, unifac_lyngby_nothnagel, unifac_nist_hoc, unifac_nist_nothnagel, unifac_nothnagel, unifac_psrk_hoc, unifac_psrk_nothnagel -> virial P_max
#   'virial P_max': thermo's density-form truncated virial has no vapour root above
#   P_max = -RT/(4B); the bubble-P bracket (3 x the largest Wilson Psat) evaluates the vapour
#   there and raises (a robustness limit of the hoc/nothnagel rows at >~0.4 MPa, reported).
#   UnconvergedError: thermo's FlashVL successive substitution fails next to the spurious
#   original-UNIFAC MeOH/n-butane liquid split (x_MeOH 0.31-0.56 unstable at 364.5 K).
#
