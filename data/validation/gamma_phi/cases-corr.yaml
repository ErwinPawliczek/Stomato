# Gamma-phi CORRELATIVE rows: independent L2 binary VLE cases (validation run 2026-11-04,
# work package gphi-corr). Companion of data/validation/gamma_phi/cases.yaml (same units and
# tolerance conventions: T [K], P [Pa abs], mole fractions; bubble_T 0.5 % relative,
# bubble_P 3 % relative, vapour composition 0.02 absolute - scripts/validate_properties.py
# TOLERANCE_POLICY, fixed before any run).
#
# Source: the Dortmund Data Bank Explorer Edition free VLE pages (ddbst.com/en/EED/VLE/...,
# now offline at the original URL; read from the Internet Archive copies named in each
# case). Each case cites the ORIGINAL paper as printed on the DDB page, the DDB data-set
# number and the archived page. Numbers were extracted from the downloaded pages by a parser
# (no hand typing) and re-checked against the page text.
#
# Point selection rule, fixed BEFORE any model was run: in each data set, the three points
# whose liquid mole fraction of DDB component 1 lies nearest to 0.1, 0.4 and 0.7. Isobaric
# x-y sets without temperatures (Beebe 1942) compare the vapour composition only.
#
# Independence (PR #150 ruling): none of these data sets is a point any shipped binary
# parameter was fitted to. ChemSep IPDB pairs (nrtl*, uniquac*, wilson*) are databank
# regressions; the in-house fits in data/thermo_params/{uniquac,wilson,margules,vanlaar}/
# pairs.yaml used only the MEG/H2O 431.25 K / 1 atm point (Perry's), the MeOH/nC4 Courtial
# 323.22 K point and the EtOH/H2O 1-atm azeotrope; uniquac_tdep's Guevara Luna (2018)
# pairs were regressed on that paper's 13.15/19.71/32.86 kPa data, not Beebe's 50.66 kPa
# isobar; NRTL-SAC and regular solution carry no binary parameters at all.
#
# Component ids: curated ids where the slate has them (EtOH and acetone resolve through
# the chemicals databank by name/CAS - ngdesign.data.component_record step 2; C6+ is the
# curated n-hexane entry, CAS 110-54-3, so the n-hexane data apply to it exactly).
# `package:` lists every catalogue row whose parameters cover the binary (a row whose
# tables refuse the pair is not bound: a refusal is a crash, not a comparison).
#
# pure_cases: L1 saturation references for wilson_tdep_ig (whose parameter tables cover
# only aromatic / ketone / alkane / chloroalkane pairs), machine-generated with CoolProp
# 8.0.0 PropsSI at Q=0/1 by the same expressions as scripts/validate_properties.py
# --regen-coolprop (never hand-typed). Temperatures (350/400 K toluene, 380 K p-xylene) were
# chosen inside the row's 319-424 K window before any run.
meta:
  coolprop_version: 8.0.0
pure_cases:
- id: pure-toluene-350K-gphi
  package: [wilson_tdep_ig]
  fluid: "108-88-3"
  coolprop_fluid: Toluene
  components:
  - "108-88-3"
  z:
    "108-88-3": 1.0
  T: 350.0
  source: coolprop:Toluene
  expected:
    bubble_P: 34821.16076975351
    dew_P: 34821.16076975351
    rho_V: 1.12383683583342
    rho_L: 812.8725534697174
    Cp: 173.05403653603162
- id: pure-toluene-400K-gphi
