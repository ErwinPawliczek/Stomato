# SR-POLAR (VTBMSR-III) density cases — T11 binding of the T3 pack (spec T11).
#
# The nine single-phase water-air points of Mangold et al. 2019's worked example
# (Table 8; experimental molar volumes from Japas & Franck [30]). Values are typed
# from data/validation/packs/T3/{pack.yaml,data.csv} (the transcribing commit);
# never regenerated by the script. The row is density-only: cases use the harness's
# single-phase (T, P) comparison path (density/Z/cp from the one phase the PT flash
# returns), labelled `aqueous` per the pack's binder note (the water-rich
# supercritical phase the package returns).
#
# Tolerance: the intended bind check is "our error vs the paper's own VTBMSR-III
# error column" (pack.yaml binding notes). The harness compares DENSITY, the paper
# prints molar-VOLUME errors, so each per-case density tolerance is
# |1/(1 + e_v) - 1| + 1 percentage point with e_v the paper's own error at that
# point (opposite sign, larger magnitude under compression). A correct
# implementation of the same model sits near the paper's error (this port's worst
# deviation from the paper's column is 0.64 pp, case 8); the extra point absorbs
# round-off in the printed 3-significant-figure molar volumes.
#
# Units: T [K], P [Pa abs], density [kg/m3], compositions [mole fraction].
multicomponent_cases:
- id: h2o-air-620.5K-27MPa
  package: sr-polar
  components: [H2O, O2, N2]
  z: {H2O: 0.791, O2: 0.0418, N2: 0.1672}
  T: 620.5
  P: 27000000.0
  phase: aqueous
  source: "literature:Mangold, Pilz, Bjelic & Vogel, J. Supercrit. Fluids 153 (2019) 104476, Table 8 (experimental molar volume from Japas & Franck [30]; doi:10.1016/j.supflu.2019.02.016, open CC BY 4.0); x_O2/x_N2 = 1/4 assumed by Mangold (not specified in Japas & Franck); data/validation/packs/T3, read 2026-11-04"
  expected:
    density: 167.810369
  tolerance: {density: 0.0140}
  note: v_ref 120.8e-6 m3/mol; paper's own VTBMSR-III error 0.4 % (Table 8)
