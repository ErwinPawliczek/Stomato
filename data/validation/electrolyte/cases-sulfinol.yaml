# Sulfinol-M type solvent (MDEA + sulfolane + water) validation cases, row amine_sulfinol_m.
#
# Source: MacGregor 1988 (Univ. of Alberta MSc thesis), Table 5.6 (p. 48): CO2 and H2S solubility
# measured TOGETHER in the 2.0 M mixed solvent at 40 C. The row's constants (thesis Table 6.4)
# were regressed on the single-gas Tables 5.3-5.5 only, so these mixed-gas points are held out.
# Caveat recorded on the row: the 40 C H2S Henry constant was raised by hand by the author to fit
# the high-loading single-gas H2S data (p. 66), so the H2S side at high loading carries that tuning.
#
# Conventions, fixed before any model value was compared:
#   - The family K convention (cases-amine.yaml): P = 0.999 x the package bubble pressure of the
#     case liquid, expected K_i = p_i,lit / (z_i P), so y_i P == p_i,eq isolates the equilibrium
#     partial pressures. K band 5 % (policy).
#   - Feed: Table 1.1 (p. 4) solvent, 0.1754 mol MDEA, 0.2538 mol sulfolane, 2.6976 mol water per
#     100 g solution; CO2 and H2S = loading x 0.1754 mol; normalised.
#   - Selection: every Table 5.6 row whose loadings are both <= 1.5 mol/mol (the shared amine
#     flash's loading window, _MAX_LOADING). Rows 19 (H2S 1.543) and 20 (H2S 1.769) are outside it.
#   - Table 5.7 (100 C) is not bound: the 373.15 K isotherm refuses (no cited sulfolane
#     permittivity at 373.15 K); its 24 rows are transcribed in the progress notes, ready to bind.
#   - Table 6.5 (constants refitted on these very mixed data at 40 C) is not used by the row.
