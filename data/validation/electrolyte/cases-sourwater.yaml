# Sour-water (sour_water row) validation cases: NH3 + H2O VLE from two independent open data sets,
# read programmatically from NIST ThermoML files (no hand transcription), 2026-11-04.
#
# Conventions, fixed before the cases ran:
#   - Liu et al. 2011 give the NH3 PARTIAL pressure over the liquid. Compared as K_NH3 at
#     P = 0.999 x the package bubble pressure of the case liquid (the family convention of
#     cases.yaml: at a vanishing vapour fraction y_NH3 P == p_NH3,eq, so the expected
#     K = p_lit / (x_NH3 P) isolates the partial pressure). Tolerance: the policy K band, 5 %.
#   - Salavera et al. 2005 give the TOTAL vapour pressure: bubble_P at the policy 3 %.
#     Every NH3 + H2O point inside the row's window (20-100 C) with w_NH3 <= 0.2 is bound.
#     Feed z from mass fraction with the databank molar masses.
#   - The row's coefficients were checked against DWSIM's independent transcription
#     (DanWBR/dwsim PropertyPackages/SourWater.vb, CalcHenryConstants): the NH3 Henry
#     constants agree digit for digit. The EPA report itself could not be retrieved.
#   - pure_cases for this row live in cases-nacl.yaml (pure-H2O-*-electrolyte).
pure_cases: []

