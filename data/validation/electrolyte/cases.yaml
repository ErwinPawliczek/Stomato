# Family G (electrolyte) literature-backed validation data — spec T-14 (#145).
#
# Conventions, declared before the cases ran (the harness only sees the entries):
#   - Compositions are built on the anchor's stated amine molarity basis
#     (4.3638 kmol/m3 for the NeqSim CO2 anchors, 4.28 kmol/m3 for the Jou
#     Mather Otto H2S anchors) under the package's documented molarity
#     convention (AminePackage._amine_molarity: ideal mass mixing of the pure
#     liquid densities 1039.0 kg/m3 MDEA / 997.05 kg/m3 water). A plain 50 wt%
#     mass basis gives a different molarity under that convention and would
#     compare the anchors at the wrong basis.
#   - Case pressures sit at 0.995 x the package bubble pressure at the case
#     liquid composition (computed 2026-10-21), so the flash is two-phase with
#     a vanishing vapour fraction and the flashed liquid equals the feed; at
#     convergence y_i P == p_eq_i, so the relative K comparison isolates the
#     equilibrium partial pressure against the literature anchor.
#   - Tolerance: K 0.05, the P1-04 anchor band the repo's own amine regression
#     tests assert (tests/units/test_mdea_equilibrium.py uses pytest.approx
#     rel=0.05 for the CO2 anchors and rel=0.03 for the direct H2S chemistry
#     calls; the flash-path adds a near-bubble composition shift, worst case
#     measured 4.8 % on the trace-H2S point).
#   - The pure cases pin the reactive package's carrier (Peng-Robinson)
#     saturation surface — the only pure-component surface a reactive package
#     has (l0_excluded declares the reactive surface has none). Expected values
#     equal the root cases.yaml pure-H2O entries (CoolProp 8.0.0, Q=0/1);
#     rho/Cp are deliberately omitted — PR's aqueous rho_L/Cp weaknesses
#     against CoolProp are already documented by the root cubic cases.
#   - amine_enrtl rejects H2S by design (public structure, paywalled Zhang &
#     Chen 2011 tau tables), and its CO2 chemistry reproduces the anchors only
#     within the factor-2 band asserted in tests/units/test_enrtl.py, so its
#     loading cases are kept pending:<id> with the anchor values recorded; they
#     go live when the parameter tables land and the model reproduces the
#     anchors within the 5 % band.
#
# The five live anchor cases span loadings 0.01-0.453 across CO2 and H2S at
# 313.15 K — the family's loading-isotherm L3 layer; the absorber/regenerator
# loops are pinned by the existing sour-gas amine-loop e2e goldens.

pure_cases:
  - id: pure-H2O-323.5K-amine-ke
    package: amine_ke
    components: [H2O]
    fluid: H2O
    coolprop_fluid: Water
    z: {H2O: 1.0}
    source: coolprop:H2O
    T: 323.5
    expected:
      bubble_P: 12568.1
      dew_P: 12568.1
  - id: pure-H2O-420K-amine-ke
    package: amine_ke
    components: [H2O]
