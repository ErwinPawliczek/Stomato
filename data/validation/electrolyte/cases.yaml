binary_cases:
  # CO2 anchors: p_CO2 = 930 Pa at loading 0.10 and 22900 Pa at loading 0.40,
  # 4.3638 kmol/m3 aqueous MDEA at 313.15 K. expected K_CO2 = p_CO2 / (z_CO2 P).
  - id: amine-ke-co2-loading-0.10-313K
    package: amine_ke
    components: [MDEA, H2O, CO2]
    z: {MDEA: 0.134491, H2O: 0.852060, CO2: 0.013449}
    T: 313.15
    P: 7188.4
    source: "literature:p_CO2 at fixed loading, 4.3638 kmol/m3 (50 wt%) aqueous MDEA at 313.15 K: 0.0093 bara at loading 0.10 and 0.229 bara at loading 0.40 — NeqSim MDEA-model regression anchors (apparent constants fitted to Jou, Mather & Otto, I&EC Process Des. Dev., vol. 21, p. 539, 1982), as curated in tests/units/test_mdea_equilibrium.py; retrieved 2026-10-21"
    tolerance: {K: 0.05}
    expected:
      K: {CO2: 9.61968}
  - id: amine-ke-co2-loading-0.40-313K
    package: amine_ke
    components: [MDEA, H2O, CO2]
    z: {MDEA: 0.129275, H2O: 0.819015, CO2: 0.051710}
    T: 313.15
    P: 29246.0
    source: "literature:p_CO2 at fixed loading, 4.3638 kmol/m3 (50 wt%) aqueous MDEA at 313.15 K: 0.0093 bara at loading 0.10 and 0.229 bara at loading 0.40 — NeqSim MDEA-model regression anchors (apparent constants fitted to Jou, Mather & Otto, I&EC Process Des. Dev., vol. 21, p. 539, 1982), as curated in tests/units/test_mdea_equilibrium.py; retrieved 2026-10-21"
