# Amine-row validation cases (CO2 partial pressure over loaded aqueous amines), read
# programmatically from NIST ThermoML files (no hand transcription), 2026-11-04.
#
# Conventions, fixed before the cases ran:
#   - The family convention of cases.yaml: compared as K_CO2 at P = 0.999 x the package bubble
#     pressure of the case liquid, so y_CO2 P == p_CO2,eq at a vanishing vapour fraction and the
#     expected K = p_lit / (z_CO2 P) isolates the equilibrium partial pressure. K band 5 %.
#   - Feeds: molarity data are converted on the package's own molarity convention
#     (AminePackage._amine_molarity, as cases.yaml does); molality and mass-fraction data
#     are converted exactly with databank molar masses.
#   - Selection rules, fixed before any model value was seen:
#       AMP (amine_ke_dga_amp): Dash et al. 2011, every point at 318 K and 3.4 mol/dm3 with
#       1 <= p_CO2 <= 300 kPa. Dash 2011 is independent of the row's fit (Kundu 2003).
#       The 0.938-loading point (212.3 kPa) was first left unbound (the bubble point of a
#       7-digit, off-sum feed raised "loading fixed point did not converge"); bound 2026-11-09
#       after the off-sum feed fix in AmineReactivePackage._equilibrium_internal.
#       DIPA (amine_ke_dga_amp, 2026-11-09): every CO2-loaded point of Dell'Era et al. 2010
#       dataset 3 (total pressure, compared as bubble_P at the fixed 3 % policy band; the
#       CO2-free rows are pure-solvent vapour pressures and are skipped) and every Haghtalab et
#       al. 2014 dataset 2 point inside the row's T window 296-333 K (313.15 and 328.15 K, CO2
#       partial pressure, K convention above). The 343.15 K points are outside the window.
#       Rule fixed by the row's applicability, all points bound. Feeds: Dell'Era's mass
#       fraction is on the CO2-free solvent; z = (solvent mole fractions) x (1 - x_CO2).
#       The DIPA constants are literature values with no VLE fit, so all points are independent.
#       MDEA (amine_enrtl): Xiao et al. 2018, every point at 313.15 K (MDEA 2.58 mol/kg water).
#       The case P is the package bubble pressure (bisected on k_values, since amine_enrtl's
#       bubble_point scan did not converge on these off-sum feeds before 2026-11-09; it now
#       agrees with the bisection to <= 3e-6) times 0.999. Leontiadis et al. 2019
#       (j.fluid.2019.112254) is not used: its ThermoML "mole fraction of CO2" column runs
#       0.26-1.08, i.e. it holds loadings, and the mislabel cannot be resolved without the paper.
pure_cases: []

