# Family G (electrolyte) validation cases: NaCl brines and the pure-water limit of every
# electrolyte/amine row (validation run 2026-11-04, agent electrolyte-amine).
#
# Conventions, fixed before the cases ran:
#   - pure_cases: water saturation at 20/25/30 C (and 80 C for the sour-water and amine rows,
#     whose windows reach it) from CoolProp 8.0.0 (IAPWS-95), generated by script, not typed.
#     A pure-water feed carries no electrolyte, so these points exercise the row's water
#     saturation surface (the pure-component limit the brine/amine liquids reduce to).
#     rho/Cp omitted as in cases.yaml of this family (PR carrier aqueous density, documented).
#   - NaCl brine L2: bubble pressure of the brine (the water vapour pressure over the solution;
#     NaCl is involatile) against Clarke & Glew 1985 Table 21 A, a critically evaluated
#     regression of the equilibrium measurements (osmotic, vapour-pressure, EMF, freezing
#     point) with tabulated standard errors <= 0.00031 kPa at these points. Independent of
#     every row's parameters: Pitzer (Harvie, Moller & Weare 1984 / PHRQPITZ), eNRTL (Chen &
#     Evans 1986), Extended UNIQUAC (Thomsen) and PDH (no parameters); no value was fitted in
#     this repo to Clarke & Glew. Feed z from molality with M_w 18.0152 g/mol (the paper's).
#   - Discrimination at the fixed 3 % bubble_P tolerance: an ideal (Raoult, two ions) solution
#     is +0.2 % off at 2 m, +2.7 % at 4 m and +8.2 % at 6 m (measured against the same table),
#     so the 6 m points are the ones that test the activity model; the 0.1/0.2 m points (the
#     only ones inside pitzer_debye_huckel's 0.2 mol/kg cap) cannot discriminate at 3 %.
#   - Solubility (enrtl_crystallisation): Table 17 A at 20 and 30 C, x_sat on the package
#     stream basis (salt counted undissociated, x = m M_w / (1 + m M_w)). The row's solubility
#     product comes from the 25 C PPB84 anchor (6.146 mol/kg), so the 25 C point is withheld;
#     the row has no temperature dependence, so these two points test the eNRTL liquid's
#     prediction of the anchor-derived solubility, not a T trend.
meta: {coolprop_version: 8.0.0}

pure_cases:
- id: pure-H2O-293.15K-electrolyte
  package: [pitzer_nacl_water, enrtl_nacl_water, ext_uniquac_nacl_water, enrtl_rk, enrtl_hoc, pitzer_hoc, enrtl_crystallisation, pitzer_debye_huckel, sour_water, amine_ke_dga_amp, amine_mdea_pz]
  components: [H2O]
  fluid: H2O
  coolprop_fluid: Water
  z: {H2O: 1.0}
  source: coolprop:H2O
  T: 293.15
  expected: {bubble_P: 2339.32, dew_P: 2339.32}
- id: pure-H2O-298.15K-electrolyte
  package: [pitzer_nacl_water, enrtl_nacl_water, ext_uniquac_nacl_water, enrtl_rk, enrtl_hoc, pitzer_hoc, enrtl_crystallisation, pitzer_debye_huckel, sour_water, amine_ke_dga_amp, amine_mdea_pz]
