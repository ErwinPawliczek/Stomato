  z:
    C1: 1.0
  source: coolprop:CH4 - K = Psat/P at P = Psat is the definitional pure-component saturation limit (catalogue plan L0); the case pressure is the CoolProp saturation pressure regenerated in data/validation/cases.yaml
  expected:
    K:
      C1: 1.0
    bubble_P: 268757.80384445406
  T: 125.0
  P: 268757.80384445406
  note: 'Catalogue row not yet registered (plan docs/thermo-catalogue-plan.md); the harness skips entries whose package starts with pending: until the row lands.'
