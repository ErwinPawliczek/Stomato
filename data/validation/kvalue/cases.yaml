# K-value / Rs-gamma family reference cases (data sweep, spec T-11; binary VLE
# extension, spec T-14; reconciliation and activation, spec T-05).
#
# Loads together with the root data/validation/cases.yaml (the harness discovers every
# cases*.yaml under data/validation/). Spec T-05 registered the ten K-value rows, so the
# sweep's pending placeholders are reconciled here:
#
#   - 39 of the 100 sweep cases are activated (package: <row-id>) for the rows they
#     measure; the copies for rows/states that do not bind are deleted, with the reason
#     recorded on the row (data/thermo_models/kvalue.yaml) and in the T-05 PR body.
#   - The kept methane-propane case pressures were off by a factor of ten in the sweep
#     commit (482600.0 for the 4.826 MPa state, 620500.0 for 6.205 MPa, 413700.0 for
#     4.137 MPa); the ids, the cited IUPAC compilation and the expected K = y/x values
#     all correspond to the MPa-scale pressures, so the kept entries carry the corrected
#     values.
#   - The correlation rows (chao-seader, grayson-streed, grayson-streed-extended,
#     braun-k10, lee-kesler-ploecker) carry their own vapour-pressure basis (nu0 charts
#     or the Lee-Kesler EOS), so their pure-component K cases state an explicit
#     tolerance covering the correlation's own accuracy at the bound points; the
#     databank-equality limit (K = Psat/P = 1 and bubble_P = databank exactly) stays an
#     L0 exclusion in the row. The databank-Psat rows (esso-tabular on the Antoine
#     basis deviates <=0.63 %, antoine-ideal-k, ideal-raoult, ideal-lk, henry-sander)
#     keep the harness defaults.
#
# Dropped sweep cases and why (kept evidence lives in the PR body's measured table):
#   - chao-seader-pureK-C1-125K: the CS methane nu0 set deviates +11.74 % at 125 K
#     (Tr = 0.66), outside any defensible tolerance for a definitional limit.
#   - lee-kesler-ploecker-pureK-nC4-280K: the LK EOS deviates +7.49 % for n-butane.
#   - grayson-streed / grayson-streed-extended pureK-C1: the GS methane set deviates
#     +102.64 % at 125 K (the set is outside its fitted range).
#   - all DePriester slice-inlet copies: chart-read K values on a ten-component
#     rich inlet are not usable as a binding anchor for a single row (composition
#     classes the rows refuse, reading precision >> any informative tolerance).
#   - the methane-propane copies for grayson-streed, grayson-streed-extended,
#     braun-k10, esso-tabular, antoine-ideal-k, ideal-raoult, ideal-lk and the 6.205 MPa
#     copy for chao-seader: measured K deviations outside the 5 % K tolerance
#     (GS -6 to -35 %; the ideal-K rows are not VLE models at these states;
#     braun-k10 refuses the pressures above its 0.7 MPa service cap).
#   - the methane-in-water copies for the nine non-henry rows: the cases measure the
#     Henry constant; Raoult-law and hydrocarbon-correlation rows have no dilute-solute
#     basis at these states.
#
# Sections:
#   multicomponent_cases - one pure-component K case per bound row at the component
#     saturation point: K = Psat/P = 1 is the definitional pure-component limit
#     (catalogue plan L0 "pure-component limits"); the case pressure is the CoolProp
#     saturation pressure from the root file (regenerated, CoolProp 8.0.0), with
#     bubble_P cross-checking the same number.
#   binary_cases - (a) the methane-propane VLE points that bind: Reamer, Sage & Lacey
#     1950 as compiled in the IUPAC Solubility Data Series vol. 27/28 (Methane),
#     pp. 270-271 (compiled errors dP 0.05 %, dx/dy 0.002); K_C1 = y/x and
#     K_C3 = (1-y)/(1-x) at the cited isotherm and pressure; the default K 5 % tolerance
#     comfortably exceeds the compiled data precision at these points (worst ~1.3 %).
#     (b) two methane-in-water cases for the henry-sander row: K_C1 = y_C1/x_C1 with
#     y_C1 = 1 - Psat_H2O(T)/P (databank Psat, 3179.4 Pa at 298.2 K, 6543.7 Pa at
#     310.9 K), x from Culberson & McKetta 1951 (compiled error dx 3 %); tolerance
#     K 0.10 covers data precision, the y ~ 1 idealisation, and Henry fugacity effects
#     at elevated pressure.
#
# Units: T in K, P in Pa, compositions in mole fractions.
meta:
  coolprop_version: 8.0.0
# T-15 promotion sweep: these single-component saturation points are L1 pure cases -
# the audit counts L1 by section (spec T-01); ids, values, tolerances unchanged.
