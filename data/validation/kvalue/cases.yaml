# K-value / Rs-gamma family reference cases (data sweep, spec T-11; binary VLE
# extension, spec T-14).
#
# Loads together with the root data/validation/cases.yaml (the harness discovers every
# cases*.yaml under data/validation/). Entries whose package is "pending:<id>" name a
# planned catalogue row that is not registered yet and are skipped by the harness until
# the row lands; their ids must be reconciled with the ids the K-value adapter spec
# (docs/thermo-catalogue-plan.md, family E) actually registers.
#
# Sections:
#   multicomponent_cases - (a) four single-component K cases per pending row at the
#     component saturation point: K = Psat/P = 1 is the definitional pure-component limit
#     (catalogue plan L0 "pure-component limits"); the case pressure is the CoolProp
#     saturation pressure from the root file (regenerated, CoolProp 8.0.0), with bubble_P
#     cross-checking the same number. (b) one copy of the root DePriester slice-inlet K
#     case per pending row (chart-read K values, 5-7 % reading precision).
#   binary_cases - (a) three methane-propane VLE points per pending row: Reamer, Sage &
#     Lacey 1950 as compiled in the IUPAC Solubility Data Series vol. 27/28 (Methane),
#     pp. 270-271 (compiled errors dP 0.05 %, dx/dy 0.002); K_C1 = y/x and
#     K_C3 = (1-y)/(1-x) at the cited isotherm and pressure; the default K 5 % tolerance
#     comfortably exceeds the compiled data precision at these points (worst ~1.3 %).
#     (b) two methane-in-water cases for the henry-sander row: K_C1 = y_C1/x_C1 with
#     y_C1 = 1 - Psat_H2O(T)/P (databank Psat, 3179.4 Pa at 298.2 K, 6543.7 Pa at
#     310.9 K), x from Culberson & McKetta 1951 (compiled error dx 3 %); tolerance
#     K 0.10 covers data precision, the y ~ 1 idealisation, and Henry fugacity effects
#     at elevated pressure.
#
# Units: T in K, P in Pa, compositions in mole fractions.
meta:
  coolprop_version: 8.0.0
multicomponent_cases:
- id: chao-seader-pureK-C1-125K
  package: pending:chao-seader
  components:
