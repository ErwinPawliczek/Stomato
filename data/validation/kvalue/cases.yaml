# --- 2026-11-04 (helm-kvalue): L1 for the ideal-K rows. Measured normal boiling points at
# 101.3 kPa (Gupta & Lee 2013, ThermoML 'Vapor or sublimation pressure' datasets, p = 101.3 kPa
# at the printed T). bubble_T compared at the harness's 0.5 % isobaric tolerance.
- id: idealk-pure-toluene-101.3kPa
  package: [ideal-raoult, antoine-ideal-k, esso-tabular, ideal-lk, braun-k10, braun-k10-ideal]
  components: ['108-88-3']
  z: {'108-88-3': 1.0}
  P: 101300.0
