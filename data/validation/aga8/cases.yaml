# T-16a AGA8 DC92 gas-phase cases.
#
# The aga8_dc92 row is gas-only by construction: bubble/dew, two-phase and
# liquid-phase comparisons do not exist for it and are refused by the adapter
# (typed Aga8Dc92Error). Cases here use the harness's single-phase (T, P)
# comparison path (density/Z/cp from the vapour phase the PT flash returns).
#
# Values are hand-typed from the cited reference; never regenerated by the script.
multicomponent_cases:
- id: aga8-dc92-nist-check-gas-400K-50MPa
  package: aga8_dc92
  components: [C1, N2, CO2, C2, C3, IC4, NC4, IC5, NC5, NC6, NC7, NC8, NC9, NC10, H2, O2, CO, H2O, H2S, He, Ar]
  z:
    C1: 0.77824
    N2: 0.02
    CO2: 0.06
    C2: 0.08
    C3: 0.03
    IC4: 0.0015
    NC4: 0.003
    IC5: 0.0005
    NC5: 0.00165
    NC6: 0.00215
    NC7: 0.00088
    NC8: 0.00024
    NC9: 0.00015
    NC10: 0.00009
    H2: 0.004
    O2: 0.005
    CO: 0.002
    H2O: 0.0001
    H2S: 0.0025
    He: 0.007
    Ar: 0.001
  T: 400.0
  P: 5.0e7
  source: "literature:Lemmon, Bell, Heinemann & Lu (2017) AGA8 Version 2.0 [Software], NIST, github.com/usnistgov/AGA8 @ 3bdb9ab8ff317c618b0b59d1b704c2c86ddc5fce, AGA8CODE/C Detail_test_01.cpp printed check values: 21-component example gas at 400 K / 50 000 kPa - molar density 12.80792403648801 mol/l, molar mass 20.54333051 g/mol, Z 1.173801364147326, cp 58.54617672380667 J/(mol K); retrieved 2026-10-21"
  expected:
    density: 263.117417
    Z: 1.173801364147326
    cp: 58.54617672380667
  note: DC92 reproduces every printed check value in tests/thermo/test_aga8.py; density = molar density x molar mass
