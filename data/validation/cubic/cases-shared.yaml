# Shared cubic-option reference cases (val-cubic-mixing, 2026-11-04).
# `package:` lists: one cited point binds several rows. Pure and C1/C3, C1/CO2 entries are
# programmatic copies of the root data/validation/cases.yaml cases of the same name (CoolProp 8.0.0
# machine-generated pure values; Reamer 1950 / Legoix 2017 binary points with their citations),
# never hand-typed. TEG/water points are parsed from the retrieved NIST ThermoML XML of
# Mostafazadeh et al. 2009 (published after the Gironi 2007 k12(T) fit the glycol_pr row uses).
# Tolerances: the fixed TOLERANCE_POLICY of scripts/validate_properties.py.
pure_cases:
- id: cubicopt-pure-C1-125K
  fluid: C1
  coolprop_fluid: CH4
  package: &id001
  - pr-rackett
  - srk-rackett
  - pr-costald
  - srk-costald
  - pr-free-water
  - kabadi-danner-free-water
  - glycol_pr
  components:
  - C1
  z:
    C1: 1.0
  T: 125.0
  source: coolprop:CH4
  expected:
    bubble_P: 268757.80384445406
    dew_P: 268757.80384445406
    rho_V: 4.466913910567139
    rho_L: 402.1105827307507
    Cp: 57.7411469743096
- id: cubicopt-pure-C3-300K
  fluid: C3
  coolprop_fluid: Propane
  package: *id001
  components:
  - C3
  z:
    C3: 1.0
  T: 300.0
  source: coolprop:Propane
  expected:
    bubble_P: 997682.6201918732
    dew_P: 997682.6201918732
    rho_V: 21.629532018462196
    rho_L: 489.44737525195876
    Cp: 120.80473982443137
- id: cubicopt-pure-nC4-280K
  fluid: nC4
  coolprop_fluid: n-Butane
  package: *id001
  components:
  - nC4
  z:
    nC4: 1.0
  T: 280.0
  source: coolprop:n-Butane
  expected:
    bubble_P: 132816.54823974936
    dew_P: 132816.54823974936
    rho_V: 3.4895818108256678
    rho_L: 593.2939677646473
    Cp: 136.27982819611634
- id: cubicopt-pure-CO2-265K
  fluid: CO2
  coolprop_fluid: CO2
  package: *id001
  components:
  - CO2
  z:
    CO2: 1.0
  T: 265.0
  source: coolprop:CO2
  expected:
    bubble_P: 2790916.074974494
    dew_P: 2790916.074974494
    rho_V: 75.47077353408034
    rho_L: 973.2544843551278
    Cp: 103.05559698734537
