# Cubic EOS family reference cases (data sweep, spec T-11).
#
# Loads together with the root data/validation/cases.yaml (the harness discovers every
# cases*.yaml under data/validation/). Entries whose package is "pending:<id>" name a
# planned catalogue row that is not registered yet and are skipped by the harness until
# the row lands; their ids must be reconciled with the ids the adapter specs (T-02..T-07)
# actually register.
#
# Sections:
#   pure_cases            - four pure-component points per pending row, copied from the root
#                           file (same fluids/temperatures); expected values are regenerated
#                           by `uv run scripts/validate_properties.py --regen-coolprop`
#                           (source coolprop:<fluid>, tolerance policy as the root file).
#   binary_cases          - two literature binary VLE points per pending row, copied from the
#                           root file (Reamer et al. 1950 C1/C3 and Legoix et al. 2017 C1/CO2).
#   multicomponent_cases  - the family L3 case: measured dew pressures of the Mørch et al.
#                           (2006) synthetic natural gas ternary (C1/C2/nC5), committed for
#                           every pending row and for the shipped packages (package: all).
#                           Shipped-package failures are assessed xfails (issue #130).
#
# Units: T in K, P in Pa, compositions in mole fractions, enthalpies in J/mol.
