# U-D — Phase separation (plan §2 U-D, 10 rows).
#
# Molecular-sieve dehydration (plan U-G 6) maps onto the adsorption_bed row —
# no separate treating row.

- id: scrubber
  name: 2-phase separator / KO drum
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: two-phase feed
    outlet:
    - name: gas_out
      required: true
      description: vapour outlet
    - name: liquid_out
      required: true
      description: liquid outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separator:Scrubber
      params:
        type: object
        properties: {}
      note: PT/PH/PVF flash with ΔP; gas and liquid leave at their flash states
    R1:
      status: planned
      params: {}
      note: Souders-Brown sizing, carry-over at a given diameter (the souders_brown correlation plugin exists)
      end_state: true
  sizer: scrubber
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 1
  notes: the registered id stays `scrubber` (historical); the row is the palette's 2-phase separator.

- id: separator_3phase
  name: 3-phase separator
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: three-phase feed
    outlet:
    - name: gas_out
      required: true
      description: vapour outlet
    - name: hc_out
      required: true
      description: hydrocarbon liquid outlet
    - name: water_out
      required: true
      description: water outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separator:Separator3Phase
      params:
        type: object
        properties: {}
      note: VLLE flash; gas, hydrocarbon and water leave at their phase states
      end_state: true
  sizer: separator_3phase
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 2
  notes: roadmap R1 lands with the S1 slice (plan §2b).

- id: flash_drum
  name: Flash drum with duty
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    - name: inlet_2
      required: false
      description: optional second feed; the inlets are adiabatically PH-mixed at
        the lowest inlet pressure before the outlet spec applies
    outlet:
    - name: gas_out
      required: true
      description: vapour outlet
    - name: liquid_out
      required: true
      description: non-aqueous liquid outlet (the whole liquid when the package returns one)
    - name: aqueous_out
      required: false
      description: aqueous liquid outlet (zero flow when the package returns a single liquid)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.flash_drum:FlashDrum
      params:
        type: object
        properties:
          outlet_P: {type: number, description: 'outlet pressure, Pa abs; default min inlet P'}
          duty_W: {type: number, description: 'heat added to the drum, W; PH flash with H_out = H_in + duty_W'}
          vapor_fraction: {type: number, minimum: 0, maximum: 1, description: 'molar vapour fraction; PVF flash at outlet_P'}
      validation:
      - V1-flash-corripio-2013
      note: PT / PH (duty_W) / PVF flash at the outlet pressure — exactly one of
        duty_W and vapor_fraction; the inlets are first adiabatically PH-mixed at
        the lowest inlet pressure (a single inlet passes through unchanged); the
        balancing duty is reported; gas, liquid and (when the package gives one)
        aqueous outlets at their flash states
    R1:
      status: planned
      params: {}
      note: Souders-Brown sizing, carry-over at a given diameter (the souders_brown correlation plugin exists)
      end_state: true
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 3
  notes: R0 PT/PH/PVF flash implemented with an optional mixed second inlet; the
    flash family is validated by V1-flash-corripio-2013 (assessed PR-vs-ideal-K
    miss) and V0 self-consistency; Souders-Brown sizing is R1.

- id: decanter
  name: Decanter
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: LLE feed
    outlet:
    - name: light_out
      required: true
      description: light liquid phase
    - name: heavy_out
      required: true
      description: heavy liquid phase
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.decanter:Decanter
      params:
        type: object
        properties:
          dP: {type: number, minimum: 0, description: 'pressure drop, Pa; default 0'}
      note: PT flash at (T_in, P_in - dP); the two liquid phases leave light/heavy by
        phase density; a single-liquid or vapour-returning flash is refused, naming T and P.
        Evidence gap — V0 self-consistency only — no cited worked example validates
        a decanter split at R0
    R1:
      status: planned
      params: {}
      note: settling (Stokes)
      end_state: true
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 4
  notes: R0 LLE split implemented; Stokes settling sizing is R1 (plan §2b).

- id: tank
  name: Tank / surge drum
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: well-mixed outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.tank:Tank
      params:
        type: object
        properties:
          P: {type: number, description: 'outlet pressure, Pa abs; default min inlet P'}
          volume_m3: {type: number, minimum: 0, description: 'liquid holdup, m3; drives the residence-time report'}
      note: adiabatic PH mix at P = min inlet P (or a given P — refused when it
        exceeds the lowest inlet pressure — the tank does not raise pressure);
        info residence_time_s = volume_m3 / liquid volumetric flow (from the
        outlet liquid phases' density). Closed-form R0 — a pure mixer with spec
        quantities only, no correlation constants
      end_state: true
  pid_symbol: TK
  references:
  - docs/unit-catalogue-plan.md §2 U-D 5
  notes: R0 mixer implemented; volume_m3 is an optional holdup report, not sizing.

- id: hydrocyclone
  name: Hydrocyclone / cyclone
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: slurry/gas feed
    outlet:
    - name: overflow
      required: true
      description: fine stream
    - name: underflow
      required: true
      description: coarse stream
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.hydrocyclone:Hydrocyclone
      params:
        type: object
        properties:
          underflow_fractions:
            type: object
            description: 'component id to the fraction of its molar flow sent to the underflow; unnamed components go entirely to the overflow'
          dP: {type: number, minimum: 0, description: 'pressure drop, Pa; applied to the overflow outlet'}
      note: per-component split spec — the underflow is the spec, not a correlation
        constant; the overflow leaves at P_in - dP, the underflow at P_in.
        Evidence gap — Perry Sect. 18 cut-size sizing is R1, so no worked example
        validates a cut size at R0 (V0 self-consistency only).
    R1:
      status: planned
      params: {}
      note: Lapple / Barth cut size
      end_state: true
  pid_symbol: CYC
  references:
  - docs/unit-catalogue-plan.md §2 U-D 6
  notes: R0 split spec implemented; deoiling example with 95 % water to the underflow.

- id: filter
  name: Filter
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: slurry feed
    outlet:
    - name: filtrate
      required: true
      description: clear filtrate
    - name: cake
      required: true
      description: solids cake
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.filter:Filter
      params:
        type: object
        properties:
          cake_fractions:
            type: object
            description: 'component id to the fraction of its molar flow sent to the cake; unnamed components pass entirely to the filtrate'
          dP: {type: number, minimum: 0, description: 'pressure drop, Pa; applied to the filtrate outlet (the cake leaves at the inlet pressure)'}
      note: per-component split spec — the cake split is the spec, not a correlation
        constant; the filtrate leaves at P_in - dP, the cake at P_in.
        Evidence gap — cake-resistance physics is R1, so no worked example
        validates a cake at R0 (V0 self-consistency only).
    R1:
      status: planned
      params: {}
      note: cake resistance
      end_state: true
  pid_symbol: FLT
  references:
  - docs/unit-catalogue-plan.md §2 U-D 7
  notes: roadmap.

- id: membrane
  name: Membrane (gas)
  family: separation
  ports:
    inlet:
    - name: feed_in
      required: true
      description: high-pressure feed gas
    outlet:
    - name: permeate
      required: true
      description: permeate stream
    - name: residue
      required: true
      description: residue stream
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.membrane:Membrane
      params:
        type: object
        properties:
          permeate_recovery:
            type: object
            description: 'component id to the fraction of its molar flow crossing to the permeate; unnamed components stay in the residue'
          stage_cut: {type: number, minimum: 0, maximum: 1, description: 'fraction of the feed molar flow recovered as permeate (binary Weller-Steiner model)'}
          perm_ratio:
            type: object
            description: 'component id to relative permeance; required with stage_cut (binary)'
          P_permeate: {type: number, description: 'permeate-side absolute pressure, Pa; required'}
      validation:
      - V1-membrane-geankoplis-13-4-2
      note: exactly one of permeate_recovery (any components) and stage_cut with
        perm_ratio (binary Weller-Steiner complete mixing); the permeate leaves
        at P_permeate, the residue at P_in. Evidence gap — the stage-cut model is
        validated against Geankoplis Ex. 13.4-2 (air, y_O2 = 0.5068, reject
        x_O2 = 0.1345); the permeate_recovery path is a spec split with V0
        self-consistency only.
    R1:
      status: provisional
      adapter: ngdesign.units.separation.membrane_r1:MembraneR1
      params:
        type: object
        required: [permeances_mol_m2_s_Pa, P_permeate]
        properties:
          permeances_mol_m2_s_Pa: {type: object, description: 'component id to permeance, mol/(m2 s Pa) (1 GPU = 3.348e-10); every feed component required'}
          P_permeate: {type: number, exclusiveMinimum: 0, description: 'permeate-side absolute pressure, Pa'}
          area_m2: {type: number, exclusiveMinimum: 0, description: 'membrane area, m2 (rating mode)'}
          stage_cut: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: 'target permeate/feed molar ratio (design mode; area is solved)'}
      note: solution-diffusion with permeances, cross-flow (Weller-Steiner 1950,
        Pan 1983) with the local permeate y_i = J_i/ΣJ from a bracketed brentq
        (closed form at P_l = 0) and the feed side dn_i/da = -J_i integrated
        DOP853 at rtol 1e-11; stage-cut mode by a terminal event with the
        A_hard cap; isothermal outlets via split_by_component as in R0.
    R2:
      status: provisional
      adapter: ngdesign.units.separation.membrane_r2:MembraneR2
      params:
        type: object
        required: [permeances_mol_m2_s_Pa, P_permeate]
        properties:
          permeances_mol_m2_s_Pa: {type: object, description: 'component id to permeance, mol/(m2 s Pa) (1 GPU = 3.348e-10); every feed component required'}
          P_permeate: {type: number, exclusiveMinimum: 0, description: 'permeate-side absolute pressure, Pa'}
          area_m2: {type: number, exclusiveMinimum: 0, description: 'membrane area, m2 (rating mode)'}
          stage_cut: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: 'target permeate/feed molar ratio (design mode; area is solved)'}
      note: counter-current module, Pan 1983 shooting on the residue flows
        (scipy root hybr, tol 1e-12) with the permeate plug flow dp_i/da = -J_i
        toward the feed end, the M2 switch at Sum(p) <= 1e-12 F, and design
        mode by brentq on theta_R2(A) - theta over [0, A_R1(theta)]; outlets
        as in R0/R1.
  pid_symbol: M
  references:
  - docs/unit-catalogue-plan.md §2 U-D 8
  notes: R0 split and stage-cut specs implemented; Geankoplis Ex. 13.4-2 example.

- id: adsorption_bed
  name: Adsorption bed (TSA/PSA)
  family: separation
  ports:
    inlet:
    - name: feed_in
      required: true
      description: gas to the bed
    outlet:
    - name: product_out
      required: true
      description: treated product
    - name: regen_out
      required: false
      description: regeneration (tail-gas) outlet during the cycle
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.adsorption_bed:AdsorptionBed
      params:
        type: object
        required: [removal_fraction]
        properties:
          removal_fraction:
            type: object
            description: 'component id -> fraction of its molar flow taken to the desorbate'
          capacity_kg_per_kg: {type: number, minimum: 0, description: 'adsorbate loading, kg per kg bed'}
          bed_mass_kg: {type: number, minimum: 0, description: 'bed mass, kg'}
          product_P: {type: number, description: 'product outlet pressure, Pa abs; default feed P'}
          regen_P: {type: number, description: 'desorbate outlet pressure, Pa abs; default feed P'}
          product_T: {type: number, description: 'product outlet temperature, K; default feed T'}
          regen_T: {type: number, description: 'desorbate outlet temperature, K; default feed T'}
      note: adsorbate split spec to regen_out; product and desorbate flashed at
        their own T (product_T / regen_T, default feed T) and their own P;
        info cycle_time_s = capacity * bed_mass / adsorbate mass rate. The
        default capacity 0.10 kg/kg is the ~10 wt% design water loading GPSA
        quotes for molecular sieves (Sect. 20, dehydration). V1 gap -- no printed
        worked example of a split-spec adsorption bed with its printed outlet
        state was found; the row is checked by closed-form tests only
    R1:
      status: planned
      params: {}
      note: Langmuir isotherm, LUB
      end_state: true
  pid_symbol: X
  references:
  - docs/unit-catalogue-plan.md §2 U-D 9
  notes: molecular-sieve dehydration (plan U-G 6) maps onto this row with a cycle —
    no separate treating row.

- id: hydrate_check
  name: Hydrate check / inhibitor injection
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas stream at risk of hydrates
    - name: inhibitor_in
      required: false
      description: inhibitor (MeOH/MEG) injection
    outlet:
    - name: outlet
      required: true
      description: gas with hydrate margin and inhibitor dose reported
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.hydrate_check:HydrateCheck
      params:
        type: object
        properties:
          P: {type: number, description: 'mixed outlet pressure, Pa abs; default min inlet P'}
          T_operating_K: {type: number, description: 'target operating temperature, K; drives the required-inhibitor-dose info'}
      validation:
      - V1-hydrate-gpsa-20-10
      note: adiabatic PH mix; hydrate_T from hammerschmidt_formation at the mixed P,
        dose from nielsen_bucklin_suppression at the operating T; the required
        inhibitor rate covers the aqueous phase only — GPSA's vapour and
        hydrocarbon-liquid methanol losses are excluded at R0
    R1:
      status: planned
      params: {}
      note: Katz / van der Waals-Platteeuw (via thermo)
      end_state: true
  pid_symbol: HC
  references:
  - docs/unit-catalogue-plan.md §2 U-D 10
  notes: roadmap; S2 slice (plan §2b).
