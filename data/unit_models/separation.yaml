# U-D — Phase separation (plan §2 U-D, 10 rows).
#
# Molecular-sieve dehydration (plan U-G 6) maps onto the adsorption_bed row —
# no separate treating row.

- id: scrubber
  name: 2-phase separator / KO drum
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: two-phase feed
    outlet:
    - name: gas_out
      required: true
      description: vapour outlet
    - name: liquid_out
      required: true
      description: liquid outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separator:Scrubber
      params:
        type: object
        properties: {}
      note: PT/PH/PVF flash with ΔP; gas and liquid leave at their flash states
    R1:
      status: provisional
      adapter: ngdesign.units.separation.scrubber_r1:ScrubberR1
      params:
        type: object
        properties:
          dP:
            type: number
            minimum: 0
            description: pressure drop, Pa; default 0 (R0)
          K_m_s:
            type: number
            exclusiveMinimum: 0
            description: Souders-Brown K, m/s; default York demister fit at the drum pressure
          diameter_m:
            type: number
            exclusiveMinimum: 0
            description: vessel inside diameter, m; enables the carry-over calculation
          inlet_entrained_fraction:
            type: number
            minimum: 0
            maximum: 1
            description: fraction of the liquid entering the gravity section as droplets
          droplet_d_rr_m:
            type: number
            exclusiveMinimum: 0
            description: Rosin-Rammler characteristic droplet size, m
          droplet_n_rr:
            type: number
            exclusiveMinimum: 0
            description: Rosin-Rammler spread parameter
          gas_viscosity_Pa_s:
            type: number
            exclusiveMinimum: 0
            description: gas viscosity override, Pa s
      note: Souders-Brown sizing (York demister K) and droplet carry-over at a given diameter; reduces to R0 without diameter_m or at E = 0
      end_state: true
  sizer: scrubber
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 1
  notes: the registered id stays `scrubber` (historical); the row is the palette's 2-phase separator.

- id: separator_3phase
  name: 3-phase separator
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: three-phase feed
    outlet:
    - name: gas_out
      required: true
      description: vapour outlet
    - name: hc_out
      required: true
      description: hydrocarbon liquid outlet
    - name: water_out
      required: true
      description: water outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separator:Separator3Phase
      params:
        type: object
        properties: {}
      note: VLLE flash; gas, hydrocarbon and water leave at their phase states
      end_state: true
  sizer: separator_3phase
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 2
  notes: roadmap R1 lands with the S1 slice (plan §2b).

- id: flash_drum
  name: Flash drum with duty
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    - name: inlet_2
      required: false
      description: optional second feed; the inlets are adiabatically PH-mixed at
        the lowest inlet pressure before the outlet spec applies
    outlet:
    - name: gas_out
      required: true
      description: vapour outlet
    - name: liquid_out
      required: true
      description: non-aqueous liquid outlet (the whole liquid when the package returns one)
    - name: aqueous_out
      required: false
      description: aqueous liquid outlet (zero flow when the package returns a single liquid)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.flash_drum:FlashDrum
      params:
        type: object
        properties:
          outlet_P: {type: number, description: 'outlet pressure, Pa abs; default min inlet P'}
          duty_W: {type: number, description: 'heat added to the drum, W; PH flash with H_out = H_in + duty_W'}
          vapor_fraction: {type: number, minimum: 0, maximum: 1, description: 'molar vapour fraction; PVF flash at outlet_P'}
      validation:
      - V1-flash-corripio-2013
      note: PT / PH (duty_W) / PVF flash at the outlet pressure — exactly one of
        duty_W and vapor_fraction; the inlets are first adiabatically PH-mixed at
        the lowest inlet pressure (a single inlet passes through unchanged); the
        balancing duty is reported; gas, liquid and (when the package gives one)
        aqueous outlets at their flash states
    R1:
      status: provisional
      adapter: ngdesign.units.separation.flash_drum_r1:FlashDrumR1
      params:
        type: object
        properties:
          outlet_P: {type: number, description: 'outlet pressure, Pa abs; default min inlet P'}
          duty_W: {type: number, description: 'heat added to the drum, W; PH flash with H_out = H_in + duty_W'}
          vapor_fraction: {type: number, minimum: 0, maximum: 1, description: 'molar vapour fraction; PVF flash at outlet_P'}
          K_m_s: {type: number, exclusiveMinimum: 0, description: 'Souders-Brown K, m/s; default York demister fit at the drum pressure'}
          diameter_m: {type: number, exclusiveMinimum: 0, description: 'vessel inside diameter, m; enables the carry-over calculation'}
          inlet_entrained_fraction: {type: number, minimum: 0, maximum: 1, description: 'fraction of the liquid entering the gravity section as droplets'}
          droplet_d_rr_m: {type: number, exclusiveMinimum: 0, description: 'Rosin-Rammler characteristic droplet size, m'}
          droplet_n_rr: {type: number, exclusiveMinimum: 0, description: 'Rosin-Rammler spread parameter'}
          gas_viscosity_Pa_s: {type: number, exclusiveMinimum: 0, description: 'gas viscosity override, Pa s'}
      validation: []
      note: Souders-Brown sizing (York demister K) and droplet carry-over at a given diameter over both liquid outlets; reduces to R0 without diameter_m or at E = 0
      end_state: true
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 3
  notes: R0 PT/PH/PVF flash implemented with an optional mixed second inlet; the
    flash family is validated by V1-flash-corripio-2013 (assessed PR-vs-ideal-K
    miss) and V0 self-consistency; Souders-Brown sizing is R1.

- id: decanter
  name: Decanter
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: LLE feed
    outlet:
    - name: light_out
      required: true
      description: light liquid phase
    - name: heavy_out
      required: true
      description: heavy liquid phase
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.decanter:Decanter
      params:
        type: object
        properties:
          dP: {type: number, minimum: 0, description: 'pressure drop, Pa; default 0'}
      note: PT flash at (T_in, P_in - dP); the two liquid phases leave light/heavy by
        phase density; a single-liquid or vapour-returning flash is refused, naming T and P.
        Evidence gap — V0 self-consistency only — no cited worked example validates
        a decanter split at R0
    R1:
      status: provisional
      adapter: ngdesign.units.separation.decanter_r1:DecanterR1
      params:
        type: object
        required: [dispersed_phase, droplet_diameter_m]
        properties:
          dP: {type: number, minimum: 0, description: 'pressure drop, Pa; default 0'}
          dispersed_phase: {type: string, enum: [light, heavy], description: 'phase forming the droplets'}
          droplet_diameter_m: {type: number, exclusiveMinimum: 0, description: 'design droplet diameter, m'}
          interface_area_m2: {type: number, exclusiveMinimum: 0, description: 'interface (settling) area, m2'}
          diameter_m: {type: number, exclusiveMinimum: 0, description: 'horizontal vessel diameter, m (interface at the centre line)'}
          length_m: {type: number, exclusiveMinimum: 0, description: 'horizontal vessel length, m'}
          continuous_viscosity_Pa_s: {type: number, exclusiveMinimum: 0, description: 'continuous-phase viscosity override, Pa s'}
      note: Stokes settling with Richardson-Zaki hindered settling on the R0 split;
        Hazen ideal-settler efficiency scales the dispersed outlet and reflashes
        the continuous outlet with the entrained dispersed liquid; Re_t >= 1 is
        refused (R1 is a Stokes model)
      end_state: true
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-D 4
  notes: R0 LLE split implemented; Stokes settling sizing is R1 (plan §2b).

- id: tank
  name: Tank / surge drum
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: well-mixed outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.tank:Tank
      params:
        type: object
        properties:
          P: {type: number, description: 'outlet pressure, Pa abs; default min inlet P'}
          volume_m3: {type: number, minimum: 0, description: 'liquid holdup, m3; drives the residence-time report'}
      note: adiabatic PH mix at P = min inlet P (or a given P — refused when it
        exceeds the lowest inlet pressure — the tank does not raise pressure);
        info residence_time_s = volume_m3 / liquid volumetric flow (from the
        outlet liquid phases' density). Closed-form R0 — a pure mixer with spec
        quantities only, no correlation constants
      end_state: true
  pid_symbol: TK
  references:
  - docs/unit-catalogue-plan.md §2 U-D 5
  notes: R0 mixer implemented; volume_m3 is an optional holdup report, not sizing.

- id: hydrocyclone
  name: Hydrocyclone / cyclone
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: slurry/gas feed
    outlet:
    - name: overflow
      required: true
      description: fine stream
    - name: underflow
      required: true
      description: coarse stream
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.hydrocyclone:Hydrocyclone
      params:
        type: object
        properties:
          underflow_fractions:
            type: object
            description: 'component id to the fraction of its molar flow sent to the underflow; unnamed components go entirely to the overflow'
          dP: {type: number, minimum: 0, description: 'pressure drop, Pa; applied to the overflow outlet'}
      note: per-component split spec — the underflow is the spec, not a correlation
        constant; the overflow leaves at P_in - dP, the underflow at P_in.
        Evidence gap — Perry Sect. 18 cut-size sizing is R1, so no worked example
        validates a cut size at R0 (V0 self-consistency only).
    R1:
      status: provisional
      adapter: ngdesign.units.separation.hydrocyclone_r1:HydrocycloneR1
      params:
        type: object
        required: [particle_components, particle_density_kg_m3, inlet_width_m, inlet_height_m]
        properties:
          particle_components:
            type: array
            items: {type: string}
            minItems: 1
            description: component ids forming the particles/droplets
          particle_density_kg_m3: {type: number, exclusiveMinimum: 0, description: 'particle density, kg/m3'}
          particle_diameter_m: {type: number, exclusiveMinimum: 0, description: 'monodisperse particle diameter, m'}
          d_rr_m: {type: number, exclusiveMinimum: 0, description: 'Rosin-Rammler characteristic size, m'}
          n_rr: {type: number, exclusiveMinimum: 0, description: 'Rosin-Rammler spread'}
          inlet_width_m: {type: number, exclusiveMinimum: 0, description: 'inlet width W, m'}
          inlet_height_m: {type: number, exclusiveMinimum: 0, description: 'inlet height H, m'}
          body_length_m: {type: number, exclusiveMinimum: 0, description: 'cylinder length Lb, m'}
          cone_length_m: {type: number, exclusiveMinimum: 0, description: 'cone length Lc, m'}
          N_e: {type: number, exclusiveMinimum: 0, description: 'effective turns; default (Lb + Lc/2)/H'}
          outlet_diameter_m: {type: number, exclusiveMinimum: 0, description: 'vortex finder diameter De, m'}
          K_inlet: {type: number, exclusiveMinimum: 0, description: 'Shepherd-Lapple inlet constant; default 16 (tangential)'}
          fluid_underflow_fraction: {type: number, minimum: 0, exclusiveMaximum: 1, description: 'fluid flow split to the underflow'}
          dP: {type: number, minimum: 0, description: 'overflow pressure drop, Pa; default Shepherd-Lapple'}
          fluid_viscosity_Pa_s: {type: number, exclusiveMinimum: 0, description: 'fluid viscosity override, Pa s'}
      note: Lapple cut size (H3), grade efficiency (H4), Rosin-Rammler overall
        efficiency by 64-point Gauss-Legendre (H5) and Shepherd-Lapple pressure
        drop (H6); the split is delegated to R0 with the computed fractions.
        Barth's static-particle model is not part of R1 — the row names
        "Lapple / Barth", R1 implements Lapple only. Q uses the slurry
        approximation (total mass flow over the continuous-fluid density).
      end_state: true
  pid_symbol: CYC
  references:
  - docs/unit-catalogue-plan.md §2 U-D 6
  notes: R0 split spec implemented; deoiling example with 95 % water to the underflow.
    R1 V1 gap — no verifiable printed copy of the candidate sources (Cooper & Alley,
    Air Pollution Control, Ch. 4 Lapple worked example; Perry's 8th ed. Sect. 17
    cyclone example) was found online. A Dartmouth ENGS-37 lecture adaptation of the
    Cooper & Alley example (cushman.host.dartmouth.edu/courses/engs37/Cyclones.pdf,
    p. 10) prints D, Q, rho_p, the size distribution, N = 6, v_i = 20 m/s,
    d_pc = 5.79 um and the per-size efficiency table, but not the fluid viscosity or
    air density the example used, so its d50 anchor cannot be transcribed without
    reconstructing inputs. Searched 2026-10-25; R1 ships provisional on its
    closed-form (CF1-CF5) and R0-identity tests.

- id: filter
  name: Filter
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: slurry feed
    outlet:
    - name: filtrate
      required: true
      description: clear filtrate
    - name: cake
      required: true
      description: solids cake
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.filter:Filter
      params:
        type: object
        properties:
          cake_fractions:
            type: object
            description: 'component id to the fraction of its molar flow sent to the cake; unnamed components pass entirely to the filtrate'
          dP: {type: number, minimum: 0, description: 'pressure drop, Pa; applied to the filtrate outlet (the cake leaves at the inlet pressure)'}
      note: per-component split spec — the cake split is the spec, not a correlation
        constant; the filtrate leaves at P_in - dP, the cake at P_in.
        Evidence gap — cake-resistance physics is R1, so no worked example
        validates a cake at R0 (V0 self-consistency only).
    R1:
      status: provisional
      adapter: ngdesign.units.separation.filter_r1:FilterR1
      params:
        type: object
        required: [cake_fractions, dP, specific_cake_resistance_m_kg, t_filtration_s, solid_density_kg_m3]
        properties:
          cake_fractions:
            type: object
            description: 'component id to the fraction of its molar flow sent to the cake (the solids)'
          dP: {type: number, exclusiveMinimum: 0, description: 'filtration pressure difference, Pa; applied to the filtrate'}
          specific_cake_resistance_m_kg: {type: number, exclusiveMinimum: 0, description: 'specific cake resistance alpha, m/kg'}
          medium_resistance_1_m: {type: number, minimum: 0, description: 'filter medium resistance Rm, 1/m; default 0'}
          t_filtration_s: {type: number, exclusiveMinimum: 0, description: 'filtration time per cycle, s'}
          t_down_s: {type: number, minimum: 0, description: 'washing/discharge downtime per cycle, s; default 0'}
          solid_density_kg_m3: {type: number, exclusiveMinimum: 0, description: 'true solid density, kg/m3'}
          cake_porosity: {type: number, minimum: 0, exclusiveMaximum: 1, description: 'cake void fraction; default 0 (dry cake)'}
          area_m2: {type: number, exclusiveMinimum: 0, description: 'installed filter area, m2 (capacity ratio)'}
          filtrate_viscosity_Pa_s: {type: number, exclusiveMinimum: 0, description: 'filtrate viscosity override, Pa s'}
      note: Ruth constant-pressure cake filtration over the R0 split — required
        area, cake thickness and cake moisture (F1-F7); reduces exactly to R0
        at zero porosity.
      end_state: true
  pid_symbol: FLT
  references:
  - docs/unit-catalogue-plan.md §2 U-D 7
  notes: R1 V1 gap (PR 280) — provisional without a case. Searched the spec's
    candidates and none prints a case for the batch constant-pressure Ruth
    model with printed inputs only — Geankoplis 4th ed. sect. 14.2, Examples
    14.2-1 and 14.2-2 evaluate alpha and Rm by regression on t-V data, so
    there is no printed input/output pair to pin at the closed form, and
    Example 14.2-4 folds the wet-cake moisture into Cs = rho*Cx/(1 - m*Cx)
    with m = 2 kg wet cake per kg dry cake, a moisture model different from
    R1's porosity-based cake, so reproducing its printed 6.66 m2 needs an
    unprinted cake porosity; the FOSSEE open transcription of Geankoplis
    ch. 14, whose regression prints differ from the book's graphical reads
    (264.61 s vs the book's 269.7 s recovery time used in 14.2-3); and
    McCabe, Smith and Harriott 7th ed., Mechanical Separations (fetched and
    inspected), Example 30.2 being a least-squares regression of t-V data
    for alpha and Rm and Example 30.3 a continuous rotary-drum design with
    a compressible cake (alpha = alpha0/dP**0.26) and the moisture folded
    into the slurry concentration. The level is covered by the closed-form
    CF1-CF4 tests and the R0-reduction identity instead.

- id: membrane
  name: Membrane (gas)
  family: separation
  ports:
    inlet:
    - name: feed_in
      required: true
      description: high-pressure feed gas
    outlet:
    - name: permeate
      required: true
      description: permeate stream
    - name: residue
      required: true
      description: residue stream
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.membrane:Membrane
      params:
        type: object
        properties:
          permeate_recovery:
            type: object
            description: 'component id to the fraction of its molar flow crossing to the permeate; unnamed components stay in the residue'
          stage_cut: {type: number, minimum: 0, maximum: 1, description: 'fraction of the feed molar flow recovered as permeate (binary Weller-Steiner model)'}
          perm_ratio:
            type: object
            description: 'component id to relative permeance; required with stage_cut (binary)'
          P_permeate: {type: number, description: 'permeate-side absolute pressure, Pa; required'}
      validation:
      - V1-membrane-geankoplis-13-4-2
      note: exactly one of permeate_recovery (any components) and stage_cut with
        perm_ratio (binary Weller-Steiner complete mixing); the permeate leaves
        at P_permeate, the residue at P_in. Evidence gap — the stage-cut model is
        validated against Geankoplis Ex. 13.4-2 (air, y_O2 = 0.5068, reject
        x_O2 = 0.1345); the permeate_recovery path is a spec split with V0
        self-consistency only.
    R1:
      status: provisional
      adapter: ngdesign.units.separation.membrane_r1:MembraneR1
      params:
        type: object
        required: [permeances_mol_m2_s_Pa, P_permeate]
        properties:
          permeances_mol_m2_s_Pa: {type: object, description: 'component id to permeance, mol/(m2 s Pa) (1 GPU = 3.348e-10); every feed component required'}
          P_permeate: {type: number, exclusiveMinimum: 0, description: 'permeate-side absolute pressure, Pa'}
          area_m2: {type: number, exclusiveMinimum: 0, description: 'membrane area, m2 (rating mode)'}
          stage_cut: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: 'target permeate/feed molar ratio (design mode; area is solved)'}
      note: solution-diffusion with permeances, cross-flow (Weller-Steiner 1950,
        Pan 1983) with the local permeate y_i = J_i/ΣJ from a bracketed brentq
        (closed form at P_l = 0) and the feed side dn_i/da = -J_i integrated
        DOP853 at rtol 1e-11; stage-cut mode by a terminal event with the
        A_hard cap; isothermal outlets via split_by_component as in R0.
    R2:
      status: provisional
      adapter: ngdesign.units.separation.membrane_r2:MembraneR2
      params:
        type: object
        required: [permeances_mol_m2_s_Pa, P_permeate]
        properties:
          permeances_mol_m2_s_Pa: {type: object, description: 'component id to permeance, mol/(m2 s Pa) (1 GPU = 3.348e-10); every feed component required'}
          P_permeate: {type: number, exclusiveMinimum: 0, description: 'permeate-side absolute pressure, Pa'}
          area_m2: {type: number, exclusiveMinimum: 0, description: 'membrane area, m2 (rating mode)'}
          stage_cut: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: 'target permeate/feed molar ratio (design mode; area is solved)'}
      note: counter-current module, Pan 1983 shooting on the residue flows
        (scipy root hybr, tol 1e-12) with the permeate plug flow dp_i/da = -J_i
        toward the feed end, the M2 switch at Sum(p) <= 1e-12 F, and design
        mode by brentq on theta_R2(A) - theta over [0, A_R1(theta)]; outlets
        as in R0/R1.
      end_state: true
  pid_symbol: M
  references:
  - docs/unit-catalogue-plan.md §2 U-D 8
  notes: R0 split and stage-cut specs implemented; Geankoplis Ex. 13.4-2 example.
      V1 gap — no printed cross-flow or counter-current worked example was found for
      R1/R2 (searched Geankoplis §13.5 cross-flow worked example, Pan 1983, Baker
      Ch. 8, and the plan's candidates); the R1/R2 oracle cases CF1–CF4 are
      hand-computed (scratchpad/unit-specs/calc_membrane.py RK4/bisection — no
      printed source), checked by the Rayleigh closed form and the R2 -> R1 -> R0
      identities.

- id: adsorption_bed
  name: Adsorption bed (TSA/PSA)
  family: separation
  ports:
    inlet:
    - name: feed_in
      required: true
      description: gas to the bed
    outlet:
    - name: product_out
      required: true
      description: treated product
    - name: regen_out
      required: false
      description: regeneration (tail-gas) outlet during the cycle
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.adsorption_bed:AdsorptionBed
      params:
        type: object
        required: [removal_fraction]
        properties:
          removal_fraction:
            type: object
            description: 'component id -> fraction of its molar flow taken to the desorbate'
          capacity_kg_per_kg: {type: number, minimum: 0, description: 'adsorbate loading, kg per kg bed'}
          bed_mass_kg: {type: number, minimum: 0, description: 'bed mass, kg'}
          product_P: {type: number, description: 'product outlet pressure, Pa abs; default feed P'}
          regen_P: {type: number, description: 'desorbate outlet pressure, Pa abs; default feed P'}
          product_T: {type: number, description: 'product outlet temperature, K; default feed T'}
          regen_T: {type: number, description: 'desorbate outlet temperature, K; default feed T'}
      note: adsorbate split spec to regen_out; product and desorbate flashed at
        their own T (product_T / regen_T, default feed T) and their own P;
        info cycle_time_s = capacity * bed_mass / adsorbate mass rate. The
        default capacity 0.10 kg/kg is the ~10 wt% design water loading GPSA
        quotes for molecular sieves (Sect. 20, dehydration). V1 gap -- no printed
        worked example of a split-spec adsorption bed with its printed outlet
        state was found; the row is checked by closed-form tests only
    R1:
      status: provisional
      adapter: ngdesign.units.separation.adsorption_bed_r1:AdsorptionBedR1
      params:
        type: object
        required: [removal_fraction, langmuir]
        properties:
          removal_fraction:
            type: object
            description: 'component id -> fraction of its molar flow taken to the desorbate'
          langmuir:
            type: object
            description: 'adsorbate id -> {q_max_mol_kg, b_1_Pa}; saturation capacity mol/kg and Langmuir affinity 1/Pa; extended Langmuir over all adsorbates'
          bed_mass_kg: {type: number, minimum: 0, description: 'bed mass, kg; or the geometry form below, exactly one'}
          bed_density_kg_m3: {type: number, minimum: 0, description: 'packed-bed density, kg/m3 (geometry form, all three required)'}
          bed_diameter_m: {type: number, minimum: 0, description: 'bed inside diameter, m (geometry form)'}
          bed_length_m: {type: number, minimum: 0, description: 'packed length, m (geometry form); required for a LUB'}
          lub_m: {type: number, minimum: 0, description: 'length of unused bed, m; default 0'}
          dH_ads_J_mol:
            type: object
            description: 'adsorbate id -> heat of adsorption, J/mol (negative); with T_ref_K, rescales b via van t Hoff'
          T_ref_K: {type: number, minimum: 0, description: 'reference temperature of the given b values, K; with dH_ads_J_mol'}
          product_P: {type: number, description: 'product outlet pressure, Pa abs; default feed P'}
          regen_P: {type: number, description: 'desorbate outlet pressure, Pa abs; default feed P'}
          product_T: {type: number, description: 'product outlet temperature, K; default feed T'}
          regen_T: {type: number, description: 'desorbate outlet temperature, K; default feed T'}
      note: >-
        R0 outlets and duty unchanged; cycle_time_s from extended-Langmuir
        equilibrium loading (feed-basis partial pressures, Langmuir 1918 /
        Markham-Benton 1931), optional van 't Hoff affinity rescale (Ruthven
        1984 Ch. 2), stoichiometric time on the removed rate and LUB
        breakthrough (Collins 1967; McCabe-Smith-Harriott 7th ed. Ch. 25;
        Geankoplis 4th ed. §12.3) — t_b = t_s·(1 − LUB/L), cycle = min over
        adsorbates. capacity_kg_per_kg is refused at R1. The R0 equivalence
        (capacity = q*·MW/1000 reproduces the same cycle time) holds to 1e-12.
        Spec issue recorded on PR no. 295 — the spec's printed CF3/CF4 times
        (57726.765 s / 50510.9194 s) are 1000× the A4 result for its own
        stated inputs (the division by the 1000 mol/s adsorbate rate was
        dropped); A4 is implemented as written. V1 gap — no printed worked
        example with a verifiable breakthrough time was transcribed: the
        verified FOSSEE transcription of Geankoplis Ch. 12
        (tbc-python.fossee.in) contains only Ex. 12.3-1 (alcohol-in-air
        scale-up), whose printed outputs are used/unused bed lengths
        (10.23 / 3.77 cm) and a saturation capacity (0.124 g/g carbon);
        the book's comparable time appears only as the Part B design input
        (break point 6.0 hr), never as a printed result for a specified
        bed, and no isotherm is stated to transcribe. The
        McCabe-Smith-Harriott Ch. 25 candidate has no verified open
        transcription. The row is checked by closed-form tests only
      end_state: true
  pid_symbol: X
  references:
  - docs/unit-catalogue-plan.md §2 U-D 9
  notes: molecular-sieve dehydration (plan U-G 6) maps onto this row with a cycle —
    no separate treating row.

- id: hydrate_check
  name: Hydrate check / inhibitor injection
  family: separation
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas stream at risk of hydrates
    - name: inhibitor_in
      required: false
      description: inhibitor (MeOH/MEG) injection
    outlet:
    - name: outlet
      required: true
      description: gas with hydrate margin and inhibitor dose reported
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.separation.hydrate_check:HydrateCheck
      params:
        type: object
        properties:
          P: {type: number, description: 'mixed outlet pressure, Pa abs; default min inlet P'}
          T_operating_K: {type: number, description: 'target operating temperature, K; drives the required-inhibitor-dose info'}
      validation:
      - V1-hydrate-gpsa-20-10
      note: adiabatic PH mix; hydrate_T from hammerschmidt_formation at the mixed P,
        dose from nielsen_bucklin_suppression at the operating T; the required
        inhibitor rate covers the aqueous phase only — GPSA's vapour and
        hydrocarbon-liquid methanol losses are excluded at R0
    R1:
      status: provisional
      adapter: ngdesign.units.separation.hydrate_check_r1:HydrateCheckR1
      params:
        type: object
        properties:
          P: {type: number, description: 'mixed outlet pressure, Pa abs; default min inlet P (R0)'}
          T_operating_K: {type: number, description: 'target operating temperature, K; drives the dose (R0)'}
          hydrate_method: {type: string, enum: [towler_mokhatab, hammerschmidt], description: 'hydrate-temperature correlation; default towler_mokhatab (Katz gas-gravity fit)'}
      note: >-
        selectable hydrate T — Katz gas gravity (Towler-Mokhatab 2005 fit,
        enforced validity range 0.55 < gamma < 1.0, 1200-40000 kPa) or R0's
        Hammerschmidt; outlet, duty and dose bisection unchanged from R0; the
        vdWP route is out of scope because no thermo hydrate model exists
      end_state: true
  pid_symbol: HC
  references:
  - docs/unit-catalogue-plan.md §2 U-D 10
  notes: >-
    roadmap; S2 slice (plan §2b). R1 V1 gap (searched 2026-10-25): Towler &
    Mokhatab (2005) compare against experimental hydrate points but do not
    print the gas compositions the unit needs to compute gravity; Sloan & Koh,
    Clathrate Hydrates of Natural Gases 3rd ed. ch. 4, and GPSA Sect. 20 give
    gravity-chart readings only (figure-based). The R1 Katz fit is checked by
    closed-form tests on the transcribed coefficients; R0's GPSA 20-10 dose
    case still applies through the Hammerschmidt method.
