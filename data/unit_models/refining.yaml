      required: true
      description: heated assay feed
    outlet:
    - name: vapor_out
      required: true
      description: flashed vapor
    - name: liquid_out
      required: true
      description: flashed liquid
  levels:
    R0:
      status: planned
      params: {}
      note: flash drum on the assay stream (today via the separator row)
    R2:
      status: planned
