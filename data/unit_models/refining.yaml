    outlet:
    - name: acid_gas_out
      required: true
      description: acid gas overhead
    - name: clean_water_out
      required: true
      description: stripped water bottoms
  levels:
    R2:
      status: planned
      params: {}
      note: a reboiled-stripper CONFIGURATION on the electrolyte package (T-09), not a
        bespoke unit — today via the `column` row's stripper configuration with a
        sour-water package (plan U-G 9; plan-to-registry mapping)
      end_state: true
  pid_symbol: SW
  references:
  - docs/unit-catalogue-plan.md §2 U-H 12
  notes: roadmap; kept as a palette reference row — resolve_level refuses until the
    sour-water package lands.
