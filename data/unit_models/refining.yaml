# U-H — Refining (plan §2 U-H, 12 rows).
#
# LNG and NGL recovery templates are excluded as flowsheet templates (plan §2
# decision): they are example flowsheets in data/example_cases, not catalogue rows.

- id: crude_column
  name: Atmospheric crude column
  family: refining
  ports:
    inlet:
    - name: crude_in
      required: true
      description: heated crude feed
    outlet:
    - name: overhead
      required: true
      description: naphtha overhead
    - name: kero_out
      required: true
      description: kerosene side draw
    - name: diesel_out
      required: true
      description: diesel side draw
    - name: ago_out
      required: true
      description: atmospheric gas oil side draw
    - name: bottoms
      required: true
      description: reduced crude bottoms
  levels:
    R2:
      status: planned
      params: {}
      note: MESH with multiple side draws + steam stripping (needs column_extensions, P1-11)
    R3:
      status: planned
      params: {}
      note: rate-based with film hydraulics
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-H 1
  notes: roadmap; needs pseudo-component preflash (P1-14) and column extensions (plan §2b).

