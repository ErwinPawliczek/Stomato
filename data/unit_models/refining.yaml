# U-H — Refining (plan §2 U-H, 12 rows).
#
# Review round 2: the family is the plan table verbatim — every level note is
# the plan table's R0/R1/R2 cell, and reactors declare nothing above R1 (plan:
# "nothing above R1 is planned for them").
#
# Rows recorded on round 1 and dropped here, with the decisions:
# - alkylation, isomerization: not on the plan's U-H list (plan §2 palette).
# - LPG recovery: a flowsheet template built from the column-family absorber +
#   regenerator rows, not a bespoke unit (plan §2 — LNG/NGL templates are
#   example flowsheets, not catalogue rows).
# - sour-water stripping: a reboiled-stripper CONFIGURATION on the electrolyte
#   package (T-09), reached via the column row (plan U-G 9).
# - assay-based feed characterization: merged into the assay feeder row — the
#   assay that cuts pseudo-components is data-layer work (A-01, P1-14).

- id: assay_feeder
  name: Assay feeder
  family: refining
  ports:
    inlet:
    - name: assay_in
      required: true
      description: crude assay data (A-01 data layer)
    outlet:
    - name: cuts_out
      required: true
      description: pseudo-component stream at T, P, flow
  balance: molar
  levels:
    R0:
      status: provisional
      validation:
      - V2101
      adapter: ngdesign.units.refining.assay_feeder:AssayFeeder
      params:
        type: object
        properties:
          assay_id:
            type: string
            description: id of the stored A-01 assay whose slate is the feed
          T:
            type: number
            description: outlet temperature (K)
          P:
            type: number
            description: outlet pressure (Pa abs)
        required:
        - assay_id
        - T
        - P
      note: assay (A-01) → pseudo-component stream at T, P, flow (spec U-H1,
        the inlet must match the declared slate exactly)
      end_state: true
  pid_symbol: ASSAY
  references:
  - docs/unit-catalogue-plan.md §2 U-H 1
  notes: roadmap; pairs with the A-01 assay work and the flowsheet-owned
    pseudo-components (P1-14); assay cutting is data-layer work.

- id: desalter
  name: Desalter
  family: refining
  ports:
    inlet:
    - name: crude_in
      required: true
      description: crude feed
    - name: wash_in
      required: true
      description: wash water
    outlet:
    - name: crude_out
      required: true
      description: desalted crude
    - name: water_out
      required: true
      description: salty waste water
  balance: molar
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.desalter:Desalter
      params:
        type: object
        properties:
          T:
            type: number
            description: outlet temperature (K), isothermal desalter
          dP:
            type: number
            description: pressure drop from the crude inlet (Pa, default 0)
          water_carryover_frac:
            type: number
            description: fraction of inlet water reporting to the desalted crude
              (the BS&W)
          salt_removal:
            type: number
            description: fraction of tracked NaCl leaving with the brine
        required:
        - T
        - water_carryover_frac
        - salt_removal
      note: water/salt/BS&W split spec, wash-water mix (spec U-H1, component
        split at isothermal T with ΔP)
    R1:
      status: planned
      params: {}
      note: efficiency vs wash rate and ΔT (cited correlation)
      end_state: true
  pid_symbol: DS
  references:
  - docs/unit-catalogue-plan.md §2 U-H 2
  notes: V1 gap — provisional without a case. Searched PetroWiki "Desalting" and
    Wauquier (Petroleum Refining vol. 1, crude desalting): both state a
    0.1–0.2 vol% BS&W specification but print no worked case, so the former
    V2102 pin (which echoed its own input spec and the adapter's default salt
    removal) was withdrawn at re-review. The water/salt/BS&W split is covered
    by closed-form tests in tests/units/refining/test_separation.py.

- id: crude_column
  name: Atmospheric crude column
  family: refining
  ports:
    inlet:
    - name: crude_in
      required: true
      description: heated crude feed
    - name: stripping_steam
      required: false
      description: stripping steam; its water (H2O) reports to the overhead
    outlet:
    - name: overhead
      required: true
      description: naphtha overhead
    - name: kero_out
      required: true
      description: kerosene side draw
    - name: diesel_out
      required: true
      description: diesel side draw
    - name: ago_out
      required: true
      description: atmospheric gas oil side draw
    - name: bottoms
      required: true
      description: reduced crude bottoms
  balance: molar
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.crude_column:CrudeColumn
      params:
        type: object
        properties:
          cut_points_K:
            type: array
            items:
              type: number
            description: four ascending TBP cut boundaries (K) for the five
              products
          overlap_K:
            type: number
            description: linear split band (K) at each cut boundary (default 0)
          draws:
            type: object
            description: per-port {T, P} draw conditions (default the feed state)
        required:
        - cut_points_K
      note: cut-point fractionation (TBP cut points, gap/overlap spec) — spec
        U-H1 sharp cut, light ends and water to the overhead; optional
        stripping_steam inlet carries its water to the overhead at R0
        (one net duty)
    R2:
      status: planned
      params: {}
      note: MESH with side strippers, pumparounds, stripping steam, overflash
        (U-E 6 extensions; needs column_extensions, P1-11)
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-H 3
  notes: V1 gap — provisional without a case. The open Bagajewicz & Ji (2001)
    copy prints no per-cut product-yield table (transcription gaps recorded in
    data/validation_units/refining/s0_reference.yaml), so the former V2103 pin
    (a closed-form recomputation of the adapter's own cut arithmetic) was moved
    to a closed-form test in tests/units/refining/test_separation.py. Column
    extensions still planned (P1-11).

- id: side_strip
  name: Side stripper
  family: refining
  ports:
    inlet:
    - name: draw_in
      required: true
      description: side draw from the main column
    - name: steam_in
      required: true
      description: stripping steam
    outlet:
    - name: overhead_out
      required: true
      description: stripped product + steam back to the column
    - name: bottoms_out
      required: true
      description: stripped liquid product
  levels:
    R0:
      status: planned
      params: {}
      note: steam-stripped draw, Kremser on pseudos
    R2:
      status: planned
      params: {}
      note: MESH stage section coupled to the main column
      end_state: true
  pid_symbol: SS
  references:
  - docs/unit-catalogue-plan.md §2 U-H 4
  notes: roadmap.

- id: vacuum_column
  name: Vacuum distillation column
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: reduced crude feed
    outlet:
    - name: overhead
      required: true
      description: overhead (wash oil / vacuum gas oil)
    - name: vgo_out
      required: true
      description: vacuum gas oil draw
    - name: bottoms
      required: true
      description: vacuum residuum
  balance: molar
  levels:
    R0:
      status: provisional
      validation:
      - V2104
      adapter: ngdesign.units.refining.vacuum_column:VacuumColumn
      params:
        type: object
        properties:
          cut_points_K:
            type: array
            items:
              type: number
            description: two ascending TBP cut boundaries (K) for the three
              products
          overlap_K:
            type: number
            description: linear split band (K) at each cut boundary (default 0)
          draws:
            type: object
            description: per-port {T, P} draw conditions (default the feed state)
        required:
        - cut_points_K
      note: cut-point fractionation at flash-zone P (spec U-H1 sharp cut on the
        reduced-crude feed; single VGO draw, the row's three ports)
    R2:
      status: planned
      params: {}
      note: MESH with pumparounds, no condenser, wash zone
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-H 5
  notes: roadmap.

- id: preflash
  name: Preflash / flash column
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: heated assay feed
    outlet:
    - name: vapor_out
      required: true
      description: flashed vapor
    - name: liquid_out
      required: true
      description: flashed liquid
  balance: molar
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.preflash:Preflash
      params:
        type: object
        properties:
          T:
            type: number
            description: drum temperature (K)
          P:
            type: number
            description: drum pressure (Pa abs, default the inlet pressure)
        required:
        - T
      note: flash drum on the assay stream (spec U-H1 PT flash at the drum
        conditions; vapour to vapor_out, pooled liquid to liquid_out)
    R2:
      status: planned
      params: {}
      note: short MESH
      end_state: true
  pid_symbol: FL
  references:
  - docs/unit-catalogue-plan.md §2 U-H 6
  notes: V1 gap — provisional without a case. The drum conditions are published
    (Gary et al., Petroleum Refining, p. 66), but no open source prints a
    flashed-vapour yield for that basis, so the former V2105 pin (a regression
    value computed by the registered PR package) was withdrawn; plumbing and
    vapour-fraction consistency live as closed-form tests in
    tests/units/refining/test_separation.py.

- id: naphtha_ht
  name: Naphtha hydrotreater
  family: refining
  ports:
    inlet:
    - name: naphtha_in
      required: true
      description: naphtha feed
    - name: h2_in
      required: true
      description: hydrogen feed
    outlet:
    - name: treated_out
      required: true
      description: hydrotreated naphtha
    - name: gas_out
      required: true
      description: H2S / offgas
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.reactors_hdt:NaphthaHydrotreater
      params:
        type: object
        properties:
          sulfur_removal_frac:
            {type: number, description: 'feed sulfur removal fraction, in [0, 1], default 1.0'}
          nitrogen_removal_frac:
            {type: number, description: 'feed nitrogen removal fraction, in [0, 1], default 1.0'}
          pentene_conversion:
            {type: number, description: 'olefin saturation conversion, in [0, 1], default 0'}
          benzene_conversion:
            {type: number, description: 'aromatic saturation conversion, in [0, 1], default 0'}
          T_out: {type: number, description: 'outlet temperature, K, default 620'}
          P_out: {type: number, description: 'outlet pressure, Pa, default 3.0e6'}
      validation:
      - V1_naphtha_ht_e12_2
      note: Fahim E12.2 model-compound stoichiometry (thiophene HDS, pyridine HDN,
        olefin/aromatic saturation) with declared removal fractions; duty sensible-only
    R1:
      status: planned
      params: {}
      note: lumped HDS/HDN kinetics in a PFR
      end_state: true
  pid_symbol: HT
  references:
  - docs/unit-catalogue-plan.md §2 U-H 7
  notes: "R0 shipped by U-H2. Sulfur rides on thiophene, nitrogen on pyridine; real
    H2/H2S/NH3 products from pseudo-lump feeds need pseudo-component elemental
    characterization (issue #222)."

- id: reformer_cat
  name: Catalytic reformer
  family: refining
  ports:
    inlet:
    - name: naphtha_in
      required: true
      description: naphtha feed
    outlet:
    - name: reformate_out
      required: true
      description: reformate
    - name: h2_out
      required: true
      description: hydrogen by-product
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.reactors_reformer:CatalyticReformer
      params:
        type: object
        required: [ron_reformate, naphthenes_vol_pct, aromatics_vol_pct]
        properties:
          ron_reformate:
            {type: number, description: 'target reformate RON (correlation fitted near 80-104)'}
          naphthenes_vol_pct: {type: number, description: 'feed naphthenes, vol%'}
          aromatics_vol_pct: {type: number, description: 'feed aromatics, vol%'}
          T_out: {type: number, description: 'outlet temperature, K, default 780'}
          P_out: {type: number, description: 'outlet pressure, Pa, default 3.0e6'}
      validation:
      - V1_reformer_e5_2
      note: Fahim Table 5.3 lumped yields vs reformate RON; duty sensible-only (flag
        heat_of_reaction_basis_sensible_only)
    R1:
      status: planned
      params: {}
      note: Smith (1959) lumped kinetics
      end_state: true
  pid_symbol: RF
  references:
  - docs/unit-catalogue-plan.md §2 U-H 8
  notes: "R0 shipped by U-H2. The spec's \"H2 and light ends as real components\" is
    out of reach of the mass_elements balance (C/H atoms with no formula-bearing
    source from a pseudo naphtha); the offgas is a mass-only lump, species split
    in info. Pseudo-component elemental characterization - issue #222."

- id: fcc
  name: Fluid catalytic cracker
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: VGO feed
    outlet:
    - name: dry_gas_out
      required: true
      description: dry gas
    - name: lpg_out
      required: true
      description: LPG
    - name: gasoline_out
      required: true
      description: gasoline
    - name: lco_out
      required: true
      description: light cycle oil
    - name: slurry_out
      required: true
      description: slurry/slops
  levels:
    R0:
      status: planned
      params: {}
      note: yield table vs conversion
    R1:
      status: planned
      params: {}
      note: Weekman 3/4-lump kinetics with heat balance
      end_state: true
  pid_symbol: FC
  references:
  - docs/unit-catalogue-plan.md §2 U-H 9
  notes: roadmap; nothing above R1 is planned (plan §2 U-H preamble). R0 record of
    what was searched (U-H2 review) - the published FCC yield correlations are
    chart/figure-based (Gary, Handwerk & Kaiser, Petroleum Refining, 5th ed. 2007,
    §6.12 Yield Estimation, pp. 143-144, points at Figures 6.17-6.28) and the U-R1
    conventions forbid digitising figures; no equation-based R0 correlation was
    found in the open sources searched, so the row stays planned rather than
    shipping a figure-transcription.

