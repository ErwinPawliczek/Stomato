      required: true
      description: blendstock feed (multiple via params)
    outlet:
    - name: blend_out
      required: true
      description: blended product
  levels:
    R0:
      status: planned
      params: {}
      note: linear blend of component properties — shares the mixer adapter (linear blend)
    R1:
      status: planned
      params: {}
      note: blend indices (RON/MON, RVP, pour) — the cloud_point and pour_point plugins exist
      end_state: true
  sizer: null  # no registered blender sizer; sizing ships with a later spec
  pid_symbol: BL
  references:
  - docs/unit-catalogue-plan.md §2 U-H 9
  notes: R0 shares the mixer adapter (linear blend); R1 index work is U-H's thread.

