    - name: lean_oil_in
      required: true
      description: absorption oil
    outlet:
    - name: lean_gas_out
      required: true
      description: lean gas
    - name: rich_oil_out
      required: true
      description: rich oil
  levels:
    R2:
      status: planned
      params: {}
      note: a flowsheet built from the column-family absorber + regenerator rows, not a
        bespoke unit (plan §2 decision — LNG/NGL templates are excluded as flowsheet templates)
      end_state: true
  pid_symbol: NGL
  references:
  - docs/unit-catalogue-plan.md §2 U-H 11
  notes: roadmap; recorded here as documentation of the template decision — no dedicated
    adapter is planned. LNG liquefaction likewise ships as an example flowsheet (plan §2 U-H 12).

- id: sour_water_strip_check
