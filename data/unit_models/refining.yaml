- id: blending
  name: Product blender
  family: refining
  ports:
    inlet:
    - name: component_in_1
      required: true
      description: first blendstock feed
    - name: component_in_2
      required: true
      description: second blendstock feed
    - name: component_in_3
      required: true
      description: third blendstock feed (zero-flow when unused)
    outlet:
    - name: blend_out
      required: true
      description: blended product
  levels:
    R0:
      status: experimental
      adapter: ngdesign.units.refining.blending:Blender
      params:
        type: object
        properties:
          T:
            type: number
            description: blend temperature (K, default the first inlet's)
          P:
            type: number
            description: blend pressure (Pa abs, default the first inlet's)
      note: volume/mass blending with property indices (RVP, octane, cetane,
        sulfur, D86) — spec U-H1 ships the isothermal linear part (the
        mixer convention, three declared inlets, unused ports zero-flow);
        the index work (cloud_point and pour_point plugins exist) is U-H's
        thread
      end_state: true
  sizer: null  # no registered blender sizer; sizing ships with a later spec
  pid_symbol: BL
  references:
  - docs/unit-catalogue-plan.md §2 U-H 12
  notes: roadmap; the R0 blend shares the mixer adapter for the linear part, the
    index work (cloud_point and pour_point plugins exist) is U-H's thread.
