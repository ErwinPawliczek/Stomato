    - name: hydrogen_in
      required: true
      description: hydrogen feed
    outlet:
    - name: naphtha_out
      required: true
      description: hydrocracked naphtha
    - name: diesel_out
      required: true
      description: diesel
    - name: unconverted_out
      required: true
