- id: coker
  name: Delayed coker / visbreaker
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: residuum feed
    outlet:
    - name: gas_out
      required: true
      description: coker gas
    - name: naphtha_out
      required: true
      description: coker naphtha
    - name: lgo_out
      required: true
      description: light gas oil
    - name: hgo_out
      required: true
      description: heavy gas oil
    - name: coke_out
      required: true
      description: petroleum coke
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.reactors_coker:DelayedCoker
      params:
        type: object
        required: [ccr_wt_pct]
        properties:
          ccr_wt_pct: {type: number, description: 'feed Conradson carbon residue, wt%'}
          gasoil_lgo_fraction:
            {type: number, description: 'LGO share of the gas-oil yield, in (0, 1), default 0.5'}
          T_out: {type: number, description: 'outlet temperature, K, default 773.15'}
          P_out: {type: number, description: 'outlet pressure, Pa, default 4.0e5'}
      validation:
      - V1_coker_jechura
      note: Gary–Handwerk mass yields vs feed CCR; duty sensible-only (flag
        heat_of_reaction_basis_sensible_only)
      end_state: true
  pid_symbol: CK
  references:
  - docs/unit-catalogue-plan.md §2 U-H 11
  notes: R0 shipped by U-H2 (Gary–Handwerk CCR table, Jechura CSM example basis);
    products are mass-only pseudo lumps — the mass_elements element ledger has no
    atom sources for a pseudo feed. The refinery_leeps_distillation correlation
    plugin exists for LEEP cut yields.

