# U-H — Refining (plan §2 U-H, 12 rows).
#
# Review round 2: the family is the plan table verbatim — every level note is
# the plan table's R0/R1/R2 cell, and reactors declare nothing above R1 (plan:
# "nothing above R1 is planned for them").
#
# Rows recorded on round 1 and dropped here, with the decisions:
# - alkylation, isomerization: not on the plan's U-H list (plan §2 palette).
# - LPG recovery: a flowsheet template built from the column-family absorber +
#   regenerator rows, not a bespoke unit (plan §2 — LNG/NGL templates are
#   example flowsheets, not catalogue rows).
# - sour-water stripping: a reboiled-stripper CONFIGURATION on the electrolyte
#   package (T-09), reached via the column row (plan U-G 9).
# - assay-based feed characterization: merged into the assay feeder row — the
#   assay that cuts pseudo-components is data-layer work (A-01, P1-14).

- id: assay_feeder
  name: Assay feeder
  family: refining
  ports:
    inlet:
    - name: assay_in
      required: true
      description: crude assay data (A-01 data layer)
    outlet:
    - name: cuts_out
      required: true
      description: pseudo-component stream at T, P, flow
  balance: molar
  levels:
    R0:
      status: provisional
      validation:
      - V2101
      adapter: ngdesign.units.refining.assay_feeder:AssayFeeder
      params:
        type: object
        properties:
          assay_id:
            type: string
            description: id of the stored A-01 assay whose slate is the feed
          T:
            type: number
            description: outlet temperature (K)
          P:
            type: number
            description: outlet pressure (Pa abs)
        required:
        - assay_id
        - T
        - P
      note: assay (A-01) → pseudo-component stream at T, P, flow (spec U-H1,
        the inlet must match the declared slate exactly)
      end_state: true
  pid_symbol: ASSAY
  references:
  - docs/unit-catalogue-plan.md §2 U-H 1
  notes: roadmap; pairs with the A-01 assay work and the flowsheet-owned
    pseudo-components (P1-14); assay cutting is data-layer work.

- id: desalter
  name: Desalter
  family: refining
  ports:
    inlet:
    - name: crude_in
      required: true
      description: crude feed
    - name: wash_in
      required: true
      description: wash water
    outlet:
    - name: crude_out
      required: true
      description: desalted crude
    - name: water_out
      required: true
      description: salty waste water
  balance: molar
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.desalter:Desalter
      params:
        type: object
        properties:
          T:
            type: number
            description: outlet temperature (K), isothermal desalter
          dP:
            type: number
            description: pressure drop from the crude inlet (Pa, default 0)
          water_carryover_frac:
            type: number
            description: fraction of inlet water reporting to the desalted crude
              (the BS&W)
          salt_removal:
            type: number
            description: fraction of tracked NaCl leaving with the brine
        required:
        - T
        - water_carryover_frac
        - salt_removal
      note: water/salt/BS&W split spec, wash-water mix (spec U-H1, component
        split at isothermal T with ΔP)
    R1:
      status: provisional
      adapter: ngdesign.units.refining.desalter_r1:DesalterR1
      params:
        type: object
        required: [T, settling_area_m2, d50_mixed_um, d50_fine_um, rosin_rammler_n, mixing_efficiency,
          rho_oil_kg_m3, rho_water_kg_m3, mu_oil_Pa_s]
        properties:
          T: {type: number, description: 'desalter temperature (K), isothermal'}
          dP: {type: number, description: 'pressure drop from the crude inlet (Pa, default 0)'}
          settling_area_m2: {type: number, exclusiveMinimum: 0, description: 'horizontal area the oil rises through, m2'}
          d50_mixed_um: {type: number, exclusiveMinimum: 0, description: 'volume-median drop diameter of the coalesced wash and brine water, micrometre'}
          d50_fine_um: {type: number, exclusiveMinimum: 0, description: 'volume-median drop diameter of the uncontacted emulsion, micrometre'}
          rosin_rammler_n: {type: number, exclusiveMinimum: 0, description: 'Rosin-Rammler spread exponent of both populations'}
          mixing_efficiency: {type: number, minimum: 0, maximum: 1, description: 'fraction of the crude brine contacted by the wash water'}
          rho_oil_kg_m3: {type: number, exclusiveMinimum: 0, description: 'oil density at T, kg/m3'}
          rho_water_kg_m3: {type: number, exclusiveMinimum: 0, description: 'water density at T, kg/m3'}
          mu_oil_Pa_s: {type: number, exclusiveMinimum: 0, description: 'oil viscosity at T, Pa s'}
      note: Stokes cut (counter-current settling) plus Rosin-Rammler two-population carryover; splits
        fed to R0. Temperature effect via user-supplied properties (spec option B)
      end_state: true
  pid_symbol: DS
  references:
  - docs/unit-catalogue-plan.md §2 U-H 2
  notes: "R1 takes oil and water densities and oil viscosity as required params (spec option B):
    no package gives honest values for a pseudo crude. V1 gap - provisional without a case. Searched PetroWiki 'Desalting' and
    Wauquier (Petroleum Refining vol. 1, crude desalting): both state a
    0.1-0.2 vol% BS&W specification but print no worked case, so the former
    V2102 pin (which echoed its own input spec and the adapter's default salt
    removal) was withdrawn at re-review. The water/salt/BS&W split is covered
    by closed-form tests in tests/units/refining/test_separation.py."

- id: crude_column
  name: Atmospheric crude column
  family: refining
  ports:
    inlet:
    - name: crude_in
      required: true
      description: heated crude feed
    - name: stripping_steam
      required: false
      description: stripping steam; its water (H2O) reports to the overhead
    outlet:
    - name: overhead
      required: true
      description: naphtha overhead
    - name: kero_out
      required: true
      description: kerosene side draw
    - name: diesel_out
      required: true
      description: diesel side draw
    - name: ago_out
      required: true
      description: atmospheric gas oil side draw
    - name: bottoms
      required: true
      description: reduced crude bottoms
  balance: molar
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.crude_column:CrudeColumn
      params:
        type: object
        properties:
          cut_points_K:
            type: array
            items:
              type: number
            description: four ascending TBP cut boundaries (K) for the five
              products
          overlap_K:
            type: number
            description: linear split band (K) at each cut boundary (default 0)
          draws:
            type: object
            description: per-port {T, P} draw conditions (default the feed state)
        required:
        - cut_points_K
      note: cut-point fractionation (TBP cut points, gap/overlap spec) — spec
        U-H1 sharp cut, light ends and water to the overhead; optional
        stripping_steam inlet carries its water to the overhead at R0
        (one net duty)
    R2:
      status: planned
      params: {}
      note: MESH with side strippers, pumparounds, stripping steam, overflash
        (U-E 6 extensions; needs column_extensions, P1-11)
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-H 3
  notes: V1 gap — provisional without a case. The open Bagajewicz & Ji (2001)
    copy prints no per-cut product-yield table (transcription gaps recorded in
    data/validation_units/refining/s0_reference.yaml), so the former V2103 pin
    (a closed-form recomputation of the adapter's own cut arithmetic) was moved
    to a closed-form test in tests/units/refining/test_separation.py. Column
    extensions still planned (P1-11).

- id: side_strip
  name: Side stripper
  family: refining
  ports:
    inlet:
    - name: draw_in
      required: true
      description: side draw from the main column
    - name: steam_in
      required: true
      description: stripping steam
    outlet:
    - name: overhead_out
      required: true
      description: stripped product + steam back to the column
    - name: bottoms_out
      required: true
      description: stripped liquid product
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.side_strip:SideStrip
      params:
        type: object
        properties:
          T:
            type: number
            description: stripper temperature (K)
          P:
            type: number
            description: stripper pressure (Pa abs, default the draw_in P)
          N:
            type: number
            description: number of ideal stages in the stripped section
        required:
        - T
        - N
      note: steam-stripped draw, per-pseudo Kremser stripping via
        units/_physics/shortcut.kremser_fraction (S_i = K_i V/L, K from
        thermo.k_values at the stripper T, P) (spec U-H1)
    R2:
      status: planned
      params: {}
      note: MESH stage section coupled to the main column
      end_state: true
  pid_symbol: SS
  references:
  - docs/unit-catalogue-plan.md §2 U-H 4
  notes: roadmap; R0 V1 gap — the Watkins Petroleum Refinery Distillation
    side-stripper example is not open (access-controlled Scribd copies of the
    1969 report; no open reproduction with printed inputs/results found —
    searched 2026-10-24 across Scribd scans, Colorado School of Mines
    crude-units lecture notes, Bagajewicz crude-fractionation papers and the
    BRE refinery-operations manual), so the row ships provisional with the
    closed-form test tests/units/refining/test_side_strip.py per U-R1
    conventions.

- id: vacuum_column
  name: Vacuum distillation column
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: reduced crude feed
    outlet:
    - name: overhead
      required: true
      description: overhead (wash oil / vacuum gas oil)
    - name: vgo_out
      required: true
      description: vacuum gas oil draw
    - name: bottoms
      required: true
      description: vacuum residuum
  balance: molar
  levels:
    R0:
      status: provisional
      validation:
      - V2104
      adapter: ngdesign.units.refining.vacuum_column:VacuumColumn
      params:
        type: object
        properties:
          cut_points_K:
            type: array
            items:
              type: number
            description: two ascending TBP cut boundaries (K) for the three
              products
          overlap_K:
            type: number
            description: linear split band (K) at each cut boundary (default 0)
          draws:
            type: object
            description: per-port {T, P} draw conditions (default the feed state)
        required:
        - cut_points_K
      note: cut-point fractionation at flash-zone P (spec U-H1 sharp cut on the
        reduced-crude feed; single VGO draw, the row's three ports)
    R2:
      status: planned
      params: {}
      note: MESH with pumparounds, no condenser, wash zone
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-H 5
  notes: roadmap.

- id: preflash
  name: Preflash / flash column
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: heated assay feed
    outlet:
    - name: vapor_out
      required: true
      description: flashed vapor
    - name: liquid_out
      required: true
      description: flashed liquid
  balance: molar
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.preflash:Preflash
      params:
        type: object
        properties:
          T:
            type: number
            description: drum temperature (K)
          P:
            type: number
            description: drum pressure (Pa abs, default the inlet pressure)
        required:
        - T
      note: flash drum on the assay stream (spec U-H1 PT flash at the drum
        conditions; vapour to vapor_out, pooled liquid to liquid_out)
    R2:
      status: planned
      params: {}
      note: short MESH
      end_state: true
  pid_symbol: FL
  references:
  - docs/unit-catalogue-plan.md §2 U-H 6
  notes: V1 gap — provisional without a case. The drum conditions are published
    (Gary et al., Petroleum Refining, p. 66), but no open source prints a
    flashed-vapour yield for that basis, so the former V2105 pin (a regression
    value computed by the registered PR package) was withdrawn; plumbing and
    vapour-fraction consistency live as closed-form tests in
    tests/units/refining/test_separation.py.

- id: naphtha_ht
  name: Naphtha hydrotreater
  family: refining
  ports:
    inlet:
    - name: naphtha_in
      required: true
      description: naphtha feed
    - name: h2_in
      required: true
      description: hydrogen feed
    outlet:
    - name: treated_out
      required: true
      description: hydrotreated naphtha
    - name: gas_out
      required: true
      description: H2S / offgas
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.reactors_hdt:NaphthaHydrotreater
      params:
        type: object
        properties:
          sulfur_removal_frac:
            {type: number, description: 'feed sulfur removal fraction, in [0, 1], default 1.0'}
          nitrogen_removal_frac:
            {type: number, description: 'feed nitrogen removal fraction, in [0, 1], default 1.0'}
          pentene_conversion:
            {type: number, description: 'olefin saturation conversion, in [0, 1], default 0'}
          benzene_conversion:
            {type: number, description: 'aromatic saturation conversion, in [0, 1], default 0'}
          T_out: {type: number, description: 'outlet temperature, K, default 620'}
          P_out: {type: number, description: 'outlet pressure, Pa, default 3.0e6'}
      validation:
      - V1_naphtha_ht_e12_2
      note: Fahim E12.2 model-compound stoichiometry (thiophene HDS, pyridine HDN,
        olefin/aromatic saturation) with declared removal fractions; duty sensible-only
    R1:
      status: provisional
      adapter: ngdesign.units.refining.hdt_kinetic:NaphthaHydrotreaterR1
      params:
        type: object
        required: [beds, bulk_density_kg_m3, kinetics]
        properties:
          beds: {type: array, description: "[{catalyst_mass_kg, inlet_T_K (optional heater set point),
              thermal: adiabatic|isothermal}] in flow order"}
          bulk_density_kg_m3: {type: number, description: 'catalyst bulk density, kg/m3'}
          kinetics: {type: object, description: "required, no default: {hds_thiophene|hdn_pyridine|olefin_sat|arom_sat:
              contract PowerLaw or LHHW, rate_units mol/(kg_cat s)}; omitted reactions are inactive"}
      note: model-compound HDS, HDN and saturation kinetics in catalyst beds on the pfr integrator;
        real model compounds only, the kinetics are required user inputs
      end_state: true
  pid_symbol: HT
  references:
  - docs/unit-catalogue-plan.md §2 U-H 7
  notes: "R1 kinetics are required inputs, on real model compounds only; pseudo feeds stay at R0.
    R1 V1 gap - no printed naphtha HDT kinetic example with inputs and outlets was searched for;
    provisional on the closed-form W(X) with mole change and the reduction to R0. R0 shipped by U-H2. Sulfur rides on thiophene, nitrogen on pyridine; real
    H2/H2S/NH3 products from pseudo-lump feeds need pseudo-component elemental
    characterization (issue #222)."

- id: reformer_cat
  name: Catalytic reformer
  family: refining
  ports:
    inlet:
    - name: naphtha_in
      required: true
      description: naphtha feed
    outlet:
    - name: reformate_out
      required: true
      description: reformate
    - name: h2_out
      required: true
      description: hydrogen by-product
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.reactors_reformer:CatalyticReformer
      params:
        type: object
        required: [ron_reformate, naphthenes_vol_pct, aromatics_vol_pct]
        properties:
          ron_reformate:
            {type: number, description: 'target reformate RON (correlation fitted near 80-104)'}
          naphthenes_vol_pct: {type: number, description: 'feed naphthenes, vol%'}
          aromatics_vol_pct: {type: number, description: 'feed aromatics, vol%'}
          T_out: {type: number, description: 'outlet temperature, K, default 780'}
          P_out: {type: number, description: 'outlet pressure, Pa, default 3.0e6'}
      validation:
      - V1_reformer_e5_2
      note: Fahim Table 5.3 lumped yields vs reformate RON; duty sensible-only (flag
        heat_of_reaction_basis_sensible_only)
    R1:
      status: provisional
      adapter: ngdesign.units.refining.reformer_kinetic:CatalyticReformerR1
      params:
        type: object
        required: [beds, bulk_density_kg_m3, kinetics]
        properties:
          beds: {type: array, description: "[{catalyst_mass_kg, inlet_T_K (interheater set point),
              thermal: adiabatic|isothermal}] in flow order"}
          bulk_density_kg_m3: {type: number, description: 'catalyst bulk density, kg/m3'}
          kinetics: {description: "required explicit {dehydro|n_to_p: {k0, Ea, A_K, B_K}, hc_n|hc_p:
              {k0, Ea}}; k0 in mol/(kg_cat s atm^order), Ea J/mol, K = exp(A_K - B_K/T[K]); the
              smith1959 preset is refused"}
      note: Smith (1959) four-reaction scheme on representative C7 species in adiabatic beds with
        interheaters, on the pfr integrator; the constants are required inputs
      end_state: true
  pid_symbol: RF
  references:
  - docs/unit-catalogue-plan.md §2 U-H 8
  notes: "R1 takes Smith's constants as a required explicit input and refuses the smith1959 preset -
    Smith 1959 could not be read, and the open reproduction (Liang, Guo and Pan, J. Zhejiang Univ. Sci.
    B 6(6) 2005 590-596, eqs. 9-17) prints k_p2 with a 9.87 prefactor against MPa-2 units that need
    97.4. V1 gap - that paper omits catalyst masses, so its plant table cannot be reproduced;
    provisional on the hand equilibrium of dehydro and the unit conversions. No R1 limit reproduces
    R0 (a different model). R0 shipped by U-H2. The spec's \"H2 and light ends as real components\" is
    out of reach of the mass_elements balance (C/H atoms with no formula-bearing
    source from a pseudo naphtha); the offgas is a mass-only lump, species split
    in info. Pseudo-component elemental characterization - issue #222."

- id: fcc
  name: Fluid catalytic cracker
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: VGO feed
    outlet:
    - name: dry_gas_out
      required: true
      description: dry gas
    - name: lpg_out
      required: true
      description: LPG
    - name: gasoline_out
      required: true
      description: gasoline
    - name: lco_out
      required: true
      description: light cycle oil
    - name: slurry_out
      required: true
      description: slurry/slops
    - name: coke_out
      required: true
      description: coke on spent catalyst, to the regenerator
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.fcc:FccR0
      params:
        type: object
        required: [conversion_wt_pct, yield_table, T_out, P_out]
        properties:
          conversion_wt_pct: {type: number, description: 'operating conversion, wt% on feed (100 - LCO - slurry)'}
          yield_table:
            type: object
            description: "user table, no default: {conversion_wt_pct, dry_gas_wt_pct, lpg_wt_pct,
              gasoline_wt_pct, lco_wt_pct, slurry_wt_pct, coke_wt_pct}, equal-length arrays; each row
              sums to 100 and LCO + slurry = 100 - conversion"
          T_out: {type: number, description: 'outlet temperature, K'}
          P_out: {type: number, description: 'outlet pressure, Pa'}
      note: mass yields linearly interpolated from a required user table against conversion, no
        extrapolation; mass-only lumps, duty sensible-only
    R1:
      status: provisional
      adapter: ngdesign.units.refining.fcc:FccR1
      params:
        type: object
        required: [kinetics, contact_time_s, deactivation_alpha_per_s, dry_gas_fraction, lco_fraction, P_out]
        properties:
          kinetics:
            type: object
            description: "required, no default: {gasoil_to_gasoline, gasoil_to_gases, gasoil_to_coke,
              gasoline_to_gases, gasoline_to_coke}, each {k0_per_s, Ea_J_mol}; on the operating
              catalyst-to-oil basis"
          contact_time_s: {type: number, description: riser contact time, s}
          deactivation_alpha_per_s: {type: number, description: 'Weekman decay phi = exp(-alpha t), 1/s'}
          dry_gas_fraction: {type: number, description: dry-gas share of the gases lump}
          lco_fraction: {type: number, description: LCO share of the unconverted gas-oil lump}
          P_out: {type: number, description: 'riser pressure, Pa'}
          isothermal_T_K: {type: number, description: 'isothermal riser temperature, K; replaces the
              heat balance'}
          catalyst_to_oil: {type: number, description: catalyst-to-oil mass ratio; heat balance}
          cp_cat_J_kgK: {type: number, description: catalyst heat capacity; heat balance}
          T_regen_K: {type: number, description: regenerated catalyst temperature (an input, the
              regenerator is not solved); heat balance}
          heat_of_cracking_J_kg: {type: number, description: endothermic heat per kg converted; heat balance}
          coke_heat_of_combustion_J_kg: {type: number, description: for the reported regenerator residual}
      note: Lee et al. four-lump form of the Weekman gas-oil lump over riser contact time with
        exp(-alpha t) decay and an adiabatic riser fed by regenerated catalyst; all constants are
        required user inputs. The regenerator is reported, not solved
      end_state: true
  pid_symbol: FC
  references:
  - docs/unit-catalogue-plan.md §2 U-H 9
  notes: Nothing above R1 is planned (plan §2 U-H preamble). R0 record of
    what was searched (U-H2 review, still true) - the published FCC yield correlations are
    chart/figure-based (Gary, Handwerk & Kaiser, Petroleum Refining, 5th ed. 2007,
    §6.12 Yield Estimation, pp. 143-144, points at Figures 6.17-6.28) and the U-R1
    conventions forbid digitising figures; no equation-based R0 correlation was
    found in the open sources searched. R0 and R1 therefore ship with no numbers of
    their own - the table and the rate constants are required user inputs and absent
    ones refuse - so no figure is transcribed. The original Weekman & Nace (1970) and
    Lee et al. (1989) constants could not be read from an open copy (searched
    2026-11-01; secondary quotations conflict in values and units), so none is a
    preset. The coke_out port was added at R0 so mass closes. V1 gap - provisional on
    the closed-form Weekman second-order solution, the first-order gasoline
    integral by quadrature, and refusals.

- id: hcu
  name: Hydrocracker
  family: refining
  ports:
    inlet:
    - name: vgo_in
      required: true
      description: VGO feed
    - name: hydrogen_in
      required: true
      description: hydrogen feed
    outlet:
    - name: naphtha_out
      required: true
      description: hydrocracked naphtha
    - name: diesel_out
      required: true
      description: diesel
    - name: unconverted_out
      required: true
      description: unconverted oil recycle
    - name: gas_out
      required: true
      description: light gases and unreacted hydrogen
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.hcu:HcuR0
      params:
        type: object
        required: [conversion_wt_pct, yield_table, T_out, P_out]
        properties:
          conversion_wt_pct: {type: number, description: 'operating conversion, wt% on VGO'}
          yield_table:
            type: object
            description: "user table, no default: {conversion_wt_pct, diesel_wt_pct, naphtha_wt_pct};
              gas and H2 follow from the element balance"
          T_out: {type: number, description: 'outlet temperature, K'}
          P_out: {type: number, description: 'outlet pressure, Pa'}
      note: yield table vs conversion on representative real paraffins (nC20, nC12, nC6, C3); gas by
        element balance; H2 consumption counts scissions only, a lower bound
    R1:
      status: provisional
      adapter: ngdesign.units.refining.hcu:HcuR1
      params:
        type: object
        required: [kinetics, T_bed_K, lhsv_per_h, T_out, P_out]
        properties:
          kinetics:
            type: object
            description: "required, no default: {vgo_to_diesel, vgo_to_naphtha, vgo_to_gas,
              diesel_to_naphtha, diesel_to_gas, naphtha_to_gas}, each {k0_per_s, Ea_J_mol}"
          T_bed_K: {type: number, description: 'isothermal bed temperature, K'}
          lhsv_per_h: {type: number, description: 'liquid hourly space velocity, 1/h; contact time 1/LHSV'}
          T_out: {type: number, description: 'outlet temperature, K'}
          P_out: {type: number, description: 'outlet pressure, Pa'}
      note: discrete four-lump six-path first-order kinetics (Sadighi et al. 2010 network form) on
        representative paraffins, isothermal bed, hydrogen in excess; continuous lumping as such is
        not implemented
      end_state: true
  pid_symbol: HC
  references:
  - docs/unit-catalogue-plan.md §2 U-H 10
  notes: R0 record of what was searched (U-H2 review) - published hydrocracker
    yield correlations are chart/figure-based (Gary, Handwerk & Kaiser, Petroleum
    Refining, 5th ed. 2007, §7.6 Hydrocracking Yields, pp. 170-172, reads
    Figure 7.4 / Figure 7.6 curves; its Table 7.3 is fixed-feed vol% tables, not a
    correlation) and the U-R1 conventions forbid digitising figures. R0 and R1 therefore
    ship with no numbers of their own - the table and the rate constants are required
    user inputs and absent ones refuse. The gas_out port was added at R0 so excess H2
    and light gases close the mass balance. Pseudo VGO is refused (issue 222); real H2
    consumed into formula-free lumps cannot close the element ledger. V1 gap - Faraji et
    al., ACS Omega 2020 Table 2 prints k1-k6 at 663.15 K, but the open text does not map
    each constant to a path, so it is not used; provisional on the series-reaction
    closed form and the reduction of R1 to R0.

- id: coker
  name: Delayed coker / visbreaker
  family: refining
  ports:
    inlet:
    - name: feed_in
      required: true
      description: residuum feed
    outlet:
    - name: gas_out
      required: true
      description: coker gas
    - name: naphtha_out
      required: true
      description: coker naphtha
    - name: lgo_out
      required: true
      description: light gas oil
    - name: hgo_out
      required: true
      description: heavy gas oil
    - name: coke_out
      required: true
      description: petroleum coke
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.refining.reactors_coker:DelayedCoker
      params:
        type: object
        required: [ccr_wt_pct]
        properties:
          ccr_wt_pct: {type: number, description: 'feed Conradson carbon residue, wt%'}
          gasoil_lgo_fraction:
            {type: number, description: 'LGO share of the gas-oil yield, in (0, 1), default 0.5'}
          T_out: {type: number, description: 'outlet temperature, K, default 773.15'}
          P_out: {type: number, description: 'outlet pressure, Pa, default 4.0e5'}
      validation:
      - V1_coker_gh_case_study
      note: Gary–Handwerk mass yields vs feed CCR (Table 5.5, p. 104); duty
        sensible-only (flag heat_of_reaction_basis_sensible_only)
      end_state: true
  pid_symbol: CK
  references:
  - docs/unit-catalogue-plan.md §2 U-H 11
  notes: "R0 shipped by U-H2 (Gary-Handwerk CCR yield equations, 5th ed. Table 5.5
    p. 104; V1 is the book's own worked example - §5.9 case-study problem,
    pp. 116-118, printed product slate at coker-feed CCR 14.2 wt%; the Jechura CSM
    feed stays the example_case basis); products are mass-only pseudo lumps - the
    mass_elements element ledger has no atom sources for a pseudo feed
    (pseudo-component elemental characterization - issue #222). The
    refinery_leeps_distillation correlation plugin exists for LEEP cut yields."

- id: blending
  name: Product blender
  family: refining
  ports:
    inlet:
    - name: component_in_1
      required: true
      description: first blendstock feed
    - name: component_in_2
      required: true
      description: second blendstock feed
    - name: component_in_3
      required: true
      description: third blendstock feed (zero-flow when unused)
    outlet:
    - name: blend_out
      required: true
      description: blended product
  balance: molar
  levels:
    R0:
      status: provisional
      validation: []
      adapter: ngdesign.units.refining.blending:Blender
      params:
        type: object
        properties:
          P:
            type: number
            description: blend pressure (Pa abs, default the first inlet's)
          properties:
            type: object
            description: per-inlet-port blendstock properties
              {rvp_psi, sulfur_wt_ppm, ron, cetane_index, d86_point_k}; an
              index is reported only when every flowing inlet declares it
      note: adiabatic PH mix (duty 0) plus property indices — RVP by the
        Gary-Handwerk-Kaiser/Chevron index RVP^1.25 on a volume basis,
        sulfur mass-weighted, octane and cetane linear by volume (documented
        R0 simplification; real blending is interactive), one D86 point by
        volume-average T (R0); every rule cited in the adapter (spec U-H1,
        three declared inlets, unused ports zero-flow)
      end_state: true
  sizer: null  # no registered blender sizer; sizing ships with a later spec
  pid_symbol: BL
  references:
  - docs/unit-catalogue-plan.md §2 U-H 12
  notes: V1 gap — provisional without a case. The GHK 5th ed. ch. 12 printed
    RVP blending example could not be re-read from an open copy at re-review
    time, and the former V2106 pin was index arithmetic on its own input values
    (with an invented reformate stand-in), so it was withdrawn; the RVP/sulfur/
    RON index arithmetic is covered by closed-form tests in
    tests/units/refining/test_separation.py.
