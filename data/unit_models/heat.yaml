# U-C — Heat transfer (plan §2 U-C, 10 rows).
#
# heater and cooler are separate rows. The electric-heater concept (plan U-C 9)
# maps onto the heater row (its R0 IS a duty spec) — no separate row.

- id: heater
  name: Heater
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: heated outlet (PH flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: duty or outlet T with ΔP
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 1
  notes: heater and cooler are separate rows. The electric-heater line (plan U-C 9, R0
    duty only) maps onto this row — no separate electric-heater row.

- id: cooler
  name: Cooler
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: cooled outlet (PH flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: duty or outlet T with ΔP
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 1
  notes: separate row from the heater so flowsheets read naturally.

- id: shell_tube
  name: Shell-and-tube exchanger
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: exchanger outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: approach / duty with LMTD-F specification
    R1:
      status: planned
      params: {}
      note: rating — U from ht film coefficients, TEMA type, F factor, ΔP both sides
    R2:
      status: planned
      params: {}
      note: zoned (phase change), multi-pass with temperature cross
      end_state: true
  sizer: shell_tube
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 2
  notes: the R0 row shares the HeatExchanger adapter; R1/R2 rating physics is the U-C
    family thread's work on the shared _physics/heat_transfer store.

