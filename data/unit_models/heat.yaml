    - name: hot_in_2
      required: false
      description: second hot feed (0 = inactive)
    - name: cold_in_1
      required: true
      description: first cold feed (0 = inactive)
    - name: cold_in_2
      required: false
      description: second cold feed (0 = inactive)
    outlet:
    - name: hot_out_1
      required: true
      description: positional outlet for hot_in_1
    - name: hot_out_2
      required: true
      description: positional outlet for hot_in_2
    - name: cold_out_1
      required: true
      description: positional outlet for cold_in_1
    - name: cold_out_2
      required: true
      description: positional outlet for cold_in_2
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.multi_stream:MultiStreamExchanger
      params:
        type: object
        properties:
          T_out_hot_in_1: {type: number, description: 'hot_in_1 outlet temperature spec, K'}
          T_out_hot_in_2: {type: number, description: 'hot_in_2 outlet temperature spec, K'}
          T_out_cold_in_1: {type: number, description: 'cold_in_1 outlet temperature spec, K'}
          T_out_cold_in_2: {type: number, description: 'cold_in_2 outlet temperature spec, K'}
      note: every active side carries a T_out spec except exactly one balance stream, which
        absorbs the residual duty; zoned composite pinch check, per-port duties
    R1:
      status: planned
      params: {}
      note: layer-wise UA distribution
    R2:
      status: planned
      params: {}
      note: zoned with phase change
      end_state: true
  pid_symbol: MS
  references:
  - docs/unit-catalogue-plan.md §2 U-C 6
  notes: >-
    No V1 worked case: Smith Table 16.2 (the four-stream LNG-cold-box basis)
    needs 7.5 MW of hot utility that the utility-free R0 unit does not model, and
    every single-balance arrangement of the four streams crosses (verified by hand
    cascade). The Smith streams 1+3 two-stream balance is covered by the
    closed-form test in tests/units/heat/test_multi_stream.py; outlet ports are
    positional, not mirrored inlet names.

- id: fired_heater
  name: Fired heater
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed (coil inlet)
    outlet:
    - name: outlet
      required: true
      description: coil outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.fired_heater:FiredHeater
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K (one of T_out/duty_W)'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          efficiency: {type: number, description: 'firing efficiency on the LHV basis, (0, 1]'}
          fuel_composition: {type: object, description: 'fuel component-id map; fuel flow is the solved demand'}
          dP: {type: number, description: 'coil pressure drop, Pa'}
      validation:
      - V2083
      note: process duty from a T_out/duty_W spec; fuel demand from the mixture LHV with
        water as vapour
    R1:
      status: provisional
      adapter: ngdesign.units.heat.fired_heater_r1:FiredHeaterR1
      params:
        type: object
        required: [fuel_composition, excess_air_frac, alpha_Acp_m2, exchange_factor,
                   tube_area_radiant_m2, tube_wall_excess_K, UA_convection_W_K]
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K (one of T_out/duty_W)'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'coil pressure drop, Pa'}
          fuel_composition: {type: object, description: 'fuel component-id map; required at R1'}
          excess_air_frac: {type: number, description: 'excess air fraction over stoichiometric'}
          air_composition: {type: object, description: 'air mole fractions, default N2 0.79 / O2 0.21'}
          air_T_K: {type: number, description: 'combustion air temperature, K, default 298.15'}
          box_P_Pa: {type: number, description: 'firebox pressure, Pa, default 101325'}
          alpha_Acp_m2: {type: number, description: 'Lobo-Evans alpha*A_cp, m2'}
          exchange_factor: {type: number, description: 'Lobo-Evans overall exchange factor, (0, 1]'}
          tube_area_radiant_m2: {type: number, description: 'radiant tube outside area, m2'}
          h_conv_radiant_W_m2K: {type: number, description: 'radiant-section convection, W/(m2 K), default 11.3565267'}
          tube_wall_excess_K: {type: number, description: 'tube wall above mean radiant process T, K'}
          UA_convection_W_K: {type: number, description: 'convection-section UA, W/K'}
          radiant_loss_frac: {type: number, description: 'setting loss fraction of fired heat, default 0'}
      note: radiant/convective split (Lobo-Evans) with the fuel and flue-gas balance
        solved; bridgewall, stack and crossover temperatures reported
      end_state: true
  pid_symbol: FH
  references:
  - docs/unit-catalogue-plan.md §2 U-C 7
  notes: V2083 checks the methane LHV against NBSIR 82-2401 (802.125 kJ/mol at
    288.15 K; package 802.584 kJ/mol on the 298.15 K formation basis, +0.057%).
    R1 has no V1 case — Kern Example 19.1 (Process Heat Transfer, 1950, Ch. 19)
    fixes the 75 % LHV efficiency as a design input and sizes only the radiant
    section, while R1 rates the efficiency from UA_convection_W_K, which the
    example does not print, so a case asserting the solved efficiency against
    0.75 would echo an input. Kern 1950 Ch. 19, Wimpress 1963 and API 560 were
    searched for a printed-inputs to printed-outputs fired-heater case without
    success; any future case id must follow V1-... . The radiant-section solve is
    kept as a documented comparison test against Kern Example 19.1 in
    tests/units/heat/test_fired_heater_r1.py (fuel composition, coil fluid and
    convection UA there are documented carriers).

- id: cooling_tower
  name: Cooling tower
  family: heat
  ports:
    inlet:
    - name: water_in
      required: true
      description: warm circulating water
    - name: air_in
      required: true
      description: inlet air (humid, N2/O2 dry basis)
    outlet:
    - name: water_out
      required: true
      description: cooled water
    - name: air_out
      required: true
      description: exit air (saturated at the exit-air temperature solved from the
        energy balance)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.cooling_tower:CoolingTower
      params:
        type: object
        properties:
          cycles_of_concentration: {type: number, description: 'cycles of concentration, >= 1 (default 3)'}
          approach_K: {type: number, description: 'water outlet above the inlet-air wet bulb, K (> 0, required)'}
      validation:
      - V2085
      note: water outlet FIXED at wet bulb + approach_K; the exit air, saturated at
        the exit-air temperature solved from the overall energy closure, carries
        the heat and the evaporation; blowdown/makeup from cycles of concentration
    R1:
      status: planned
      params: {}
      note: Merkel method
      end_state: true
  pid_symbol: CT
  references:
  - docs/unit-catalogue-plan.md §2 U-C 8
  notes: V2085 checks the model wet bulb against ASHRAE Fundamentals 2021 SI Ch. 1
    Example 1 (40 C dry-bulb / 20 C wet-bulb air; measured 292.989 K, -0.16 K).

