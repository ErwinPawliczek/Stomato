# U-C — Heat transfer (plan §2 U-C, 10 rows).
#
# heater and cooler are separate rows. The electric-heater concept (plan U-C 9)
# maps onto the heater row (its R0 IS a duty spec) — no separate row.

- id: heater
  name: Heater
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: heated outlet (PH flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: duty or outlet T with ΔP
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 1
  notes: heater and cooler are separate rows. The electric-heater line (plan U-C 9, R0
    duty only) maps onto this row — no separate electric-heater row.

- id: cooler
  name: Cooler
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: cooled outlet (PH flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: duty or outlet T with ΔP
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 1
  notes: separate row from the heater so flowsheets read naturally.

- id: shell_tube
  name: Shell-and-tube exchanger
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: exchanger outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: approach / duty with LMTD-F specification
    R1:
      status: provisional
      adapter: ngdesign.units.heat.shell_tube_r1:ShellTubeR1
      params:
        type: object
        required: [process_side, shell_ID_m, n_tubes, tube_OD_m, tube_ID_m, tube_length_m,
          pitch_m, layout, baffle_spacing_m, n_baffles, tube_passes, utility_composition,
          utility_T_K, utility_P_Pa, utility_molar_flow]
        properties:
          process_side: {type: string, enum: [tube, shell], description: 'side the
              process stream flows on'}
          shell_ID_m: {type: number, description: 'shell inside diameter Ds, m'}
          n_tubes: {type: integer, description: 'total tube count Nt'}
          tube_OD_m: {type: number, description: 'tube outside diameter, m'}
          tube_ID_m: {type: number, description: 'tube inside diameter, m'}
          tube_length_m: {type: number, description: 'tube length per pass, m'}
          pitch_m: {type: number, description: 'tube pitch PT, m'}
          layout: {type: string, enum: [triangular30, square90], description: 'tube
              layout'}
          baffle_spacing_m: {type: number, description: 'baffle spacing B, m'}
          n_baffles: {type: integer, description: 'baffle count Nb'}
          tube_passes: {type: integer, enum: [1, 2, 4, 6, 8], description: 'tube passes
              per shell Ntp'}
          n_shells: {type: integer, description: 'TEMA E shells in series, default
              1'}
          utility_composition: {type: object, description: 'utility stream mole fractions'}
          utility_T_K: {type: number, description: 'utility inlet temperature, K'}
          utility_P_Pa: {type: number, description: 'utility inlet pressure, Pa'}
          utility_molar_flow: {type: number, description: 'utility inlet molar flow,
              mol/s'}
          k_wall_W_mK: {type: number, description: 'tube wall conductivity, W/(m K),
              default 45'}
          R_f_tube_m2K_W: {type: number, description: 'tube-side fouling, m2 K/W, default
              0'}
          R_f_shell_m2K_W: {type: number, description: 'shell-side fouling, m2 K/W,
              default 0'}
          roughness_m: {type: number, description: 'tube roughness, m, default 4.5e-5'}
          allow_extrapolation: {type: boolean, description: 'permit Kern outside 2e3
              < Re_s < 1e6, flagged in info'}
      note: rating — Kern shell side (S1-S3) with D_e per layout, duct tube side with
        4Ntp return heads, e-NTU S&T, F reported
    R2:
      status: planned
      params: {}
      note: zoned (phase change), multi-pass with temperature cross
      end_state: true
  sizer: shell_tube
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 2
  notes: >-
    The R0 row shares the HeatExchanger adapter. R1 V1 gap - searched Kern 1950
    Examples 7.3-7.4 and the Kakaç et al. 3rd ed. Ch. 8 Kern-method worked
    examples for a complete printed input-and-result set (film coefficients,
    U and pressure drops with printed inputs); only OCR'd full-text scans are
    available and no set was verifiable to the U-R1 transcription standard
    within the time box, so no R1 V1 case is recorded - the closed-form tests
    and the R1-to-R0 and e-NTU identities carry R1 verification.

- id: air_cooler
  name: Air cooler
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: cooled outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: approach / duty spec
    R1:
      status: provisional
      adapter: ngdesign.units.heat.air_cooler_r1:AirCoolerR1
      params:
        type: object
        required: [tube_rows, tube_passes, tubes_per_row, tube_length_m, tube_OD_m,
          tube_wall_m, fin_thickness_m, fin_height_m, fin_density_per_m,
          pitch_parallel_m, pitch_normal_m, air_T_K, air_mass_flow_kg_s, fan_efficiency]
        properties:
          tube_rows: {type: integer, description: 'tube rows deep'}
          tube_passes: {type: integer, description: 'tube passes; supported pairs (1, 1-4),
            (2, 2), (2, 4), (3, 3), (4, 4) and passes = rows > 4'}
          tubes_per_row: {type: integer, description: 'tubes per row'}
          tube_length_m: {type: number, description: 'bare tube length, m'}
          tube_OD_m: {type: number, description: 'tube outside diameter, m'}
          tube_wall_m: {type: number, description: 'tube wall thickness, m'}
          fin_thickness_m: {type: number, description: 'fin thickness, m'}
          fin_height_m: {type: number, description: 'fin height, m (alternative: fin_diameter_m)'}
          fin_density_per_m: {type: number, description: 'fins per metre (alternative: fin_interval_m)'}
          pitch_parallel_m: {type: number, description: 'staggered pitch parallel to flow, m
            (alternative pitch spec: pitch_m with angle_deg)'}
          pitch_normal_m: {type: number, description: 'staggered pitch normal to flow, m'}
          air_T_K: {type: number, description: 'air inlet temperature, K'}
          air_mass_flow_kg_s: {type: number, description: 'total air mass flow, kg/s'}
          fan_efficiency: {type: number, description: 'fan efficiency in (0, 1]'}
          air_P_Pa: {type: number, description: 'air-side pressure, Pa, default 101325'}
          air_composition: {type: object, description: 'air mole fractions, default N2 0.79
            / O2 0.21'}
          parallel_bays: {type: integer, description: 'parallel bays, default 1'}
          bundles_per_bay: {type: integer, description: 'bundles per bay, default 1'}
          k_fin_W_mK: {type: number, description: 'fin conductivity, W/(m K), default 205'}
          k_wall_W_mK: {type: number, description: 'tube wall conductivity, W/(m K), default 45'}
          R_f_tube_m2K_W: {type: number, description: 'tube-side fouling resistance, m2 K/W,
            default 0'}
          roughness_m: {type: number, description: 'absolute roughness, m, default 4.5e-5'}
          allow_extrapolation: {type: boolean, description: 'rate outside the Briggs-Young
            Re window (1000, 8000), flagged briggs_young_in_range, default false'}
      note: rating (Briggs-Young air side on the bare-area basis, ESDU 86022 air dP, duct_h
        tube side, brentq duty solve with Ft_aircooler; fan power reported in info, the
        air side is not a port)
      end_state: true
  sizer: air_cooler
  pid_symbol: AC
  references:
  - docs/unit-catalogue-plan.md §2 U-C 3
  notes: >-
    R1 is rated on the ht AirCooledExchanger docstring bundle basis (the S1
    natural-gas slice E-101 geometry, plan §2b). V1 gap: searched GPSA EDB Sec. 10,
    Serth 2nd ed. Ch. 12, Kern & Kraus 1972 Ch. 12 - no printed air-cooler rating
    example with complete inputs was accessible, so the closed-form Briggs-Young,
    ESDU and fan-power checks and the R0-reduction identity carry the R1
    verification.

- id: plate_exchanger
  name: Plate exchanger
  family: heat
  ports:
    inlet:
    - name: hot_in
      required: true
      description: hot-side feed (liquid service)
    - name: cold_in
      required: true
      description: cold-side feed
    outlet:
    - name: hot_out
      required: true
      description: cooled hot outlet
    - name: cold_out
      required: true
      description: warmed cold outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.exchangers:PlateExchanger
      params:
        type: object
        properties:
          duty_W: {type: number, description: 'duty spec, W (one of duty_W/hot_T_out/cold_T_out)'}
          hot_T_out: {type: number, description: 'hot outlet temperature spec, K'}
          cold_T_out: {type: number, description: 'cold outlet temperature spec, K'}
          min_approach_K: {type: number, description: 'solve the duty for this minimum approach, K'}
          dP_hot: {type: number, description: 'hot-side pressure drop, Pa'}
          dP_cold: {type: number, description: 'cold-side pressure drop, Pa'}
      note: exactly one of duty_W / hot_T_out / cold_T_out; min-approach duty bisection, pinch
        check and LMTD/UA reported
    R1:
      status: provisional
      adapter: ngdesign.units.heat.plate_exchanger_r1:PlateExchangerR1
      params:
        type: object
        required: [amplitude_m, wavelength_m, chevron_angle_deg, plate_width_m, plate_length_m, port_diameter_m, n_plates]
        properties:
          amplitude_m: {type: number, description: 'plate corrugation amplitude, m (half the channel gap)'}
          wavelength_m: {type: number, description: 'chevron corrugation wavelength, m'}
          chevron_angle_deg: {type: number, description: 'chevron angle from the flow axis, deg, in (10, 80)'}
          plate_width_m: {type: number, description: 'single-plate width, m'}
          plate_length_m: {type: number, description: 'single-plate effective length, m'}
          port_diameter_m: {type: number, description: 'port (maldistribution) diameter, m'}
          n_plates: {type: number, description: 'total plate count, integer >= 3 (both fluids flowing)'}
          plate_thickness_m: {type: number, description: 'plate thickness, m, default 6e-4'}
          k_plate_W_mK: {type: number, description: 'plate conductivity, W/(m K), default 16 (stainless)'}
          R_f_hot_m2K_W: {type: number, description: 'hot-side fouling, m2 K/W, default 0'}
          R_f_cold_m2K_W: {type: number, description: 'cold-side fouling, m2 K/W, default 0'}
          correlation: {type: string, enum: [martin, kumar], description: 'film-correlation switch, default martin'}
          allow_extrapolation: {type: boolean, description: 'rate outside Re 200-1e4 and flag correlation_in_range 0, default false'}
      note: rating — Martin 1996 VDI Heat Atlas N6 chevron correlations (explicit
        1/sqrt(f) with the Konakov branch, Nu = 0.122 Pr^1/3 (f Re^2 sin 2phi)^0.374),
        1.4-velocity-head port loss, counterflow e-NTU on enthalpies
      end_state: true
  pid_symbol: PHE
  references:
  - docs/unit-catalogue-plan.md §2 U-C 4
  notes: >-
    No V1 worked case: no single-exchanger printed example with complete printed
    inputs was located in accessible copies this round (the Kakaç & Liu duty example
    and the Perry Sect. 11 candidates were checked but not transcribed; Smith Table
    16.1 is a network table, not one exchanger). The Smith Table 16.1 water-water
    streams are covered by the closed-form CP*ΔT test in
    tests/units/heat/test_exchangers.py; a V1 case needs a printed example with
    both feeds, an outlet spec and a printed duty/outlet.
    R1 V1 gap: the R1 verification is carried by the spec's closed-form anchors
    (friction, Nusselt, h, ΔP and U to 1e-8 relative), the geometry refusals and
    the R0-reduction identity (R0 replay of the R1 duty to 1e-10); no printed
    plate-exchanger example with complete geometry, feeds and printed duty/outlet
    was located, so no R1 V1 case is recorded. Sources searched: the spec's V1
    candidate Kakaç, Liu & Pramuanjaroenkij, Heat Exchangers, 3rd ed., ch. 10
    (their gasketed-plate rating examples are Kumar-correlation water-water cases
    with plate geometry and h/U/duty printed, but the accessible copies carry
    worked solutions as exercise answers or partial tables only); VDI Heat Atlas
    2nd ed. N6 (no worked numerical example); Wang, Sundén & Manglik, Plate Heat
    Exchangers (2007) (design charts, no end-to-end printed example). The VDI N6
    equations are pinned by the anchors, which ht's variant='VDI' reproduces only
    to ~5e-6 relative.

- id: double_pipe
  name: Double-pipe / hairpin exchanger
  family: heat
  ports:
    inlet:
    - name: hot_in
      required: true
      description: hot-side feed (gas service)
    - name: cold_in
      required: true
      description: cold-side feed
    outlet:
    - name: hot_out
      required: true
      description: cooled hot outlet
    - name: cold_out
      required: true
      description: warmed cold outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.exchangers:DoublePipeExchanger
      params:
        type: object
        properties:
          duty_W: {type: number, description: 'duty spec, W (one of duty_W/hot_T_out/cold_T_out)'}
          hot_T_out: {type: number, description: 'hot outlet temperature spec, K'}
          cold_T_out: {type: number, description: 'cold outlet temperature spec, K'}
          min_approach_K: {type: number, description: 'solve the duty for this minimum approach, K'}
          dP_hot: {type: number, description: 'hot-side pressure drop, Pa'}
          dP_cold: {type: number, description: 'cold-side pressure drop, Pa'}
      validation:
      - V2082
      note: exactly one of duty_W / hot_T_out / cold_T_out; min-approach duty bisection, pinch
        check and LMTD/UA reported
    R1:
      status: provisional
      adapter: ngdesign.units.heat.double_pipe_r1:DoublePipeR1
      params:
        type: object
        required: [inner_ID_m, inner_OD_m, outer_ID_m, length_m, inner_side]
        properties:
          inner_ID_m: {type: number, description: 'inner pipe inside diameter, m'}
          inner_OD_m: {type: number, description: 'inner pipe outside diameter, m'}
          outer_ID_m: {type: number, description: 'outer pipe inside diameter, m'}
          length_m: {type: number, description: 'total effective exchange length, m'}
          inner_side: {type: string, enum: [hot, cold], description: 'stream in the inner pipe'}
          k_wall_W_mK: {type: number, description: 'wall conductivity, W/(m K), default 45'}
          R_f_inner_m2K_W: {type: number, description: 'inside fouling, m2 K/W, default 0'}
          R_f_outer_m2K_W: {type: number, description: 'outside fouling, m2 K/W, default 0'}
          roughness_m: {type: number, description: 'absolute roughness, m, default 4.5e-5'}
      note: rating (Gnielinski tube and annulus, counterflow e-NTU on enthalpies)
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 5
  notes: >-
    V2082 runs Kern Example 6.1's printed inputs (9,820 lb/h benzene, 6,330 lb/h
    toluene, 160 -> 100 F); measured duty 44,968 W (-8.1%) and benzene outlet
    +0.93 K are assessed against the book's chart cp values, not widened away.
    R1 V1 gap: Kern 6.1's printed film coefficients and pressure drops
    (Sieder-Tate chart basis) would need a primary-text transcription; none is
    verified here, so no R1 V1 case is recorded - the closed-form correlation
    tests and the R0-reduction identity carry the R1 verification.

- id: multi_stream
  name: Multi-stream exchanger (LNG cold box)
  family: heat
  ports:
    inlet:
    - name: hot_in_1
      required: true
      description: first hot feed (0 = inactive)
    - name: hot_in_2
      required: false
      description: second hot feed (0 = inactive)
    - name: cold_in_1
      required: true
      description: first cold feed (0 = inactive)
    - name: cold_in_2
      required: false
      description: second cold feed (0 = inactive)
    outlet:
    - name: hot_out_1
      required: true
      description: positional outlet for hot_in_1
    - name: hot_out_2
      required: true
      description: positional outlet for hot_in_2
    - name: cold_out_1
      required: true
      description: positional outlet for cold_in_1
    - name: cold_out_2
      required: true
      description: positional outlet for cold_in_2
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.multi_stream:MultiStreamExchanger
      params:
        type: object
        properties:
          T_out_hot_in_1: {type: number, description: 'hot_in_1 outlet temperature spec, K'}
          T_out_hot_in_2: {type: number, description: 'hot_in_2 outlet temperature spec, K'}
          T_out_cold_in_1: {type: number, description: 'cold_in_1 outlet temperature spec, K'}
          T_out_cold_in_2: {type: number, description: 'cold_in_2 outlet temperature spec, K'}
      note: every active side carries a T_out spec except exactly one balance stream, which
        absorbs the residual duty; zoned composite pinch check, per-port duties
    R1:
      status: provisional
      adapter: ngdesign.units.heat.multi_stream_r1:MultiStreamR1
      params:
        type: object
        properties:
          hA_hot_in_1_W_K: {type: number, description: 'layer conductance of hot_in_1, W/K (required for every active stream)'}
          hA_hot_in_2_W_K: {type: number, description: 'layer conductance of hot_in_2, W/K (required when active)'}
          hA_cold_in_1_W_K: {type: number, description: 'layer conductance of cold_in_1, W/K (required for every active stream)'}
          hA_cold_in_2_W_K: {type: number, description: 'layer conductance of cold_in_2, W/K (required when active)'}
          dP_hot_in_1: {type: number, description: 'hot_in_1 pressure drop, Pa (default 0)'}
          dP_hot_in_2: {type: number, description: 'hot_in_2 pressure drop, Pa (default 0)'}
          dP_cold_in_1: {type: number, description: 'cold_in_1 pressure drop, Pa (default 0)'}
          dP_cold_in_2: {type: number, description: 'cold_in_2 pressure drop, Pa (default 0)'}
      note: common-wall BVP over per-stream T(H) tables with given layer hA; no T_out specs,
        every outlet solved by the coupled balances; reports minimum approach, wall-mediated
        UA and BVP nodes; per-port duties in R0 signs (hot releases, cold absorbs)
    R2:
      status: provisional
      adapter: ngdesign.units.heat.multi_stream_r2:MultiStreamR2
      params:
        type: object
        properties:
          fin_height_hot_in_1_m:
            type: number
            description: hot_in_1 fin height, m (required for every active stream)
          fin_spacing_hot_in_1_m:
            type: number
            description: hot_in_1 fin spacing, m (required for every active stream)
          fin_thickness_hot_in_1_m:
            type: number
            description: hot_in_1 fin thickness, m (required for every active stream)
          strip_length_hot_in_1_m:
            type: number
            description: hot_in_1 offset-strip length, m (required for every active stream)
          fin_height_hot_in_2_m:
            type: number
            description: hot_in_2 fin height, m (required for every active stream)
          fin_spacing_hot_in_2_m:
            type: number
            description: hot_in_2 fin spacing, m (required for every active stream)
          fin_thickness_hot_in_2_m:
            type: number
            description: hot_in_2 fin thickness, m (required for every active stream)
          strip_length_hot_in_2_m:
            type: number
            description: hot_in_2 offset-strip length, m (required for every active stream)
          fin_height_cold_in_1_m:
            type: number
            description: cold_in_1 fin height, m (required for every active stream)
          fin_spacing_cold_in_1_m:
            type: number
            description: cold_in_1 fin spacing, m (required for every active stream)
          fin_thickness_cold_in_1_m:
            type: number
            description: cold_in_1 fin thickness, m (required for every active stream)
          strip_length_cold_in_1_m:
            type: number
            description: cold_in_1 offset-strip length, m (required for every active stream)
          fin_height_cold_in_2_m:
            type: number
            description: cold_in_2 fin height, m (required for every active stream)
          fin_spacing_cold_in_2_m:
            type: number
            description: cold_in_2 fin spacing, m (required for every active stream)
          fin_thickness_cold_in_2_m:
            type: number
            description: cold_in_2 fin thickness, m (required for every active stream)
          strip_length_cold_in_2_m:
            type: number
            description: cold_in_2 offset-strip length, m (required for every active stream)
          layer_width_m:
            type: number
            description: shared layer width (fin gap direction), m
          length_m:
            type: number
            description: shared exchanger length, m
          k_fin_W_mK:
            type: number
            description: fin thermal conductivity, W/(m K) (default 180)
          n_zones:
            type: integer
            description: zone count for the zone loop (default 20)
          dP_hot_in_1:
            type: number
            description: hot_in_1 pressure drop, Pa (default 0)
          dP_hot_in_2:
            type: number
            description: hot_in_2 pressure drop, Pa (default 0)
          dP_cold_in_1:
            type: number
            description: cold_in_1 pressure drop, Pa (default 0)
          dP_cold_in_2:
            type: number
            description: cold_in_2 pressure drop, Pa (default 0)
      note: >-
        zoned plate-fin rating with phase change: per-layer offset-strip-fin
        geometry (Manglik-Bergles j, fin/surface efficiency), a zone loop that
        recomputes h at the zone-mean state (single phase, or ht.Shah
        condensation / ht.Liu_Winterton boiling through D_h as a stated
        approximation) and re-solves the common-wall BVP with piecewise hA
      end_state: true
  pid_symbol: MS
  references:
  - docs/unit-catalogue-plan.md §2 U-C 6
  notes: >-
    No V1 worked case: Smith Table 16.2 (the four-stream LNG-cold-box basis)
    needs 7.5 MW of hot utility that the utility-free R0 unit does not model, and
    every single-balance arrangement of the four streams crosses (verified by hand
    cascade). The Smith streams 1+3 two-stream balance is covered by the
    closed-form test in tests/units/heat/test_multi_stream.py; outlet ports are
    positional, not mirrored inlet names. R1 V1 gap (searched 2026-10-25):
    Haseler (1983), Shah & Sekulic, Fundamentals of Heat Exchanger Design (2003)
    ch. 8-9, and the ALPEMA standards print no worked multi-stream rating. The R1
    evidence is the constant-capacity-rate epsilon-NTU reduction, an independently
    hand-computed two-hot/one-cold case (not a printed source), and the R0
    identity test in tests/units/heat/test_multi_stream_r1.py.
    R2 V1 gap (searched 2026-10-25): the printed sources checked are Shah &
    Sekulic (2003) ch. 9 and Kays & London, Compact Heat Exchangers 3rd ed. -
    single-phase core sizing/checking and offset-strip-fin surface data, no
    multi-stream plate-fin rating with printed outlet states. The R2 evidence
    is the closed-form Manglik-Bergles j/f values, the fin/surface efficiency
    closed forms, and the R2-R1 identity test (given hA reproduces the R1
    result) in tests/units/heat/test_multi_stream_r2.py.

- id: fired_heater
  name: Fired heater
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed (coil inlet)
    outlet:
    - name: outlet
      required: true
      description: coil outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.fired_heater:FiredHeater
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K (one of T_out/duty_W)'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          efficiency: {type: number, description: 'firing efficiency on the LHV basis, (0, 1]'}
          fuel_composition: {type: object, description: 'fuel component-id map; fuel flow is the solved demand'}
          dP: {type: number, description: 'coil pressure drop, Pa'}
      validation:
      - V2083
      note: process duty from a T_out/duty_W spec; fuel demand from the mixture LHV with
        water as vapour
    R1:
      status: provisional
      adapter: ngdesign.units.heat.fired_heater_r1:FiredHeaterR1
      params:
        type: object
        required: [fuel_composition, excess_air_frac, alpha_Acp_m2, exchange_factor,
                   tube_area_radiant_m2, tube_wall_excess_K, UA_convection_W_K]
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K (one of T_out/duty_W)'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'coil pressure drop, Pa'}
          fuel_composition: {type: object, description: 'fuel component-id map; required at R1'}
          excess_air_frac: {type: number, description: 'excess air fraction over stoichiometric'}
          air_composition: {type: object, description: 'air mole fractions, default N2 0.79 / O2 0.21'}
          air_T_K: {type: number, description: 'combustion air temperature, K, default 298.15'}
          box_P_Pa: {type: number, description: 'firebox pressure, Pa, default 101325'}
          alpha_Acp_m2: {type: number, description: 'Lobo-Evans alpha*A_cp, m2'}
          exchange_factor: {type: number, description: 'Lobo-Evans overall exchange factor, (0, 1]'}
          tube_area_radiant_m2: {type: number, description: 'radiant tube outside area, m2'}
          h_conv_radiant_W_m2K: {type: number, description: 'radiant-section convection, W/(m2 K), default 11.3565267'}
          tube_wall_excess_K: {type: number, description: 'tube wall above mean radiant process T, K'}
          UA_convection_W_K: {type: number, description: 'convection-section UA, W/K'}
          radiant_loss_frac: {type: number, description: 'setting loss fraction of fired heat, default 0'}
      note: radiant/convective split (Lobo-Evans) with the fuel and flue-gas balance
        solved; bridgewall, stack and crossover temperatures reported
      end_state: true
  pid_symbol: FH
  references:
  - docs/unit-catalogue-plan.md §2 U-C 7
  notes: V2083 checks the methane LHV against NBSIR 82-2401 (802.125 kJ/mol at
    288.15 K; package 802.584 kJ/mol on the 298.15 K formation basis, +0.057%).
    R1 has no V1 case — Kern Example 19.1 (Process Heat Transfer, 1950, Ch. 19)
    fixes the 75 % LHV efficiency as a design input and sizes only the radiant
    section, while R1 rates the efficiency from UA_convection_W_K, which the
    example does not print, so a case asserting the solved efficiency against
    0.75 would echo an input. Kern 1950 Ch. 19, Wimpress 1963 and API 560 were
    searched for a printed-inputs to printed-outputs fired-heater case without
    success; any future case id must follow V1-... . The radiant-section solve is
    kept as a documented comparison test against Kern Example 19.1 in
    tests/units/heat/test_fired_heater_r1.py (fuel composition, coil fluid and
    convection UA there are documented carriers).

- id: cooling_tower
  name: Cooling tower
  family: heat
  ports:
    inlet:
    - name: water_in
      required: true
      description: warm circulating water
    - name: air_in
      required: true
      description: inlet air (humid, N2/O2 dry basis)
    outlet:
    - name: water_out
      required: true
      description: cooled water
    - name: air_out
      required: true
      description: exit air (saturated at the exit-air temperature solved from the
        energy balance)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.cooling_tower:CoolingTower
      params:
        type: object
        properties:
          cycles_of_concentration: {type: number, description: 'cycles of concentration, >= 1 (default 3)'}
          approach_K: {type: number, description: 'water outlet above the inlet-air wet bulb, K (> 0, required)'}
      validation:
      - V2085
      note: water outlet FIXED at wet bulb + approach_K; the exit air, saturated at
        the exit-air temperature solved from the overall energy closure, carries
        the heat and the evaporation; blowdown/makeup from cycles of concentration
    R1:
      status: provisional
      adapter: ngdesign.units.heat.cooling_tower_r1:CoolingTowerR1
      params:
        type: object
        properties:
          characteristic_C: {type: number, exclusiveMinimum: 0, description: 'tower characteristic coefficient C in KaV/L = C (L/G)^-n (solution mode, with characteristic_n)'}
          characteristic_n: {type: number, description: 'tower characteristic exponent n, >= 0 (solution mode, with characteristic_C)'}
          cycles_of_concentration: {type: number, minimum: 1, description: 'cycles of concentration, >= 1 (default 3)'}
      note: >-
        Merkel number by 4-point Chebyshev (CTI ATC-105) against KaV/L = C
        (L/G)^-n, water outlet solved by brentq, then the R0 balance at the
        solved approach; Merkel enthalpies from the ASHRAE Fundamentals Ch. 1
        Hyland-Wexler closed form per the orchestrator ruling on PR #284 (the
        package's water latent heat is ~4% high, #249), the balance stays
        R0's through the thermo package; approach_K is solved at R1, not a
        parameter. A characteristic above the attainable Merkel number refuses
        typed with both numbers.
      end_state: true
  pid_symbol: CT
  references:
  - docs/unit-catalogue-plan.md §2 U-C 8
  notes: V2085 checks the model wet bulb against ASHRAE Fundamentals 2021 SI Ch. 1
    Example 1 (40 C dry-bulb / 20 C wet-bulb air; measured 292.989 K, -0.16 K).
    R1 V1 gap — searched ASHRAE HVAC S&E Ch. 40, Perry's 8th §12, Kern 1950
    Ch. 17; the printed worked examples sit behind paywalls, the web reproduces
    the method but not the printed inputs/answers, so no printed-value case is
    constructed.

- id: hen_block
  name: Heat exchanger network block (HEN)
  family: heat
  ports:
    inlet:
    - name: hot_in_1
      required: true
      description: first hot stream (0 = inactive)
    - name: hot_in_2
      required: false
      description: second hot stream (0 = inactive)
    - name: cold_in_1
      required: true
      description: first cold stream (0 = inactive)
    - name: cold_in_2
      required: false
      description: second cold stream (0 = inactive)
    outlet:
    - name: hot_out_1
      required: true
      description: positional outlet for hot_in_1
    - name: hot_out_2
      required: true
      description: positional outlet for hot_in_2
    - name: cold_out_1
      required: true
      description: positional outlet for cold_in_1
    - name: cold_out_2
      required: true
      description: positional outlet for cold_in_2
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.hen_block:HenBlock
      params:
        type: object
        properties:
          T_out_hot_in_1: {type: number, description: 'hot_in_1 target, K'}
          T_out_hot_in_2: {type: number, description: 'hot_in_2 target, K'}
          T_out_cold_in_1: {type: number, description: 'cold_in_1 target, K'}
          T_out_cold_in_2: {type: number, description: 'cold_in_2 target, K'}
          dT_min: {type: number, description: 'minimum approach, K (default 10)'}
          cp_hot_in_1_W_per_K: {type: number, description: 'analysis CP for hot_in_1, W/K (overrides the package-derived cp)'}
          cp_hot_in_2_W_per_K: {type: number, description: 'analysis CP for hot_in_2, W/K (overrides the package-derived cp)'}
          cp_cold_in_1_W_per_K: {type: number, description: 'analysis CP for cold_in_1, W/K (overrides the package-derived cp)'}
          cp_cold_in_2_W_per_K: {type: number, description: 'analysis CP for cold_in_2, W/K (overrides the package-derived cp)'}
      validation:
      - V2086
      note: every active stream reaches its T_out target; the Linnhoff problem table
        (on package-derived or cp_*-overridden CPs) reports utility targets
        QH_min/QC_min and the pinch (no utilities are added)
  pid_symbol: HEN
  references:
  - docs/unit-catalogue-plan.md §2 U-C 10
  notes: V2086 runs the Kemp four-stream problem-table basis; engineering deliverable
    (utility targets), not a balanced solver unit.
