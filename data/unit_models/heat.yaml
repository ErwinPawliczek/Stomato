# U-C — Heat transfer (plan §2 U-C, 10 rows).
#
# heater and cooler are separate rows. The electric-heater concept (plan U-C 9)
# maps onto the heater row (its R0 IS a duty spec) — no separate row.

- id: heater
  name: Heater
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: heated outlet (PH flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: duty or outlet T with ΔP
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 1
  notes: heater and cooler are separate rows. The electric-heater line (plan U-C 9, R0
    duty only) maps onto this row — no separate electric-heater row.

- id: cooler
  name: Cooler
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: cooled outlet (PH flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: duty or outlet T with ΔP
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 1
  notes: separate row from the heater so flowsheets read naturally.

- id: shell_tube
  name: Shell-and-tube exchanger
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: exchanger outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: approach / duty with LMTD-F specification
    R1:
      status: planned
      params: {}
      note: rating — U from ht film coefficients, TEMA type, F factor, ΔP both sides
    R2:
      status: planned
      params: {}
      note: zoned (phase change), multi-pass with temperature cross
      end_state: true
  sizer: shell_tube
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 2
  notes: the R0 row shares the HeatExchanger adapter; R1/R2 rating physics is the U-C
    family thread's work on the shared _physics/heat_transfer store.

- id: air_cooler
  name: Air cooler
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed
    outlet:
    - name: outlet
      required: true
      description: cooled outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat_exchange:HeatExchanger
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          dP: {type: number, description: 'pressure drop, Pa'}
      note: approach / duty spec
    R1:
      status: planned
      params: {}
      note: rating — bundle geometry, fan power, ht air-side correlation
      end_state: true
  sizer: air_cooler
  pid_symbol: AC
  references:
  - docs/unit-catalogue-plan.md §2 U-C 3
  notes: roadmap R1 lands with the S1 natural-gas slice (plan §2b).

- id: plate_exchanger
  name: Plate exchanger
  family: heat
  ports:
    inlet:
    - name: hot_in
      required: true
      description: hot-side feed (liquid service)
    - name: cold_in
      required: true
      description: cold-side feed
    outlet:
    - name: hot_out
      required: true
      description: cooled hot outlet
    - name: cold_out
      required: true
      description: warmed cold outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.exchangers:PlateExchanger
      params:
        type: object
        properties:
          duty_W: {type: number, description: 'duty spec, W (one of duty_W/hot_T_out/cold_T_out)'}
          hot_T_out: {type: number, description: 'hot outlet temperature spec, K'}
          cold_T_out: {type: number, description: 'cold outlet temperature spec, K'}
          min_approach_K: {type: number, description: 'solve the duty for this minimum approach, K'}
          dP_hot: {type: number, description: 'hot-side pressure drop, Pa'}
          dP_cold: {type: number, description: 'cold-side pressure drop, Pa'}
      validation:
      - V2081
      note: exactly one of duty_W / hot_T_out / cold_T_out; min-approach duty bisection, pinch
        check and LMTD/UA reported
    R1:
      status: planned
      params: {}
      note: rating — chevron-correlation film coefficients
      end_state: true
  pid_symbol: PHE
  references:
  - docs/unit-catalogue-plan.md §2 U-C 4
  notes: V2081 runs Smith Table 16.1 water-water duty spec.

- id: double_pipe
  name: Double-pipe / hairpin exchanger
  family: heat
  ports:
    inlet:
    - name: hot_in
      required: true
      description: hot-side feed (gas service)
    - name: cold_in
      required: true
      description: cold-side feed
    outlet:
    - name: hot_out
      required: true
      description: cooled hot outlet
    - name: cold_out
      required: true
      description: warmed cold outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.exchangers:DoublePipeExchanger
      params:
        type: object
        properties:
          duty_W: {type: number, description: 'duty spec, W (one of duty_W/hot_T_out/cold_T_out)'}
          hot_T_out: {type: number, description: 'hot outlet temperature spec, K'}
          cold_T_out: {type: number, description: 'cold outlet temperature spec, K'}
          min_approach_K: {type: number, description: 'solve the duty for this minimum approach, K'}
          dP_hot: {type: number, description: 'hot-side pressure drop, Pa'}
          dP_cold: {type: number, description: 'cold-side pressure drop, Pa'}
      validation:
      - V2082
      note: exactly one of duty_W / hot_T_out / cold_T_out; min-approach duty bisection, pinch
        check and LMTD/UA reported
    R1:
      status: planned
      params: {}
      note: rating
      end_state: true
  pid_symbol: E
  references:
  - docs/unit-catalogue-plan.md §2 U-C 5
  notes: V2082 runs Kern Example 6.1 (toluene/benzene).

- id: multi_stream
  name: Multi-stream exchanger (LNG cold box)
  family: heat
  ports:
    inlet:
    - name: hot_in_1
      required: true
      description: first hot feed (0 = inactive)
    - name: hot_in_2
      required: false
      description: second hot feed (0 = inactive)
    - name: cold_in_1
      required: true
      description: first cold feed (0 = inactive)
    - name: cold_in_2
      required: false
      description: second cold feed (0 = inactive)
    outlet:
    - name: hot_out_1
      required: true
      description: positional outlet for hot_in_1
    - name: hot_out_2
      required: true
      description: positional outlet for hot_in_2
    - name: cold_out_1
      required: true
      description: positional outlet for cold_in_1
    - name: cold_out_2
      required: true
      description: positional outlet for cold_in_2
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.multi_stream:MultiStreamExchanger
      params:
        type: object
        properties:
          T_out_hot_in_1: {type: number, description: 'hot_in_1 outlet temperature spec, K'}
          T_out_hot_in_2: {type: number, description: 'hot_in_2 outlet temperature spec, K'}
          T_out_cold_in_1: {type: number, description: 'cold_in_1 outlet temperature spec, K'}
          T_out_cold_in_2: {type: number, description: 'cold_in_2 outlet temperature spec, K'}
      validation:
      - V2084
      note: every active side carries a T_out spec except exactly one balance stream, which
        absorbs the residual duty; zoned composite pinch check, per-port duties
    R1:
      status: planned
      params: {}
      note: layer-wise UA distribution
    R2:
      status: planned
      params: {}
      note: zoned with phase change
      end_state: true
  pid_symbol: MS
  references:
  - docs/unit-catalogue-plan.md §2 U-C 6
  notes: V2084 runs Smith Table 16.2 streams 1 and 3 (two-stream basis, zero-flow second
    pair); outlet ports are positional, not mirrored inlet names.

- id: fired_heater
  name: Fired heater
  family: heat
  ports:
    inlet:
    - name: inlet
      required: true
      description: process feed (coil inlet)
    outlet:
    - name: outlet
      required: true
      description: coil outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.fired_heater:FiredHeater
      params:
        type: object
        properties:
          T_out: {type: number, description: 'outlet temperature spec, K (one of T_out/duty_W)'}
          duty_W: {type: number, description: 'duty spec, W (one of T_out/duty_W)'}
          efficiency: {type: number, description: 'firing efficiency on the LHV basis, (0, 1]'}
          fuel_composition: {type: object, description: 'fuel component-id map; fuel flow is the solved demand'}
          dP: {type: number, description: 'coil pressure drop, Pa'}
      validation:
      - V2083
      note: process duty from a T_out/duty_W spec; fuel demand from the mixture LHV with
        water as vapour
    R1:
      status: planned
      params: {}
      note: radiant/convective split (Lobo-Evans)
      end_state: true
  pid_symbol: FH
  references:
  - docs/unit-catalogue-plan.md §2 U-C 7
  notes: V2083 checks the methane LHV against GPSA (802.3 kJ/mol).

- id: cooling_tower
  name: Cooling tower
  family: heat
  ports:
    inlet:
    - name: water_in
      required: true
      description: warm circulating water
    - name: air_in
      required: true
      description: inlet air (humid, N2/O2 dry basis)
    outlet:
    - name: water_out
      required: true
      description: cooled water
    - name: air_out
      required: true
      description: exit air (saturated at the wet-bulb state)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.cooling_tower:CoolingTower
      params:
        type: object
        properties:
          cycles_of_concentration: {type: number, description: 'cycles of concentration, >= 1 (default 3)'}
      validation:
      - V2085
      note: wet bulb from the adiabatic-saturation balance; exit air saturated at the wet-bulb
        state fixes evaporation; the energy closure solves the water outlet; blowdown/makeup
        from cycles of concentration
    R1:
      status: planned
      params: {}
      note: Merkel method
      end_state: true
  pid_symbol: CT
  references:
  - docs/unit-catalogue-plan.md §2 U-C 8
  notes: V2085 runs the Perry evaporative-cooling basis (water 90 -> 70 F).

- id: hen_block
  name: Heat exchanger network block (HEN)
  family: heat
  ports:
    inlet:
    - name: hot_in_1
      required: true
      description: first hot stream (0 = inactive)
    - name: hot_in_2
      required: false
      description: second hot stream (0 = inactive)
    - name: cold_in_1
      required: true
      description: first cold stream (0 = inactive)
    - name: cold_in_2
      required: false
      description: second cold stream (0 = inactive)
    outlet:
    - name: hot_out_1
      required: true
      description: positional outlet for hot_in_1
    - name: hot_out_2
      required: true
      description: positional outlet for hot_in_2
    - name: cold_out_1
      required: true
      description: positional outlet for cold_in_1
    - name: cold_out_2
      required: true
      description: positional outlet for cold_in_2
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.heat.hen_block:HenBlock
      params:
        type: object
        properties:
          T_out_hot_in_1: {type: number, description: 'hot_in_1 target, K'}
          T_out_hot_in_2: {type: number, description: 'hot_in_2 target, K'}
          T_out_cold_in_1: {type: number, description: 'cold_in_1 target, K'}
          T_out_cold_in_2: {type: number, description: 'cold_in_2 target, K'}
          dT_min: {type: number, description: 'minimum approach, K (default 10)'}
      validation:
      - V2086
      note: every active stream reaches its T_out target; the Linnhoff problem table reports
        utility targets QH_min/QC_min and the pinch (no utilities are added)
  pid_symbol: HEN
  references:
  - docs/unit-catalogue-plan.md §2 U-C 10
  notes: V2086 runs the Kemp four-stream problem-table basis; engineering deliverable
    (utility targets), not a balanced solver unit.
