# U-E — Columns and staged contactors (plan §2 U-E, 12 rows).
#
# The registered `column` row is the rigorous MESH unit: plan U-E 2 (rigorous
# distillation) and the R2 of U-E 3/4 (feed-determined absorber via the
# zero-tear configuration, reboiled stripper via the one-tear configuration)
# are its configurations. Rate-based stages are a later round, not this row's
# declared ladder. Sour-water stripping (plan U-G 9) is a reboiled-stripper
# configuration on an electrolyte package (T-09) — no separate row.

- id: shortcut_distillation
  name: Shortcut distillation (FUG)
  family: column
  ports:
    inlet:
    - name: feed
      required: true
      description: column feed
    outlet:
    - name: distillate
      required: true
      description: light-key product
    - name: bottoms
      required: true
      description: heavy-key product
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.column_shortcut.distillation:ShortcutDistillation
      params:
        type: object
        required: [light_key, heavy_key, R_over_Rmin]
        properties:
          light_key: {type: string, description: light-key component id}
          heavy_key: {type: string, description: heavy-key component id}
          recovery_LK_D: {type: number, description: 'fraction of the light key in the distillate (default 1)'}
          recovery_HK_B: {type: number, description: 'fraction of the heavy key in the bottoms (default 1)'}
          condenser: {type: string, description: 'total | partial (default total)'}
          P_top: {type: number, description: 'top-stage pressure, Pa (default feed pressure)'}
          P_bottom: {type: number, description: 'bottom-stage pressure, Pa (default P_top)'}
          R: {type: number, description: 'reflux ratio (give R or R_over_Rmin)'}
          R_over_Rmin: {type: number, description: 'reflux ratio as multiple of the Underwood Rmin'}
      note: Fenske-Underwood-Gilliland with Kirkbride feed stage (Seader-Henley V1 oracle); saturation K-values at product states, two-phase feed q from the inlet flash
      validation:
      - V1-fug-debutanizer-seader97
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 1
  notes: >-
    roadmap; S1 slice needs it (plan §2b). R0 duty approximation: the condenser
    duty condenses the overhead vapour at the distillate composition
    (h at its dew T minus h at its bubble T); a real total condenser's vapour
    carries the top-tray composition, which R0 does not track.


- id: column
  name: Rigorous distillation column
  family: column
  ports:
    inlet:
    - name: feed
      required: true
      description: main feed (further feeds via params)
    outlet:
    - name: distillate
      required: true
      description: overhead product (total condenser) or vapour overhead (partial)
    - name: bottoms
      required: true
      description: bottoms product
    - name: side_draw
      required: true
      description: side draw (zero-flow state when no draw is configured)
  levels:
    R2:
      status: provisional
      adapter: ngdesign.units.column:Column
      params:
        type: object
        required: [n_stages, condenser, reboiler, feed_stage, specs]
        properties:
          n_stages: {type: integer, description: 'equilibrium stages, numbered 1..N top to bottom'}
          condenser: {type: string, description: 'total | partial (total condenses above stage 1)'}
          reboiler: {type: string, description: 'kettle | none (none = absorber/rectifier configuration)'}
          feed_stage: {type: integer, description: main feed stage}
          pressure_profile: {type: number, description: 'top pressure or per-stage profile, Pa'}
          specs: {type: object, description: 'two specs for two tears (reflux_ratio, distillate_rate, boilup_ratio, boilup_rate, ...); one for one-tear; none for an absorber'}
          feeds: {type: object, description: additional feeds by stage}
          side_draws: {type: object, description: additional draws by stage}
          stage_heaters: {type: array, description: '[{stage, duty_W}] fixed heat added to an ordinary tray, W (< 0 cools)'}
      note: MESH on the inside-out (Boston-Sullivan) solver with Naphtali-Sandholm fallback;
        configurations (absorber zero-tear, stripper/rectifier one-tear, two-tear distillation)
        select themselves from the condenser/reboiler kinds
    R3:
      status: provisional
      adapter: ngdesign.units.column.column_r3:ColumnR3
      params:
        type: object
        required: [n_stages, condenser, feed_stage, specs]
        additionalProperties: false
        properties:
          stage_model: {type: string, enum: [rate_based, murphree], description: 'rate_based (default) packed segments, or murphree equilibrium-stage trays'}
          n_stages: {type: integer, minimum: 3, description: 'stages in R2 numbering: 1 = partial condenser or the stage under a total condenser, N = kettle'}
          condenser: {type: string, enum: [total, partial], description: 'total (saturated bubble-point reflux and distillate) or partial (equilibrium stage, vapour distillate)'}
          reboiler: {type: string, enum: [kettle], description: kettle (the only R3 reboiler; equilibrium stage)}
          feed_stage: {type: integer, minimum: 1, description: 'feed stage, R2 numbering (feed vapour to the vapour side, liquid to the liquid side of a packed segment)'}
          pressure_profile:
            description: stage pressures, Pa abs (scalar = uniform; list = N values top to bottom; a total condenser sits at stage 1's pressure); default feed P
            oneOf:
            - {type: number, exclusiveMinimum: 0}
            - {type: array, items: {type: number, exclusiveMinimum: 0}}
          specs: {type: object, description: 'exactly two: one condenser-side (reflux_ratio, condenser_duty_W heat removed W, distillate_rate or bottoms_rate mol/s) and one reboiler-side (boilup_ratio, reboiler_duty_W W, distillate_rate or bottoms_rate)'}
          column_diameter_m: {type: number, exclusiveMinimum: 0, description: 'rate_based: packed-bed diameter, m'}
          packed_height_m: {type: number, exclusiveMinimum: 0, description: 'rate_based: total packed height, m (split equally over the N-1 (total) or N-2 (partial) segments)'}
          nominal_size_m: {type: number, exclusiveMinimum: 0, description: 'rate_based: nominal packing size D_p, m'}
          specific_area_m2_m3: {type: number, exclusiveMinimum: 0, description: 'rate_based: total packing area a_t, m2/m3'}
          critical_surface_tension_N_m: {type: number, exclusiveMinimum: 0, description: 'rate_based: packing critical surface tension sigma_c, N/m'}
          surface_tension_N_m: {type: number, exclusiveMinimum: 0, description: 'rate_based: liquid surface tension, N/m (the thermo contract carries none)'}
          transfer_factor: {type: number, exclusiveMinimum: 0, description: 'rate_based: multiplier on every film conductance and heat-transfer coefficient (default 1); large values reduce each segment to an equilibrium stage'}
          murphree_efficiency:
            description: 'murphree: Murphree vapour efficiency in (0, 1], scalar or one per tray between condenser and kettle (top to bottom); default 1 (= R2)'
            oneOf:
            - {type: number, exclusiveMinimum: 0, maximum: 1}
            - {type: array, items: {type: number, exclusiveMinimum: 0, maximum: 1}}
      note: one simultaneous Newton (the absorber/stripper R3 solver extended with a condenser
        end) over condenser, middle stages and kettle. rate_based - Krishna-Taylor packed
        segments (Onda 1968 coefficients), reduces to R2 as transfer_factor grows (measured
        1.9e-6 max product mole-fraction deviation at 1e4, partial condenser); murphree -
        MESH trays with y_n = y_in + E (y*_n - y_in) (Murphree 1925), E = 1 reproduces R2
        (measured 1.2e-9, partial condenser). Total condenser returns bubble-point reflux
        (R2 returns it at the stage-1 temperature; measured 3.3e-3 product mole-fraction
        difference). Holland vaporisation efficiency not implemented (equation not verified
        from an accessible source)
      validation: []
      end_state: true
  mode_map:
    distillation: R2
    absorber: R2
    stripper: R2
    rectifier: R2
    reboiled_absorber: R2
  pid_symbol: T
  references:
  - Boston & Sullivan 1974, Can. J. Chem. Eng. 52, 52-63
  - Naphtali & Sandholm 1971, AIChE J. 17(1), 148-153
  - Taylor, Kooijman & Hung 1994, Comput. Chem. Eng. 18, 205-217
  - Murphree 1925, Ind. Eng. Chem. 17, 747-750
  - docs/unit-catalogue-plan.md §2 U-E 2
  notes: covers plan U-E 2 and the R2 of U-E 3 (feed-determined absorber, zero-tear) and
    U-E 4 (reboiled stripper, one-tear) as configurations. R3 (rate-based packed segments
    or Murphree trays, condenser + kettle) is the end state. Side draws exist (side_draw
    port) at R2 only; the graph-visible second feed and the extended composite are the
    column_extensions row. R3 V1 gap - provisional without a case (searched
    data/validation/ and data/validation_units/column/ for rate-based or Murphree
    distillation cases, none; the Taylor-Krishna and Seader-Henley rate-based distillation
    examples were not accessible with printed inputs and results); R3 is covered by the
    R2 reduction tests, closed-form condenser and Murphree-row tests.

- id: absorber
  name: Absorber (feed-determined)
  family: column
  ports:
    inlet:
    - name: gas_in
      required: true
      description: feed gas
    - name: solvent_in
      required: true
      description: lean solvent
    outlet:
    - name: gas_out
      required: true
      description: treated gas
    - name: rich_out
      required: true
      description: rich solvent
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.column_shortcut.absorber:Absorber
      params:
        type: object
        required: [N]
        properties:
          N: {type: number, description: 'ideal stages, positive'}
          k_overrides: {type: object, description: '{cid: K} replacing thermo k_values per component (book-estimated-K reference cases)'}
      note: Kremser stage count (the kremser correlation plugin exists in sizing); two-feed split lets lean-solvent components strip
      validation:
      - V1-kremser-absorber-seader53
    R2:
      status: provisional
      adapter: ngdesign.units.column_shortcut.absorber_r2:AbsorberR2
      params:
        type: object
        required: [n_stages]
        additionalProperties: false
        properties:
          n_stages: {type: integer, minimum: 2, description: equilibrium stages (top = 1)}
          pressure_profile:
            description: stage pressures, Pa abs (scalar = uniform; list = per stage, top to bottom); default gas_in.P
            oneOf:
            - {type: number, exclusiveMinimum: 0}
            - {type: array, items: {type: number, exclusiveMinimum: 0}}
      note: zero-tear MESH via the column API (inside-out + NS fallback); duty_W = boundary
        energy residual
      validation: []
    R3:
      status: provisional
      adapter: ngdesign.units.column.rate_based_units:AbsorberR3
      params:
        type: object
        required: [n_stages, column_diameter_m, packed_height_m, nominal_size_m, specific_area_m2_m3, critical_surface_tension_N_m, surface_tension_N_m]
        additionalProperties: false
        properties:
          n_stages: {type: integer, minimum: 1, description: 'packed segments (rate-based stages), top = 1'}
          column_diameter_m: {type: number, exclusiveMinimum: 0, description: packed-bed diameter, m}
          packed_height_m: {type: number, exclusiveMinimum: 0, description: 'total packed height, m (split equally over the segments)'}
          nominal_size_m: {type: number, exclusiveMinimum: 0, description: 'nominal packing size D_p, m (Onda kG constant 5.23 at >= 15 mm, 2.00 below)'}
          specific_area_m2_m3: {type: number, exclusiveMinimum: 0, description: 'total packing area a_t, m2/m3'}
          critical_surface_tension_N_m: {type: number, exclusiveMinimum: 0, description: 'critical surface tension of the packing material sigma_c, N/m'}
          surface_tension_N_m: {type: number, exclusiveMinimum: 0, description: 'liquid surface tension, N/m (the thermo contract carries none)'}
          transfer_factor: {type: number, exclusiveMinimum: 0, description: 'multiplier on every film conductance and heat-transfer coefficient (default 1); large values reduce each segment to an equilibrium stage'}
          pressure_profile:
            description: stage pressures, Pa abs (scalar = uniform; list = per stage, top to bottom)
            oneOf:
            - {type: number, exclusiveMinimum: 0}
            - {type: array, items: {type: number, exclusiveMinimum: 0}}
      note: rate-based (Krishna-Taylor) packed segments - separate vapour/liquid balances,
        interface equilibrium from the package fugacity coefficients, effective-diffusivity
        film fluxes with Onda (1968) random-packing kG, kL and wetted area, Chapman-Enskog
        and Wilke-Chang diffusivities, Chilton-Colburn/penetration heat transfer; reduces to
        R2 as transfer_factor grows (measured 5.6e-7 max outlet deviation at 1e4); duty_W =
        boundary energy residual. Random packing only - sieve-tray (AIChE 1958, Chan-Fair
        1984) coefficients were not adopted because their constants could not be confirmed
        from a fetched source
      validation: []
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 3
  - Taylor, Kooijman & Hung 1994, Comput. Chem. Eng. 18, 205-217
  - Onda, Takeuchi & Okumoto 1968, J. Chem. Eng. Japan 1, 56-62
  notes: the amine-specific rows live in the treating family; this row is the generic solvent absorber. R2 V1 gap — provisional without a case (searched data/validation/ and data/validation_units/column/ for absorber cases; the only absorber V1 case on main is R0's V1-kremser-absorber-seader53, whose printed fractions-not-absorbed are anchored to Example 5.3's 97.5 F chart-estimated K-values carried as Kremser k_overrides — a different thermodynamic basis from the package K-values R2 runs on — so the case is not transferable without re-deriving anchors, which the V1 conventions forbid). R2 is covered by closed-form identity and equilibrium-pair tests.

- id: reboiled_stripper
  name: Reboiled stripper
  family: column
  ports:
    inlet:
    - name: feed
      required: true
      description: liquid feed to the top stage
    outlet:
    - name: overhead
      required: true
      description: stripped overhead
    - name: bottoms
      required: true
      description: lean bottoms
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.column_shortcut.stripper:ReboiledStripper
      params:
        type: object
        required: [N]
        properties:
          N: {type: number, description: 'ideal stages, positive'}
          vapour_flow: {type: number, description: 'stripping vapour flow, mol/s'}
          k_overrides: {type: object, description: '{cid: K} replacing thermo k_values per component'}
      note: Kremser on the stripping side
      validation:
      - V1-kremser-stripper-seader98
    R2:
      status: provisional
      adapter: ngdesign.units.column_shortcut.reboiled_stripper_r2:ReboiledStripperR2
      params:
        type: object
        required: [n_stages, spec]
        additionalProperties: false
        properties:
          n_stages: {type: integer, minimum: 2, description: stages including the kettle reboiler (stage N); feed on stage 1}
          pressure_profile:
            description: stage pressures, Pa abs (scalar = uniform; list = per stage, top to bottom); default feed.P
            oneOf:
            - {type: number, exclusiveMinimum: 0}
            - {type: array, items: {type: number, exclusiveMinimum: 0}}
          spec:
            type: object
            description: exactly one of boilup_ratio, bottoms_rate (mol/s), distillate_rate (mol/s), component_recovery ({component, value, product})
            minProperties: 1
            maxProperties: 1
      note: one-tear MESH (kettle only) via the column API; specs met to the column's
        _SPEC_TOL — the loose column-core spec gate (tracked as issue 248; rate-spec
        convergence there is a core defect; reboiler_duty_W refused — the kettle-only
        core hits a singular Newton system for it). The nC4/nC5 bench feed is withdrawn
        per the PR 292 ruling — the kettle-only column core does not converge on it
        (tracked as issue 248). The component_recovery 0.9 NC4 case on the C1/NC4
        anchor feed is infeasible on this core (residual stuck ~7.5e-3, above the spec
        gate) and is pinned xfail(strict=True) in the test file.
      validation: []
    R3:
      status: provisional
      adapter: ngdesign.units.column.rate_based_units:ReboiledStripperR3
      params:
        type: object
        required: [n_stages, spec, column_diameter_m, packed_height_m, nominal_size_m, specific_area_m2_m3, critical_surface_tension_N_m, surface_tension_N_m]
        additionalProperties: false
        properties:
          n_stages: {type: integer, minimum: 2, description: 'stages including the equilibrium kettle (stage N); N-1 packed segments above it, feed on segment 1'}
          spec:
            type: object
            description: exactly one of boilup_ratio, bottoms_rate (mol/s), distillate_rate (mol/s), reboiler_duty_W
            minProperties: 1
            maxProperties: 1
          column_diameter_m: {type: number, exclusiveMinimum: 0, description: packed-bed diameter, m}
          packed_height_m: {type: number, exclusiveMinimum: 0, description: 'total packed height, m (split equally over the segments)'}
          nominal_size_m: {type: number, exclusiveMinimum: 0, description: 'nominal packing size D_p, m (Onda kG constant 5.23 at >= 15 mm, 2.00 below)'}
          specific_area_m2_m3: {type: number, exclusiveMinimum: 0, description: 'total packing area a_t, m2/m3'}
          critical_surface_tension_N_m: {type: number, exclusiveMinimum: 0, description: 'critical surface tension of the packing material sigma_c, N/m'}
          surface_tension_N_m: {type: number, exclusiveMinimum: 0, description: 'liquid surface tension, N/m (the thermo contract carries none)'}
          transfer_factor: {type: number, exclusiveMinimum: 0, description: 'multiplier on every film conductance and heat-transfer coefficient (default 1); large values reduce each segment to an equilibrium stage'}
          pressure_profile:
            description: stage pressures, Pa abs (scalar = uniform; list = per stage, top to bottom)
            oneOf:
            - {type: number, exclusiveMinimum: 0}
            - {type: array, items: {type: number, exclusiveMinimum: 0}}
      note: rate-based (Krishna-Taylor) packed segments over an equilibrium kettle, solved
        simultaneously with the kettle spec (reboiler_duty_W included); same transport
        models as the absorber R3; reduces to R2 as transfer_factor grows (measured 7e-7
        relative on the overhead at 1e4 against R2 at R2's achieved boilup). Random packing
        only (tray coefficients not adopted - constants unconfirmed)
      validation: []
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 4
  - Taylor, Kooijman & Hung 1994, Comput. Chem. Eng. 18, 205-217
  - Onda, Takeuchi & Okumoto 1968, J. Chem. Eng. Japan 1, 56-62
  notes: sour-water stripping (plan U-G 9) is a reboiled-stripper configuration on an
    electrolyte package (T-09) — no separate treating row. R2 V1 gap — provisional without a
    case (searched Seader, Henley & Roper 3rd ed. rigorous-methods chapter and Kister,
    Distillation Design (1992) stripper examples; no printed rigorous reboiled-stripper
    example with its inputs and printed product flows or duties was found, so a V1 case
    cannot be transcribed without reconstruction; R2 is covered by closed-form identity and
    equilibrium-pair tests against the column row and thermo bubble/dew points).

- id: refluxed_absorber
  name: Refluxed absorber / reboiled absorber
  family: column
  ports:
    inlet:
    - name: gas_in
      required: true
      description: feed gas
    - name: solvent_in
      required: true
      description: lean solvent
    outlet:
    - name: gas_out
      required: true
      description: treated gas
    - name: rich_out
      required: true
      description: rich solvent
  levels:
    R2:
      status: provisional
      adapter: ngdesign.units.column_shortcut.refluxed_absorber:RefluxedAbsorber
      params:
        type: object
        required: [n_stages, spec]
        additionalProperties: false
        properties:
          n_stages: {type: integer, minimum: 3, description: 'equilibrium stages, top = 1 (a partial condenser is stage 1, a kettle is stage N)'}
          configuration: {type: string, description: 'reboiled (default; kettle, no condenser) | refluxed (partial condenser, no reboiler)'}
          gas_stage: {type: integer, description: 'feed-gas stage (default mid-column reboiled, stage N refluxed)'}
          solvent_stage: {type: integer, description: 'lean-solvent stage (default 1 reboiled, mid-column refluxed); never below gas_stage'}
          pressure_profile:
            description: stage pressures, Pa abs (scalar or per-stage list); default gas_in.P
          spec:
            type: object
            description: exactly one spec. reboiled = boilup_ratio | bottoms_rate | component_recovery; refluxed = distillate_rate (the gas_out flow)
      note: one-tear MESH with one end exchanger via the column API; partial condenser only (gas_out is a vapour); total condenser refused
      validation: []
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 5
  - Seader, Henley & Roper 3rd ed., Table 10.1 (reboiled absorber; refluxed absorber)
  notes: >-
    V1 gap — provisional without a case: no printed example with its inputs and
    product flows was at hand. Covered by a stage-by-stage MESH audit and the
    zero-duty comparison with absorber R2 (tests/units/column_shortcut/test_refluxed_absorber.py).
    Measured limits: on the C1/NC4 basis the reboiled bottoms_rate and
    component_recovery specs do not converge (column core; the boilup_ratio
    spec does), and the refluxed distillate_rate spec has a narrow window
    (C2/C3 into NC4: 60 mol/s converges, 75 mol/s does not).

- id: column_extensions
