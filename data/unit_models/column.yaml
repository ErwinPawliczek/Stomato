      validation: []
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 6
  - Seader, Henley & Roper 3rd ed., eq. 10-4 (stage heat duty Q_j)
  notes: >-
    The MESH extensions the S0 crude column builds on (plan §2b). V1 gap —
    provisional without a case; covered by a stage-by-stage audit and reductions
    to the plain column (tests/units/column_shortcut/test_column_extensions.py).
    Side strippers and the condenser decant are not here: the column refuses them.

