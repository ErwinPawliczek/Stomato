  - Tsuboka & Katayama, J. Chem. Eng. Japan 9 (1976) 40
  - Seader, Henley & Roper 3rd ed., Sect. 10.5
  notes: >-
    V1 gap — provisional without a case. Checked by the one-stage reduction to a
    flash, stage balances, isofugacity from single-phase builds, and the dilute
    Kremser limit (tests/units/column_shortcut/test_extractor_r2.py). The stage
    energy balance is not solved (isothermal).

- id: divided_wall
  name: Divided-wall / Petlyuk column
  family: column
  ports:
    inlet:
    - name: feed
      required: true
      description: feed
    outlet:
    - name: distillate
      required: true
      description: light product
    - name: side_product
      required: true
      description: middle product
    - name: bottoms
      required: true
      description: heavy product
  levels:
    R2:
      status: provisional
      adapter: ngdesign.units.column.divided_wall:DividedWallR2
      params:
        type: object
        required: [n_top, n_prefractionator, n_main_wall, n_bottom, feed_stage, side_draw_stage, side_draw_rate, liquid_split, specs]
        additionalProperties: false
        properties:
          n_top: {type: integer, minimum: 1, description: 'common rectifying stages above the wall (stage 1 under the total condenser)'}
          n_prefractionator: {type: integer, minimum: 1, description: 'feed-side wall stages (the prefractionator)'}
          n_main_wall: {type: integer, minimum: 1, description: 'side-draw-side wall stages'}
          n_bottom: {type: integer, minimum: 2, description: 'common stripping stages below the wall, the kettle reboiler last'}
          feed_stage: {type: integer, minimum: 1, description: 'prefractionator stage of the feed, 1..n_prefractionator'}
          side_draw_stage: {type: integer, minimum: 1, description: 'main-side stage of the liquid side product, 1..n_main_wall'}
          side_draw_rate: {type: number, exclusiveMinimum: 0, description: 'side product, mol/s'}
          liquid_split: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: 'fraction of the liquid leaving the stage above the wall sent to the prefractionator'}
          vapour_split: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: 'fraction of the vapour leaving the stage below the wall sent to the prefractionator; omitted = solved from equal pressure drop across the two sides'}
          wall_area_fraction: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: 'prefractionator share of the cross-section, for the equal pressure-drop split (default 0.5)'}
          pressure_profile:
            description: main-cascade stage pressures, Pa abs (scalar = uniform; {top, bottom} = linear); default feed.P; prefractionator stages interpolate across the wall
            oneOf:
            - {type: number, exclusiveMinimum: 0}
            - {type: object}
          specs: {type: object, description: 'exactly reflux_ratio and distillate_rate (mol/s)'}
      note: one simultaneous MESH solve over the whole shell on the column core's stage
        graph (graph_ns) - common top, main side, common bottom as the main cascade, the
        prefractionator a section linked by the split liquid, its top-vapour return, its
        bottom liquid and the split vapour; the vapour split is a Newton unknown closed by
        equal pressure drop across the two sides (turbulent dry-bed dP ~ rho_V u^2,
        Stichlmair, Bravo & Fair 1989; split set by the wall position, Dejanovic et al.
        2010) or specified; seeded from the wall-free shell on the same specs
      validation: []
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 10
  - Dejanovic, Matijasevic & Olujic, Chem. Eng. Process. 49 (2010) 559-580
  - Stichlmair, Bravo & Fair, Gas Sep. Purif. 3 (1989) 19-28
  - Russell 1983, Comput. Chem. Eng. 7, 571-578
  notes: >-
    V1 gap - provisional without a case. Checked by every stage's component
    balance re-closed from the reported stage flows over the four wall links,
    the vapour split meeting its pressure-drop equation (and a specified split
    held exactly), and the symmetric reduction to the plain column (feed above
    the wall, no side draw, liquid split = area fraction: both wall sides
    reproduce the plain column's stages) (tests/units/column/test_divided_wall.py).
    Specs are reflux_ratio + distillate_rate only (the graph Newton's top-vapour
    mode). Measured limit: the initializer is the plain column's own spec loop,
    which does not converge on BTX 8 + 12|12 + 8 stages at R = 5 (inside-out and
    its NS fallback at tears 166.7 / 186.7 mol/s), so that shell is refused there.

- id: column_internals
  name: Column internals (trays/packing)
  family: column
  ports:
    inlet:
    - name: inlet
      required: true
      description: solved column result (hydraulics input)
    outlet:
    - name: outlet
      required: true
      description: hydraulics report
  levels:
    R1:
      status: provisional
      adapter: ngdesign.units.column_shortcut.column_internals_r1:ColumnInternalsR1
      params:
        type: object
        required: [internals]
        additionalProperties: false
        properties:
          internals: {type: string, description: 'sieve_tray | packing'}
          surface_tension_N_m: {type: number, description: 'liquid surface tension, N/m, > 0 (tray, required)'}
          tray_spacing_m: {type: number, description: 'tray spacing, m, > 0; the Fair fit takes mm internally (tray, required)'}
          diameter_m: {type: number, description: 'column diameter, m, > 0 (tray rating mode; give exactly one of diameter_m / design_flood_fraction)'}
          design_flood_fraction: {type: number, description: 'design fraction of flood, in (0, 1) (tray design mode; give exactly one of diameter_m / design_flood_fraction)'}
          downcomer_area_frac: {type: number, description: 'total area fraction taken by each downcomer, in (0, 0.5) (tray, required)'}
          hole_area_frac: {type: number, description: 'hole area as a fraction of the ACTIVE area, in [0.06, 0.20] (tray, required)'}
          weir_height_m: {type: number, description: 'weir height, m, > 0 (tray, required)'}
          weir_length_m: {type: number, description: 'weir length, m, > 0 (tray, required)'}
          orifice_coefficient: {type: number, description: 'orifice discharge coefficient, > 0 (tray, required)'}
          aeration_factor: {type: number, description: 'aeration factor, in (0, 1] (tray, required)'}
          foaming_factor: {type: number, description: 'foaming system factor, > 1 foaming, default 1 (tray)'}
          column_diameter_m: {type: number, description: 'packed-section diameter, m, > 0 (packing, required)'}
          packed_height_m: {type: number, description: 'packed height, m, > 0 (packing, required)'}
          voidage: {type: number, description: 'packing void fraction, in (0, 1) (packing, required)'}
          specific_area_m2_m3: {type: number, description: 'packing specific area, m2/m3, > 0 (packing, required)'}
          stichlmair_C1: {type: number, description: 'Stichlmair constant C1, > 0 (packing, required)'}
          stichlmair_C2: {type: number, description: 'Stichlmair constant C2, > 0 (packing, required)'}
          stichlmair_C3: {type: number, description: 'Stichlmair constant C3, > 0 (packing, required)'}
          Fpd_per_ft: {type: number, description: 'packing factor, 1/ft (packing; Robbins dP is reported when given)'}
          hetp_m: {type: number, description: 'HETP, m (packing; give both of hetp_m / n_stages or neither)'}
          n_stages: {type: integer, description: 'theoretical stages (packing; give both of hetp_m / n_stages or neither)'}
      note: sieve-tray flooding/diameter/pressure drop (Fair capacity via the Lygeros-Magoulas 1986 fit, Seader-Henley-Roper 3rd ed. §6.6) and packed-section Stichlmair dry/wet/flood plus optional Robbins dP via fluids 1.3.1; pass-through outlet, all hydraulics in info; every result carries flooded = 1.0 when flood_fraction > 1, else 0.0 (the info contract carries floats), and dP_wet_Pa is reported only at or below the flood point (the irrigated correlation is undefined above it); HETP is not computed, hetp_m·n_stages is reported when both are given
      end_state: true
  pid_symbol: INT
  references:
  - docs/unit-catalogue-plan.md §2 U-E 11
  notes: R1 sieve-tray hydraulics (Seader-Henley-Roper 3rd ed. §6.6; the C_SB fit is Lygeros-Magoulas 1986 — 0.0105 + 8.127e-4·TS_mm^0.755·exp(−1.463·F_LV^0.842), verified against the Perry 8th ed. eq. 14-90 form and Souza et al., I&EC Res. 64(4), 2256, 2025) and packed-section Stichlmair dry/wet/flood plus optional Robbins dP through fluids 1.3.1, all anchored to closed-form tests. The hole-area correction is applied (plan eq. 3 — F_HA = 1 at Ah/Aa ≥ 0.10, else 5·(Ah/Aa) + 0.5, refusal below 0.06) and reported in info as F_HA; params reject unknown keys (strict params schema). V1 gap — the spec's candidate (Seader-Henley-Roper §6.6 worked sieve-tray example) is not transcribed — no accessible printed page, and the book reads C_F from the Fair chart, where a fit-based reading would be an assessed value, so the case is withdrawn rather than tuned; the level ships provisional. dP_wet_Pa above the flood point is omitted (fluids.Stichlmair_wet does not converge there; dry dP, flood velocity and flood fraction are still reported — SPEC ISSUE on PR #288 with the traceback), and per the orchestrator ruling the flooded state is reported explicitly as info flooded = 1.0 when flood_fraction > 1, else 0.0 (the info contract carries floats, so the ruling's True/False maps to 1.0/0.0), tested on both sides (flooded spec state; Vg = 0.25 m/s with dP_wet = 544.8235414348013 Pa). Sizing integration and the remaining roadmap stay planned.

