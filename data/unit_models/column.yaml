      params:
        type: object
        required: [N]
        properties:
          N: {type: number, description: 'ideal stages, positive'}
          K_D: {type: object, description: '{cid: distribution coefficient}; omitted = thermo k_values, refused when no second liquid phase'}
      note: stage count from Kremser; nonsolutes immiscible at R0 (each stays with its inlet phase)
      validation:
      - V1-kremser-extractor-seader52
    R2:
      status: provisional
      adapter: ngdesign.units.column_shortcut.extractor_r2:ExtractorR2
      params:
        type: object
