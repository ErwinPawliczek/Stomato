    - name: feed_2
      required: false
      description: second feed (stage from feed_2_stage)
    outlet:
    - name: distillate
      required: true
      description: overhead product
    - name: bottoms
      required: true
      description: bottoms product
    - name: side_draw
      required: false
      description: side draw (zero-flow state when none is configured)
  levels:
    R2:
      status: provisional
      adapter: ngdesign.units.column_shortcut.column_extensions:ColumnExtensions
      params:
        type: object
        required: [n_stages, condenser, reboiler, feed_stage, specs]
        additionalProperties: false
        properties:
          n_stages: {type: integer, description: 'equilibrium stages, 1..N top to bottom'}
          condenser: {type: string, description: 'total | partial | none'}
          reboiler: {type: string, description: 'kettle | none'}
          feed_stage: {type: integer, description: main feed stage}
          feed_2_stage: {type: integer, description: 'second feed stage (required when feed_2 is connected)'}
          pressure_profile: {type: number, description: 'top pressure or per-stage profile, Pa'}
          specs: {type: object, description: 'one spec per tear, as the column row'}
