  name: Three-phase (VLLE) stages
  family: column
  ports:
    inlet:
    - name: feed
      required: true
      description: feed forming two liquids
    outlet:
    - name: distillate
      required: true
      description: overhead
    - name: bottoms
      required: true
      description: bottoms
  levels:
    R2:
      status: provisional
      adapter: ngdesign.units.column_shortcut.three_phase_stages:ThreePhaseStages
      params:
        type: object
        required: [n_stages, condenser, reboiler, feed_stage, specs]
        additionalProperties: false
        properties:
          n_stages: {type: integer, description: 'equilibrium stages, 1..N top to bottom'}
          condenser: {type: string, description: 'total | partial | none'}
          reboiler: {type: string, description: 'kettle | none'}
          feed_stage: {type: integer, description: feed stage}
          pressure_profile: {type: number, description: 'top pressure or per-stage profile, Pa'}
          specs: {type: object, description: 'one spec per tear, as the column row'}
      note: MESH on the overall (pooled) stage liquid with K = y/xbar from the stage VLLE flash; the split is reported per stage and a re-flash gate refuses stages off equilibrium; no decanter, both liquids flow down together
      validation: []
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 7
  - Block & Hegner, AIChE J. 22 (1976) 582
  - Cairns & Furzer, I&EC Res. 29 (1990) 1349
  notes: >-
    V1 gap — provisional without a case; checked by isofugacity of the
    three reported phases, a stage audit on fresh three-phase flashes, and the
    single-liquid reduction
    (tests/units/column_shortcut/test_three_phase_stages.py). Measured limit: a
    two-tear wet nC6/nC7 column with a total condenser does not converge
    (M = 1 from the cold seed), so the example is a one-tear kettle column.

- id: reactive_stages
  name: Reactive stages (equilibrium / kinetic)
  family: column
  ports:
    inlet:
    - name: feed
      required: true
      description: feed
    outlet:
    - name: distillate
      required: true
      description: overhead
    - name: bottoms
      required: true
      description: bottoms
  levels:
    R2:
      status: provisional
      adapter: ngdesign.units.column_shortcut.reactive_stages:ReactiveStages
      params:
        type: object
        required: [n_stages, condenser, reboiler, feed_stage, specs, reaction_set, reactive_holdup_m3]
        additionalProperties: false
        properties:
          n_stages: {type: integer, description: 'equilibrium stages, 1..N top to bottom'}
          condenser: {type: string, description: 'total | partial | none'}
          reboiler: {type: string, description: 'kettle | none'}
          feed_stage: {type: integer, description: main feed stage}
          pressure_profile: {type: number, description: 'top pressure or per-stage profile, Pa'}
          specs: {type: object, description: 'one spec per tear, as the column row'}
          reaction_set: {type: object, description: 'ReactionSet document; kinetics on the mole_fraction basis, reversible reactions by an explicit reverse rate'}
          reactive_holdup_m3: {type: object, description: '{stage: liquid holdup, m3}; never on a condenser or kettle stage'}
      note: MESH with kinetic source terms on the stage liquid holdup; equilibrium is the large-holdup limit, there is no chemical-equilibrium stage model; heat of reaction on the formation-enthalpy basis
      validation: []
      end_state: true
  balance: mass_elements
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-E 8
  - Taylor & Krishna, Chem. Eng. Sci. 55 (2000) 5183
  - Fogler, Elements of Chemical Reaction Engineering, Example 11-3 (example kinetics)
  notes: >-
    Amine chemistry lives in the property package, not the stage (plan note).
    V1 gap — provisional without a case; checked by hand-evaluated stage rates,
    the zero-holdup reduction to the plain column, and the large-holdup limit on
    the book's K_C(T) (tests/units/column_shortcut/test_reactive_stages.py).
    A cold reactive mesh walks the holdup up from the plain column. Measured
    limits: the two-tear path does not converge on the narrow nC4/iC4 split with
    or without reaction (1 MPa, 12 stages), and the ethylene oxide hydration
    benchmark does not converge on PR on either path, also with or without
    reaction; the example therefore uses a one-tear kettle column with boilup_rate.
    A strongly displaced feed stalls the ladder (x_iC4 = 0.1, 1 m3 per stage at
    50 mol/s boilup stops at 0.42 of the holdup).

