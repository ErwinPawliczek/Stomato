  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.column_shortcut.extractor:LiquidLiquidExtractor
      params:
        type: object
        required: [N]
        properties:
          N: {type: number, description: 'ideal stages, positive'}
          K_D: {type: object, description: '{cid: distribution coefficient}; omitted = thermo k_values, refused when no second liquid phase'}
