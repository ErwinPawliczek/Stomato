        properties:
          n_stages: {type: integer, minimum: 1, description: 'equilibrium stages; feed on 1, solvent on N'}
          T: {type: number, description: 'uniform column temperature, K (default the flow-weighted inlet T)'}
          P: {type: number, description: 'column pressure, Pa abs (default the lower inlet P)'}
      note: LLE stages by the isothermal sum-rates method with tie lines from the package flash; isothermal, duty_W holds T
      validation: []
