# U-A — Logical and stream handling (plan §2 U-A, 9 rows).
#
# mixer and splitter are the two registered rows; the rest are roadmap R0
# rows so the palette is complete and later family threads only add adapters.

- id: mixer
  name: Mixer
  family: logical
  ports:
    inlet:
    - name: inlet_1
      required: true
      description: first feed
    - name: inlet_2
      required: true
      description: second feed
    - name: inlet_3
      required: true
      description: third feed
    outlet:
    - name: outlet
      required: true
      description: adiabatic mixed stream
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.mixer:Mixer
      params:
        type: object
        properties: {}
      note: outlet pressure = min inlet pressure; adiabatic PH flash of the combined feed
      end_state: true
  pid_symbol: MIX
  references:
  - docs/unit-catalogue-plan.md §2 U-A 1
  notes: complete at R0 (plan §1) — a mixer has no rating or rigorous level.

- id: splitter
  name: Splitter
  family: logical
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet_1
      required: true
      description: first split, fraction of the feed
    - name: outlet_2
      required: true
      description: second split, fraction of the feed
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.splitter:Splitter
      params:
        type: object
        required: [fractions]
        properties:
          fractions:
            type: array
            items: {type: number}
            description: outlet split fractions (same order as the outlet ports)
      note: splits the feed by fractions or flows; outlet T/P follow the inlet
      end_state: true
  pid_symbol: SPL
  references:
  - docs/unit-catalogue-plan.md §2 U-A 2
  notes: complete at R0.

- id: component_splitter
  name: Component splitter
  family: logical
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet_1
      required: true
      description: first component split
    - name: outlet_2
      required: true
      description: second component split
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.logical.component_splitter:ComponentSplitter
      params:
        type: object
        required: [fractions]
        properties:
          fractions:
            type: object
            description: cid -> fraction of its flow sent to outlet_1; unmapped cids go to outlet_2
          outlet_T:
            type: [number, object]
            description: outlet temperature, scalar or per port (outlet_1/outlet_2), K
          outlet_P:
            type: [number, object]
            description: outlet pressure, scalar or per port (outlet_1/outlet_2), Pa abs
      note: per-component split fractions via units._physics.splitting, each outlet flashed at its own T/P; duty reported. closed-form only; definitional unit (no open textbook worked example; searched Towler & Sinnott ch. 2 and Coulson & Richardson vol. 2)
      end_state: true
  pid_symbol: CSP
  references:
  - docs/unit-catalogue-plan.md §2 U-A 3
  notes: roadmap R0 — the canvas slice S3 needs it (plan §2b).

- id: stream_calculator
  name: Stream calculator (set)
  family: logical
  ports:
    inlet:
    - name: inlet
      required: true
      description: reference stream
    outlet:
    - name: outlet
      required: true
      description: copy/scale/override of the inlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.logical.stream_calculator:StreamCalculator
      params:
        type: object
        properties:
          scale:
            type: number
            description: multiplies the inlet flow (default 1)
          set:
            type: object
            description: overrides applied before a PT flash; T (K), P (Pa), molar_flow (mol/s), composition (renormalised, negative entries refused)
      note: scale, set overrides, then a PT flash; duty = enthalpy change. closed-form only; definitional unit (no open textbook worked example; searched Towler & Sinnott ch. 2 and Coulson & Richardson vol. 2)
      end_state: true
  pid_symbol: SMC
  references:
  - docs/unit-catalogue-plan.md §2 U-A 4
  notes: P2-01 design specs exist at the solver level; the unit form is missing.

- id: adjust
  name: Adjust
  family: logical
  ports:
    inlet:
    - name: inlet
      required: true
      description: stream carrying the target
    outlet:
    - name: outlet
      required: true
      description: adjusted stream
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.logical.adjust:Adjust
      params:
        type: object
        required: [target, manipulate]
        properties:
          target:
            type: object
            description: '{stream, variable, value} - the solver target address and value'
          manipulate:
            type: object
            description: '{unit, param} - the unit parameter the solver may vary'
          bounds:
            type: object
            description: '{lower, upper} on the manipulated variable (defaults unbounded)'
      note: identity at R0; lowers to a P2-01 DesignSpec (solver.lowering). closed-form only; definitional unit (no open textbook worked example)
      end_state: true
  pid_symbol: ADJ
  references:
  - docs/unit-catalogue-plan.md §2 U-A 5
  notes: exists at solver level only today (plan marks the line 🟡).

- id: balance
  name: Balance
  family: logical
  ports:
    inlet:
    - name: inlet
      required: true
      description: known streams
    outlet:
    - name: outlet
      required: true
      description: stream closed by the balance
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.logical.balance:Balance
      params:
        type: object
        properties:
          known_outlets:
            type: array
            description: FeedSpec kwargs of already-known outlet streams, subtracted per component
          P:
            type: number
            description: PH-flash pressure of the closed outlet (default inlet P), Pa abs
      note: closes one unknown outlet by component balance then a PH flash so energy closes too; negative component flows refused. closed-form only; definitional unit (no open textbook worked example)
      end_state: true
  pid_symbol: BAL
  references:
  - docs/unit-catalogue-plan.md §2 U-A 6
  notes: roadmap R0.

- id: recycle_block
  name: Recycle block
  family: logical
  ports:
    inlet:
    - name: inlet
      required: true
      description: torn stream guess
    outlet:
    - name: outlet
      required: true
      description: accelerated tear stream
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.logical.recycle_block:RecycleBlock
      params:
        type: object
        properties:
          acceleration:
            type: string
            enum: [none, wegstein, broyden]
            description: tear acceleration for the loop (default solver value); none = direct substitution
          tolerance:
            type: number
            description: relative tear tolerance (default solver value)
      note: identity at R0; lowers to the P2-03 flowsheet tear options (solver.lowering). closed-form only; definitional unit (no open textbook worked example)
      end_state: true
  pid_symbol: RCY
  references:
  - docs/unit-catalogue-plan.md §2 U-A 7
  notes: tear handling is implicit in the solver today (P2-03).

- id: stream_duplicator
  name: Stream duplicator / tee
  family: logical
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet_1
      required: true
      description: identical copy
    - name: outlet_2
      required: true
      description: identical copy
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.logical.stream_duplicator:StreamDuplicator
      params:
        type: object
        properties:
          n_copies:
            type: integer
            description: number of outlets (default 2)
          copy_flow_scale:
            type: number
            description: flow scale of copies 1..N-1 (default 0 so the balance closes)
          allow_unbalanced:
            type: boolean
            description: permit the full-flow mirror form that breaks the mole balance (V0 never uses it)
      note: 'reference-stream tees: copy_0 carries the material, copies 1..N-1 share the intensive state at copy_flow_scale. closed-form only; definitional unit (no open textbook worked example)'
      end_state: true
  pid_symbol: TEE
  references:
  - docs/unit-catalogue-plan.md §2 U-A 8
  notes: roadmap R0.

- id: utility_stream
  name: Utility stream source/sink
  family: logical
  ports:
    inlet:
    - name: inlet
      required: false
      description: process stream to absorb the utility (sink side)
    outlet:
    - name: outlet
      required: true
      description: utility stream at the declared level
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.logical.utility_stream:UtilityStream
      params:
        type: object
        required: [kind]
        properties:
          kind:
            type: string
            enum: [steam_lp, steam_mp, steam_hp, cooling_water, fuel_gas, electricity, refrigerant]
          price:
            type: number
            description: currency per unit basis; reported as info.utility_cost_rate (pass-through, not physics)
      note: metering pass-through reporting utility_cost_rate. closed-form only; definitional unit (no open textbook worked example; pricing data out of scope per spec)
      end_state: true
  pid_symbol: UTL
  references:
  - docs/unit-catalogue-plan.md §2 U-A 9
  notes: roadmap R0.
