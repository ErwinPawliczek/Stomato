- id: electrolyser_stack
  name: Electrolyser / fuel cell stack
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed (no H2 or O2 present)
    outlet:
    - name: h2_out
      required: true
      description: pure hydrogen product
    - name: o2_out
      required: true
      description: coproduct oxygen plus everything else fed
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.reactors.electrolyser:ElectrolyserStack
      params:
        type: object
        properties:
          current_A: {type: number, description: stack current, A}
          n_cells: {type: number, description: cells in series}
          cell_voltage_V: {type: number, description: cell voltage, V}
          faradaic_efficiency: {type: number, description: "charge efficiency in (0, 1]; default 1"}
      validation:
      - V1-ELECTROLYSER
      note: Faraday's law n(H2) = η·I·N/(2F); power = V·I·N is electrical work
    R1:
      status: planned
      params: {}
      note: polarisation curve
      end_state: true
  balance: mass_elements
  pid_symbol: FC
  references:
  - docs/unit-catalogue-plan.md §2 U-F 9
  notes: R0 implemented (U-F). Thermoneutral voltage reported on the databank's
    water-vapour basis (≈ 1.253 V); liquid-water HHV (1.481 V) deliberately not used.
