# U-F — Reactors (plan §2 U-F, 9 rows). Five R0 rows are implemented and
# registered through the catalogue (status provisional): conversion, yield,
# equilibrium, Gibbs and the electrolyser stack. The remaining rows are
# roadmap: kinetic reactors land with the S3 slice (plan §2b).

- id: conversion_reactor
  name: Conversion reactor
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: effluent at specified conversion
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.reactors.conversion_reactor:ConversionReactor
      params:
        type: object
        properties:
          reaction_set:
            description: inline ReactionSet, or a string id resolved against Flowsheet.reactions
          conversion:
            type: object
            description: '{reaction_id: fraction of the reaction base component converted}'
          sequential:
            type: boolean
            description: "true: each conversion applies to the amounts left by the preceding reactions (declaration order); default false: all conversions on the inlet basis"
          thermal:
            description: "'isothermal' | 'adiabatic' | {duty_W: W} | {T_out: K} (default isothermal)"
      validation:
      - V1-FOGLER-CONV
      note: fractional conversion per reaction (simultaneous or sequential); outlet flashed at
        inlet P; info carries extents
      end_state: true
  balance: mass_elements
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 1
  notes: R0 implemented (U-F). Components absent from the reaction set pass through.

- id: yield_reactor
  name: Yield reactor
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: effluent at the specified product yields
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.reactors.yield_reactor:YieldReactor
      params:
        type: object
        properties:
          feed_components:
            type: array
            description: lumped feed components consumed by the reactor
          products:
            type: array
            description: outlet components, aligned with yields_mass
          yields_mass:
            type: array
            description: kg product per kg consumed feed, Σ = 1
          thermal:
            description: "'isothermal' | 'adiabatic' | {duty_W: W} | {T_out: K} (default isothermal)"
      validation:
      - V1-SMR-YIELD
      note: product mass yields; the shift enforces mass closure, no reaction set required
      end_state: true
  balance: mass_elements
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 2
  notes: R0 implemented (U-F). Undeclared components pass through unconverted.

- id: equilibrium_reactor
  name: Equilibrium reactor (Keq)
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: equilibrium effluent
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.reactors.equilibrium_reactor:EquilibriumReactor
      params:
        type: object
        properties:
          reaction_set:
            description: inline ReactionSet, or a string id resolved against Flowsheet.reactions
          approach_K:
            type: number
            description: K evaluated at T_out − approach_K; 0 = full equilibrium. Sign convention —
              equilibrium evaluated at the temperature that gives LESS conversion than ideal
              (positive falls short for an endothermic reaction; negative for an exothermic one,
              matching U-G's Claus T_out + approach on the hot side)
          thermal:
            description: "'isothermal' | 'adiabatic' | {duty_W: W} | {T_out: K} (default isothermal)"
      validation:
      - V1-WGS-EQ
      note: extents solve ln Q = ln K(T_out − approach_K) per reaction; ideal-gas quotient on the
        JANAF standard state; info reports ln K at the temperature actually used; a solve that
        pushes a species negative or past depletion is refused, never clipped
      end_state: true
  balance: mass_elements
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 3
  notes: R0 implemented (U-F); cross-checks the Gibbs reactor to 1e-6 (U-F V2). The
    WGSR/Moe discrepancy is tracked by U-R (issue #192).

- id: gibbs_reactor
  name: Gibbs reactor
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: Gibbs-minimum effluent
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.reactors.gibbs_reactor:GibbsReactor
      params:
        type: object
        properties:
          species:
            type: array
            description: components allowed to react (element-potential Gibbs minimum)
          inerts:
            type: array
            description: fixed-amount spectators excluded from the minimisation
          thermal:
            description: "'isothermal' | 'adiabatic' | {duty_W: W} | {T_out: K} (default isothermal)"
      validation:
      - V1-WGS-GIBBS
      note: Gibbs minimisation at the stationarity conditions (element-potential method)
      end_state: true
  balance: mass_elements
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 4
  notes: R0 implemented (U-F). Every feed component must be listed in species or
    inerts; restricted equilibria stay an R1+ concern. The SVA steam-methane-reforming
    worked example (mole fractions to 3 decimals) could not be verified in any open
    source (searched 2026-10-24 — the FOSSEE ch13 transcription, whose Ex 13.5 is the
    WGS example at 1100 K, plus solution-manual and course-note searches); the Gibbs
    oracle anchors to the JANAF-printed WGS case (V1-WGS-GIBBS) until a copy of the
    7th-edition example page is available.

- id: cstr
  name: Continuous stirred-tank reactor
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: reactor effluent (well-mixed)
  levels:
    R1:
      status: provisional
      adapter: ngdesign.units.reactors.cstr:CstrR1
      params:
        type: object
        required: [reaction_set, volume_m3]
        properties:
          reaction_set: {description: inline ReactionSet, or a string id resolved against
            Flowsheet.reactions}
          volume_m3: {type: number, description: reacting volume, m3}
          thermal: {description: "'isothermal' | 'adiabatic' | {duty_W: W} | {T_out: K};
            default isothermal"}
          reacting_phase: {type: string, enum: [vapor, liquid], description: single
            phase required at R1; default vapor}
          bulk_density_kg_m3: {type: number, description: catalyst bulk density, kg/m3}
          T_guess_K: {type: number, description: Newton start temperature, K; selects
            the steady-state branch}
      note: kinetics (Arrhenius, LHHW, power-law), single phase
    R2:
      status: provisional
      adapter: ngdesign.units.reactors.cstr:CstrR2
      params:
        type: object
        required: [reaction_set, volume_m3]
        properties:
          reaction_set: {description: inline ReactionSet, or a string id resolved against
            Flowsheet.reactions}
          volume_m3: {type: number, description: reacting volume, m3}
          thermal: {description: "'isothermal' | 'adiabatic' | {duty_W: W} | {T_out: K};
            default isothermal"}
          reacting_phase: {type: string, enum: [vapor, hc_liquid, aqueous], description: phase
            the reactions occur in; default hc_liquid}
          bulk_density_kg_m3: {type: number, description: catalyst bulk density, kg/m3}
          T_guess_K: {type: number, description: Newton start temperature, K; selects
            the steady-state branch}
          holdup_m3: {type: number, description: 'explicit reacting-phase volume, m3,
            in (0, volume_m3]; default the phase-ratio holdup from the vessel flash'}
      note: multi-phase with VLE in the vessel; phase-resolved rate on the reacting
        phase holdup (Fogler ch. 8), holdup_m3 override, reduces to R1 single-phase
      end_state: true
  balance: mass_elements
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 5
  notes: >-
    R1 implemented (U-R2): algebraic extents at outlet conditions, damped Newton,
    single phase in the vessel. V1 gap (2026-10-25; CORRECTION same day: an
    earlier version of this note wrongly blamed missing components — ethylene
    oxide, ethylene glycol, propylene oxide and propylene glycol all resolve in
    ngdesign.data.component_record with formation data, dHf298 = -52680,
    -389420, -95351.4 and -429800 J/mol, verified this session). The true
    blockers for the spec's Fogler candidates: (a) the printed isothermal
    ethylene-glycol CSTR (4th ed. Sec. 4.2, Example 4-2, pp. 142-145:
    k = 0.311 min-1, stream A 7.67
    ft3/min at CA0 = 1 lbmol/ft3, stream B water 7.67 ft3/min, total 15.34
    ft3/min, X = 0.8, V = 197.3 ft3 = 1480 gal = 5.6 m3) works volumetrically
    on a constant-density liquid lbmol/ft3 basis: the water molar flow (hence
    the inlet mole fractions) is not printed, no pressure is printed, and the
    printed concentrations are not reachable from the unit's flash-derived
    c = x·c_tot liquid basis. A probe through CstrR1 at 313 K (feed built with
    an assumed water density, the one free choice) two-phases the aqueous-EO
    feed below 10 bar with pr (vapour + liquid, refused at R1) and at
    all-liquid pressures of 10, 30 and 100 bar liquid-liquid-splits it (two
    liquid phases; the R1 vapour-fraction check passes such a feed) and the
    Newton solve does not close the printed V on any of them. (b) The adiabatic
    propylene-glycol CSTR (non-isothermal chapter) was not re-attempted on this
    basis. (c) The Ch. 4/5 summary-notes CSTR example (umich.edu/~elements
    companion site: v0 = 25 dm3/s, CA0 = 0.2 mol/dm3, k = 10 dm3/(mol s),
    X = 0.9, V = 1125 dm3) is a pure-A liquid at 0.2 mol/dm3, a feed
    concentration no registry component reproduces. The level ships provisional
    on its closed-form tests (R1-A, R1-B, identities, refusals).

- id: pfr
  name: Plug-flow reactor
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: reactor effluent
  levels:
    R1:
      status: provisional
      adapter: ngdesign.units.reactors.pfr:PfrR1
      params:
        type: object
        properties:
          reaction_set:
            description: inline ReactionSet, or a string id resolved against Flowsheet.reactions
          volume_m3:
            type: number
            description: reactor volume, m3 (> 0)
          thermal:
            description: "'isothermal' | 'adiabatic' | {duty_W: W} (default isothermal; {T_out: K}
              is a conversion-reactor mode, refused for a kinetic PFR)"
          reacting_phase:
            description: "'vapor' | 'liquid' (default vapor); the PFR is single-phase and a
              two-phase state anywhere along the profile is refused"
          bulk_density_kg_m3:
            type: number
            description: catalyst bulk density, kg/m3 — required when a rate is per kg_cat
      note: >-
        kinetic extents integrated over V (BDF, depletion and pressure-floor events); the
        RHS never flashes — single-phase properties come from phase_props and the audit flashes
        once per output point, so the flash count is O(n_output) and independent of V (P0-06);
        the outlet closes exactly on the formation-enthalpy basis and info carries extents,
        T_profile_out_K, T_closure_gap_K, T_max_K, V_at_T_max_m3. The energy ODE uses the
        closure-consistent dH (PR #311 review, blocking items 1 and B: heat_of_reaction at
        298.15 K plus stoichiometric partial molar enthalpies of the actual mixture, from a
        finite difference of the mixture enthalpy flow); the residual T_closure_gap_K measures
        6.6e-7 K on ideal-raoult for the nC4 isomerisation case, within the spec's 1e-3 K
        consistency bound
    R2:
      status: planned
      params: {}
      note: integrated along length with heat transfer and pressure drop (Ergun) on the shared
        integrator (ngdesign.units.reactors.plug_flow)
    R3:
      status: planned
      params: {}
      note: catalyst deactivation, pellet effectiveness
      end_state: true
  balance: mass_elements
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 6
  notes: >-
    R1 implemented (U-R2); single phase, no pressure drop. V1 gap — no transcribable
    printed validation case: searches 'Fogler Elements of Chemical Reaction Engineering PFR
    example first order irreversible gas phase numerical conversion worked example printed
    values' and 'Example 4- Fogler PFR gas phase 500 K volume final conversion table printed'
    found only umich web self-test pages and a 4th-ed chapter PDF snippet, none with a full
    feed/kinetics/outlet state reproducible without reconstruction

