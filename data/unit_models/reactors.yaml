- id: batch_reactor
  name: Batch / semi-batch reactor
  family: reactors
  ports:
    inlet:
    - name: charge_in
      required: true
      description: initial charge
    outlet:
    - name: outlet
      required: true
      description: vessel contents at the end of the batch
  levels:
    R3:
      status: planned
      params: {}
      note: dynamic — a separate axis and plan (steady-state catalogue excludes it)
      end_state: true
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 7
  notes: roadmap; out of the steady-state scope (plan §0 decision 4).

- id: fixed_bed_tubular
