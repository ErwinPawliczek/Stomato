# U-F — Reactors (plan §2 U-F, 9 rows). All rows are roadmap: reaction chemistry
# lives in the property package and the reaction-set contract (U-R), and the
# reactor units land with the S3 slice (plan §2b).

- id: conversion_reactor
  name: Conversion reactor
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: effluent at specified conversion
  levels:
    R0:
      status: planned
      params: {}
      note: fractional conversion per reaction, heat of reaction, adiabatic/isothermal/duty
      end_state: true
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 1
  notes: roadmap.

