- id: electrolyser_stack
  name: Electrolyser / fuel cell stack
  family: reactors
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed (no H2 or O2 present)
    outlet:
    - name: h2_out
      required: true
      description: pure hydrogen product
    - name: o2_out
      required: true
      description: coproduct oxygen plus everything else fed
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.reactors.electrolyser:ElectrolyserStack
      params:
        type: object
        properties:
          current_A: {type: number, description: stack current, A}
          n_cells: {type: number, description: cells in series}
          cell_voltage_V: {type: number, description: cell voltage, V}
          faradaic_efficiency: {type: number, description: "charge efficiency in (0, 1]; default 1"}
      validation:
      - V1-ELECTROLYSER
      note: Faraday's law n(H2) = η·I·N/(2F); power = V·I·N is electrical work
    R1:
      status: provisional
      adapter: ngdesign.units.reactors.electrolyser_r1:ElectrolyserStackR1
      params:
        type: object
        properties:
          current_A: {type: number, description: stack current, A}
          n_cells: {type: number, description: cells in series}
          area_m2: {type: number, description: electrode area per cell, m2}
          polarisation:
            description: "Ulleberg (2003, Int. J. Hydrogen Energy 28:21-33) eq. 4 coefficients {r1: Ohm m2, r2: Ohm m2/degC, s: V, t1: m2/A, t2: m2 degC/A, t3: m2 degC2/A}; i in A/m2, T in degC, log10. The named preset 'ulleberg2003' is refused until Table 1 is transcribed with page and equation numbers"
          faradaic:
            description: "optional {f1: A2/m4, f2}: Ulleberg eq. 9 form eta_F = f2*i^2/(f1 + i^2); default 1"
          pressure_correction:
            type: boolean
            description: "true adds the Nernst term (R*T/2F)*ln[(P/P0)^1.5] with P0 = 1e5 Pa; default false"
          T_K: {type: number, description: operating temperature, K — must equal the inlet T (no silent re-heating)}
      note: Ulleberg (2003) eq. 4 cell voltage on the reversible voltage from ln_keq
        on H2O(g) -> H2 + 1/2 O2, the liquid-water p_sat correction (Poynting neglected)
        and the optional Nernst term, with the eq. 9 form Faradaic efficiency; delegation
        to R0 by composition. V1 gap, recorded with PR 305 — Ulleberg 2003 prints the
        polarisation curves mostly as figures and no printed (current, voltage,
        temperature) point with the stack area was found in the searched sources
        (Ulleberg 2003 Tables 1-2 and text; Ursua, Gandia & Sanchis, Proc. IEEE 100
        (2012) 410-426; the LeRoy/Bowen/LeRoy 1980 alkaline data), so the polarisation
        closed form is covered by unit tests on hand-chosen test coefficients. The
        ulleberg2003 preset is added only when Table 1 is transcribed with page and
        equation numbers.
      end_state: true
  balance: mass_elements
  pid_symbol: FC
  references:
  - docs/unit-catalogue-plan.md §2 U-F 9
  notes: R0 implemented (U-F). Thermoneutral voltage is computed from the actual
    stream balance, (H_out − H_in)/(2F·n_H2) — on the 298.15 K liquid-water feed it
    measures 1.4895 V, +0.58 % against the printed 1.481 V (Züttel, Borgschulte &
    Schlapbach 2008, p. 5) — the databank miss is recorded, not tuned away, in the
    V1-ELECTROLYSER assessed note.
