  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: reactor effluent (well-mixed)
  levels:
    R1:
      status: planned
      params: {}
      note: kinetics (Arrhenius, LHHW, power-law), single phase
    R2:
      status: planned
      params: {}
      note: multi-phase with VLE in the vessel
      end_state: true
  pid_symbol: R
  references:
  - docs/unit-catalogue-plan.md §2 U-F 5
  notes: roadmap.

