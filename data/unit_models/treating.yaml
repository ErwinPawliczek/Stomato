# U-G — Gas treating and specialty (plan §2 U-G, 9 rows).
#
# Palette lines 6-9 are NOT rows here: molecular-sieve dehydration maps to
# separation's adsorption_bed row (U-D 9), LNG and NGL trains are flowsheet
# templates, and sour-water stripping is a reboiled-stripper configuration on an
# electrolyte package (T-09). Lines 1-2 expand into one row per registered
# solvent (MDEA/MEA/DEA) — the absorbers share the Kent-Eisenberg adapter in
# ngdesign.units.mdea_absorber, the regenerators the one in mdea_regenerator.

- id: mdea_absorber
  name: MDEA absorber
  family: treating
  ports:
    inlet:
    - name: gas_in
      required: true
      description: sour gas
    - name: lean_amine_in
      required: true
      description: lean amine
    outlet:
    - name: gas_out
      required: true
      description: treated (sweet) gas
    - name: rich_amine_out
      required: true
      description: rich amine
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.mdea_absorber:MdeaAbsorber
      params:
        type: object
        properties:
          amine: {type: string, description: 'solvent amine (a key of mdea_equilibrium.AMINES); the row default is MDEA'}
          co2_out_molpct: {type: number, description: treated-gas CO2 spec, mol%}
          h2s_out_ppmv: {type: number, description: treated-gas H2S spec, ppmv}
      note: single-stage shortcut with Kent-Eisenberg equilibrium
    R2:
      status: planned
      params: {}
      note: re-measured on the P1-13 tree (zero-tear column on amine_ke, example feeds) - 5 stages
        fails (NS stalls at M=2.3e-3 against the reactive 1e-3 gate, 53 s), 8 stages fails (M=9.2e-3,
        118 s); the 20-stage column converges (tests/units/test_column_amine.py) but its solve takes
        150-190 s under parallel load, over the locked per-test limit, so no adapter ships
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-G 1
  notes: amine chemistry lives in the property package, not the stage (plan note).

