- id: teg_contactor
  name: TEG contactor
  family: treating
  ports:
    inlet:
    - name: gas_in
      required: true
      description: wet gas
    - name: lean_teg_in
      required: true
      description: lean glycol (TEG)
    outlet:
    - name: gas_out
      required: true
      description: dehydrated gas
    - name: rich_teg_out
      required: true
      description: rich glycol
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.teg_contactor:TEGContactor
      params:
        type: object
        properties:
          water_out_lb_per_mmscf: {type: number, description: outlet water content spec, lb/MMscf}
      note: activity-based water spec (GPSA/Parrish water-activity model)
    R2:
      status: provisional
      adapter: ngdesign.units.treating.teg_contactor_r2:TEGContactorR2
      params:
        type: object
        required: [n_stages]
        additionalProperties: false
        properties:
          n_stages: {type: integer, minimum: 1, description: equilibrium stages (isothermal at the gas inlet T and P)}
      note: stage-wise isothermal water absorption on the Parrish-Won-Baltatu activity line (rating at N stages)
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-G 3
  notes: molecular-sieve dehydration (plan U-G 6) maps to separation's adsorption_bed row.
    R2 V1 gap — the GPSA Eng. Data Book Sect. 20 glycol-contactor example works on
    McCabe-Thiele/Kremser charts; no accessible page shows the printed inputs and a
    printed outlet water together, so no V1 case (searched GPSA Sect. 20 worked
    examples and open TEG-dehydration literature); chart reads are never presented
    as printed numbers, so the level ships provisional.

- id: teg_regen
  name: TEG regenerator + stripping gas
  family: treating
  ports:
    inlet:
    - name: rich_in
      required: true
      description: rich glycol
    - name: stripping_gas_in
      required: false
      description: stripping gas
    outlet:
    - name: water_out
      required: true
      description: stripped water
    - name: lean_out
      required: true
      description: regenerated glycol
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.treating.teg_regen:TEGRegen
      params:
        type: object
        properties:
          T_reboiler: {type: number, description: reboiler temperature, K}
          P: {type: number, description: regenerator pressure, Pa abs}
      validation: [V1201-teg-regen-gpsa]
      note: shortcut water split; lean purity on the TEG-water boiling line (teg_activity owner),
        stripping gas refused at R0 (uncited); info["activity_extrapolated"] flags reboilers
        outside the Parrish-Won-Baltatu 300-380 K fit range; V1 miss assessed — measured 99.27
        wt% vs the GPSA 98.8 wt% read (activity correlation extrapolated past its fitted range),
        so the level stays provisional until the purity model is defensible at reboiler conditions
    R2:
      status: provisional
      adapter: ngdesign.units.treating.teg_regen_r2:TEGRegenR2
      params:
        type: object
        additionalProperties: false
        properties:
          T_reboiler: {type: number, description: "reboiler temperature (K), default 477.15"}
          P: {type: number, description: "regenerator pressure (Pa abs), default 101325"}
          n_stages: {type: integer, minimum: 0, description: "stripping-gas (Stahl) equilibrium stages below the reboiler; 0 = R0 boiling-line purity, default 2"}
      note: boiling-line reboiler + N-stage stripping-gas section on the Parrish activity line (extrapolated above 380 K; flagged)
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-G 4
  notes: >-
    R2 V1 gap — the stripping-gas enhancement is not citable in open numeric
    form: searched the GPSA EDB Sect. 20 worked regeneration example and
    Moshfeghian (Campbell Tip of the Month, May 2013), which prints simulation
    results only, not a correlation; the R0 GPSA case V1201 carries the assessed
    boiling-line miss and stays the row's V1 anchor.

- id: sulfur_recovery
  name: Claus sulfur recovery
  family: treating
  ports:
    inlet:
    - name: acid_gas_in
      required: true
      description: acid gas feed
    outlet:
    - name: tail_gas_out
      required: true
      description: tail gas
    - name: sulfur_out
      required: true
      description: liquid sulfur
  balance: mass_elements
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.treating.sulfur_recovery:SulfurRecovery
      params:
        type: object
        properties:
          T_thermal: {type: number, description: thermal-stage (reaction-furnace) temperature, K}
          P: {type: number, description: process pressure, Pa abs}
          T_condenser: {type: number, description: sulfur condenser temperature, K}
          thermal_conversion: {type: number, description: fraction of the post-burn H2S consumed
              by the Claus reaction in the thermal stage}
          catalytic_stages: {type: array, description: one entry per catalytic stage, each
              with T (K) and exactly one of conversion (fraction) or approach_K (K)}
          reaction_set: {type: object, description: flowsheet-owned reaction set (H2S burn
              + Claus reaction, U-01b pattern (a))}
      validation: [V1202-sulfur-recovery-gpsa]
      note: condenses S8 only (databank species with usable formula + formation data — recorded
        choice); hydrocarbons pass through unburned at R0; V1 case on GPSA EDB Sect. 22 Ex. 22-1
        printed stage results — the example's printed overall recovery is not accessible in any
        copy reachable (official GPSA workbook companion ends at the first converter), so it is
        a documented V1 gap and the level stays provisional
    R2:
      status: provisional
      adapter: ngdesign.units.treating.sulfur_recovery_r2:SulfurRecoveryR2
      params:
        type: object
        required: [T_thermal, P, T_condenser, thermal_conversion, catalytic_stages, reaction_set]
        properties:
          T_thermal: {type: number, description: 'reaction-furnace temperature (K); R0 thermal rule'}
          P: {type: number, description: 'process pressure (Pa abs)'}
          T_condenser: {type: number, description: 'sulfur condenser temperature (K); complete S6+S8 condensation'}
          thermal_conversion: {type: number, minimum: 0, maximum: 1, description: 'Claus conversion of the post-burn SO2 in the furnace (R0 rule)'}
          catalytic_stages: {type: array, description: 'one {T, approach_K?} per converter; Gibbs equilibrium at T + approach_K, isothermal'}
          extra_species: {type: array, description: 'any of COS, CS2, CO, H2, added to every converter Gibbs set'}
          reaction_set: {type: object, description: 'flowsheet-owned set for the thermal stage (H2S burn + Claus), as at R0'}
      note: Gibbs equilibrium per catalytic converter (isothermal; S6/S8, optionally COS/CS2); furnace
        = R0 rule (S2 data missing); complete sulfur condensation (package S8 Psat unusable)
      end_state: true
  pid_symbol: SRU
  references:
  - docs/unit-catalogue-plan.md §2 U-G 5
  notes: R2 ships provisional on an independent extent-space ln K solve and the reduction to R0;
    no V1 converter case was searched for. Sour-water stripping is NOT a row here — it is a
    reboiled-stripper configuration on the electrolyte package (T-09, plan U-G 9).
