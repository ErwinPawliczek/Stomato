- id: mdea_regenerator
  name: MDEA regenerator
  family: treating
  ports:
    inlet:
    - name: rich_amine_in
      required: true
      description: rich amine
    outlet:
    - name: lean_amine_out
      required: true
      description: lean amine bottoms
    - name: acid_gas_out
      required: true
      description: acid gas overhead
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.mdea_regenerator:MdeaRegenerator
      params:
        type: object
        properties:
          amine: {type: string, description: 'solvent amine; the row default is MDEA'}
          lean_co2_loading: {type: number, description: lean solvent CO2 loading target, mol CO2 / mol amine}
          lean_h2s_loading: {type: number, description: lean solvent H2S loading target, mol H2S / mol amine}
          regenerator_P: {type: number, description: regenerator pressure, Pa}
          reboiler_T: {type: number, description: reboiler temperature, K}
      note: shortcut stripping to lean-loading specifications
    R2:
      status: provisional
      adapter: ngdesign.units.amine_regenerator_r2:MdeaRegeneratorR2
      validation: []
      params:
        type: object
        additionalProperties: false
        required:
        - boilup_rate
        properties:
          n_stages: {type: integer, minimum: 2, description: 'equilibrium stages, rich feed on 1, kettle on N (default 6)'}
          boilup_rate: {type: number, description: 'kettle vapour, mol/s'}
          regenerator_P: {type: number, description: 'column pressure, Pa abs (default 1.9e5)'}
          feed_T: {type: number, description: 'rich solvent temperature after the lean/rich exchanger, K (default 370)'}
      note: reboiled MESH stripper on the reactive amine package (amine_ke when the flowsheet
        package is not reactive), no overhead condenser - acid_gas_out is the wet top vapour.
        Measured (6 stages, 1.9 bar, 370 K feed) components close to 1e-11 at boilup 15/20/30 mol/s
        in 2-6 s; stage audit (reported-profile material balances, package re-flash of each
        stage) at most 1.7e-4. A rich feed left at 303 K does not converge (170 s, M=0.53)
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-G 2
  notes: pairs with the absorber rows in the S2 amine loop (plan §2b).

