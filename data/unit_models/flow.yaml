      note: single-phase Darcy (Colebrook) with elevation; the darcy_colebrook correlation plugin exists
    R2:
      status: planned
      params: {}
      note: two-phase Beggs-Brill / fluids multiphase, profile along the length
      end_state: true
  pid_symbol: PIPE
  references:
  - docs/unit-catalogue-plan.md §2 U-B 8
  notes: R0 fixed dP with optional hydrostatic head; Darcy friction and two-phase flowsheeting remain roadmap.

- id: orifice
  name: Orifice / flow element
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: element inlet
    outlet:
    - name: outlet
      required: true
      description: element outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.orifice:Orifice
      params: {}
      note: ΔP from a discharge coefficient
    R1:
      status: provisional
      adapter: ngdesign.units.flow.orifice_r1:OrificeR1
      params:
        type: object
        required: [D_m]
        properties:
          D_m: {type: number, description: 'pipe internal diameter, m (ISO 5167-2: 0.05 to 1.0)'}
