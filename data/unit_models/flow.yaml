# U-B — Pressure change and flow (plan §2 U-B, 12 rows).
#
# The compression train is its own row (plan marks compressor's R2
# "multi-section with intercooling" as "train ✅"); the hydraulic turbine is
# covered by the expander row, not a separate row.

- id: pump
  name: Pump
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: liquid feed
    outlet:
    - name: outlet
      required: true
      description: pressurised liquid (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.pump:Pump
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta: {type: number, description: 'pump efficiency in (0, 1], default 0.65'}
      note: ΔP/outlet P with efficiency; PS flash on the outlet
    R1:
      status: planned
      params: {}
      note: curve (head/efficiency vs flow) and NPSHa check
      end_state: true
  sizer: pump
  pid_symbol: P
  references:
  - docs/unit-catalogue-plan.md §2 U-B 1
  notes: shaft power currently inlined in the unit; the pump_power correlation plugin exists.

- id: compressor
  name: Centrifugal compressor
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: compressed gas (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.compressor:Compressor
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta_isentropic: {type: number, description: 'isentropic efficiency in (0, 1], default 0.75'}
      note: isentropic/polytropic efficiency; PS flash on the outlet
    R1:
      status: provisional
      adapter: ngdesign.units.flow.compressor_r1:CompressorR1
      params:
        type: object
        required: [map]
        properties:
          map:
            type: object
            required: [flow_m3_s, head_J_kg, efficiency]
            properties:
              flow_m3_s: {type: array, items: {type: number}, description: 'actual inlet flow points at map speed, m3/s, strictly increasing'}
              head_J_kg: {type: array, items: {type: number}, description: 'head at each point, J/kg (basis per efficiency_basis)'}
              efficiency: {type: array, items: {type: number}, description: 'efficiency at each point, (0, 1]'}
          efficiency_basis: {type: string, enum: [polytropic, isentropic], description: 'default polytropic'}
          speed_ratio: {type: number, description: 'N / N_map (fan laws), default 1.0'}
          surge_flow_m3_s: {type: number, description: 'surge flow at map speed, m3/s, default first map point'}
          stonewall_flow_m3_s: {type: number, description: 'stonewall flow at map speed, m3/s, default last map point'}
          max_pressure_ratio: {type: number, description: 'upper bracket for the discharge pressure solve, default 10'}
      note: performance map (head/efficiency vs flow, fan laws, surge/stonewall), Schultz polytropic
      validation: []
      end_state: true
  sizer: compressor
  pid_symbol: C
  references:
  - docs/unit-catalogue-plan.md §2 U-B 2
  notes: multi-section compression with intercooling is its own flow row (compression_train), not a level of this row. V1 gap recorded in specs/backend/units/compressor.md — no printed Schultz polytropic example with reproducible inputs/results has been verified (ASME PTC 10-1997 appendix, Schultz 1962, Ludwig vol. 3 ch. 15, Perry's 9th ed. §10 all unexamined); R1 is anchored by closed-form tests against an independent bisection script instead.

- id: reciprocating_compressor
  name: Reciprocating compressor
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: compressed gas
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.reciprocating_compressor:ReciprocatingCompressor
      params: {}
      note: clearance-volume model, stages
    R1:
      status: provisional
      adapter: ngdesign.units.flow.reciprocating_compressor_r1:ReciprocatingCompressorR1
      params:
        type: object
        required: [P_out, cylinders, speed_rpm]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          n_stages: {type: integer, description: 'stages, default 1'}
          eta_isentropic: {type: number, description: 'stage isentropic efficiency, default 0.75'}
          T_intercool: {type: number, description: 'intercooler outlet temperature, K (optional)'}
          loss_allowance: {type: number, description: 'valve-loss allowance L in E_v, default 0'}
          cylinders:
            type: array
            description: 'one entry per stage'
            items:
              type: object
              required: [bore_m, stroke_m, rod_diameter_m]
              properties:
                n_cylinders: {type: integer, description: 'parallel cylinders, default 1'}
                bore_m: {type: number, description: 'bore, m'}
                stroke_m: {type: number, description: 'stroke, m'}
                rod_diameter_m: {type: number, description: 'rod diameter, m'}
                action: {type: string, enum: [double, single_head_end], description: 'default double'}
                clearance: {type: number, description: 'clearance fraction, default 0.10'}
          speed_rpm: {type: number, description: 'crank speed, rpm'}
          z_ratio_correction: {type: boolean, description: 'Zs/Zd in volumetric efficiency, default true'}
          capacity_control: {type: string, enum: [none, clearance_pocket], description: 'default none'}
          P_crankcase_Pa: {type: number, description: 'crankcase pressure, Pa, default 101325'}
          rod_load_limit_N:
            type: object
            properties:
              compression: {type: number, description: 'allowable gas rod load in compression, N'}
              tension: {type: number, description: 'allowable gas rod load in tension, N'}
      note: per-stage cylinder capacity vs clearance (GPSA VE with Zs/Zd), clearance pocket, gas rod load
      validation: []
      end_state: true
  pid_symbol: RC
  references:
  - docs/unit-catalogue-plan.md §2 U-B 3
  notes: >-
    R0 isentropic stages with intercooling and a clearance-volume
    volumetric-efficiency report. R1 adds per-stage cylinder capacity vs
    clearance (GPSA 13th ed. §13 VE with Zs/Zd), the closed-form clearance
    pocket and API 618 §6.6 gas rod loads. V1 gap: GPSA 13th ed. §13 worked
    examples, Bloch & Hoefner (1996) ch. 2–3, Ludwig Applied Process Design
    vol. 3 4th ed. ch. 15 and Perry's 9th ed. §10 are citation only. Searched
    2026-10-25: the only accessible Section 13 reproduction (GPA Midstream
    public "Data Book Calculations", 14th ed. rev. 0 2017, Examples
    13-1..13-5) prints BHP, discharge temperature, bottle volumes and
    chart-read power — no VE or rod-load case with printed geometry — so no
    V1 case is filed (U-R2: never invent a number).

- id: compression_train
  name: Compression train
  family: flow
  ports:
    inlet:
    - name: gas_in
      required: true
      description: gas feed to the first section
    outlet:
    - name: gas_out
      required: true
      description: discharge of the last section after intercooling
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.compression_train:CompressionTrain
      params:
        type: object
        required: [P_discharge]
        properties:
          P_discharge: {type: number, description: 'final discharge pressure, Pa'}
          eta_isentropic: {type: number, description: 'per-section isentropic efficiency, default 0.75'}
          T_interstage_out: {type: number, description: 'interstage outlet temperature after cooling, K'}
      note: multi-section compression with intercooling to a fixed interstage temperature
      end_state: true
  pid_symbol: CT
  references:
  - 'docs/unit-catalogue-plan.md §2 U-B 2 (today: train ✅)'
  notes: its own flow row per the plan-to-registry mapping — the plan's compressor R2
    (multi-section with intercooling) lives here, not on the compressor row.

- id: expander
  name: Expander / turbine
  family: flow
  ports:
    inlet:
    - name: gas_in
      required: true
      description: gas feed
    outlet:
    - name: gas_out
      required: true
      description: expanded gas (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.expander:Expander
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta_isentropic: {type: number, description: 'isentropic efficiency in (0, 1], default 0.8'}
      note: isentropic expansion with power recovery
    R1:
      status: provisional
      adapter: ngdesign.units.flow.expander_r1:ExpanderR1
      params:
        type: object
        required: [P_out, rotor_diameter_m, speed_rpm, map]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          rotor_diameter_m: {type: number, description: 'rotor tip diameter, m'}
          speed_rpm: {type: number, description: 'shaft speed, rpm'}
          map:
            type: object
            required: [velocity_ratio, efficiency]
            properties:
              velocity_ratio: {type: array, items: {type: number}, description: 'strictly increasing u/c0 points'}
              efficiency: {type: array, items: {type: number}, description: 'isentropic efficiency in (0, 1] at each velocity_ratio'}
          flow_min_m3_s: {type: number, description: 'flow-capacity lower limit, m3/s (optional)'}
          flow_max_m3_s: {type: number, description: 'flow-capacity upper limit, m3/s (optional)'}
      note: performance map (eta vs u/c0, PCHIP, no extrapolation) driving the R0 expansion
      validation: []
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-B 4
  notes: the hydraulic turbine / pressure-recovery line (plan U-B 12) is covered by this
    row — isentropic expansion recovering shaft power — not a separate row. R1 V1 gap
    (PR 297) — no accessible source prints a full u/c0 performance map together with the
    inlet state and the resulting outlet; searched Whitfield & Baines, Design of Radial
    Turbomachines (1990) ch. 7 (eta-vs-U/C0 is figure/curve data), Balje, Turbomachines
    (1981) ch. 3, Perry's 9th ed. sect. 10 (expander sizing curves, no worked example
    with a printed outlet state), GPSA Data Book sect. 13 (public GPA example
    spreadsheets cover Example 13-1 compressor work, not a turboexpander with printed
    map and states), and Campbell, Gas Conditioning and Processing vol. 2 (expander
    chapter). The level ships provisional, covered by the closed-form, identity and
    refusal tests.

- id: jt_valve
  name: JT valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: isenthalpic (flash_ph) outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.jt_valve:JTValve
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
      note: isenthalpic flash to the outlet pressure
      end_state: true
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-B 5
  notes: the palette defines no higher level for the JT valve (plan §2 U-B 5).

- id: control_valve
  name: Control valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: throttled outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.control_valve:ControlValve
      params: {}
      note: Cv / outlet P spec, isenthalpic (the cv_liquid correlation plugin exists)
    R1:
      status: planned
      params: {}
      note: IEC 60534 sizing, choked flow, Cv curve
      end_state: true
  pid_symbol: CV
