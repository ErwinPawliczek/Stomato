  pid_symbol: FAN
  references:
  - docs/unit-catalogue-plan.md §2 U-B 11
  notes: R0 fixed dP rise with efficiency; R1 performance curve (PCHIP, no extrapolation) with fan laws (AMCA 201; ASHRAE Fans chapter) and density correction, delegating to R0. V1 gap (fan R1) - no open printed fan-law worked example qualified for the harness — searched AMCA 201 (its fan-selection example needs manufacturer data, not printed results), the openly accessible ASHRAE Handbook—Fundamentals ch. 21 speed-change example (its only printed input is a single curve point, so a case would need a synthesized curve and would restate the fan law — the circularity that withdrew the ejector case), ASHRAE HVAC Systems & Equipment Fans chapter (paywalled) and Perry's 9th ed. sect. 10 (no printed worked example found). Covered by closed-form tests instead.
