  pid_symbol: FE
  references:
  - docs/unit-catalogue-plan.md §2 U-B 9
  notes: R0 fixed-Cd dP read; R1 ISO 5167-2 RHG C, expansibility and permanent loss
    (rating and sizing). V1 gap - ISO 5167 has no normative worked example; the spec's
    candidates (API MPMS Ch. 14.3 Part 4 / AGA Report No. 3 Part 4 1992 and 2019, Miller
    3rd ed., Reader-Harris 2015) were searched 2026-10-25 - only front-matter sample PDFs
    openly accessible (the AGA Part 4 sample carries no example numbers), the books paywalled,
    so no printed inputs-plus-results case could be transcribed.

- id: ejector
  name: Ejector
  family: flow
  ports:
    inlet:
    - name: motive_in
      required: true
      description: motive stream
    - name: suction_in
      required: true
      description: suction stream
    outlet:
    - name: outlet
      required: true
      description: combined discharge
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.ejector:Ejector
      params: {}
      note: entrainment ratio spec
    R1:
      status: provisional
      adapter: ngdesign.units.flow.ejector_r1:EjectorR1
      params:
        type: object
        properties:
          eta_nozzle: {type: number, description: 'motive nozzle isentropic efficiency, default 0.95'}
          phi_mix: {type: number, description: 'mixing momentum coefficient, default 0.85'}
          eta_diffuser: {type: number, description: 'diffuser isentropic efficiency, default 0.85'}
          P_out_required: {type: number, description: 'optional required discharge pressure, Pa'}
      validation: []
      note: 'Keenan constant-pressure mixing with Huang efficiencies: achievable discharge pressure'
      end_state: true
  pid_symbol: EJ
  references:
  - docs/unit-catalogue-plan.md §2 U-B 10
  notes: >-
    R0 momentum balance at a specified entrainment ratio.
    V1 gap (PR #217): the previous Graham 3:1 case was circular (both expectations restated the inputs) and is withdrawn; no open published ejector example with a printed outlet state was found (searched Graham Manufacturing ejector performance literature and Perry sect. 10 — operating points are entrainment ratios and curves, not outlet states).
    R0 mixing remains covered by closed-form unit tests.
    1-D momentum design mode remains roadmap.
    R1 V1 gap: no open-source source prints inputs and results for a full steam-ejector rating that the thermo can reproduce exactly.
    Candidates assessed: Huang et al. 1999 Table 2/3 (R141b test data; R141b is not in the component set), Power, Steam Jet Ejectors for the Process Industries (McGraw-Hill, 1994) worked examples, and Perry's 9th ed. sect. 10 examples — none reproducible exactly.
    R1 rests on the ideal-gas closed-form tests, the R0-reduction identity and the refusal tests.

