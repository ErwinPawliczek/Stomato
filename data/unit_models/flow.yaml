# U-B — Pressure change and flow (plan §2 U-B, 12 rows).
#
# The compression train is its own row (plan marks compressor's R2
# "multi-section with intercooling" as "train ✅"); the hydraulic turbine is
# covered by the expander row, not a separate row.

- id: pump
  name: Pump
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: liquid feed
    outlet:
    - name: outlet
      required: true
      description: pressurised liquid (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.pump:Pump
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta: {type: number, description: 'pump efficiency in (0, 1], default 0.65'}
      note: ΔP/outlet P with efficiency; PS flash on the outlet
    R1:
      status: planned
      params: {}
      note: curve (head/efficiency vs flow) and NPSHa check
      end_state: true
  sizer: pump
  pid_symbol: P
  references:
  - docs/unit-catalogue-plan.md §2 U-B 1
  notes: shaft power currently inlined in the unit; the pump_power correlation plugin exists.

- id: compressor
  name: Centrifugal compressor
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: compressed gas (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.compressor:Compressor
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta_isentropic: {type: number, description: 'isentropic efficiency in (0, 1], default 0.75'}
      note: isentropic/polytropic efficiency; PS flash on the outlet
    R1:
      status: planned
      params: {}
      note: performance map (head/efficiency vs flow, surge/stonewall), Schultz polytropic
      end_state: true
  sizer: compressor
  pid_symbol: C
  references:
  - docs/unit-catalogue-plan.md §2 U-B 2
  notes: multi-section compression with intercooling is its own flow row (compression_train), not a level of this row.

- id: reciprocating_compressor
  name: Reciprocating compressor
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: compressed gas
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.reciprocating_compressor:ReciprocatingCompressor
      params: {}
      note: clearance-volume model, stages
    R1:
      status: planned
      params: {}
      note: rod load, capacity vs clearance
      end_state: true
  pid_symbol: RC
  references:
  - docs/unit-catalogue-plan.md §2 U-B 3
  notes: R0 isentropic stages with intercooling and a clearance-volume volumetric-efficiency report; rod load and capacity-vs-clearance remain roadmap.

- id: compression_train
  name: Compression train
  family: flow
  ports:
    inlet:
    - name: gas_in
      required: true
      description: gas feed to the first section
    outlet:
    - name: gas_out
      required: true
      description: discharge of the last section after intercooling
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.compression_train:CompressionTrain
      params:
        type: object
        required: [P_discharge]
        properties:
          P_discharge: {type: number, description: 'final discharge pressure, Pa'}
          eta_isentropic: {type: number, description: 'per-section isentropic efficiency, default 0.75'}
          T_interstage_out: {type: number, description: 'interstage outlet temperature after cooling, K'}
      note: multi-section compression with intercooling to a fixed interstage temperature
      end_state: true
  pid_symbol: CT
  references:
  - 'docs/unit-catalogue-plan.md §2 U-B 2 (today: train ✅)'
  notes: its own flow row per the plan-to-registry mapping — the plan's compressor R2
    (multi-section with intercooling) lives here, not on the compressor row.

- id: expander
  name: Expander / turbine
  family: flow
  ports:
    inlet:
    - name: gas_in
      required: true
      description: gas feed
    outlet:
    - name: gas_out
      required: true
      description: expanded gas (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.expander:Expander
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta_isentropic: {type: number, description: 'isentropic efficiency in (0, 1], default 0.8'}
      note: isentropic expansion with power recovery
    R1:
      status: planned
      params: {}
      note: performance map
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-B 4
  notes: the hydraulic turbine / pressure-recovery line (plan U-B 12) is covered by this
    row — isentropic expansion recovering shaft power — not a separate row.

- id: jt_valve
  name: JT valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: isenthalpic (flash_ph) outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.jt_valve:JTValve
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
      note: isenthalpic flash to the outlet pressure
      end_state: true
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-B 5
  notes: the palette defines no higher level for the JT valve (plan §2 U-B 5).

- id: control_valve
  name: Control valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: throttled outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.control_valve:ControlValve
      params: {}
      note: Cv / outlet P spec, isenthalpic (the cv_liquid correlation plugin exists)
    R1:
      status: provisional
      adapter: ngdesign.units.flow.control_valve_r1:ControlValveR1
      params:
        type: object
        properties:
          P_out: {type: number, description: 'sizing mode: outlet pressure, Pa'}
          dP: {type: number, description: 'sizing mode: pressure drop, Pa'}
          Cv_rated: {type: number, description: 'rated full-travel Cv (US); required in rating mode'}
          opening: {type: number, description: 'rating mode: relative travel in (0, 1]'}
          characteristic: {type: string, enum: [linear, equal_percentage, quick_opening], description: 'inherent characteristic, default linear'}
          rangeability: {type: number, description: 'equal-percentage rangeability R > 1, default 50'}
          FL: {type: number, description: 'liquid pressure-recovery factor, default 0.9'}
          Fd: {type: number, description: 'valve style modifier, default 1.0'}
          xT: {type: number, description: 'gas pressure-differential ratio factor, default 0.7'}
          D1_m: {type: number, description: 'upstream pipe ID, m (sizing; all three or none)'}
          D2_m: {type: number, description: 'downstream pipe ID, m'}
          d_m: {type: number, description: 'valve size, m'}
          mu_liquid: {type: number, description: 'liquid viscosity, Pa.s, if the thermo reports none'}
          mu_gas: {type: number, description: 'gas viscosity, Pa.s, if the thermo reports none'}
      validation:
      - V1-control-valve-iec60534-annexD-ex1-liquid
      - V1-control-valve-iec60534-annexD-ex2-liquid-choked
      note: >-
        IEC 60534-2-1 sizing/rating, choked flow, inherent characteristic.
        V1 (liquid): expected Kv transcribed from the printed results of
        ISA-75.01.01-2007 (IEC 60534-2-1 Mod) Annex E Examples 1 and 2 —
        C = Kv = 165 and 238 m3/h, three significant figures, which the
        0.5 percent tolerance reflects. V1 gap (gas, Annex D/E Example 3,
        CO2 433 K): the printed no-fittings value 62.7 m3/h is an
        intermediate first pass with FP = 1 assumed, and the final printed
        72.1 m3/h embeds the FP/xTP fittings iteration, while the adapter
        takes MW/Z/gamma/viscosity from the thermo and cannot be pinned to
        the printed state (nu 1.743e-5 m2/s, Z 0.988); search places were
        IEC 60534-2-1:2011 Annex D, the ISA-75.01.01-2007 Annex, and the
        Emerson Control Valve Handbook 5th ed. ch. 5.
      end_state: true
  pid_symbol: CV
  references:
  - docs/unit-catalogue-plan.md §2 U-B 6
  notes: R0 isenthalpic letdown; ISA liquid Cv is reported when the inlet is liquid and a viscosity is available (PR phase property or a mu_liquid param). R1 adds IEC 60534-2-1 sizing and rating with choked flow, piping-geometry factors and inherent characteristics.

- id: relief_valve
  name: Relief valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: relieved stream at set pressure
    outlet:
    - name: outlet
      required: true
      description: discharge
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.relief_valve:ReliefValve
      params: {}
      note: set pressure, orifice from API 520 (the psv_api520_gas correlation plugin exists)
    R1:
      status: planned
      params: {}
      note: two-phase sizing (HEM/omega)
    R2:
      status: planned
      params: {}
      note: inlet/outlet loss checks
      end_state: true
  pid_symbol: PSV
  references:
  - docs/unit-catalogue-plan.md §2 U-B 7
  notes: R0 gas PSV sizing per API 520 Part I with API 526 orifice selection. V1 gap (PR #217): the sizing layer is pinned by a unit test to the API worked example's printed inputs and published area (API RP 520 Part I Example 3.6.2.2, p. 44 — W 53500 lb/h, M 65, Z 0.84, k 1.09, T 627 R, P1 97.2 psia, Kd 0.975, Kb = Kc = 1.0, C = 326 from Table 8; published area 3179 mm2 = 4.93 in2, read from FluidFlow's results-verified reproduction of that example), but no feed in the installed packages reproduces the printed M/Z/k as a single-phase vapour (C4/C5/C6 composition search at the relieving point: M ~ 65 states are liquid or two-phase; all-vapour tops out near M 61, Z 0.854, k 1.069), so the adapter-level V1 case is withdrawn, not tuned. Two-phase sizing and relief-system loss checks remain roadmap.

- id: pipe_segment
  name: Pipe segment
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: segment inlet
    outlet:
    - name: outlet
      required: true
      description: segment outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.pipe_segment:PipeSegment
      params: {}
      note: fixed ΔP spec; in dP mode an elevation rise subtracts rho*g*z from the outlet pressure, in P_out mode it is reported only
    R1:
      status: planned
      params: {}
      note: single-phase Darcy (Colebrook) with elevation; the darcy_colebrook correlation plugin exists
    R2:
      status: planned
      params: {}
      note: two-phase Beggs-Brill / fluids multiphase, profile along the length
      end_state: true
  pid_symbol: PIPE
  references:
  - docs/unit-catalogue-plan.md §2 U-B 8
  notes: R0 fixed dP with optional hydrostatic head; Darcy friction and two-phase flowsheeting remain roadmap.

- id: orifice
  name: Orifice / flow element
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: element inlet
    outlet:
    - name: outlet
      required: true
      description: element outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.orifice:Orifice
      params: {}
      note: ΔP from a discharge coefficient
    R1:
      status: planned
      params: {}
      note: ISO 5167 sizing
      end_state: true
  pid_symbol: FE
  references:
  - docs/unit-catalogue-plan.md §2 U-B 9
  notes: R0 fixed-Cd dP read; ISO 5167 sizing remains roadmap.

- id: ejector
  name: Ejector
  family: flow
  ports:
    inlet:
    - name: motive_in
      required: true
      description: motive stream
    - name: suction_in
      required: true
      description: suction stream
    outlet:
    - name: outlet
      required: true
      description: combined discharge
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.ejector:Ejector
      params: {}
      note: entrainment ratio spec
    R1:
      status: planned
      params: {}
      note: 1-D momentum (ESDU-style)
      end_state: true
  pid_symbol: EJ
  references:
  - docs/unit-catalogue-plan.md §2 U-B 10
  notes: R0 momentum balance at a specified entrainment ratio. V1 gap (PR #217): the previous Graham 3:1 case was circular (both expectations restated the inputs) and is withdrawn; no open published ejector example with a printed outlet state was found (searched Graham Manufacturing ejector performance literature and Perry sect. 10 — operating points are entrainment ratios and curves, not outlet states). R0 mixing remains covered by closed-form unit tests. 1-D momentum design mode remains roadmap.

- id: fan
  name: Fan / blower
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: raised-pressure gas
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.fan:Fan
      params: {}
      note: ΔP + efficiency
    R1:
      status: planned
      params: {}
      note: performance curve
      end_state: true
  pid_symbol: FAN
  references:
  - docs/unit-catalogue-plan.md §2 U-B 11
  notes: R0 fixed dP rise with efficiency; performance curves remain roadmap.
