# U-B — Pressure change and flow (plan §2 U-B, 12 rows).
#
# The compression train is its own row (plan marks compressor's R2
# "multi-section with intercooling" as "train ✅"); the hydraulic turbine is
# covered by the expander row, not a separate row.

- id: pump
  name: Pump
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: liquid feed
    outlet:
    - name: outlet
      required: true
      description: pressurised liquid (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.pump:Pump
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta: {type: number, description: 'pump efficiency in (0, 1], default 0.65'}
      note: ΔP/outlet P with efficiency; PS flash on the outlet
    R1:
      status: planned
      params: {}
      note: curve (head/efficiency vs flow) and NPSHa check
      end_state: true
  sizer: pump
  pid_symbol: P
  references:
  - docs/unit-catalogue-plan.md §2 U-B 1
  notes: shaft power currently inlined in the unit; the pump_power correlation plugin exists.

- id: compressor
  name: Centrifugal compressor
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: compressed gas (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.compressor:Compressor
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta_isentropic: {type: number, description: 'isentropic efficiency in (0, 1], default 0.75'}
      note: isentropic/polytropic efficiency; PS flash on the outlet
    R1:
      status: planned
      params: {}
      note: performance map (head/efficiency vs flow, surge/stonewall), Schultz polytropic
      end_state: true
  sizer: compressor
  pid_symbol: C
  references:
  - docs/unit-catalogue-plan.md §2 U-B 2
  notes: multi-section compression with intercooling is its own flow row (compression_train), not a level of this row.

- id: reciprocating_compressor
  name: Reciprocating compressor
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: compressed gas
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.reciprocating_compressor:ReciprocatingCompressor
      params: {}
      note: clearance-volume model, stages
    R1:
      status: planned
      params: {}
      note: rod load, capacity vs clearance
      end_state: true
  pid_symbol: RC
  references:
  - docs/unit-catalogue-plan.md §2 U-B 3
  notes: R0 isentropic stages with intercooling and a clearance-volume volumetric-efficiency report; rod load and capacity-vs-clearance remain roadmap.

- id: compression_train
  name: Compression train
  family: flow
  ports:
    inlet:
    - name: gas_in
      required: true
      description: gas feed to the first section
    outlet:
    - name: gas_out
      required: true
      description: discharge of the last section after intercooling
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.compression_train:CompressionTrain
      params:
        type: object
        required: [P_discharge]
        properties:
          P_discharge: {type: number, description: 'final discharge pressure, Pa'}
          eta_isentropic: {type: number, description: 'per-section isentropic efficiency, default 0.75'}
          T_interstage_out: {type: number, description: 'interstage outlet temperature after cooling, K'}
      note: multi-section compression with intercooling to a fixed interstage temperature
      end_state: true
  pid_symbol: CT
  references:
  - 'docs/unit-catalogue-plan.md §2 U-B 2 (today: train ✅)'
  notes: its own flow row per the plan-to-registry mapping — the plan's compressor R2
    (multi-section with intercooling) lives here, not on the compressor row.

- id: expander
  name: Expander / turbine
  family: flow
  ports:
    inlet:
    - name: gas_in
      required: true
      description: gas feed
    outlet:
    - name: gas_out
      required: true
      description: expanded gas (PS flash)
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.expander:Expander
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
          eta_isentropic: {type: number, description: 'isentropic efficiency in (0, 1], default 0.8'}
      note: isentropic expansion with power recovery
    R1:
      status: planned
      params: {}
      note: performance map
      end_state: true
  pid_symbol: T
  references:
  - docs/unit-catalogue-plan.md §2 U-B 4
  notes: the hydraulic turbine / pressure-recovery line (plan U-B 12) is covered by this
    row — isentropic expansion recovering shaft power — not a separate row.

- id: jt_valve
  name: JT valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: isenthalpic (flash_ph) outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.jt_valve:JTValve
      params:
        type: object
        required: [P_out]
        properties:
          P_out: {type: number, description: 'outlet pressure, Pa'}
      note: isenthalpic flash to the outlet pressure
      end_state: true
  pid_symbol: V
  references:
  - docs/unit-catalogue-plan.md §2 U-B 5
  notes: the palette defines no higher level for the JT valve (plan §2 U-B 5).

- id: control_valve
  name: Control valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: feed
    outlet:
    - name: outlet
      required: true
      description: throttled outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.control_valve:ControlValve
      params: {}
      note: Cv / outlet P spec, isenthalpic (the cv_liquid correlation plugin exists)
    R1:
      status: planned
      params: {}
      note: IEC 60534 sizing, choked flow, Cv curve
      end_state: true
  pid_symbol: CV
  references:
  - docs/unit-catalogue-plan.md §2 U-B 6
  notes: R0 isenthalpic letdown; ISA liquid Cv is reported when the inlet is liquid and a viscosity is available (PR phase property or a mu_liquid param); IEC 60534 sizing and the choked-flow correlation remain roadmap.

- id: relief_valve
  name: Relief valve
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: relieved stream at set pressure
    outlet:
    - name: outlet
      required: true
      description: discharge
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.relief_valve:ReliefValve
      params: {}
      note: set pressure, orifice from API 520 (the psv_api520_gas correlation plugin exists)
    R1:
      status: provisional
      adapter: ngdesign.units.flow.relief_valve_r1:ReliefValveR1
      params:
        type: object
        required: [P_back]
        properties:
          P_back: {type: number, description: 'superimposed back pressure, Pa abs'}
          Kd: {type: number, description: 'discharge coefficient; default 0.975 gas / 0.85 two-phase / 0.65 liquid, chosen by regime'}
          Kb: {type: number, description: 'back-pressure correction, default 1.0'}
          Kc: {type: number, description: 'combination (rupture disk) correction, default 1.0'}
          Kv: {type: number, description: 'viscosity correction (liquid), default 1.0'}
          Kw: {type: number, description: 'liquid back-pressure correction (balanced bellows), default 1.0'}
      note: Leung omega two-phase and subcooled sizing (eqs. 1-5), gas delegated to R0; Kd by regime
      validation: []
    R2:
      status: provisional
      adapter: ngdesign.units.flow.relief_valve_r2:ReliefValveR2
      params:
        type: object
        required: [P_back, P_set]
        properties:
          P_back: {type: number, description: 'superimposed back pressure, Pa abs'}
          P_set: {type: number, description: 'set pressure, Pa abs'}
          P_atm: {type: number, description: 'atmospheric pressure, Pa, default 101325'}
          overpressure: {type: number, description: 'overpressure fraction, one of 0.10, 0.16, 0.21'}
          Kd: {type: number, description: 'discharge coefficient; default 0.975 gas / 0.85 two-phase / 0.65 liquid'}
          Kb: {type: number, description: 'back-pressure correction, default 1.0'}
          Kc: {type: number, description: 'combination (rupture disk) correction, default 1.0'}
          Kv: {type: number, description: 'viscosity correction (liquid), default 1.0'}
          Kw: {type: number, description: 'liquid back-pressure correction (balanced bellows), default 1.0'}
          valve_type: {type: string, description: 'conventional, balanced_bellows or pilot'}
          L_in_m: {type: number, description: 'inlet line length, m'}
          D_in_m: {type: number, description: 'inlet line ID, m'}
          K_in: {type: number, description: 'inlet line sum-K'}
          roughness_in_m: {type: number, description: 'inlet roughness, m, default 4.57e-5 commercial steel'}
          L_out_m: {type: number, description: 'discharge line length, m'}
          D_out_m: {type: number, description: 'discharge line ID, m'}
          K_out: {type: number, description: 'discharge line sum-K'}
          roughness_out_m: {type: number, description: 'discharge roughness, m, default 4.57e-5 commercial steel'}
      note: rated-capacity inlet-loss and built-up back-pressure checks with bellows Kb/Kw re-sizing
      validation: []
  pid_symbol: PSV
  references:
  - docs/unit-catalogue-plan.md §2 U-B 7
  notes: R0 gas PSV sizing per API 520 Part I with API 526 orifice selection. V1 gap (PR #217): the sizing layer is pinned by a unit test to the API worked example's printed inputs and published area (API RP 520 Part I Example 3.6.2.2, p. 44 — W 53500 lb/h, M 65, Z 0.84, k 1.09, T 627 R, P1 97.2 psia, Kd 0.975, Kb = Kc = 1.0, C = 326 from Table 8; published area 3179 mm2 = 4.93 in2, read from FluidFlow's results-verified reproduction of that example), but no feed in the installed packages reproduces the printed M/Z/k as a single-phase vapour (C4/C5/C6 composition search at the relieving point: M ~ 65 states are liquid or two-phase; all-vapour tops out near M 61, Z 0.854, k 1.069), so the adapter-level V1 case is withdrawn, not tuned. R1/R2 (PR #313) implement Leung omega two-phase and subcooled sizing and the API 520 inlet-loss and built-up back-pressure checks with bellows re-sizing; V1 gap: the API 520 Part I 10th ed. liquid example (fluids' "Example 5", printed result 3066 mm2 on inputs 6814 L/min, SG 0.9, set 1724 kPag, 10 percent overpressure, Kw 0.97) cannot be confirmed against the standard from this workspace, and a case-level feed would additionally need thermo density 899.1 kg/m3 at relieving conditions, so the printed arithmetic is pinned by closed-form tests (G = 52821.2752591226, A = 3.06594883829264e-3 m2) and validation ids are empty. The R1 adapter refuses single-component subcooled feeds: the registered pr package's flash_ps raises ZeroDivisionError in the two-phase region (thermo flash_utils.py:961) and its quality flashes clamp to the liquid root at vf bounds for pure fluids, so regime tests use a 99.9/0.1 C3/nC4 basis.

- id: pipe_segment
  name: Pipe segment
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: segment inlet
    outlet:
    - name: outlet
      required: true
      description: segment outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.pipe_segment:PipeSegment
      params: {}
      note: fixed ΔP spec; in dP mode an elevation rise subtracts rho*g*z from the outlet pressure, in P_out mode it is reported only
    R1:
      status: planned
      params: {}
      note: single-phase Darcy (Colebrook) with elevation; the darcy_colebrook correlation plugin exists
    R2:
      status: planned
      params: {}
      note: two-phase Beggs-Brill / fluids multiphase, profile along the length
      end_state: true
  pid_symbol: PIPE
  references:
  - docs/unit-catalogue-plan.md §2 U-B 8
  notes: R0 fixed dP with optional hydrostatic head; Darcy friction and two-phase flowsheeting remain roadmap.

- id: orifice
  name: Orifice / flow element
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: element inlet
    outlet:
    - name: outlet
      required: true
      description: element outlet
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.orifice:Orifice
      params: {}
      note: ΔP from a discharge coefficient
    R1:
      status: planned
      params: {}
      note: ISO 5167 sizing
      end_state: true
  pid_symbol: FE
  references:
  - docs/unit-catalogue-plan.md §2 U-B 9
  notes: R0 fixed-Cd dP read; ISO 5167 sizing remains roadmap.

- id: ejector
  name: Ejector
  family: flow
  ports:
    inlet:
    - name: motive_in
      required: true
      description: motive stream
    - name: suction_in
      required: true
      description: suction stream
    outlet:
    - name: outlet
      required: true
      description: combined discharge
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.ejector:Ejector
      params: {}
      note: entrainment ratio spec
    R1:
      status: planned
      params: {}
      note: 1-D momentum (ESDU-style)
      end_state: true
  pid_symbol: EJ
  references:
  - docs/unit-catalogue-plan.md §2 U-B 10
  notes: R0 momentum balance at a specified entrainment ratio. V1 gap (PR #217): the previous Graham 3:1 case was circular (both expectations restated the inputs) and is withdrawn; no open published ejector example with a printed outlet state was found (searched Graham Manufacturing ejector performance literature and Perry sect. 10 — operating points are entrainment ratios and curves, not outlet states). R0 mixing remains covered by closed-form unit tests. 1-D momentum design mode remains roadmap.

- id: fan
  name: Fan / blower
  family: flow
  ports:
    inlet:
    - name: inlet
      required: true
      description: gas feed
    outlet:
    - name: outlet
      required: true
      description: raised-pressure gas
  levels:
    R0:
      status: provisional
      adapter: ngdesign.units.flow.fan:Fan
      params: {}
      note: ΔP + efficiency
    R1:
      status: provisional
      adapter: ngdesign.units.flow.fan_r1:FanR1
      params:
        type: object
        required: [curve]
        properties:
          curve:
            type: object
            required: [flow_m3_s, pressure_rise_Pa, efficiency]
            properties:
              flow_m3_s: {type: array, items: {type: number}, description: 'actual inlet flow points, m3/s, strictly increasing'}
              pressure_rise_Pa: {type: array, items: {type: number}, description: 'fan total pressure rise at each point, Pa'}
              efficiency: {type: array, items: {type: number}, description: 'efficiency at each point, (0, 1]'}
          speed_ratio: {type: number, description: 'N / N_curve (fan laws), default 1.0'}
          curve_density_kg_m3: {type: number, description: 'rating density of the curve, kg/m3; omitted = operating density'}
      note: performance curve (pressure rise/efficiency vs flow, PCHIP) with fan laws and density correction
      validation: []
      end_state: true
  pid_symbol: FAN
  references:
  - docs/unit-catalogue-plan.md §2 U-B 11
  notes: R0 fixed dP rise with efficiency; R1 performance curve (PCHIP, no extrapolation) with fan laws (AMCA 201; ASHRAE Fans chapter) and density correction, delegating to R0. V1 gap (fan R1) - no open printed fan-law worked example qualified for the harness — searched AMCA 201 (its fan-selection example needs manufacturer data, not printed results), the openly accessible ASHRAE Handbook—Fundamentals ch. 21 speed-change example (its only printed input is a single curve point, so a case would need a synthesized curve and would restate the fan law — the circularity that withdrew the ejector case), ASHRAE HVAC Systems & Equipment Fans chapter (paywalled) and Perry's 9th ed. sect. 10 (no printed worked example found). Covered by closed-form tests instead.
