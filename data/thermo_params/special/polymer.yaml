# Polymer-solution parameters (spec T-10). Every entry carries provenance;
# a pair without parameters is a construction-time refusal, never an ideal.

segments:
  toluene:
    r: 1.0
    segments: [[s, 1]]
    provenance: 'solvent reference segment: one segment per solvent molecule (FH lattice convention)'
  POLY_PS:
    r: 962.0
    segments: [[p, 962]]
    provenance: >-
      Polystyrene Mn = 100,000 g/mol with styrene repeat 104 g/mol and toluene
      repeat-equivalent volume: r = Mn/M_repeat x (M_repeat/M_tol) ~ 962
      solvent-sized segments, per the worked example in Penn State MATSE 202
      Lesson 10 (Flory-Huggins polymer-solution section, worked toluene/PS
      entropy-of-mixing example). POLY_PS is a registered pseudo-component
      (P1-07); register it as register_pseudo('POLY_PS', 'Polystyrene',
      Tb=871.0, sg=1.05) - Tb is an operational placeholder (polystyrene
      decomposes before boiling; an n-tetracosane-analogue value keeps the
      Riazi-Daubert characterization defined), sg = 1.05 is the standard
      amorphous polystyreneg density at 20 C.

chi:
  toluene/POLY_PS:
    chi: 0.67
    provenance: >-
      Gunduz & Dincer, Polymer 21 (1980) 1131, polystyrene/toluene at
      162.31 C (435.46 K), reduced from inverse gas chromatography
      infinite-dilution data (the same source's Omega_1^inf = 7.90).

segment_tau:
  s/p:
    tau_ab: 0.45
    tau_ba: 0.45
    alpha: 0.2
    provenance: >-
      ILLUSTRATIVE parameterization (toluene solvent segment / polystyrene
      segment): no verified published Chen-1993 parameter set for this pair was
      located this session. Values are order-of-magnitude placeholders so the
      model's algebra is exercised end-to-end; they are NOT engineering data.
      Replace with fitted values before any design use.

polymer_pc_saft:
  toluene:
    m: 2.8149
    sigma_Angstrom: 3.7169
    epsilon_over_k: 285.69
    provenance: >-
      Gross & Sadowski, Ind. Eng. Chem. Res. 40 (2001) 1244-1257, Table 1
      (toluene); cross-checked against the feos-pcsaft project's literature
      parameter record (feos-org/feos-pcsaft, parameters/gross2001.json,
      toluene: m 2.8149, sigma 3.7169 A, epsilon/k 285.69 K, Mw 92.141).
  POLY_PS:
    m: 7600.0
    sigma_Angstrom: 4.107
    epsilon_over_k: 267.0
    provenance: >-
      AlHammadi & Abutaqiya, ACS Omega 5(45) 29530-29537 (2020), Table 1
      (parameters attributed to Gross & Sadowski 2001; open access): a
      polystyrene pseudo-component with Mw = 400,000 g/mol, m/Mw =
      0.0190 mol/g (so m = 7600 chain segments), sigma = 4.107 A and
      epsilon/k = 267.00 K. POLY_PS is the registered pseudo-component of
      P1-07. k_ij = 0: no verifiable open citation for this pair's
      interaction parameter was found, and tuning k_ij against a point is
      forbidden (catalogue how-to).
