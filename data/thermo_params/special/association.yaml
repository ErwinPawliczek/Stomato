# Vapour-phase association (dimerization) parameters (spec T-10).

dimerization:
  AcOH:
    dH_assoc: -25000.0
    K2_ref: 3.4539e-5
    T_ref: 399.35
    provenance: >-
      Acetic acid dimerization: the reference constant is reduced from the
      Mehling & Kleiber (2020) acetic-acid vapour association data - their
      measured nominal compressibility Z = 0.6299 at 399.35 K and 1 bar true
      pressure gives, per nominal acid mole, dimer moles n_D = 1 - Z = 0.3701
      and monomer moles n_M = 2Z - 1 = 0.2598, so the true mole fractions are
      y_M = 0.41245 and y_D = 0.58755 and Kp = p_D/p_M^2 = y_D/(y_M^2 P) =
      0.58755/(0.170115 x 1e5 Pa) = 3.4539e-5 1/Pa at T_ref (their reported
      dimerization enthalpy ~ 25 kJ/mol is the standard literature value for
      acetic acid dimerization). NOTE: with K2 reduced from the same Z point,
      the tests/thermo round-trip against Z = 0.6299 exercises the
      chemical-theory algebra, not an independent prediction; an independent
      K2(T) source is the pending validation case.
