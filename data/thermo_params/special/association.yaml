# Vapour-phase association (dimerization) parameters (spec T-10).

dimerization:
  AcOH:
    dH_assoc: -60574.0
    K2_ref: 2.39647e-5
    T_ref: 399.35
    provenance: >-
      Acetic acid dimerization: Ritter & Simons, J. Am. Chem. Soc. 67, 757
      (1945), "The Molecular State of Acetic Acid Vapor", regress from their
      vapour-density measurements log10 K2 = 3164/T - 10.4184 with K2 in
      mmHg^-1 (verified 2026-10-23 against the open reproduction in Sebastiani
      & Lacquaniti, Chem. Eng. Sci. 22, 1155 (1967), eq. 3). Converted to a Pa
      basis, K2_Pa = K2_mmHg/133.322: at T_ref = 399.35 K,
      K2 = 10^(3164/399.35 - 10.4184) mmHg^-1 = 3.19503e-3 mmHg^-1 =
      2.39647e-5 1/Pa. Association enthalpy dH = -3164 R ln10 = -60.57 kJ/mol
      (exothermic dimer formation; supersedes the previously shipped ~-25
      kJ/mol point value, which disagreed with the regression slope).
      Independent check (tests/thermo/test_special.py): the kernel now
      PREDICTS, not fits, the Mehling & Kleiber (2020) measured compressibility
      Z = 0.6299 at 399.35 K and 1 bar true pressure - predicted Z = 0.6537,
      a +3.8% miss, assessed. The former K2-reduced-from-Z round trip is
      removed.

hexamerization:
  HF:
    log10_k6_a: -53.0054051
    log10_k6_b: 8660.4
    provenance: >-
      HF monomer-hexamer chemical theory, 6 HF <=> (HF)6 with Kp = p_H/p_M^6
      on a pressure basis: Jarry & Davis, J. Phys. Chem. 57, 600 (1953)
      (also U.S. Bureau of Mines RI K-968) regress, from their saturated-vapour
      densities over 273-378 K, log10 K = -42.38089 + 8660.4/T with K in
      mmHg^-5; converted to a Pa basis with
      a_Pa = a_mmHg - 5 log10(101325/760) = -53.0054051 (b unchanged). The
      same paper's smoothed saturated-vapour association factors (n_nominal/
      n_true) are 3.580 at 298.16 K and 3.438 at 303.16 K - the test anchors.
      Schotte, Ind. Eng. Chem. Process Des. Dev. 19, 432 (1980), treats the
      same equilibrium as the oligomer (hexamer) association of HF vapour.
