# UNIFAC subgroup assignments for the curated slate, per variant (spec T-03).
#
# Names resolve against the thermo 0.6.1 subgroup tables listed per variant at
# load time; an unknown name is an error (never silently ignored). Assignments
# follow the per-variant published tables:
# - methanol is the whole-molecule CH3OH subgroup (15; main group CH3OH) in
#   every variant whose table carries it (UNIFAC, Dortmund, PSRK, NIST, Lyngby
#   subgroup 13); thermo's subgroup records give it atoms C1H4O1, i.e. methanol;
# - ethylene glycol is the whole-molecule DOH subgroup (62; main group 31 DOH)
#   where the table carries it (thermo's record: atoms C2H6O2, SMARTS
#   HO-CH2-CH2-OH; NIST names it "CH2(OH)-CH2(OH)"); the DDBST published
#   UNIFAC and modified-UNIFAC (Dortmund) parameter pages list subgroup 62 DOH
#   in main group 31 (https://www.ddbst.com/published-parameters-unifac.html,
#   https://www.ddbst.com/PublishedParametersUNIFACDO.html, read 2026-11-04).
#   Lyngby has no DOH group, so MEG keeps 2 CH2 + 2 OH there;
# - other alcohols: Dortmund "OH(P)" (primary), NIST "OH prim", Lyngby OH (12);
# - Lyngby has no aromatic CH subgroup, so toluene has no Lyngby assignment.
# Fix 2026-11-04 (val-gphi-unifac): MeOH (Dortmund, NIST, Lyngby) and MEG
# (UNIFAC, Dortmund, PSRK, NIST) were split into CH3/CH2 + OH groups; measured
# effect on the Kamihama (2012) MEG/H2O 101.3 kPa isobar, x_H2O 0.25, ideal-gas
# vapour: bubble_T error 2.1-6.2 % -> 0.0-0.3 %.
#
# The Magnussen LLE variant (Magnussen, Rasmussen & Fredenslund, Ind. Eng. Chem.
# Process Des. Dev. 20 (1981) 331-339, machine-readable
# copy: thermo 0.6.1 LLEUFSG/LLEUFIP, read 2026-11-09) covers water/organic
# liquid-liquid systems. Its subgroup table has no methanol (CH3OH) subgroup
# (the short alcohols it names are the whole-molecule P1 1-propanol / P2
# 2-propanol groups), so MeOH keeps NO assignment and the adapter refuses it by
# name; EtOH and MEG (the table has a DOH group, main group 25) are left
# unassigned because no liquid-liquid case needs them (both are fully miscible
# with water). Added
# 2026-11-09 (val-gphi2) for LLE validation, from the table's standard
# decomposition: 1-butanol CH3 + 3 CH2 + OH (subgroups 1, 2, 14; main groups
# CH2, OH), 1-pentanol CH3 + 4 CH2 + OH, ethyl acetate CH3 + CH2 + CH3COO
# (subgroup 25, main group 14 CCOO); every main-group pair used (1-5, 1-8,
# 5-8, 1-14, 14-8) has an LLEUFIP entry.
model: unifac
variants:
  unifac:
    version: 0
    interaction: UFIP
    subgroups: UFSG
    components:
      MeOH: {CH3OH: 1}
      EtOH: {CH3: 1, CH2: 1, OH: 1}
      MEG: {DOH: 1}
      H2O: {H2O: 1}
      nC4: {CH3: 2, CH2: 2}
  unifac_dortmund:
    version: 1
    interaction: DOUFIP2016
    subgroups: DOUFSG
    components:
      MeOH: {CH3OH: 1}
      EtOH: {CH3: 1, CH2: 1, OH(P): 1}
      MEG: {DOH: 1}
      H2O: {H2O: 1}
      nC4: {CH3: 2, CH2: 2}
  unifac_psrk:
    version: 2
    interaction: PSRKIP
    subgroups: PSRKSG
    components:
      MeOH: {CH3OH: 1}
      EtOH: {CH3: 1, CH2: 1, OH: 1}
      MEG: {DOH: 1}
      H2O: {H2O: 1}
      nC4: {CH3: 2, CH2: 2}
      C1: {CH4: 1}
  unifac_vtpr:
    version: 3
    interaction: VTPRIP
    subgroups: VTPRSG
    components:
      MeOH: {CH3OH: 1}
      H2O: {H2O: 1}
      nC4: {CH3: 2, CH2: 2}
      C1: {CH4: 1}
  unifac_nist:
    version: 0
    interaction: NISTUFIP
    subgroups: NISTUFSG
    components:
      MeOH: {CH3OH: 1}
      EtOH: {CH3: 1, CH2: 1, OH prim: 1}
      MEG: {CH2(OH)-CH2(OH): 1}
      H2O: {H2O: 1}
      nC4: {CH3: 2, CH2: 2}
  unifac_lle:
    version: 0
    interaction: LLEUFIP
    subgroups: LLEUFSG
    components:
      H2O: {H2O: 1}
      nC4: {CH3: 2, CH2: 2}
      1-butanol: {CH3: 1, CH2: 3, OH: 1}
      1-pentanol: {CH3: 1, CH2: 4, OH: 1}
      ethyl acetate: {CH3: 1, CH2: 1, CH3COO: 1}
  unifac_lyngby:
    version: 4
    interaction: LUFIP
    subgroups: LUFSG
    components:
      MeOH: {CH3OH: 1}
      EtOH: {CH3: 1, CH2: 1, OH: 1}
      MEG: {CH2: 2, OH: 2}
      H2O: {H2O: 1}
      nC4: {CH3: 2, CH2: 2}
