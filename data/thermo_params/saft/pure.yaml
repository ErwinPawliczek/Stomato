# SAFT / CPA pure-component parameters (spec T-07).
#
# Every value below was retrieved this session (2026-10-21) from the cited open
# source, and each block was verified numerically against reference saturation
# data before being committed (verification notes per block). Components without
# verified parameters are absent by design: the bridge refuses them by name
# rather than silently treating them as ideal.
#
# Units: sigma [Angstrom], epsilon_over_k and epsilon_AB_over_R [K], epsilon_AB
# [J/mol], a0 [Pa m6/mol2], b [m3/mol], lambda_r / lambda_a dimensionless.

# --- PC-SAFT (row pc_saft) -----------------------------------------------------
# Source: Gross & Sadowski, "Perturbed-Chain SAFT: An Equation of State Based on a
# Perturbation Theory for Chain Molecules of Arbitrary Length", Ind. Eng. Chem.
# Res. 40, 1244-1260 (2001), Table 1 (non-associating substances), DOI
# 10.1021/ie0003887. C1-C3 cross-checked digit-identical against teqp 0.23.2's
# compiled name library (get_m/get_sigma_Angstrom/get_epsilon_over_k_K).
# Verification: Psat at each component's normal boiling point reproduces
# 101325 Pa to <=0.8% (solver of ngdesign.thermo.teqp_bridge, checked this session).
pc_saft:
  C1: {m: 1.0, sigma_Angstrom: 3.7039, epsilon_over_k: 150.03}
  C2: {m: 1.6069, sigma_Angstrom: 3.5206, epsilon_over_k: 191.42}
  C3: {m: 2.002, sigma_Angstrom: 3.6184, epsilon_over_k: 208.11}
  nC4: {m: 2.3316, sigma_Angstrom: 3.7086, epsilon_over_k: 222.88}
  nC5: {m: 2.6864, sigma_Angstrom: 3.7729, epsilon_over_k: 231.20}
  "C6+": {m: 3.0576, sigma_Angstrom: 3.7983, epsilon_over_k: 236.77}
  CO2: {m: 2.0729, sigma_Angstrom: 2.7852, epsilon_over_k: 169.21}
  excluded:
    iC4: "G&S 2001 row retrieved as (2.1078, 3.7573, 222.30) fails the boiling-point
      check by 22% (retrieval or transcription untrustworthy); excluded pending a
      verified source."
    iC5: "m/sigma retrieved (2.4193, 3.7915) but epsilon_over_k came back garbled and
      no candidate value reproduced the databank Psat within 12%; excluded pending a
      verified source."
    N2: "G&S 2001 row retrieved as (1.2053, 3.6375, 99.06) misses databank saturation
      pressures by 53-63% over 80-110 K; excluded pending a verified source (the
      multifluid row covers N2 at reference-EOS precision)."
  binary_kij: "teqp 0.23.2 exposes a k_ij matrix only through the PCSAFTEOS(coeffs,
    kmat) constructor (teqp docs, PCSAFT.html). No methane/CO2 k_ij value with a
    verifiable open citation was found (the literature-search candidate was flagged
    unverified by its own retrieval), so the row runs k_ij=0; the near-critical
    Petropoulou c1co2-* cases carry the harness's standing k_ij=0 assessment."

# --- SAFT-VR-Mie (row saft_vr_mie) ---------------------------------------------
# Source: parameters as distributed by teqp 0.23.2's compiled name library
# (get_m/get_sigma_Angstrom/get_epsilon_over_k_K/get_lambda_r/get_lambda_a,
# extracted this session); teqp attributes the set to Lafitte, Apostolakou,
# Avendano, Galindo, Adjiman, Muller & Jackson, "Accurate statistical
# associating fluid theory for chain molecules formed from Mie segments",
# J. Chem. Phys. 139, 154504 (2013), DOI 10.1063/1.4819786.
saft_vr_mie:
  C1: {m: 1.0, sigma_Angstrom: 3.7412, epsilon_over_k: 153.36, lambda_r: 12.65, lambda_a: 6.0}
  C2: {m: 1.4373, sigma_Angstrom: 3.7257, epsilon_over_k: 206.12, lambda_r: 12.4, lambda_a: 6.0}
  C3: {m: 1.6845, sigma_Angstrom: 3.9056, epsilon_over_k: 239.89, lambda_r: 13.006, lambda_a: 6.0}
  # T-18 (2026-10-23): typed from Lafitte et al., J. Chem. Phys. 139, 154504 (2013),
  # Table III (p. 154504-25), "Carbondioxide" row, checked digit-for-digit against the
  # paper PDF this session. The paper's Table III carries no nitrogen row — the N2 set
  # circulating in secondary literature is attributed to this table but is not in it —
  # so N2 stays absent here rather than typed from an unverified secondary source.
  CO2: {m: 1.5, sigma_Angstrom: 3.1916, epsilon_over_k: 231.88, lambda_r: 27.557, lambda_a: 5.1646}

# --- CPA-SRK (row cpa_srk) ------------------------------------------------------
# Source: Kontogeorgis, Voutsas, Yakoumis & Tassios, "Multicomponent phase
# equilibrium calculations for water-methanol-alkane mixtures", Fluid Phase
# Equilib. 158-160, 21-29 (1999), Table 1 (sCPA pure-component parameters, SI
# units), DOI 10.1016/S0378-3812(99)00060-6. Water uses the 4C scheme, methanol
# the 2B scheme, both as tabulated there.
# Verification: pure Psat reproduces the databank at 11 points, 323-615 K (H2O)
# and 256-461 K (MeOH), to <=1.13% (harness tolerance 3%).
cpa_srk:
  H2O:
    scheme: 4C
    a0: 0.12277        # Pa m6/mol2
    b: 1.4515e-5       # m3/mol
    c1: 0.67359
    epsilon_AB: 16655.0  # J/mol
    beta_AB: 0.0692
    sites: [d, d, a, a]
  MeOH:
    scheme: 2B
    a0: 0.40531
    b: 3.0978e-5
    c1: 0.43102
    epsilon_AB: 24591.0
    beta_AB: 0.0161
    sites: [d, a]
  binary_kij: "0 (no water-methanol k_ij with a verifiable open citation was
    retrieved); the meohh2o-* binary and canonical cases carry the harness's
    standing assessment for the databank/1927-1929 isotherm deviations."

# --- CPA-PR (row cpa_pr) ---------------------------------------------------------
# Source: Sorensen, Boesen, Leekumjorn & Herslund, "Peng-Robinson Equation of State
# Extended to Handle Aqueous Components Using CPA Concept", Journal of Natural Gas
# Engineering 6 (2018), DOI 10.7569/JNGE.2018.692501, Table 6 (PR-CPA pure-component
# parameters and association schemes), retrieved and typed this session (2026-10-23)
# from the open-access copy at https://d-nb.info/136523830X/34.
# Constant-vs-source check (this session, against Table 6 as printed):
#   H2O: a0 1.5782 bar l2/mol2 -> 0.15782 Pa m6/mol2 (x0.1); b 1.4788e-2 l/mol ->
#     1.4788e-5 m3/mol (x1e-3); c1 0.6736; eps_AB 161.23 bar l/mol -> 16123.0 J/mol
#     (x100); beta_AB 6.9662e-2; scheme 4C (2 negative / 2 positive sites).
#   MeOH: a0 5.3485 -> 0.53485; b 3.2112e-2 -> 3.2112e-5; c1 0.4310; eps_AB 236.87
#     -> 23687.0; beta_AB 1.3239e-2; scheme 2B (1 / 1).
# Unit factors x0.1 / x1e-3 / x100 cross-checked against the cpa_srk block above
# (Kontogeorgis 1999 Table 1 values, same convention, same printed digits).
# RDF g = 1/(1 - 1.9 eta) with eta = b*rho/4: the paper's "simplified CPA" radial
# distribution function (Appendix A, eq. A14) — the same form cpa_srk uses.
# Volume correction c = 0 for associating components (paper, section 3).
# alpha(T): the paper's functional form (Appendix A, eq. A2), a(T) = a0 (1 + c1
# (1 - sqrt(T/Tc)))^2 — the same Soave-type expression cpa_srk uses, with the
# fitted c1 of Table 6.
# Binary interaction H2O-MeOH: k_ij = k_ij_ref + k_ij' * (T - 288.15 K) with
# k_ij_ref = -0.14146, k_ij' = -4.257e-4 1/K (paper Table 7).
cpa_pr:
  H2O:
    scheme: 4C
    Tc: 647.3          # K, Sorensen et al. 2018 Table 6
    a0: 0.15782        # Pa m6/mol2
    b: 1.4788e-5       # m3/mol
    c1: 0.6736
    epsilon_AB: 16123.0  # J/mol
    beta_AB: 0.069662
    sites: [d, d, a, a]
  MeOH:
    scheme: 2B
    Tc: 512.6          # K, Sorensen et al. 2018 Table 6
    a0: 0.53485
    b: 3.2112e-5
    c1: 0.4310
    epsilon_AB: 23687.0
    beta_AB: 0.013239
    sites: [d, a]
  binary_kij:
    H2O-MeOH: {kij_ref: -0.14146, kij_prime: -4.257e-4, T_ref: 288.15}

# --- PC-SAFT + association (row pc_saft_assoc) ------------------------------------
# Source: Gross & Sadowski (2002) Ind. Eng. Chem. Res. 41, 5510-5515, Table 1
# ("pure component parameters of the associating compounds"), retrieved and
# checked against the paper this session. The paper assigns the 2B scheme to
# ALL three components, water included (one donor + one acceptor site).
# Cross association follows G&S 2002 eqs. 2-3: epsilon_AB arithmetic mean,
# kappa_AB geometric mean, sigma_ij arithmetic mean.
# k_ij = 0: the paper introduces no binary interaction parameter for
# associating-associating mixtures ("simple combining rules were used"), so
# unlike-dispersion terms use the bare Lorentz-Berthelot rule.
pc_saft_assoc:
  H2O:
    scheme: 2B
    m: 1.0656
    sigma_Angstrom: 3.0007
    epsilon_over_k: 366.51   # K
    epsilon_AB_over_k: 2500.7  # K, G&S 2002 Table 1
    kappa_AB: 0.034868
    sites: [d, a]
  MeOH:
    scheme: 2B
    m: 1.5255
    sigma_Angstrom: 3.2300
    epsilon_over_k: 188.90   # K
    epsilon_AB_over_k: 2899.5  # K
    kappa_AB: 0.035176
    sites: [d, a]
  EtOH:
    scheme: 2B
    m: 2.3827
    sigma_Angstrom: 3.1771
    epsilon_over_k: 198.24   # K
    epsilon_AB_over_k: 2653.4  # K
    kappa_AB: 0.032384
    sites: [d, a]

# --- PC-SAFT + dipolar term (row pc_saft_polar) -----------------------------------
# Source: the polar parameters are from feos's curated copy of Gross & Vrabec
# (2006) AIChE J. 52, 1194-1204 Table 2 (feos-org/feos,
# parameters/pcsaft/gross2006.json, BSD-3, retrieved 2026-10-23; the file is the
# paper's own fitted set for ketones/ethers and carries mu in Debye). DME is
# identical in CoolProp's dev/pcsaft/all_pcsaft_fluids.json (BibTeXKey
# Kleiner-JPCC-2007) and feos's test parameters; acetone agrees everywhere except
# the 5th digit of m (feos 2.7447 vs CoolProp/Kleiner 2.7448 — a rounding of the
# paper's table; Psat impact below the case band). The paper's own table is paywalled
# (AIChE J.), so this curated open transcription is the provenance of record.
# m/sigma/epsilon_over_k in PC-SAFT units, mu_debye in Debye; one dipolar segment
# per molecule (dipnum = 1, as every fluid in the paper's Table 2 slate).
pc_saft_polar:
  ACETONE:
    m: 2.7447
    sigma_Angstrom: 3.2742
    epsilon_over_k: 232.99   # K
    mu_debye: 2.88
  DME:
    m: 2.2634
    sigma_Angstrom: 3.2723
    epsilon_over_k: 210.29   # K
    mu_debye: 1.3

# --- Multi-fluid Helmholtz (row multifluid) -------------------------------------
# Source: teqp 0.23.2's bundled fluid library (multi-fluid Helmholtz EOS with
# departure functions as distributed by NIST teqp; GERG-2008-family formulations).
# Component-id -> teqp fluid-name aliases verified to build against teqp 0.23.2's
# library this session.
#
# The MIXTURE row (multifluid) does not list H2O: teqp's bundled binary-pair file
# carries no interaction data for its 21 water pairs (bias factors and Fij all
# null — bare Lorentz-Berthelot combining). With those pairs the slice dew at
# 293.15 K comes out 1.61 MPa, while CoolProp — which does ship water interaction
# data for the same fluid library — gives 0.78 MPa at the same conditions: the
# unparameterised water treatment is off by 2x, so water-bearing feeds are
# refused by name (unsupported components are never treated as ideal). The PURE
# row keeps the Water alias: pure IAPWS-95 needs no binary-pair data.
multifluid:
  aliases:
    C1: Methane
    C2: Ethane
    C3: n-Propane
    nC4: n-Butane
    iC4: IsoButane
    nC5: n-Pentane
    iC5: Isopentane
    "C6+": n-Hexane
    N2: Nitrogen
    CO2: CarbonDioxide

# Pure-fluid row: no binary-pair data is ever read, so the full alias table
# including Water (pure IAPWS-95) is verified support here.
multifluid_pure:
  aliases:
    C1: Methane
    C2: Ethane
    C3: n-Propane
    nC4: n-Butane
    iC4: IsoButane
    nC5: n-Pentane
    iC5: Isopentane
    "C6+": n-Hexane
    N2: Nitrogen
    CO2: CarbonDioxide
    H2O: Water

# --- GERG-2008 through teqp's multi-fluid machinery (row gerg2008_teqp) ----------
# The same teqp 0.23.2 bundled library and Kunz-JCED-2012 reducing/departure
# parameters the T-04 CoolProp `gerg2008` row approximates with its own fitted
# pure-fluid tables; this row IS the exact-backend cross-check (issue #164).
# Slate: the ten GERG-2008 natural-gas components the catalogue already carries
# ids for. H2O is excluded for the same measured reason as `multifluid` above —
# teqp's bundled binary-pair file carries no water interaction data, and the
# GERG-2008 water pairs are the ones the spec's water-sour cases would need.
gerg2008_teqp:
  aliases:
    C1: Methane
    C2: Ethane
    C3: n-Propane
    nC4: n-Butane
    iC4: IsoButane
    nC5: n-Pentane
    iC5: Isopentane
    "C6+": n-Hexane
    N2: Nitrogen
    CO2: CarbonDioxide
