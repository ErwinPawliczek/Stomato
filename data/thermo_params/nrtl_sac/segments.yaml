# NRTL-SAC segment parameters (row nrtl_sac_ig).
#
# Model: Chen, C.-C. & Song, Y., 'Solubility modeling with a nonrandom two-liquid
# segment activity coefficient model', Ind. Eng. Chem. Res. 43 (2004) 8354-8362.
#
# Where the numbers were read (2026-11-01): the journal page returned HTTP 403, so
# every value below is from the authors' own patent family, read from the rendered
# page images because the text layer is corrupt:
#   - binary: US 2010/0114542 A1, Table 2; the same values in ACS Omega 2025
#     (PMC12242615), Table 5. The y-/y+ pair is tau = 0 (para. 0090). Para. 0087
#     prints 10.950 for the x/z tau21 where the table prints 10.949; the table is used.
#   - solvents: US 2010/0114542 A1, Table 3 ('Molecular Descriptors for Common
#     Solvents'), page image checked; US 8,527,210 B2, Table 3 has the same rows.
#     Water, n-hexane and acetonitrile are also in Valavi et al. 2016, Table 3. The
#     other rows of that thesis are refits and must not be mixed with these.
# Dimethyl sulfoxide is left out: para. 0095 calls its descriptors questionable.
# Pairs below are [segment 1, segment 2]; tau12 is tau(1,2).
binary:
- {pair: [x, y-], tau12: 1.643, tau21: 1.834, alpha: 0.2}
- {pair: [x, z], tau12: 6.547, tau21: 10.949, alpha: 0.2}
- {pair: [y-, z], tau12: -2.000, tau21: 1.787, alpha: 0.3}
- {pair: [y+, z], tau12: 2.000, tau21: 1.787, alpha: 0.3}
- {pair: [x, y+], tau12: 1.643, tau21: 1.834, alpha: 0.2}
- {pair: [y-, y+], tau12: 0.0, tau21: 0.0, alpha: 0.0}
# Keyed by CAS. Blank cells of the table are 0.
solvents:
  7732-18-5: {name: water, x: 0.0, y-: 0.0, y+: 0.0, z: 1.000}
