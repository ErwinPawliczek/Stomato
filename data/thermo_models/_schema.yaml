# Schema for data/thermo_models/*.yaml — one row per property method (spec T-01).
#
# A property method is DATA: id, family, adapter, options, parameters provenance,
# applicability, status, validation case ids, and the L0 self-consistency
# parameters the validation harness runs. ngdesign.thermo.catalogue loads these
# files and registers every row as a "thermo" plugin factory under its id; the
# adapter classes stay as code (ngdesign.thermo.pr, srk, pr78, nrtl).
#
# Fields:
#   id            registry name; stable; what Flowsheet.thermo names. Unique
#                 across all files — a duplicate fails at load, naming both rows.
#   name          human-readable name (API surface).
#   family        one of `families` below.
#   adapter       "module:ClassName", imported at load; must be a class.
#   options       per-family typed options. family cubic: eos, kij_table, alpha,
#                 translation, enthalpy — vocabularies declared in
#                 ngdesign.thermo.options. Any other key fails at load, and a
#                 non-cubic row with options fails at load (T-02/T-03 add typed
#                 options for their families). A non-default alpha/translation/
#                 enthalpy value loads but build() raises NotImplementedError
#                 naming the option until T-02 lands the implementation.
#   params        where the numbers come from: source + provenance citation.
#   applicability model-validity window (Carlson 1996, Chem. Eng. Prog. 92(10),
#                 35): component_classes (subset of the vocabulary below),
#                 polar, electrolyte, inclusive T_K / P_Pa windows, phases.
#   status        validated | provisional | experimental — enforced by
#                 scripts/validate_properties.py --audit:
#                   validated   = L0 green AND >= 1 L1 and >= 1 L2 case id in
#                                 validation (L1 = pure_cases, L2 = binary_cases);
#                   provisional = L0 green;
#                   experimental = exempt, hidden from the audit table.
#   validation    P1-05 case ids (data/validation/cases.yaml) that run against
#                 the row; audit fails on unknown ids.
#   l0            L0 self-consistency parameters keyed by check name:
#                 pure_psat_limit, phase_identification, round_trip, dhdT_cp,
#                 gibbs_duhem, single_liquid_limit, determinism. A check that is
#                 neither declared here nor excluded in l0_excluded fails the
#                 audit — checks are never silently skipped.
#   l0_excluded   check name -> declared reason (non-empty; printed in every
#                 audit and report).
#   l0_note       measured caveat shown with the L0 results (e.g. a component
#                 deliberately not used as a check point, and why).
#   references    literature citations.
families: [cubic, gamma_phi, mixing, helmholtz, kvalue, saft, electrolyte, special]
statuses: [validated, provisional, experimental]
component_classes:
  [hydrocarbon, light_gas, inert, water, acid_gas, amine, glycol, alcohol, polar_organic]
phases: [V, L, VLL, VLLE]
# L4 cross-model pairs are formed only on the classes the natural-gas slice feed
# exercises: hydrocarbon, light_gas, inert (scripts/validate_properties.py).
l4_pairing_classes: [hydrocarbon, light_gas, inert]
