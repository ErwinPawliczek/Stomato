# Special-chemistry catalogue rows (spec T-10).
#
# One row per special property method, registered by ngdesign.thermo.catalogue
# like every other family. Status per row, re-decided on evidence 2026-11-03
# and 2026-11-04 (each row's notes carry the exact reason):
#   ideal_solid      validated (2026-11-04) - van't Hoff physics complete,
#                    tabulated fusion properties only; IUPAC-NIST solubility
#                    points bound as L2 and the NIST melting points as L1
#                    (data/validation/special/cases.yaml).
#   hoc_dimer        provisional (2026-11-04) - the chemical-theory vapour is
#                    the flash's vapour phase, L0 green, flash surface checked
#                    against Mehling & Kleiber Z and CRC latent heats;
#                    applicability narrowed to the checked 290-400 K window.
#   hf_hexamer       provisional (2026-11-04) - the databank HF vapour
#                    pressure was fixed at the root (psat_methods.yaml), L0
#                    green, pure-HF L1 cases bound; no L2.
#   the other four   experimental - a named reason each: illustrative or
#                    secondary-sourced parameters (polymer_nrtl, flory_huggins),
#                    no published reference and fixed-T free volumes
#                    (unifac_fv), or no runnable published reference
#                    (polymer_pc_saft).
# Experimental rows are hidden from the advisor and exempt from the L0 audit.
# Options are deliberately empty - the special adapters read their parameters
# from data/thermo_params/special/ keyed by component id.

- id: flory_huggins
  name: Flory-Huggins polymer solution
  family: special
  adapter: ngdesign.thermo.special:FloryHugginsPackage
  options: {}
  params:
    source: data/thermo_params/special/polymer.yaml
    provenance: >-
      Segment counts and chi per solvent/polymer pair with per-entry provenance;
      polystyrene/toluene chi = 0.67 at 435.46 K from Gunduz & Dincer, Polymer
      21 (1980) 1131 (reduced from IGC infinite-dilution data). chi is the
      original composition- and temperature-independent FH form.
  applicability:
    component_classes: [hydrocarbon, polar_organic]
    polar: true
    electrolyte: false
    T_K: [250.0, 600.0]
    P_Pa: [10000.0, 10000000.0]
    phases: [V, L]
    notes: >-
      Solvent/polymer liquid-phase nonideality over the VLE surface; the polymer
      enters as a flowsheet-owned pseudo-component (P1-07). Vapour phase ideal.
      The shipped chi is fitted at 435.46 K; treat T_K as a structural, not
      validated, window. Infinite-dilution and concentrated regimes only as
      validated. T-19 search (2026-10-23): no open digitized
      polystyrene/toluene activity table was found - Bawn's osmometry data and
      Krigbaum & Geymer (J. Am. Chem. Soc. 81, 1859 (1959)) are paywalled, and
      the shipped chi is itself reduced from the Gunduz & Dincer IGC fit
      point, so binding it would be a round trip. Row stays experimental.
      Rechecked 2026-11-03, still experimental for three reasons: (1) no
      published-reference test - every FH assertion is a hand reduction of
      the implemented closed form, none a measured activity; (2) the POLY_PS
      segment count r = 962 cites a course note (Penn State MATSE 202), not a
      primary source, and is the repeat-unit count, not the molar-volume ratio
      FH defines (~890 at 1.05/0.862 g/cm3); (3) the chi = 0.67 primary
      (Gunduz & Dincer 1980) is paywalled and was not re-read. Open data
      searched: Pavlicek, Bogdanic & Wichterle, Chem. Biochem. Eng. Q. 29(1)
      1-4 (2015), doi:10.15255/CABEQ.2015.2183 (toluene activity vs w1 at
      363-383 K) - the hrcak.srce.hr PDF sits behind a bot challenge from
      here and its licence was not verifiable; the Gupta & Prausnitz
      eScholarship polymer-solvent report returned HTTP 403. Not promoted.
  status: experimental
  validation: []

- id: polymer_nrtl
  name: Chen segment-based polymer NRTL
  family: special
  adapter: ngdesign.thermo.special:ChenPolymerNRTLPackage
  options: {}
  params:
    source: data/thermo_params/special/polymer.yaml
    provenance: >-
      Chen (1993), Fluid Phase Equilibria 83, 301: segment combinatorial plus
      segment-level NRTL residual. Segment assignments and tau/alpha per
      segment pair with provenance; the shipped toluene/PS parameterization is
      an illustrative fit (no verified published parameter set located; T-19
      search 2026-10-23: the Chen 1993 parameter tables remain paywalled with
      no open transcription found - the row keeps its experimental status per
      the spec escape hatch).
  applicability:
    component_classes: [hydrocarbon, polar_organic]
    polar: true
    electrolyte: false
    T_K: [250.0, 600.0]
    P_Pa: [10000.0, 10000000.0]
    phases: [V, L]
    notes: >-
      Solvent/polymer liquid nonideality with local-composition enthalpy; the
      polymer enters as a flowsheet-owned pseudo-component. Vapour phase ideal.
      The shipped tau/alpha are illustrative, so T_K is structural only.
      Rechecked 2026-11-03: blocked - the segment tau/alpha are ILLUSTRATIVE
      placeholders (data/thermo_params/special/polymer.yaml says so), and no
      open, licensed Chen (1993) segment-parameter table was found; promotion
      needs real cited parameters, not a better test. Stays experimental.
  status: experimental
  validation: []

- id: unifac_fv
  name: UNIFAC free-volume (Oishi-Prausnitz)
  family: special
  adapter: ngdesign.thermo.special:UnifacFvPackage
  options: {}
  params:
    source: data/thermo_params/special/unifac_fv.yaml
    provenance: >-
      Oishi & Prausnitz, Ind. Eng. Chem. Process Des. Dev. 17, 333 (1978):
      UNIFAC solvent activity plus the Flory free-volume term (c1 = 1.1,
      15.17 cm3/mol CH2 reference volume, b = 1.28); polymer activity by
      Gibbs-Duhem integration. UNIFAC residual from the original-UNIFAC
      tables shipped with thermo (UFSG/UFIP; Hansen et al., Ind. Eng. Chem.
      Res. 30, 2352 (1991)) at the flash temperature, on whole-molecule group
      fractions; van der Waals volumes r summed from the same UFSG R_k over
      the subgroup assignments (toluene: the DDBST assignment 5 ACH + ACCH3,
      r = 3.9228).
  applicability:
    component_classes: [hydrocarbon, polar_organic]
    polar: true
    electrolyte: false
    T_K: [250.0, 600.0]
    P_Pa: [10000.0, 10000000.0]
    phases: [V, L]
    notes: >-
      Binary solvent/polymer supports only. The polymer pseudo-component's
      generalized vapour-pressure correlation is an operational placeholder
      (polymers do not boil); only solvent K-values are meaningful. T-19
      search (2026-10-23): the Oishi & Prausnitz (1978) worked-example tables
      are paywalled with no open transcription found. Physics fixes
      2026-11-04 (each pinned by a test that fails on the old code,
      tests/thermo/test_special.py): (1) the UNIFAC residual is evaluated at
      the model's own T (was a fixed 298.15 K), with dGE/dT, d2GE/dT2 and
      dgamma/dT now central differences of the T-dependent GE (were zero);
      (2) the residual runs on whole-molecule group fractions - the
      repeat-unit mole fraction x_ru = N x2/(x1 + N x2) with N = m/m_repeat
      = 960.1 repeat units, identical to UNIFAC on the full molecule (was the
      solvent/one-repeat-unit fraction), and the polymer r is N x the
      repeat-unit group sum; (3) r comes from the UFSG R_k (toluene 3.9228,
      was a hand-typed 3.87); (4) the toluene and repeat-unit assignments use
      ACCH3 / ACCH per the DDBST convention (were CH3 + AC and CH + AC, same
      r and q but the wrong main groups for the residual); (5) the specific
      volumes, stored in m3/kg, were used as if in cm3/g, giving reduced
      volumes ~1.5e-3 where the FV term needs ~1.2-1.6 (now 1.40 for toluene,
      1.23 for POLY_PS), and toluene's v_spec matched neither its stated
      density nor the databank (now 1/862.24 kg/m3, databank at 298.15 K).
      STAYS EXPERIMENTAL: (a) no published-reference test - no open
      polystyrene/toluene solvent-activity table was retrievable (see
      flory_huggins); (b) the free-volume term uses fixed 298.15 K (toluene)
      and 20 C (polystyrene) specific volumes, not volumes at the flash T;
      (c) the combinatorial is the Flory volume-fraction form, and whether
      Oishi-Prausnitz add the Staverman-Guggenheim surface term could not be
      checked against the paywalled paper.
  status: experimental
  validation: []

- id: ideal_solid
  name: Ideal-solubility solid-liquid equilibrium
  family: special
  adapter: ngdesign.thermo.special:IdealSolidPackage
  options: {}
  params:
    source: chemicals databank fusion properties (Tm, Hfus by CAS), tabulated sources only
    provenance: >-
      van't Hoff ideal solubility ln x = -(dHfus/R)(1/T - 1/Tm), gamma = 1
      (the ideal-solubility equation with the dCp terms neglected; Prausnitz,
      Lichtenthaler & de Azevedo, Molecular Thermodynamics of Fluid-Phase
      Equilibria, 3rd ed., solid-liquid equilibria chapter).
      Fusion properties from the chemicals databank: Tm from the first
      tabulated source chemicals ranks (Open Notebook melting points, CRC,
      CAS Common Chemistry, NIST WebBook, Wikidata), Hfus from the CRC
      Handbook table (chemicals method CRC); since 2026-11-03 the Joback
      group-contribution estimates are refused, so every number used is a
      tabulated value (naphthalene 353.35 K / 19010 J/mol, biphenyl 342.575 K /
      18570 J/mol, anthracene 489.15 K / 29400 J/mol). Not a flash package:
      solubility(cid, T) is the surface, flash-style calls refuse.
  applicability:
    component_classes: [hydrocarbon, polar_organic]
    polar: true
    electrolyte: false
    T_K: [90.0, 600.0]
    P_Pa: [10000.0, 10000000.0]
    phases: [L]
    notes: >-
      Ideal solubility of a solid in a liquid solvent. Non-ideal gamma
      corrections (NRTL/S MDL) are future work; melting-point curvature of the
      liquidus is not computed. T-19: predictions re-verified against the
      IUPAC-NIST Solubility Database (naphthalene/benzene x = 0.292 at
      298.15 K, 0.372 at 307.5 K, 0.3766 at 308.2 K - sysIDs 59_123/59_125/
      59_124; biphenyl/benzene x = 0.381 at 298.15 K - sysID 58_241;
      anthracene/benzene x = 0.00713 at 298.15 K, Acree evaluation - sysID
      58_57). Measured van't Hoff misses: +3.4%/+2.4%/+2.9% (naphthalene),
      -0.7% (biphenyl), +32% (anthracene, strongly non-ideal solute -
      assessed). PROMOTED to provisional 2026-11-03: the physics is complete
      for its claim (ideal solubility), the parameters are tabulated and
      cited, and the published checks run in tests/thermo/test_special.py.
      The structural gap is closed: scripts/validate_properties.py now has a
      `solubility` case type (expected {solute: x_sat} at T, 5 % band;
      tests/thermo/test_special_solubility_case.py drives it with the
      IUPAC-NIST points). No case is bound: data/validation/ is locked, so
      binding the IUPAC-NIST points as L2 cases is the follow-up that would
      take the row toward validated. The advisor sinks the row below every
      VLE flash package (it claims no vapour phase).
      BOUND 2026-11-04 (data/validation/special/cases.yaml, every number
      re-read from the NIST pages this session): L2 = 13 IUPAC-NIST
      solubility points in benzene (naphthalene: Chang 1969, Ward 1926 rows
      1/5/9/13/17, all five McLaughlin & Zainal 1959 rows, -0.8..+3.4 %;
      biphenyl -0.6 %; anthracene +36.7 % MISS, assessed). L1 = the pure
      solute's melting point as x_sat = 1 at the NIST WebBook evaluated
      Tfus (naphthalene 353.2 K -> 0.9973, biphenyl 343 K -> 1.0081,
      anthracene 490 K -> 1.0126). Caveat on the L1: an SLE row's only
      pure-component observable is where the liquidus ends (Tm); the 5 %
      band is about +/- 2.7 K in Tm and the case does not test dHfus (the L2
      temperature series does). The row has no fitted parameters, so all
      bound points are independent. VALIDATED on that basis; L0 is green by
      declared exclusion only (every L0 check is a flash check the row
      refuses by design).
  status: validated
  validation:
  - sle-pure-naphthalene-tfus-nist
  - sle-pure-biphenyl-tfus-nist
  - sle-pure-anthracene-tfus-nist
  - sle-naphthalene-benzene-298.15K-chang
  - sle-naphthalene-benzene-273.2K-ward
  - sle-naphthalene-benzene-282.2K-ward
  - sle-naphthalene-benzene-303.3K-ward
  - sle-naphthalene-benzene-321.1K-ward
  - sle-naphthalene-benzene-343.5K-ward
  - sle-naphthalene-benzene-308.2K-mclaughlin
  - sle-naphthalene-benzene-318.2K-mclaughlin
  - sle-naphthalene-benzene-320.6K-mclaughlin
  - sle-naphthalene-benzene-336.4K-mclaughlin
  - sle-naphthalene-benzene-349.0K-mclaughlin
  - sle-biphenyl-benzene-298.15K-chang
  - sle-anthracene-benzene-298.15K-acree
  assessed:
    sle-anthracene-benzene-298.15K-acree: "solubility +36.7 % (ideal 0.009746 vs IUPAC-NIST evaluated 0.00713 at 298.15 K, Acree 1994 evaluation, sysID 58_57). Model limitation, not a bug: anthracene in benzene is strongly non-ideal (gamma ~ 1.37 at saturation); the ideal-solubility row claims gamma = 1 and carries no activity model, and the fusion constants are the CRC/databank tabulated values (Tm 489.15 K, Hfus 29.4 kJ/mol, consistent with NIST WebBook Tfus 490 K and Goursot et al. 29.37 kJ/mol). Measured 2026-11-04."
  l0: {}
  l0_excluded:
    pure_psat_limit: not a VLE package - pure_psat returns None by contract (an SLE row
      contributes no vapour-pressure correlation); the surface is solubility(cid, T)
    phase_identification: every flash-style entry point refuses by design (a solid-bearing
      stream must never be silently flashed as vapour/liquid); the SLE surface has no phase
      identification to check
    round_trip: flash_pt/flash_ph refuse by design (SLE surface only)
    dhdT_cp: phase_props refuses by design (no phase enthalpy or Cp is claimed)
    gibbs_duhem: gamma = 1 by construction (ideal solubility), so the Gibbs-Duhem identity
      holds identically; there is no phase_props ln_phi to evaluate it on
    single_liquid_limit: flash_pt refuses by design (SLE surface only)
    determinism: flash_pt refuses by design; solubility(cid, T) is a closed form of tabulated
      constants (two instances agree bit-for-bit, pinned in tests/thermo/test_special.py)
  l0_note: >-
    The L0 checks are flash-surface checks and this row refuses every flash by design;
    its own self-consistency is pinned in tests/thermo/test_special.py instead -
    x(Tm) == 1 exactly, x rising with T, bit-identical instances, the closed form
    against a hand reduction, and the IUPAC-NIST published points.

- id: hoc_dimer
  name: Dimerizing-acid gamma-phi (Hayden-O'Connell family, in-house kernel)
  family: special
  adapter: ngdesign.thermo.special:HaydenOConnellDimerPackage
  options: {}
  params:
    source: data/thermo_params/special/association.yaml
    provenance: >-
      In-house chemical-theory vapour (Marek & Standart, Collect. Czech. Chem.
      Commun. 19, 1074 (1954); Prausnitz, Lichtenthaler & de Azevedo,
      Molecular Thermodynamics of Fluid-Phase Equilibria, 3rd ed., sec.
      5.8-5.9): monomer, dimer and every non-associating component form an
      ideal-gas mixture in dimerization equilibrium Kp = p_D/p_M^2; the
      apparent fugacity of the acid is its monomer partial pressure, the
      non-associating components get phi = 1/Z, and H carries xi dH (dimers
      per apparent mole x association enthalpy). Acetic-acid parameters from
      Ritter & Simons, J. Am. Chem. Soc. 67, 757 (1945): log10 K2 = 3164/T -
      10.4184 (mmHg^-1), dH = -3164 R ln10 = -60.57 kJ/mol (verified via
      Sebastiani & Lacquaniti, Chem. Eng. Sci. 22, 1155 (1967);
      data/thermo_params/special/association.yaml). Liquid: ideal on apparent
      composition with the saturation fugacity coefficient of the acid
      (f_L = x phi_sat Psat, phi_sat the pure chemical-theory vapour at
      (T, Psat)), so a pure acid boils exactly at its databank Psat and the
      latent heat obeys Clapeyron with the associated vapour's Z. The curated
      nrtl_hoc / nrtl_nothnagel rows keep refusing acid-strength slates and
      point here.
  applicability:
    component_classes: [polar_organic, acid_gas]
    polar: true
    electrolyte: false
    T_K: [290.0, 400.0]
    P_Pa: [1000.0, 200000.0]
    phases: [V, L]
    notes: >-
      Carboxylic-acid vapour association via dimerization; exactly one
      associating component per support (a second one refuses: no
      cross-association constant is shipped); the other components are
      non-associating ideal-gas true species (acid-water cross-association
      and the physical virial of the non-acid species are not modelled).
      Liquid ideal on apparent composition. PROMOTED to provisional
      2026-11-04: the association kernel is now the flash's vapour phase
      (special.AssociatingGas; before, every flash of this row was plain
      Raoult with an IdealGas vapour), all seven L0 checks pass, and the
      flash surface is checked against published data in
      tests/thermo/test_special_association.py - vapour Z at 399.35 K /
      1 bar 0.6537 vs Mehling & Kleiber (2020) measured 0.6299 (+3.8 %,
      assessed); latent heat vs the CRC Handbook (95th ed.) table, 23.17 vs
      23.36 kJ/mol at 298.15 K (-0.8 %) and 24.54 vs 23.70 kJ/mol at the
      normal boiling point (+3.5 %), where an ideal-gas vapour would give
      39.1 kJ/mol. Applicability narrowed from 300-500 K / 2 MPa to the
      checked window: against the VDI Heat Atlas (2nd ed. 2010, D3.1)
      saturation table the latent-heat miss grows from +7.0 % at 391.15 K to
      +12.6 % at 420 K and +27 % at 460 K (dimer-only theory with the
      Ritter & Simons constant under-associates the saturated vapour at
      elevated pressure). The saturated-liquid Cp is ~20 % below the
      databank correlation (110 vs 145 J/(mol K) at 391 K): the known
      gamma-phi vapour-route limitation (no residual liquid Cp) the nrtl_hoc
      row also carries. Acetic acid/water VLE is not bound: T-19 found
      liquid non-ideality dominates the K-values at the Sebastiani &
      Lacquaniti (1967) 376.65 K midpoint (an association-only ideal-liquid
      K model gave K_w +7 % / K_a -15 % vs measured, monomer-only -4 % /
      -16 %), and no activity parameters regressed together with this vapour
      model are shipped. No harness compressibility or latent-heat case type
      exists, and binding cases needs the locked data/validation/ tree.
      2026-11-04: L1 bound - NIST WebBook normal boiling point and the
      McDonald et al. (1959) Antoine at 320 / 360 K, through the row's
      own pure-acid bubble point (-0.05 %, -0.55 %, -0.14 %; these test the
      databank Psat the row runs on, not the association constant). The
      Mehling & Kleiber Z point stays a unit test (its primary was not
      retrievable this session, and the harness Z band of 1 % would record
      it as a +3.8 % miss). No L2: no open acetic acid + water VLE table
      was retrieved (DDBST free pages 404, MDPI Chemistry 5, 165 (2023)
      403), and the ideal liquid already misses the Sebastiani &
      Lacquaniti K-values by 7-15 % (above). Stays provisional.
  status: provisional
  validation:
  - acoh-pure-tboil-nist
  - acoh-pure-psat-320K-mcdonald
  - acoh-pure-psat-360K-mcdonald
  l0:
    pure_psat_limit:
      points: [["AcOH", 330.0], ["AcOH", 380.0]]
    phase_identification:
      points: [["AcOH", 330.0], ["AcOH", 380.0]]
    round_trip:
      z: {AcOH: 0.5, H2O: 0.5}
      states: [[365.0, 50000.0], [400.0, 100000.0]]
    dhdT_cp:
      z: {AcOH: 0.5, H2O: 0.5}
      state: [400.0, 50000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {AcOH: 0.5, H2O: 0.5}
        T: 400.0
        P: 50000.0
        phase: vapor
    single_liquid_limit:
      z: {AcOH: 1.0}
      state: [330.0, 100000.0]
    determinism:
      z: {AcOH: 0.5, H2O: 0.5}
      state: [390.0, 50000.0]
  l0_excluded: {}
  l0_note: >-
    The liquid is ideal (gamma = 1), so the Gibbs-Duhem check runs on the
    associated vapour, where the apparent ln phi are not trivial; the
    liquid's identity holds by construction.

- id: hf_hexamer
  name: HF-hexamerizing gamma-phi (in-house kernel, Jarry & Davis parameters)
  family: special
  adapter: ngdesign.thermo.special:HFHexamerPackage
  options: {}
  params:
    source: data/thermo_params/special/association.yaml
    provenance: >-
      In-house chemical-theory vapour, the hoc_dimer construction with the
      monomer-hexamer equilibrium 6 HF <=> (HF)6 (special.AssociatingGas with
      n = 6): log10 Kp = a + b/T regressed from saturated-vapour densities by
      Jarry & Davis (J. Phys. Chem. 57, 600 (1953)), converted from their
      mmHg pressure basis to Pa; association enthalpy -R b ln10 = -165.8 kJ
      per mole of hexamer. Schotte (Ind. Eng. Chem. Process Des. Dev. 19, 432
      (1980)) is the oligomer-treatment reference for HF vapour association.
      Liquid ideal on apparent composition with HF's saturation fugacity
      coefficient (PhiSat basis).
  applicability:
    component_classes: [polar_organic, acid_gas]
    polar: true
    electrolyte: false
    T_K: [270.0, 380.0]
    P_Pa: [1000.0, 500000.0]
    phases: [V, L]
    notes: >-
      HF vapour association via the hexamerization equilibrium; one
      associating component per support, the others non-associating ideal
      gases; liquid ideal on apparent composition. Since 2026-11-04 the
      kernel IS the flash's vapour phase (before, the row flashed with an
      IdealGas vapour), the hexamer kernel function is a thin call into the
      shared chemical-theory state, and through the flash the saturated
      vapour reproduces the Jarry & Davis association factors at their own
      Antoine pressure (3.486 vs 3.580 at 298.16 K, -2.6 %; 3.395 vs 3.438 at
      303.16 K, -1.2 %; tests/thermo/test_special_association.py). L0 by hand on 2026-11-04: pure Psat
      limit, phase identification, PH/PS round trips, Gibbs-Duhem and the
      single-liquid limit pass; dhdT_cp passes at its analytic level (Cp
      matches a 1e-3 K stencil to 1e-9) but the harness's 0.5 K stencil
      missed by 7e-4 at 300 K / 50 kPa because the hexamer enthalpy is
      strongly curved there. Was experimental for the caloric surface: the
      databank HF vapour pressure (thermo's default "Fit 2023") gave 109.34
      kPa at the 292.69 K normal boiling point and a nearly flat
      d ln Psat/dT across 300-310 K, so the PhiSat liquid Cp collapsed
      (0.1-1.7 J/(mol K)) and the latent heat missed the VDI Heat Atlas
      table by -14.4 % at the boiling point. FIXED AT THE ROOT 2026-11-04:
      data/thermo_params/psat_methods.yaml selects the Perry 8E (DIPPR eq.
      101, Table 2-8) HF correlation in every constants build
      (ngdesign.thermo._state.apply_psat_overrides), 101.01 kPa at 292.69 K
      and agreeing with Jarry & Davis's own Antoine within ~1 %. Measured
      after the fix (tests/thermo/test_special_association.py): latent heat
      vs VDI D3.1 +7.1 % (292.69 K), +2.7 % (305 K), -0.9 % (325 K), +1.3 %
      (345 K), +5.4 % (365 K); saturated-liquid Cp 37-38 J/(mol K) at
      295-310 K vs the VDI table's 61-62 (the gamma-phi vapour-route
      limitation with no residual liquid Cp, as on hoc_dimer). PROMOTED to
      provisional: physics complete for its claim, all seven L0 checks pass
      (dhdT_cp declared on the vapour at 370 K / 50 kPa, where the 0.5 K
      stencil resolves the curvature). L1 bound: NIST WebBook normal boiling
      point (Streng 1971) and the Sheft et al. (1973) Antoine at 278.15 /
      298.15 K, all passing - they check the Psat the row runs on, not the
      association constants. No L2: the only liquid model is ideal, and
      HF/water (azeotropic, strongly non-ideal) is the binary with data;
      binding it would be a known miss of the liquid model, not a test of
      the vapour. Not validated.
  status: provisional
  validation:
  - hf-pure-tboil-streng
  - hf-pure-psat-278.15K-sheft
  - hf-pure-psat-298.15K-sheft
  l0:
    pure_psat_limit:
      points: [["HF", 280.0], ["HF", 330.0]]
    phase_identification:
      points: [["HF", 280.0], ["HF", 330.0]]
    round_trip:
      z: {HF: 0.5, H2O: 0.5}
      states: [[300.0, 20000.0], [360.0, 100000.0]]
    dhdT_cp:
      z: {HF: 0.5, H2O: 0.5}
      state: [370.0, 50000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {HF: 0.5, H2O: 0.5}
        T: 320.0
        P: 50000.0
        phase: vapor
    single_liquid_limit:
      z: {HF: 1.0}
      state: [280.0, 200000.0]
    determinism:
      z: {HF: 0.5, H2O: 0.5}
      state: [330.0, 50000.0]
  l0_excluded: {}
  l0_note: >-
    The liquid is ideal (gamma = 1), so the Gibbs-Duhem check runs on the
    associated vapour; dhdT_cp runs on the vapour at 370 K / 50 kPa (the
    liquid also passes at 300 K / 300 kPa: Cp 37.8904 vs dH/dT 37.8903).

- id: polymer_pc_saft
  name: Polymer PC-SAFT (teqp bridge)
  family: special
  adapter: ngdesign.thermo.special:PolymerPCSAFT
  options: {}
  params:
    source: data/thermo_params/special/polymer.yaml (polymer_pc_saft section)
    provenance: >-
      PC-SAFT segment parameters for the polystyrene pseudo-component POLY_PS
      (AlHammadi & Abutaqiya, ACS Omega 5, 29530 (2020), Table 1, attributing
      Gross & Sadowski 2001) and the solvent toluene (Gross & Sadowski, Ind.
      Eng. Chem. Res. 40, 1244 (2001), Table 1; cross-checked against the
      feos-pcsaft project's literature parameter record). Builds through the
      T-07 teqp bridge (ngdesign.thermo.teqp_bridge); k_ij = 0 - no
      verifiable open citation for this pair's interaction parameter.
  applicability:
    component_classes: [hydrocarbon, polar_organic]
    polar: false
    electrolyte: false
    T_K: [250.0, 500.0]
    P_Pa: [1000.0, 10000000.0]
    phases: [V, L]
    notes: >-
      Solvent/polymer supports through the T-07 bridge: constructs without
      teqp and refuses at first use like every saft row
      (SaftDependencyMissing without the optional extra; SaftParameterError
      naming any component without verified parameters). POLY_PS is the
      registered pseudo-component of P1-07 (Mw 400,000 g/mol, m = 7600
      segments). T-19 (2026-10-23): the source paper is open access (ACS
      Omega), but it publishes no polystyrene/toluene binary equilibrium
      table an ideal-free k_ij = 0 bridge could be bound against, and the
      kernel refuses at first use without the optional saft extra, so a bound
      case cannot run in the default local environment. Row stays
      experimental. Rechecked 2026-11-03: unchanged - teqp is still absent
      locally (the kernel smoke test skips), no published polystyrene/toluene
      binary table with a verifiable licence was retrieved (see
      flory_huggins), and k_ij = 0 has no cited value, so no published-
      reference test exists for the row's solvent activity. Stays
      experimental.
  status: experimental
  validation: []
