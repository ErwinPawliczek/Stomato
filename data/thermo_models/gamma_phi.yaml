  assessed:
    ddb11-acetoneh2o-101.33kPa-x0.736: "y 0.8779 vs 0.9090 (abs 0.031 > 0.02) - databank-pair deviation at this point of the 101.33 kPa isobar (acetone/H2O: Reinders & de Minjer 1947; acetone/MeOH: Amer et al. 1956); other points of the set pass on this row (measured 2026-11-04)"
    ddb451-meohetoh-101.33kPa-x0.134: "y 0.2058 vs 0.1830 (abs 0.023 > 0.02) - data scatter at the dilute point: the databank rows give y_MeOH 0.20-0.21 against Amer et al. (1956) 0.183, while the DDB sets 2120 (Delzenne 1958, x 0.142, y 0.222) and 2719 (Slobodyanik 1966, x 0.142, y 0.194) on the same page bracket the model; the other two points of the set pass (measured 2026-11-04)"
    ddb4731-h2omeg-3.333kPa-x0.1: "bubble_T 342.442 vs 347.65 (-1.50%, band 0.5%) - extrapolation of the in-house MEG/H2O pair (T-independent energies fitted to the single 431.25 K / 1-atm Perry's point) to the 3.33 kPa isobar at the MEG-rich end (348 K); the water-rich points of the set pass (measured 2026-11-04)"
    ddb521-nc6etoh-101.33kPa-x0.08: "y 0.4475 vs 0.4200 (abs 0.028 > 0.02) - databank-pair deviation at this point of the Sinor & Weber (1960) isobar; other points pass (measured 2026-11-04)"
    ddb586-acetonemeoh-101.33kPa-x0.683: "y 0.6830 vs 0.7050 (abs 0.022 > 0.02) - databank-pair deviation at this point of the 101.33 kPa isobar (acetone/H2O: Reinders & de Minjer 1947; acetone/MeOH: Amer et al. 1956); other points of the set pass on this row (measured 2026-11-04)"
    wilson-ig-megh2o-383.15K-101.325kPa: "bubble_T 379.439 vs 383.15 (-0.97%, band 0.5%) - extrapolation of a single-point MEG/H2O fit (fitted at the 431.25 K point only) to the water-rich side (measured 2026-11-04)"
    wilson-ig-meohh2o-101.325kPa-349.05K: "y 0.6993 vs 0.7197 (abs 0.020 > 0.02) - band-edge vapour-composition miss of the databank pair against Gao (2012) (measured 2026-11-04)"
    wilson-ig-meohh2o-312.91K-20.705kPa: "bubble_P 22399.6 vs 20705 (+8.18%, band 3.0%); y 0.7602 vs 0.8053 (abs 0.045 > 0.02) - data quality suspected: every correlative row and every databank pair over-predicts this Bredig & Bayer (1927) 312.91 K isotherm the same way while the Gao (2012) 1-atm isobar passes; a Bredig et al. MeOH/H2O set is rated thermodynamically inconsistent (gamma-offset 6.7 %, Fredenslund 4.67 %) in 'A New Method for Testing Thermodynamic Consistency of Vapor-Liquid Equilibrium Data', ACS Omega 2025, PMC12529394, Tables 1-2 (measured 2026-11-04)"
    wilson-ig-pure-MeOH-330K: "rho_V 0.869469 vs 0.911218 (-4.58%, band 3.0%) - rho_V: the ideal vapour has no association term and cannot carry saturated-vapour non-ideality at this point (CoolProp Z < 1); the HOC and Nothnagel virial pairings meet the MeOH 330 K point (measured 2026-11-04)"
  references:
