  # 2026-10-22), so the row stays provisional with the fit points as regression pins.
  references:
  - Abrams, D. S. & Prausnitz, J. M., AIChE J. 21(1), 116-128, 1975
  - Maurer, G. & Prausnitz, J. M., Fluid Phase Equilib. 2(2), 91-99, 1978 (r,q form)
