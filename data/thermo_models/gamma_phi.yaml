    unifac-pure-EtOH-etohnc4-333.2K: "bubble_P 46838.7 vs 50000 (err 0.0632, tol 0.03) - data limitation, not the model: Machida et al. (2014) list the pure-ethanol endpoint at 50 kPa (integer kPa); CoolProp 8.0.0 Ethanol gives 46.84 kPa at 333.2 K, equal to this row's Psat, and the independent Fukano et al. (2006) pure-EtOH point (349.45 K, 93.32 kPa) passes at 0.2 % (measured 2026-11-04)"
    unifac-etohh2o-101.3kPa-xEtOH0.244: "vapor_comp 0.546629 vs 0.567 (err 0.0204, tol 0.02 abs) - marginal model miss of the variant's alcohol/H2O group parameters (just beyond 0.02 abs); bubble T passes (measured 2026-11-04)"
    unifac-megh2o-101.3kPa-xH2O0.25: "bubble_T 408.145 vs 415.27 (err 0.0172, tol 0.005); vapor_comp 0.918122 vs 0.892 (err 0.0261, tol 0.02 abs) - model limitation: the Lyngby table has no DOH (ethylene glycol) group, so MEG is built from 2 CH2 + 2 OH and the diol proximity effect is missing (the four variants with a DOH group pass all three MEG/H2O points) (measured 2026-11-04)"
    unifac-megh2o-101.3kPa-xH2O0.501: "bubble_T 387.947 vs 393.53 (err 0.0142, tol 0.005) - model limitation: the Lyngby table has no DOH (ethylene glycol) group, so MEG is built from 2 CH2 + 2 OH and the diol proximity effect is missing (the four variants with a DOH group pass all three MEG/H2O points) (measured 2026-11-04)"
    unifac-megh2o-101.3kPa-xH2O0.747: "bubble_T 378.685 vs 381.51 (err 0.0074, tol 0.005) - model limitation: the Lyngby table has no DOH (ethylene glycol) group, so MEG is built from 2 CH2 + 2 OH and the diol proximity effect is missing (the four variants with a DOH group pass all three MEG/H2O points) (measured 2026-11-04)"
    unifac-etohmeg-101.3kPa-xEtOH0.219: "bubble_T 391.475 vs 384.1 (err 0.0192, tol 0.005) - model limitation: EtOH/MEG bubble temperatures at x_EtOH <= 0.48 are over-predicted by the variant's OH/DOH (or OH/CH2) group interactions, on the ideal-gas pairing as well; the x_EtOH 0.734 point and every vapour composition pass (measured 2026-11-04)"
    unifac-etohmeg-101.3kPa-xEtOH0.482: "bubble_T 369.259 vs 366.65 (err 0.0071, tol 0.005) - model limitation: EtOH/MEG bubble temperatures at x_EtOH <= 0.48 are over-predicted by the variant's OH/DOH (or OH/CH2) group interactions, on the ideal-gas pairing as well; the x_EtOH 0.734 point and every vapour composition pass (measured 2026-11-04)"
    unifac-etohnc4-333.2K-xnC40.2524: "bubble_P 471361 vs 492000 (err 0.0419, tol 0.03) - model limitation: UNIFAC group-contribution prediction of this strongly non-ideal alcohol/n-butane system (ideal-gas vapour, so the error is the gE model). (measured 2026-11-04)"

