    - VLL
  # L2 (2026-11-09, val-gphi2): the Magnussen LLE group map now also covers 1-butanol,
  # 1-pentanol and ethyl acetate; 9 organic-rich-liquid tie-line points (ThermoML: Lladosa 2008,
  # Grande & Marschoff 2005, Huang 2011; harness `liquid_rich_in`) are bound. 1 passes, 8 miss
  # (assessed below): the L2 majority rule fails, so the row stays provisional.
  status: provisional
  validation:
  - unifac-pure-H2O-meohh2o-66.52kPa
  - unifac-pure-nC4-meohnc4-364.5K
  - unifac-pure-nC4-etohnc4-333.2K
  - unifac-lle-buh2o-101.3kPa-323.15K-organic
  - unifac-lle-buh2o-101.3kPa-343.15K-organic
  - unifac-lle-buh2o-101.3kPa-362.45K-organic
  - unifac-lle-eah2o-101.3kPa-298.15K-organic
  - unifac-lle-eah2o-101.3kPa-313.15K-organic
  - unifac-lle-eah2o-101.3kPa-333.15K-organic
  - unifac-lle-peh2o-101.33kPa-293.15K-organic
  - unifac-lle-peh2o-101.33kPa-303.15K-organic
  - unifac-lle-peh2o-101.33kPa-323.15K-organic
  assessed:
    unifac-lle-buh2o-101.3kPa-343.15K-organic: "liquid_comp x_1-butanol 0.4464 vs 0.4189 (abs 0.0275, band 0.02) - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
    unifac-lle-buh2o-101.3kPa-362.45K-organic: "liquid_comp x_1-butanol 0.4376 vs 0.3673 (abs 0.0703, band 0.02) - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
    unifac-lle-eah2o-101.3kPa-298.15K-organic: "liquid_comp x_H2O (organic liquid) 0.1222 vs 0.1733 (abs 0.0511, band 0.02); water solubility in ethyl acetate under-predicted at every T - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
    unifac-lle-eah2o-101.3kPa-313.15K-organic: "liquid_comp x_H2O (organic liquid) 0.1365 vs 0.2111 (abs 0.0746, band 0.02) - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
    unifac-lle-eah2o-101.3kPa-333.15K-organic: "liquid_comp x_H2O (organic liquid) 0.1558 vs 0.2414 (abs 0.0856, band 0.02) - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
    unifac-lle-peh2o-101.33kPa-293.15K-organic: "liquid_comp x_1-pentanol 0.5790 vs 0.6562 (abs 0.0772, band 0.02); water in the 1-pentanol-rich liquid over-predicted - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
    unifac-lle-peh2o-101.33kPa-303.15K-organic: "liquid_comp x_1-pentanol 0.5778 vs 0.6484 (abs 0.0706, band 0.02) - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
    unifac-lle-peh2o-101.33kPa-323.15K-organic: "liquid_comp x_1-pentanol 0.5751 vs 0.6245 (abs 0.0494, band 0.02) - model limitation, not a bug: the Magnussen (1981) LLE table is a temperature-independent group-contribution fit (organic-liquid errors 0.05-0.09 already at 293-298 K for ethyl acetate and 1-pentanol, i.e. table accuracy for these systems), and the predicted organic-phase composition barely moves with T (1-butanol 0.455 -> 0.438 over 323-362 K vs measured 0.457 -> 0.367); the same predictions on all five vapour pairings (the vapour does not enter a PT LLE split); 1-butanol at 323.15 K passes (0.4554 vs 0.4574) (measured 2026-11-09)"
  references:
  - Magnussen, T., Rasmussen, P. & Fredenslund, A., Ind. Eng. Chem. Process Des. Dev. 20(2), 331-339, 1981
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
    determinism:
      state:
      - 380.0
      - 50000.0
      z:
        H2O: 0.5
        nC4: 0.5
    dhdT_cp:
      phase: vapor
      state:
      - 380.0
      - 50000.0
      z:
        H2O: 0.5
        nC4: 0.5
    gibbs_duhem:
      binaries:
      - z:
          H2O: 0.5
          nC4: 0.5
        T: 350.0
        P: 100000.0
        phase: aqueous
    phase_identification:
      points:
      - - H2O
        - 350.0
      - - H2O
        - 400.0
    pure_psat_limit:
      points:
      - - H2O
        - 300.0
      - - H2O
        - 350.0
    round_trip:
      states:
      - - 380.0
        - 50000.0
      - - 400.0
        - 100000.0
      z:
        H2O: 0.5
        nC4: 0.5
    single_liquid_limit:
      state:
      - 298.15
      - 100000.0
      z:
        H2O: 1.0
  l0_excluded: {}

