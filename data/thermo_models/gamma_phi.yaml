    ddb4731-h2omeg-3.333kPa-x0.1: "bubble_T 339.494 vs 347.65 (-2.35%, band 0.5%); y 0.9224 vs 0.8960 (abs 0.026 > 0.02) - extrapolation of the in-house MEG/H2O pair (T-independent energies fitted to the single 431.25 K / 1-atm Perry's point) to the 3.33 kPa isobar at the MEG-rich end (348 K); the water-rich points of the set pass (measured 2026-11-04)"
    ddb4731-h2omeg-3.333kPa-x0.404: "bubble_T 313.84 vs 315.95 (-0.67%, band 0.5%) - extrapolation of the in-house MEG/H2O pair (T-independent energies fitted to the single 431.25 K / 1-atm Perry's point) to the 3.33 kPa isobar at the MEG-rich end (348 K); the water-rich points of the set pass (measured 2026-11-04)"
    ddb549-etohh2o-50.66kPa-x0.3495: "y 0.6255 vs 0.5945 (abs 0.031 > 0.02) - the in-house pair was fitted to the 1-atm azeotrope alone (T-independent energy form); its composition dependence away from the azeotrope at 50.66 kPa misses Beebe et al. (1942) (measured 2026-11-04)"
    margules-ig-megh2o-383.15K-101.325kPa: "bubble_T 379.79 vs 383.15 (-0.88%, band 0.5%) - extrapolation of a single-point MEG/H2O fit (fitted at the 431.25 K point only) to the water-rich side (measured 2026-11-04)"
    margules-ig-megh2o-431.25K-101.325kPa: "bubble_T 428.785 vs 431.25 (-0.57%, band 0.5%) - the Margules A12/A21 were fitted at this point for q1 = q2; the Scatchard-Hamer volume ratio of the Wohl form moves the interior of the curve (measured 2026-11-04)"
    margules-ig-pure-H2O-340K: "Cp 70.2529 vs 75.4562 (-6.90%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    margules-ig-pure-H2O-370K: "Cp 66.6483 vs 75.8833 (-12.17%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    margules-ig-pure-MeOH-305K: "Cp 73.3846 vs 82.6135 (-11.17%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    margules-ig-pure-MeOH-330K: "rho_V 0.869469 vs 0.911218 (-4.58%, band 3.0%); Cp 73.1651 vs 88.5047 (-17.33%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points; rho_V: the ideal vapour has no association term and cannot carry saturated-vapour non-ideality at this point (CoolProp Z < 1); the HOC and Nothnagel virial pairings meet the MeOH 330 K point (measured 2026-11-04)"
