    uniquac-ig-meohh2o-312.91K-20.705kPa: "bubble_P 21355 vs 20705 (+3.14%, band 3.0%); y 0.7573 vs 0.8053 (abs 0.048 > 0.02) - data quality suspected: every correlative row and every databank pair over-predicts this Bredig & Bayer (1927) 312.91 K isotherm the same way while the Gao (2012) 1-atm isobar passes; a Bredig et al. MeOH/H2O set is rated thermodynamically inconsistent (gamma-offset 6.7 %, Fredenslund 4.67 %) in 'A New Method for Testing Thermodynamic Consistency of Vapor-Liquid Equilibrium Data', ACS Omega 2025, PMC12529394, Tables 1-2 (measured 2026-11-04)"
    uniquac-ig-pure-H2O-340K: "Cp 70.2529 vs 75.4562 (-6.90%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    uniquac-ig-pure-H2O-370K: "Cp 66.6483 vs 75.8833 (-12.17%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    uniquac-ig-pure-MeOH-305K: "Cp 73.3846 vs 82.6135 (-11.17%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    uniquac-ig-pure-MeOH-330K: "rho_V 0.869469 vs 0.911218 (-4.58%, band 3.0%); Cp 73.1651 vs 88.5047 (-17.33%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points; rho_V: the ideal vapour has no association term and cannot carry saturated-vapour non-ideality at this point (CoolProp Z < 1); the HOC and Nothnagel virial pairings meet the MeOH 330 K point (measured 2026-11-04)"
  # T-15: the 383.15 K point is the independent check (different T from the 431.25 K fit
  # point; Coker/Perry T-x-y table) — the single-point MEG/H2O fit misses it (measured
  # 2026-10-22), so the row stays provisional with the fit points as regression pins.
  references:
  - Abrams, D. S. & Prausnitz, J. M., AIChE J. 21(1), 116-128, 1975
  - Maurer, G. & Prausnitz, J. M., Fluid Phase Equilib. 2(2), 91-99, 1978 (r,q form)
  - Kooijman, H. A. & Taylor, R., The ChemSep Book, 2nd ed., 2000 (IPDB)
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
    gibbs_duhem:
      binaries:
      - z:
          MeOH: 0.5
          H2O: 0.5
        T: 350.0
        P: 100000.0
        phase: aqueous
  l0_excluded: {}

