  assessed:
    ddb11-acetoneh2o-101.33kPa-x0.094: "bubble_T 340.759 vs 342.65 (-0.55%, band 0.5%) - databank-pair deviation at this point of the 101.33 kPa isobar (acetone/H2O: Reinders & de Minjer 1947; acetone/MeOH: Amer et al. 1956); other points of the set pass on this row (measured 2026-11-04)"
    ddb11-acetoneh2o-101.33kPa-x0.736: "y 0.8817 vs 0.9090 (abs 0.027 > 0.02) - databank-pair deviation at this point of the 101.33 kPa isobar (acetone/H2O: Reinders & de Minjer 1947; acetone/MeOH: Amer et al. 1956); other points of the set pass on this row (measured 2026-11-04)"
    ddb133-meohnc6-333.15K-x0.098: "y 0.5067 vs 0.4820 (abs 0.025 > 0.02) - databank pair regressed with an ideal vapour: the ideal-gas pairing passes these Scheller (1969) 333.15 K points, the non-ideal vapour pairings sit 5-8 % high in bubble P at 145-149 kPa (measured 2026-11-04)"
    ddb451-meohetoh-101.33kPa-x0.134: "y 0.2076 vs 0.1830 (abs 0.025 > 0.02) - data scatter at the dilute point: the databank rows give y_MeOH 0.20-0.21 against Amer et al. (1956) 0.183, while the DDB sets 2120 (Delzenne 1958, x 0.142, y 0.222) and 2719 (Slobodyanik 1966, x 0.142, y 0.194) on the same page bracket the model; the other two points of the set pass (measured 2026-11-04)"
    nrtl-ig-meohh2o-312.91K-20.705kPa: "bubble_P 21918.3 vs 20705 (+5.86%, band 3.0%); y 0.7594 vs 0.8053 (abs 0.046 > 0.02) - data quality suspected: nearly every correlative row misses this Bredig & Bayer (1927) 312.91 K isotherm (bubble P high by 3-10 %, y low by 0.04-0.05) while the Gao (2012) 1-atm isobar passes; a Bredig et al. MeOH/H2O set is rated thermodynamically inconsistent (gamma-offset 6.7 %, Fredenslund 4.67 %) in 'A New Method for Testing Thermodynamic Consistency of Vapor-Liquid Equilibrium Data', ACS Omega 2025, PMC12529394, Tables 1-2 (measured 2026-11-04)"
    nrtl-ig-meohnc4-323.22K-0.3366MPa: "bubble_P 301146 vs 336600 (-10.53%, band 3.0%) - databank limitation: the ChemSep NRTL MeOH/nC4 pair does not reproduce the Courtial et al. (2009) 323.22 K point (known since T-12) (measured 2026-11-04)"
    nrtl-ig-pure-H2O-340K: "Cp 70.2529 vs 75.4562 (-6.90%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    nrtl-ig-pure-H2O-370K: "Cp 66.6483 vs 75.8833 (-12.17%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    nrtl-ig-pure-MeOH-305K: "Cp 73.3846 vs 82.6135 (-11.17%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points (measured 2026-11-04)"
    nrtl-ig-pure-MeOH-330K: "rho_V 0.869469 vs 0.911218 (-4.58%, band 3.0%); Cp 73.1651 vs 88.5047 (-17.33%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points; rho_V: the ideal vapour has no association term and cannot carry saturated-vapour non-ideality at this point (CoolProp Z < 1); the HOC and Nothnagel virial pairings meet the MeOH 330 K point (measured 2026-11-04)"
  references:
  - Renon, H. & Prausnitz, J. M., AIChE J. 14(1), 135-144, 1968
  - Kooijman, H. A. & Taylor, R., The ChemSep Book, 2nd ed., 2000 (IPDB)
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
    gibbs_duhem:
      binaries:
      - z:
          MeOH: 0.5
          H2O: 0.5
        T: 350.0
        P: 100000.0
        phase: aqueous
  l0_excluded: {}

