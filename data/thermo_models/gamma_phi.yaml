  - unifac-meohh2o-66.52kPa-xMeOH0.705
  - unifac-meohnc4-364.5K-xnC40.2239
  - unifac-meohnc4-364.5K-xnC40.4969
  - unifac-meohnc4-364.5K-xnC40.745
  - unifac-etohnc4-333.2K-xnC40.2524
  - unifac-etohnc4-333.2K-xnC40.4551
  - unifac-etohnc4-333.2K-xnC40.7548
  references:
  - Larsen, B. L., Rasmussen, P. & Fredenslund, A., Ind. Eng. Chem. Res. 26(11), 2274-2286, 1987
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
