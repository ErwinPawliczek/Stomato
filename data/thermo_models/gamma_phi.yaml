    unifac-etohnc4-333.2K-xnC40.2524: "bubble_P 466781 vs 492000 (err 0.0513, tol 0.03) - model limitation: UNIFAC group-contribution prediction of this strongly non-ideal alcohol/n-butane system (ideal-gas vapour, so the error is the gE model). (measured 2026-11-04)"

