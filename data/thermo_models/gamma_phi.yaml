    pure-MeOH-330K-nrtl: "rho_V 0.882017 vs 0.911218 (-3.20%, band 3.0%); Cp 73.1651 vs 88.5047 (-17.33%, band 5.0%) - model limitation, not a bug: the vapour-route caloric (thermo GibbsExcessLiquid default) builds liquid H as H_ig - RT^2 dlnPsat/dT (ideal-gas Clausius-Clapeyron: no vapour non-ideality, no Poynting), so Cp_L = Cp_ig - d/dT(RT^2 dlnPsat/dT); the same number follows from CoolProp's own Psat (H2O 340 K: 70.24 vs 75.46 J/mol/K), and the error grows with T. The liquid_reference caloric (wilson_lr_ig) meets these points; rho_V: the pr vapour has no association term and cannot carry saturated-vapour non-ideality at this point (CoolProp Z < 1); the HOC and Nothnagel virial pairings meet the MeOH 330 K point (measured 2026-11-04)"
