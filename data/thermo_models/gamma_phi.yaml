- id: nrtl
  name: NRTL liquid + Peng-Robinson vapour
  family: gamma_phi
  adapter: ngdesign.thermo.nrtl:NrtlThermo
  options: {}
  params:
    source: thermo IPDB (ChemSep), 'ChemSep NRTL' binary table
    provenance: Renon, H. & Prausnitz, J. M., 'Local Compositions in Thermodynamic Excess Functions for
      Liquid Mixtures', AIChE J. 14(1), 135-144, 1968; binary parameters from the ChemSep IPDB 'NRTL original
      T' form; databank coverage is limited (MeOH/H2O, MeOH/nC4, MeOH/C6+ pairs)
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation:
  - meohh2o-97.99kPa-369.65K
  - meohh2o-97.99kPa-365.45K
  - meohh2o-97.99kPa-360.65K
  - meohh2o-97.99kPa-353.25K
  - meohh2o-97.99kPa-349.05K
  - meohh2o-97.99kPa-343.75K
  - meohh2o-97.99kPa-341.85K
  - meohh2o-97.99kPa-339.55K
  - meohh2o-312.91K-9.079kPa
  - meohh2o-312.91K-13.012kPa
  - meohh2o-312.91K-16.319kPa
  - meohh2o-312.91K-20.705kPa
  - meohh2o-312.91K-23.385kPa
  - meohh2o-312.91K-27.518kPa
  - meohh2o-312.91K-32.571kPa
  - meohh2o-322.91K-15.932kPa
  - meohh2o-322.91K-26.131kPa
  - meohh2o-322.91K-31.544kPa
  - meohh2o-322.91K-40.850kPa
  - meohh2o-322.91K-46.450kPa
  - meohh2o-322.91K-52.142kPa
  references:
  - Renon, H. & Prausnitz, J. M., AIChE J. 14(1), 135-144, 1968
  - Kooijman, H. A. & Taylor, R., The ChemSep Book, 2nd ed., 2000 (IPDB)
  l0: {}
  l0_excluded: {}
  l0_note: 'pure hydrocarbons are NOT phase-identification points: thermo''s pure-component vapour-pressure
    correlation sits ~8% above the ChemSep databank Psat for nC4 at 300 K (measured condensation at 2.78e5
    Pa vs databank 2.58e5 Pa), so a bracket on the databank Psat lands inside the model''s own two-phase
    region; MeOH/H2O correlations agree with the databank and are used instead'
  assessed:
    pure-H2O-340K-nrtl: "Cp -6.9% (70.2529 vs 75.4562) - NRTL databank carries no residual liquid-Cp contribution for pure MeOH/H2O (Cp under-predicted); vapour density at the 3% band edge (measured 2026-10-22, PR #161 table)"
    pure-H2O-370K-nrtl: "Cp -12.2% (66.6483 vs 75.8833) - NRTL databank carries no residual liquid-Cp contribution for pure MeOH/H2O (Cp under-predicted); vapour density at the 3% band edge (measured 2026-10-22, PR #161 table)"
    pure-MeOH-305K-nrtl: "Cp -11.2% (73.3846 vs 82.6135) - NRTL databank carries no residual liquid-Cp contribution for pure MeOH/H2O (Cp under-predicted); vapour density at the 3% band edge (measured 2026-10-22, PR #161 table)"
    pure-MeOH-330K-nrtl: "Cp -17.3% (73.1651 vs 88.5047); rho_V -3.2% (0.882017 vs 0.911218) - NRTL databank carries no residual liquid-Cp contribution for pure MeOH/H2O (Cp under-predicted); vapour density at the 3% band edge (measured 2026-10-22, PR #161 table)"
- id: nrtl_ig
  name: NRTL liquid + ideal gas vapour
  family: gamma_phi
  adapter: ngdesign.thermo.gamma_phi:GammaPhiPackage
  options:
    liquid: nrtl
    vapour: ideal
  params:
    source: thermo IPDB (ChemSep), 'ChemSep NRTL' binary table (as the pre-existing nrtl row consumes it)
    provenance: no in-house overrides - pairs the databank lacks raise rather than falling back to ideal
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  references:
  - Renon, H. & Prausnitz, J. M., AIChE J. 14(1), 135-144, 1968
  - Kooijman, H. A. & Taylor, R., The ChemSep Book, 2nd ed., 2000 (IPDB)
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
    gibbs_duhem:
      binaries:
      - z:
          MeOH: 0.5
          H2O: 0.5
        T: 350.0
        P: 100000.0
        phase: aqueous
  l0_excluded: {}

