      outside the curated set raises rather than predicting
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  references:
  - Magnussen, T., Rasmussen, P. & Fredenslund, A., Ind. Eng. Chem. Process Des. Dev. 20(2), 331-339, 1981
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
    determinism:
      state:
      - 380.0
      - 50000.0
      z:
        H2O: 0.5
        nC4: 0.5
    dhdT_cp:
      phase: vapor
      state:
      - 380.0
      - 50000.0
      z:
        H2O: 0.5
        nC4: 0.5
    gibbs_duhem:
      binaries:
      - z:
          H2O: 0.5
          nC4: 0.5
        T: 350.0
        P: 100000.0
        phase: aqueous
    phase_identification:
      points:
      - - H2O
        - 350.0
      - - H2O
        - 400.0
    pure_psat_limit:
      points:
      - - H2O
        - 300.0
      - - H2O
        - 350.0
    round_trip:
      states:
      - - 380.0
        - 50000.0
      - - 400.0
        - 100000.0
      z:
        H2O: 0.5
        nC4: 0.5
    single_liquid_limit:
      state:
      - 298.15
      - 100000.0
      z:
        H2O: 1.0
  l0_excluded: {}

