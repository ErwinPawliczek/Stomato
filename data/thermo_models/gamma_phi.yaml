- id: nrtl_hoc
  name: NRTL liquid + Hayden-O'Connell virial vapour
  family: gamma_phi
  adapter: ngdesign.thermo.gamma_phi:GammaPhiPackage
  options:
    liquid: nrtl
    vapour: hoc
  params:
    source: Hayden-O'Connell (1975) equation set transcribed from open sources (Lehigh 1986 MSc
      thesis Appendix A; COBEQ-2014 proceedings paper; the Prausnitz-1980 book BIJS2 Fortran as
      printed in the Maiorella LBL report LBL-1991); eta table data/thermo_params/virial/hoc_eta.yaml
      from ChemSep Lite 8.50 HAYDENO.IPD
    provenance: real second-virial kernel in ngdesign.thermo.virial; slates with a pure eta >= 4.0
      component refuse (the Prausnitz-1980 apparent-fugacity correction for strongly associating
      vapours is not available from open sources; use hoc_dimer for acids)
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation: &nrtl-hoc-cases
  - pure-H2O-323.5K-hoc
  - pure-H2O-420K-hoc
  - pure-nC4-350K-hoc
  - meohh2o-101.325kPa-366.0K-hoc
  - meohh2o-101.325kPa-361.35K-hoc
  - meohh2o-101.325kPa-356.95K-hoc
  - meohh2o-101.325kPa-353.25K-hoc
  - meohh2o-101.325kPa-349.05K-hoc
  - meohh2o-101.325kPa-346.20K-hoc
  - meohh2o-101.325kPa-343.31K-hoc
  - meohh2o-101.325kPa-341.20K-hoc
  references:
  - Hayden, R. S. & O'Connell, J. P., Ind. Eng. Chem. Process Des. Dev. 14(3), 221-239, 1975
    (equations; open transcriptions Lehigh 1986 MSc thesis Appendix A, COBEQ-2014, Maiorella LBL
    report LBL-1991)
  - Prausnitz, J. M., Anderson, T., Grens, E., Eckert, C., Hsieh, R. & O'Connell, J. P., Computer
    Calculations for Multicomponent Vapor-Liquid and Liquid-Liquid Equilibria, Prentice-Hall, 1980
    (BIJS2 Fortran; eta table via ChemSep Lite 8.50 HAYDENO.IPD)
  l0: {}
  l0_excluded: {}
  assessed:
    pure-H2O-420K-hoc: "Cp -23.9% (58.9479 vs 77.4472) - gamma-phi packages carry no residual liquid-Cp contribution, so saturated-liquid Cp under-predicts away from 298 K (the same limitation the amine row assessed per the PR #161 table; measured 2026-10-22)"
    pure-nC4-350K-hoc: "Cp -30.8% (113.4552 vs 163.8853) - same known gamma-phi liquid-Cp limitation (no residual liquid-Cp contribution; measured 2026-10-22)"
    meohh2o-101.325kPa-341.20K-hoc: "bubble_T -0.53% (339.3818 vs 341.2), just outside the 0.5 % band, at the methanol-rich end - Gao (2012) report their pure-methanol boiling point 0.41 K above the literature value (338.10 vs 337.69 K, their Table 1), a systematic warm bias the databank NRTL pair does not track; vapour composition passes (0.9272 vs 0.9221) (measured 2026-10-22, issue #100 resolution)"

