- id: unifac_ig
  name: UNIFAC liquid + ideal gas vapour
  family: gamma_phi
  adapter: ngdesign.thermo.gamma_phi:GammaPhiPackage
  options:
    liquid: unifac
    vapour: ideal
  params:
    source: thermo 0.6.1 bundled UNIFAC original interaction and subgroup tables (load_unifac_ip)
    provenance: curated per-component group assignments in data/thermo_params/unifac/groups.yaml - a component
      outside the curated set raises rather than predicting
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
  status: provisional
  validation:
  - unifac-ig-etohh2o-azeotrope-101.325kPa
  references:
  - Fredenslund, A., Jones, R. L. & Prausnitz, J. M., AIChE J. 21(6), 1086-1099, 1975
  - Skjold-Jorgensen, S., Fredenslund, A. & Rasmussen, P., AIChE J. 25(2), 337-339, 1979 (group conventions)
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
    gibbs_duhem:
      binaries:
      - z:
          MeOH: 0.5
          H2O: 0.5
        T: 350.0
        P: 100000.0
        phase: aqueous
  l0_excluded: {}

