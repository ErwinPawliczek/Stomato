- id: wohl3_ig
  name: Van Laar / Margules three-suffix forms
  family: gamma_phi
  adapter: ngdesign.thermo.gamma_phi:GammaPhiPackage
  options:
    liquid: wohl3
    vapour: ideal
  params:
    source: A12/A21 from data/thermo_params/margules/pairs.yaml; q_i are databank liquid molar
      volumes at 298.15 K, 101325 Pa
    provenance: the Wohl three-suffix expansion both classic forms truncate, with the Scatchard-Hamer
      choice q_i = V_i. It reduces to the Margules rows at q1 = q2 and to the van Laar rows at
      q1/q2 = A12/A21; no parameter is added to the Margules rows' case-fitted pairs, which fix the
      infinite-dilution limits only, so the interior of the curve is a prediction
  applicability:
