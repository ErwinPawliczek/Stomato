    provenance: DECHEMA (Gmehling & Onken) open example tables were not retrievable (documented deviation)
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
  status: provisional
  validation:
  - vanlaar-ig-meohnc4-323.22K-0.3366MPa
  - vanlaar-ig-etohh2o-azeotrope-101.325kPa
  references:
  - van Laar, J. J., Z. Phys. Chem. 72, 723-751, 1910
  - Bennett, J. P., J. Phys. Chem. 33(2), 258-270, 1929 (MeOH/H2O fit source point)
  # Vapour-phase Gibbs-Duhem loop omitted: with an ideal vapour, ln phi == 0 identically,
  # so the composition loop's normalizer is exactly zero and the ratio is undefined
  # (0/0 in the harness); the identity holds trivially. Only the liquid loop runs.
  l0:
    determinism:
      state:
      - 380.0
      - 50000.0
      z:
        EtOH: 0.5
        H2O: 0.5
    dhdT_cp:
      phase: vapor
      state:
      - 380.0
      - 50000.0
      z:
        EtOH: 0.5
        H2O: 0.5
    gibbs_duhem:
      binaries:
      - z:
          EtOH: 0.5
          H2O: 0.5
        T: 350.0
        P: 100000.0
        phase: aqueous
    round_trip:
      states:
      - - 380.0
        - 50000.0
      - - 400.0
        - 100000.0
      z:
        EtOH: 0.5
        H2O: 0.5
  l0_excluded: {}

