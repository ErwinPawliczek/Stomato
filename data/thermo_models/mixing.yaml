- id: pr_wong_sandler
  name: Peng-Robinson Wong-Sandler (NRTL)
  family: mixing
  adapter: ngdesign.thermo.mixing_rules:PRWongSandlerThermo
  options: {}
  params:
    source: Wong-Sandler (1992) mixing rule over thermo IPDB (ChemSep) 'ChemSep NRTL' binary matrices
