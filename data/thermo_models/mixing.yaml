      limits of the untranslated generalised-Twu PR host (no Peneloux volume translation: density miss
      as the pr row; Cp as the pr row) (measured 2026-10-22, T-06c harness run)'
    vtpr-pure-MeOH-330K: rho_V +3.2% (0.882069 vs 0.911218); rho_L +13.1% (656.85 vs 755.882); Cp +44.5%
      (127.928 vs 88.5047) - pure-component limits of the untranslated host form (measured 2026-10-22,
      T-06c harness run)
    vtpr-pure-H2O-340K: rho_L +15.8% (824.378 vs 979.503); Cp +33.0% (100.337 vs 75.4562) - pure-component
      limits of the untranslated host form (measured 2026-10-22, T-06c harness run)
    vtpr-pure-H2O-370K: rho_L +16.4% (803.424 vs 960.587); Cp +26.8% (96.2033 vs 75.8833) - pure-component
