    mix-meohh2o-101.325kPa-343.31K: "vapor_comp +0.021 abs (0.884623 vs 0.8633) - group-contribution prediction (vtpr UNIFAC variant, no fitted MeOH/H2O parameters) (nrtl gamma-phi on the same point: bubble_T 342.117, vapor_comp 0.870846) (measured 2026-11-04, val-cubic-mixing)"
    mix-meohh2o-101.325kPa-349.05K: "bubble_T +0.6% (351.062 vs 349.05) - group-contribution prediction (vtpr UNIFAC variant, no fitted MeOH/H2O parameters) (nrtl gamma-phi on the same point: bubble_T 349.291, vapor_comp 0.704153) (measured 2026-11-04, val-cubic-mixing)"
  l0_note: "validated 2026-11-04: 5 of 8 Gao points pass. single_liquid_limit runs the row-level MeOH/H2O feed because the family default uses EtOH, which the curated VTPR-UNIFAC map does not cover (first-use refusal). The C1/H2O points pass only through the wide 0.02 absolute band (x_C1 ~ 2e-3), not counted as evidence. Evidence (re-measured 2026-11-04): L1 = the shared CoolProp pure-hydrocarbon points (mix-pure-*; the rule collapses to its host cubic on a pure feed, so the polar MeOH/H2O pure points carry the host's untranslated liquid-density/Cp misses, assessed above); L2 = the full Gao et al. 2012 MeOH/H2O 101.325 kPa isobar (mix-meohh2o-*, 8 points). The Bayer 1927 312.91 K point is also missed by the validated nrtl row (data quality)."
- id: lcvm
  name: LCVM (PR + linear Vidal/MHV1 combination over original UNIFAC)
  family: mixing
  adapter: ngdesign.thermo.mixing_rules:PRLCVMThermo
  options: {}
  params:
    source: 'LCVM (Boukouvalas et al. 1994): PR with the linear Vidal/MHV1 combination (lambda = 0.36 on
      the Vidal term, A_V = -0.623, A_M = -0.52) over original UNIFAC (thermo unifac variant)'
    provenance: Boukouvalas, C., Spiliotis, N., Coutsikos, P., Tzouvaras, N. & Tassios, D., "Prediction of
      vapor-liquid equilibrium with the LCVM model", Fluid Phase Equilib. 92, 75-106, 1994 (alpha = A +
      (lambda/A_V + (1-lambda)/A_M) gE/RT + ((1-lambda)/A_M) sum x ln(b/b_i), lambda = 0.36, A_V = -0.623,
      A_M = -0.52 for PR); Michelsen, M. L., Fluid Phase Equilib. 60, 213-219, 1990 (MHV1 reference);
      k_ij-free form - the gE model carries all interaction information
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
