  - mix-meohh2o-101.325kPa-343.31K
  - mix-meohh2o-101.325kPa-341.20K
  - mix-meohh2o-101.325kPa-349.05K
  references:
  - Ahlers, J. & Gmehling, J., Fluid Phase Equilib. 191-192, 177-188, 2001
  l0:
