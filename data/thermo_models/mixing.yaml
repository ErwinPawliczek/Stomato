  l0_excluded: {}
  assessed:
    vtpr-pure-MeOH-305K: "rho_L -13.1% (677.553 vs 779.805); Cp +56.8% (129.578 vs 82.6135) - host-EOS limit shared with the twu-pr row (twu-pr on this point: Cp 129.578, rho_L 677.553): liquid Cp from the cubic residual (second T-derivative of a*alpha); saturated-liquid density of the untranslated two-constant cubic (the VTPR Peneloux translation is a declared, unimplemented deviation of this row) (generalised Twu alpha of the host; the fitted Ahlers-Gmehling Twu table is not available) (measured 2026-11-04, val-cubic-mixing)"
    vtpr-pure-MeOH-330K: "rho_V -3.2% (0.882069 vs 0.911218); rho_L -13.1% (656.85 vs 755.882); Cp +44.5% (127.928 vs 88.5047) - host-EOS limit shared with the twu-pr row (twu-pr on this point: Cp 127.928, rho_L 656.85, rho_V 0.882069): liquid Cp from the cubic residual (second T-derivative of a*alpha); saturated-liquid density of the untranslated two-constant cubic; saturated-vapour density of the cubic (the VTPR Peneloux translation is a declared, unimplemented deviation of this row) (generalised Twu alpha of the host; the fitted Ahlers-Gmehling Twu table is not available) (measured 2026-11-04, val-cubic-mixing)"
    vtpr-pure-H2O-340K: "rho_L -15.8% (824.378 vs 979.503); Cp +33.0% (100.337 vs 75.4562) - host-EOS limit shared with the twu-pr row (twu-pr on this point: Cp 100.337, rho_L 824.378): liquid Cp from the cubic residual (second T-derivative of a*alpha); saturated-liquid density of the untranslated two-constant cubic (the VTPR Peneloux translation is a declared, unimplemented deviation of this row) (generalised Twu alpha of the host; the fitted Ahlers-Gmehling Twu table is not available) (measured 2026-11-04, val-cubic-mixing)"
    vtpr-pure-H2O-370K: "rho_L -16.4% (803.424 vs 960.587); Cp +26.8% (96.2033 vs 75.8833) - host-EOS limit shared with the twu-pr row (twu-pr on this point: Cp 96.2033, rho_L 803.424): liquid Cp from the cubic residual (second T-derivative of a*alpha); saturated-liquid density of the untranslated two-constant cubic (the VTPR Peneloux translation is a declared, unimplemented deviation of this row) (generalised Twu alpha of the host; the fitted Ahlers-Gmehling Twu table is not available) (measured 2026-11-04, val-cubic-mixing)"
    vtpr-meohh2o-312.91K-20.705kPa: "bubble_P -11.2% (18387.6 vs 20705) - Bayer 1927 isotherm, internally inconsistent with every gamma-phi model; the validated nrtl row (same ChemSep NRTL set) also misses it: bubble_P +6.3% (22016.4 vs 20705), vapor_comp -0.046 abs (0.759733 vs 0.8053) - data quality, not the rule (measured 2026-11-04, val-cubic-mixing)"
