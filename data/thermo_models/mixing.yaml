    mix-meohh2o-101.325kPa-349.05K: "bubble_T +1.1% (352.932 vs 349.05); vapor_comp -0.020 abs (0.699402 vs 0.7197) - ChemSep NRTL parameters are low-pressure gamma-phi fits, used unchanged at the Huron-Vidal infinite-pressure reference: bubble T systematically +3..+4.5 K on the water-rich side (nrtl gamma-phi on the same point: bubble_T 349.291, vapor_comp 0.704153) (measured 2026-11-04, val-cubic-mixing)"
