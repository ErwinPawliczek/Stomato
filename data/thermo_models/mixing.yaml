- id: lcvm
  name: LCVM (PR + linear Vidal/MHV1 combination over original UNIFAC)
  family: mixing
  adapter: ngdesign.thermo.mixing_rules:PRLCVMThermo
  options: {}
  params:
    source: 'LCVM (Boukouvalas et al. 1994): PR with the linear Vidal/MHV1 combination (lambda = 0.36 on
      the Vidal term, A_V = -0.623, A_M = -0.52) over original UNIFAC (thermo unifac variant)'
    provenance: Boukouvalas, C., Spiliotis, N., Coutsikos, P., Tzouvaras, N. & Tassios, D., "Prediction of
      vapor-liquid equilibrium with the LCVM model", Fluid Phase Equilib. 92, 75-106, 1994 (alpha = A +
      (lambda/A_V + (1-lambda)/A_M) gE/RT + ((1-lambda)/A_M) sum x ln(b/b_i), lambda = 0.36, A_V = -0.623,
      A_M = -0.52 for PR); Michelsen, M. L., Fluid Phase Equilib. 60, 213-219, 1990 (MHV1 reference);
      k_ij-free form - the gE model carries all interaction information
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation:
  - lcvm-pure-MeOH-305K
  - lcvm-pure-MeOH-330K
  - lcvm-pure-H2O-340K
  - lcvm-pure-H2O-370K
  - lcvm-meohh2o-101.325kPa-349.05K
  - lcvm-meohh2o-312.91K-20.705kPa
  references:
  - Boukouvalas, C., Spiliotis, N., Coutsikos, P., Tzouvaras, N. & Tassios, D., Fluid Phase Equilib.
    92, 75-106, 1994
  - Michelsen, M. L., Fluid Phase Equilib. 60, 213-219, 1990
  l0: {}
  l0_excluded: {}
  assessed:
    lcvm-pure-MeOH-305K: rho_L -13.2% (676.721 vs 779.805); Cp +36.7% (112.917 vs 82.6135) - pure-component
      limits of the untranslated PR form (the LCVM rule reduces to PR for a pure component; same misses
      as the pr row) (measured 2026-10-22, T-06c harness run)
    lcvm-pure-MeOH-330K: rho_V -3.2% (0.882017 vs 0.911218); rho_L -13.2% (656.228 vs 755.882); Cp +31.4%
      (116.265 vs 88.5047) - pure-component limits of the untranslated PR form (measured 2026-10-22, T-06c
      harness run)
    lcvm-pure-H2O-340K: rho_L -15.9% (823.513 vs 979.503); Cp +8.0% (81.5128 vs 75.4562) - pure-component
      limits of the untranslated PR form (measured 2026-10-22, T-06c harness run)
    lcvm-pure-H2O-370K: rho_L -16.4% (802.915 vs 960.587); Cp +8.7% (82.4488 vs 75.8833) - pure-component
      limits of the untranslated PR form (measured 2026-10-22, T-06c harness run)
    lcvm-meohh2o-101.325kPa-349.05K: bubble_T +2.8% (358.996 vs 349.05); vapor_comp -0.061 abs (0.659246
      vs 0.7197) - the 64/36 Vidal/Michelsen weighting with original-UNIFAC parameters over-predicts the
      MeOH/H2O bubble temperature at 101.325 kPa (Boukouvalas et al. developed LCVM for nonpolar/polar
      asymmetry systems, not alcohol-water) (measured 2026-10-22 on the Gao 2012 101.325 kPa point, T-06c
      harness run)
    lcvm-meohh2o-312.91K-20.705kPa: 'bubble_P +29.3% (14637.2 vs 20705); vapor_comp -0.058 abs (0.747041
      vs 0.8053) - same cause: original-UNIFAC parameters in the LCVM reference on the low-pressure Bayer
      1927 isotherm (measured 2026-10-22, T-06c harness run)'
  l0_note: 'provisional on L0 only: the 6 bound T-12 cases (4 L1 pure, 2 L2 MeOH/H2O VLE) all miss (declared
    above; the two C1/H2O cases stay unbound because the original-UNIFAC curated map has no C1 assignment
