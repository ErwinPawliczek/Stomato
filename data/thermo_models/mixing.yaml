- id: pr_huron_vidal
  name: Peng-Robinson Huron-Vidal (NRTL)
  family: mixing
  adapter: ngdesign.thermo.mixing_rules:PRHuronVidalThermo
  options: {}
  params:
    source: Huron-Vidal (1979) mixing rule over thermo IPDB (ChemSep) 'ChemSep NRTL' binary matrices
    provenance: Huron, M.-J. & Vidal, J., 'New mixing rules in simple equations of state for representing
      vapour-liquid equilibria of strongly non-ideal mixtures', Fluid Phase Equilib. 3, 255-271, 1979;
      NRTL binary parameters from the ChemSep IPDB via the T-03 gamma-phi adapter's loader (one owner
      of the parameter plumbing); k_ij-free form - the gE model carries all interaction information
  applicability:
    component_classes:
    - alcohol
    - water
    - hydrocarbon
    - polar_organic
    polar: true
    electrolyte: false
    T_K:
    - 250.0
    - 600.0
    P_Pa:
    - 1000.0
    - 10000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation:
