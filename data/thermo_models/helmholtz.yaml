# Helmholtz / reference-equation family (spec T-04).
#
# Five rows carry implementations: IAPWSPackage (IAPWS-95 and IF97 formulations,
# pure water), CoolPropPackage (HEOS pure fluids and mixtures), GERGPackage (the
# dry sour natural-gas slate on the same engine), BWRSPackage (in-house Starling
# BWRS). Five rows are placeholders: the catalogue records the method, status and
# provenance while every property call raises UnavailableBackend naming the row
# (unsupported methods are rejected, never silently approximated).
#
# Applicability windows follow the cited sources' fitted ranges; statuses are
# provisional (L0 green, reference cases bound) until L1/L2 sweeps justify the
# audited 'validated' promotion.

- id: iapws95
  name: IAPWS-95 water and steam
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:IAPWSPackage
  options:
    formulation: IAPWS95
  params: {}
  applicability:
    component_classes: [water]
    polar: true
    electrolyte: false
    T_K: [251.165, 1273.0]
    P_Pa: [500.0, 1000000000.0]
    phases: [V, L]
  status: provisional
  validation:
  - h2o-nist-273.179K
  - h2o-nist-347.390K
  - h2o-nist-401.605K
  - h2o-nist-500.184K
  - h2o-nist-600.070K
  references:
  - Wagner, W., Cooper, J. R., Dittmann, A., et al., 'The IAPWS Industrial Formulation 1997
    for the Thermodynamic Properties of Water and Steam', J. Eng. Gas Turbines Power 122,
    150-182, 2000 (IAPWS-95 revised release, 2016; CoolProp HEOS::Water implements the
    IAPWS-95 formulation)
  - CoolProp 8.0.0 HEOS water backend, verified in-session against thermo 0.6.1 IAPWS-95
    (density agreement ~1e-11 relative at 300 K, 1 bar) and IAPWS saturation tables
    (Psat(373.15 K) = 101417.997 Pa)
  l0:
    pure_psat_limit:
      points: [["H2O", 373.15], ["H2O", 400.0]]
    phase_identification:
      points: [["H2O", 300.0], ["H2O", 400.0]]
    round_trip:
      z: {H2O: 1.0}
      states: [[350.0, 200000.0], [400.0, 300000.0]]
    dhdT_cp:
      z: {H2O: 1.0}
      state: [500.0, 100000.0]
      phase: vapor
    single_liquid_limit:
      z: {H2O: 1.0}
      state: [300.0, 100000.0]
    determinism:
      z: {H2O: 1.0}
      state: [350.0, 200000.0]
  l0_excluded:
    gibbs_duhem: pure water only - no binary composition path to integrate over
  l0_note: >-
    Pure-water adapter; the liquid root reports as AQUEOUS. CoolProp is imported
    lazily; without the optional coolprop extra the row loads but every evaluation
    raises CoolPropUnavailable.

- id: iapws_if97
  name: IAPWS-IF97 industrial water and steam
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:IAPWSPackage
  options:
    formulation: IF97
  params: {}
  applicability:
    component_classes: [water]
    polar: true
    electrolyte: false
    T_K: [273.15, 1073.15]
    P_Pa: [500.0, 100000000.0]
    phases: [V, L]
  status: provisional
  validation:
  # T-15 promotion sweep: L1 pure H2O points (CoolProp 8.0.0 HEOS reference values,
  # helmholtz/cases.yaml; state points match the NIST WebBook h2o-nist cases). The row
  # stays provisional: it is water-only, so no L2 binary case exists for it by design
  # (the audit's validated gate needs >=1 L2 binary; recorded on issue #167).
  - h2o-if97-273.179K
  - h2o-if97-347.390K
  - h2o-if97-401.605K
  references:
  - Wagner, W., Cooper, J. R., Dittmann, A., et al., 'The IAPWS Industrial Formulation 1997
    for the Thermodynamic Properties of Water and Steam', J. Eng. Gas Turbines Power 122,
    150-182, 2000 (CoolProp IF97::Water backend)
  - CoolProp 8.0.0 IF97 backend, Psat(373.15 K) = 101417.978 Pa in-session (vs 101417.997 Pa
    for IAPWS-95)
  l0:
    pure_psat_limit:
      points: [["H2O", 373.15], ["H2O", 400.0]]
    phase_identification:
      points: [["H2O", 300.0], ["H2O", 400.0]]
    round_trip:
      z: {H2O: 1.0}
      states: [[350.0, 200000.0], [400.0, 300000.0]]
    dhdT_cp:
      z: {H2O: 1.0}
      state: [500.0, 100000.0]
      phase: vapor
    single_liquid_limit:
      z: {H2O: 1.0}
      state: [300.0, 100000.0]
    determinism:
      z: {H2O: 1.0}
      state: [350.0, 200000.0]
  l0_excluded:
    gibbs_duhem: pure water only - no binary composition path to integrate over
  l0_note: >-
    IF97 backend exposes no fugacity coefficients (CoolProp 8), so Phase.ln_phi
    stays empty for this row; phase_props and flashes carry full properties.
    T-15 finding: at saturation states the adapter's saturated-phase densities
    come back label-swapped (rho_V reads the liquid value and vice versa) - an
    IAPWSPackage defect to fix in an engine spec, not a formulation limitation.
  assessed:
    h2o-if97-273.179K: "rho_L x1/2e5 (0.00486078 vs 999.794) and Cp -55.3% (34.017 vs 76.0217) - the IF97 adapter swaps the saturated-phase labels at the saturation state (the liquid reads the vapour values); measured 2026-10-22, T-15 sweep"
    h2o-if97-347.390K: "rho_V x4.2e3 (975.281 vs 0.235067) - the IF97 adapter swaps the saturated-phase labels (the vapour reads the liquid density); measured 2026-10-22, T-15 sweep"
    h2o-if97-401.605K: "rho_V x652 (936.138 vs 1.43327) - the IF97 adapter swaps the saturated-phase labels (the vapour reads the liquid density); measured 2026-10-22, T-15 sweep"

- id: asme_steam
  name: ASME steam tables (IAPWS-IF97 basis, ASME-labelled)
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:ASMESteamPackage
  options: {}
  params:
    implementation: >-
      The modern ASME Steam Tables (7th ed., 2000) are computed from IAPWS-IF97, so this row
      is the IF97 adapter under the ASME label over the shared kernel (formulation IF97 is
      pinned in the adapter constructor). No separate IFC-67 formulation is implemented: the
      historical (pre-2000) ASME tables based on IFC-67 differ slightly from this row and are
      out of scope. Verification values are bound from the IAPWS R7-97(2012) check tables
      that pin the shared kernel.
  applicability:
    component_classes: [water]
    polar: true
    electrolyte: false
    T_K: [273.15, 1073.15]
    P_Pa: [500.0, 100000000.0]
    phases: [V, L]
  status: provisional
  validation:
  # T-16a: verification values from the IAPWS R7-97(2012) check tables that pin the shared
  # kernel. The row stays provisional: it is water-only, so no L2 binary case exists for it
  # by design (the audit's validated gate needs >=1 L2 binary; recorded on issue #187).
  - asme-steam-r1-300K-3MPa
  - asme-steam-psat-300K
  references:
  - ASME, 'ASME Steam Tables', 7th ed., 2000 (computed from IAPWS-IF97; this row is that
    kernel under the ASME label)
  - IAPWS, 'Revised Release on the IAPWS Industrial Formulation 1997 for the Thermodynamic
    Properties of Water and Steam', R7-97(2012) - Table 5 (Region 1) and Table 35 (Region 4
    saturation line) check values bound as cases; retrieved 2026-10-23
  l0:
    pure_psat_limit:
      points: [["H2O", 373.15], ["H2O", 400.0]]
    phase_identification:
      points: [["H2O", 300.0], ["H2O", 400.0]]
    round_trip:
      z: {H2O: 1.0}
      states: [[350.0, 200000.0], [400.0, 300000.0]]
    dhdT_cp:
      z: {H2O: 1.0}
      state: [500.0, 100000.0]
      phase: vapor
    single_liquid_limit:
      z: {H2O: 1.0}
      state: [300.0, 100000.0]
    determinism:
      z: {H2O: 1.0}
      state: [350.0, 200000.0]
  l0_excluded:
    gibbs_duhem: pure water only - no binary composition path to integrate over
  l0_note: >-
    Same kernel as iapws_if97; the checks and their results are identical by construction.

- id: coolprop_heos
  name: CoolProp pure Helmholtz (HEOS) fluids and mixtures
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:CoolPropPackage
  options: {}
  params: {}
  applicability:
    component_classes: [hydrocarbon, light_gas, inert, water, acid_gas]
    polar: true
    electrolyte: false
    T_K: [90.0, 680.0]
    P_Pa: [1000.0, 100000000.0]
    phases: [V, L, VLL, VLLE]
  status: validated
  validation:
  # T-15 promotion sweep: L1 pure points (CoolProp 8.0.0 machine values, helmholtz/cases.yaml)
  - heos-pure-C1-125K
  - heos-pure-nC4-280K
  - heos-pure-CO2-265K
  # L2 binary points (Petropoulou 2018 ThermoML, helmholtz/cases.yaml)
  - heos-c1co2-293.130K-6.135MPa
  - heos-c1co2-293.130K-6.976MPa
  references:
  - Bell, I. H., Wronski, J., Quoilin, S., Lemort, V., 'Pure and Pseudo-pure Fluid
    Thermophysical Property Evaluation and the Open-Source Thermophysical Property Library
    CoolProp', Ind. Eng. Chem. Res. 53(6), 2498-2508, 2014
  - Kunz, O., Wagner, W., 'The GERG-2008 Wide-Range Equation of State for Natural Gases and
    Other Mixtures', J. Chem. Eng. Data 57, 3032-3091, 2012 (multifluid mixture model
    provenance; the row evaluates CoolProp's fitted mixture parameters)
  l0:
    pure_psat_limit:
      points: [["C1", 160.0], ["C3", 300.0], ["CO2", 250.0], ["N2", 110.0]]
    phase_identification:
      points: [["C1", 160.0], ["C3", 300.0]]
    round_trip:
      z: {N2: 0.005066, CO2: 0.015198, C1: 0.859168, C2: 0.062817, C3: 0.032422,
          iC4: 0.007092, nC4: 0.010132, iC5: 0.004053, nC5: 0.004052}
      states: [[350.0, 3447000.0]]
    dhdT_cp:
      z: {N2: 0.005066, CO2: 0.015198, C1: 0.859168, C2: 0.062817, C3: 0.032422,
          iC4: 0.007092, nC4: 0.010132, iC5: 0.004053, nC5: 0.004052}
      state: [350.0, 3447000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.6, C3: 0.4}
        T: 250.0
        P: 5000000.0
        phase: hc_liquid
      - z: {C1: 0.7, CO2: 0.3}
        T: 250.0
        P: 2000000.0
        phase: vapor
    single_liquid_limit:
      z: {C3: 0.3, nC4: 0.7}
      state: [250.0, 2000000.0]
    determinism:
      z: {N2: 0.005066, CO2: 0.015198, C1: 0.859168, C2: 0.062817, C3: 0.032422,
          iC4: 0.007092, nC4: 0.010132, iC5: 0.004053, nC5: 0.004052}
      state: [350.0, 3447000.0]
  l0_excluded: {}
  l0_note: >-
    The slice feed minus the C6+ pseudo-component and water, renormalized: a
    lumped cut has no CoolProp fluid and is refused by name (consistent with the
    GERG row and the family's never-silently-approximated rule), and water-bearing
    light-hydrocarbon mixtures have no verified HEOS interaction parameters —
    water belongs to the IAPWS rows. K values surface through saturation points
    and flashes; k_values returns None by design.

