    phases: [V, L]
  status: validated
  l2_not_applicable: >-
    pure water only: the adapter admits the single component H2O, so no binary
    (L2) case can run on this row; validated on >= 2 L1 pure cases instead
  validation:
  # T-15 promotion sweep: L1 pure H2O points (CoolProp 8.0.0 HEOS reference values,
  # helmholtz/cases.yaml; state points match the NIST WebBook h2o-nist cases).
  - h2o-if97-273.179K
  - h2o-if97-347.390K
  - h2o-if97-401.605K
  # 2026-11-04: the IAPWS R7-97(2012) check values (Tables 5, 15, 35), shared with
