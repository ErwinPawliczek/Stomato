- id: bwr_ls
  name: BWR-Lee-Starling (BWRS parameter basis, Han-Starling mixing, provisional)
  family: helmholtz
  adapter: ngdesign.thermo.bwr:BWRLeeStarlingPackage
  options: {}
  params: {}
  applicability:
    component_classes: [hydrocarbon, light_gas, inert, acid_gas]
    polar: true
    electrolyte: false
    T_K: [95.0, 600.0]
    P_Pa: [1000.0, 70000000.0]
    phases: [V, L]
  status: provisional
  validation:
  - bwr_ls-C1-155.0K
  - bwr_ls-C2-230.0K
  - bwr_ls-C3-300.0K
  - bwr_ls-c1c3-277.59K
  assessed:
    bwr_ls-C1-155.0K: "Cp -569.3% (calculated -38425.48 vs 67.6129 J/(mol K), saturated liquid): the shared BWRS parameter evaluation returns large negative Cp for bwr_ls — the same defect assessed on the bwrs row; bound and assessed, not excluded, so the defect stays visible. Measured 2026-10-23."
    bwr_ls-C2-230.0K: "Cp -1187.6% (calculated -97565.23 vs 82.2215 J/(mol K), saturated liquid): same shared BWRS parameter-evaluation Cp defect. Measured 2026-10-23."
    bwr_ls-C3-300.0K: "Cp -517.5% (calculated -62396.92 vs 120.8047 J/(mol K), saturated liquid): same shared BWRS parameter-evaluation Cp defect. Measured 2026-10-23."
  references:
  - Lee, B. I., Starling, K. E., Starling's BWR equation variant as summarized in
    'Thermodynamic Property Prediction of Light Hydrocarbons and Related Fluids' (the
    equation form)
  - 'Starling, K. E., ''Fluid Thermodynamic Properties for Light Petroleum Systems'',
    Gulf Publishing, 1973 (the parameter dictionary the row evaluates)'
  - 'Han, B.-H., Starling, K. E., ''Generalized Correlation for the Densities of
    Multicomponent Light Hydrocarbon Mixtures'', AIChE J. 18, 380-384, 1972 (the
    generalized mixing law; the row ships an empty k_ij table)'
  - 'Starling, K. E. et al., ''Fluid Thermodynamic Property Data for Light Petroleum
    Systems'' / OSTI report ORO-5249-2 (1976), Table 5 (the component parameter
    dictionary the row evaluates, shared with the bwrs row)'
  l0:
    pure_psat_limit:
      points: [["C1", 160.0], ["N2", 110.0]]
    phase_identification:
      points: [["C1", 160.0], ["N2", 110.0]]
    round_trip:
      z: {N2: 0.05, C1: 0.9, CO2: 0.05}
      states: [[300.0, 5000000.0]]
    dhdT_cp:
      z: {C1: 1.0}
      state: [300.0, 1000000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.9, N2: 0.1}
        T: 300.0
        P: 5000000.0
        phase: vapor
      - z: {C1: 0.5, CO2: 0.5}
        T: 220.0
        P: 5000000.0
        phase: hc_liquid
    single_liquid_limit:
      z: {C3: 0.3, nC4: 0.7}
      state: [250.0, 2000000.0]
    determinism:
      z: {N2: 0.05, C1: 0.9, CO2: 0.05}
      state: [300.0, 5000000.0]
  l0_excluded: {}
  l0_note: >-
    Provisional: reuses the merged BWRS parameter-dictionary equations with the
    Han-Starling generalized mixing law. The k_ij table ships deliberately empty - no
    verifiable open C1/C3 Lee-Starling interaction set was found - and with the table
    empty the mixing law reduces exactly to the one used by the bwrs row, which is the
    row's only tested claim; the k_ij dependence itself is unvalidated. Component
    constants are the ORO-5249-2 Table 5 set cited on the bwrs row. Measured results:
    at the three bound pure-fluid saturation points (C1 155 K, C2 230 K, C3 300 K)
    bubble/dew pressures and vapour/liquid densities track CoolProp closely, while Cp
    comes out large and negative (assessed per case above) - the shared BWRS
    parameter-evaluation Cp defect, made visible by binding the cases rather than
    excluding Cp. The bound near-pure-propane C1/C3 VLE point (277.59 K, 0.689 MPa)
    misses literature bubble_P by 1.24% and vapour composition by 0.50%; the
    higher-pressure isotherm point (1.724 MPa) measured 4.73% and 56.03% and stays
    unbound pending a mixing-rule decision.
