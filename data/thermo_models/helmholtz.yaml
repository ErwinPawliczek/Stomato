  status: provisional
  validation:
  # 2026-11-04: the Cp defect is fixed at the root (BWRS departure enthalpy units); the
  # bwrs-c1c3-* L2 points are shared with the bwrs row.
  - bwr_ls-C1-155.0K
  - bwr_ls-C2-230.0K
  - bwr_ls-C3-300.0K
  - bwr_ls-c1c3-277.59K
  - bwrs-c1c3-277.59K-3.103MPa
  - bwrs-c1c3-294.26K-2.068MPa
  - bwrs-c1c3-310.93K-4.137MPa
