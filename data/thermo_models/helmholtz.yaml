- id: mbwr
  name: Modified BWR-32 (Younglove-Ely 1987, pure C1/C2/C3)
  family: helmholtz
  adapter: ngdesign.thermo.bwr:MBWR32Package
  options: {}
  params: {}
  applicability:
    component_classes: [hydrocarbon, light_gas]
    polar: false
    electrolyte: false
    T_K: [90.0, 600.0]
    P_Pa: [1000.0, 100000000.0]
    phases: [V, L]
  status: provisional
  validation:
  - pure-C1-95.3K
  - pure-C1-125.0K
  - pure-C1-155.0K
  - pure-C1-181.0K
  - pure-C2-110.0K
  - pure-C2-150.0K
  - pure-C2-230.0K
  - pure-C3-150.0K
  - pure-C3-231.0K
  - pure-C3-300.0K
  references:
  - 'Younglove, B. A., Ely, J. F., ''Thermophysical Properties of Fluids. Part II:
    Methane, Ethane, Propane, Isobutane, and Normal Butane'', J. Phys. Chem. Ref. Data
    16, 577-798, 1987 - the 32-term pressure-form coefficients transcribed from
    Appendix J (NIST-hosted reprint), methane p. 794, ethane p. 795, propane p. 796'
  l0:
    pure_psat_limit:
      points: [["C1", 160.0], ["C3", 300.0]]
    phase_identification:
      points: [["C1", 160.0], ["C3", 300.0]]
    round_trip:
      z: {C1: 1.0}
      # 150 K / 2.5 MPa is compressed-liquid methane below Tc — the saturation
      # crossing (~172 K) must land between two finite bracket-scan points, and
      # above ~3 MPa the scan hits the critical region before confirming a sign
      # change. PH/PS round-trip residual 2e-13 at this state.
      states: [[150.0, 2500000.0]]
    dhdT_cp:
      z: {C1: 1.0}
      state: [300.0, 1000000.0]
      phase: vapor
    single_liquid_limit:
      z: {C3: 1.0}
      state: [150.0, 3000000.0]
    determinism:
      z: {C1: 1.0}
      state: [300.0, 5000000.0]
  l0_excluded:
    gibbs_duhem: 'MBWR-32 is pure-fluid only: the Younglove-Ely report gives no mixing
      rules for these coefficient tables, so the mixture Gibbs-Duhem gate cannot apply.'
  l0_note: >-
    In-house MBWR-32: Younglove-Ely units (rho mol/l, P MPa) at the kernel, SI at the
    boundary; ideal-gas reference as for bwrs. Mixtures are refused by the adapter.
    Saturation verified against CoolProp 8.0.0 across the ten bound cases (worst
    sampled Psat deviation about 0.4 %). Source caveats, not resolved in this work:
    the ethane G(3) table reading is uncertain by one entry, and selected
    Younglove-Ely isobar cross-checks (propane 250 K, methane 100 K) disagree by
    several percent for reasons not resolved here.

