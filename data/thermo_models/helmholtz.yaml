- id: coolprop_heos
  name: CoolProp pure Helmholtz (HEOS) fluids and mixtures
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:CoolPropPackage
  options: {}
  params: {}
  applicability:
    component_classes: [hydrocarbon, light_gas, inert, water, acid_gas]
    polar: true
    electrolyte: false
    T_K: [90.0, 680.0]
    P_Pa: [1000.0, 100000000.0]
    phases: [V, L, VLL, VLLE]
  status: provisional
  validation: []
  references:
  - Bell, I. H., Wronski, J., Quoilin, S., Lemort, V., 'Pure and Pseudo-pure Fluid
    Thermophysical Property Evaluation and the Open-Source Thermophysical Property Library
    CoolProp', Ind. Eng. Chem. Res. 53(6), 2498-2508, 2014
  - Kunz, O., Wagner, W., 'The GERG-2008 Wide-Range Equation of State for Natural Gases and
    Other Mixtures', J. Chem. Eng. Data 57, 3032-3091, 2012 (multifluid mixture model
    provenance; the row evaluates CoolProp's fitted mixture parameters)
  l0:
    pure_psat_limit:
      points: [["C1", 160.0], ["C3", 300.0], ["CO2", 250.0], ["N2", 110.0]]
    phase_identification:
      points: [["C1", 160.0], ["C3", 300.0]]
    round_trip:
      z: {N2: 0.005066, CO2: 0.015198, C1: 0.859168, C2: 0.062817, C3: 0.032422,
          iC4: 0.007092, nC4: 0.010132, iC5: 0.004053, nC5: 0.004052}
      states: [[350.0, 3447000.0]]
    dhdT_cp:
      z: {N2: 0.005066, CO2: 0.015198, C1: 0.859168, C2: 0.062817, C3: 0.032422,
          iC4: 0.007092, nC4: 0.010132, iC5: 0.004053, nC5: 0.004052}
      state: [350.0, 3447000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.6, C3: 0.4}
        T: 250.0
        P: 5000000.0
        phase: hc_liquid
      - z: {C1: 0.7, CO2: 0.3}
        T: 250.0
        P: 2000000.0
        phase: vapor
    single_liquid_limit:
      z: {C3: 0.3, nC4: 0.7}
      state: [250.0, 2000000.0]
    determinism:
      z: {N2: 0.005066, CO2: 0.015198, C1: 0.859168, C2: 0.062817, C3: 0.032422,
          iC4: 0.007092, nC4: 0.010132, iC5: 0.004053, nC5: 0.004052}
      state: [350.0, 3447000.0]
  l0_excluded: {}
  l0_note: >-
    The slice feed minus the C6+ pseudo-component and water, renormalized: a
    lumped cut has no CoolProp fluid and is refused by name (consistent with the
    GERG row and the family's never-silently-approximated rule), and water-bearing
    light-hydrocarbon mixtures have no verified HEOS interaction parameters —
    water belongs to the IAPWS rows. K values surface through saturation points
    and flashes; k_values returns None by design.

- id: gerg2008
  name: GERG-2008 natural-gas mixture model (CoolProp multifluid path)
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:GERGPackage
  options: {}
  params: {}
  applicability:
    component_classes: [hydrocarbon, light_gas, inert, acid_gas]
    polar: true
    electrolyte: false
    T_K: [90.0, 450.0]
    P_Pa: [1000.0, 40000000.0]
    phases: [V, L, VLL, VLLE]
  status: provisional
  validation:
  - pure-CO2-216.7K
  - pure-CO2-240.0K
  - pure-CO2-265.0K
  - pure-CO2-285.0K
  - pure-CO2-288.9K
  - c1n2-149.989K-2.908MPa
  - c1n2-159.972K-1.789MPa
  - c1n2-179.976K-5.062MPa
  # c1n2-130.079K now runs against the teqp GERG-2008 backend (gerg2008_teqp, saft
  # family) - the T-07 follow-up cross-check (issue #164); the other four points
  # (c1n2-149.928K/170.009K, c1co2-303.144K/303.145K) stay pending:teqp-gerg2008:
  # measured on the teqp backend, three have strictly monotone isotherms (no
  # two-phase solution in the shipped parameters) and the fourth has a sub-per-mille
  # loop the density scan cannot resolve, so neither backend can produce a value.
  - c1co2-293.130K-6.135MPa
  - c1co2-293.130K-6.976MPa
  - c1co2-298.142K-6.976MPa
  - c1co2-298.142K-7.508MPa
  - aga8-c1n2-134.02K-dew
  - aga8-c1n2-146.37K-dew
  - aga8-c1n2-153.41K-dew
  references:
  - 'Kunz, O., Wagner, W., ''The GERG-2008 Wide-Range Equation of State for Natural Gases and
    Other Mixtures'', J. Chem. Eng. Data 57, 3032-3091, 2012 (the declared model; evaluated
    here through CoolProp 8.0.0''s multifluid mixture model with fitted binary-interaction
    parameters - an exact GERG-2008 backend arrives with the teqp bridge, T-07)'
  - 'Gernert, J., Span, R., ''EOS-CG: A Helmholtz energy mixture model'', Chem. Eng.
    Sci. 148, 59-74, 2016 (CoolProp carries its mixture parameters; deviations from the
    AGA8/GERG-2008 reference values are reported in the validation findings)'
  l0:
    pure_psat_limit:
      points: [["C1", 160.0], ["C3", 300.0], ["CO2", 250.0]]
    phase_identification:
      points: [["C1", 160.0], ["C3", 300.0]]
    round_trip:
      z: {N2: 0.01, CO2: 0.02, C1: 0.88, C2: 0.06, C3: 0.03}
      states: [[350.0, 3447000.0]]
    dhdT_cp:
      z: {N2: 0.01, CO2: 0.02, C1: 0.88, C2: 0.06, C3: 0.03}
      state: [350.0, 3447000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.6, C3: 0.4}
        T: 250.0
        P: 5000000.0
        phase: hc_liquid
      - z: {C1: 0.7, CO2: 0.3}
        T: 250.0
        P: 2000000.0
        phase: vapor
    single_liquid_limit:
      z: {C3: 0.3, nC4: 0.7}
      state: [250.0, 2000000.0]
    determinism:
      z: {N2: 0.01, CO2: 0.02, C1: 0.88, C2: 0.06, C3: 0.03}
      state: [350.0, 3447000.0]
  l0_excluded: {}
  l0_note: >-
    The dry sour natural-gas slate: water is refused (the IAPWS rows own steam-water
    states) and C6+ is refused (no GERG-2008 C6+ mapping without teqp).

