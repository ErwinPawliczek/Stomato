- id: eos_cg
  name: EOS-CG combustion-gas mixture model (2016)
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:EosCgPackage
  options: {}
  params:
    source: CoolProp 8.0.0 HEOS binary table (MIT), the pairs citing Gernert's 2013 thesis
    provenance: >-
      All 15 pairs of CO2, H2O, N2, O2, Ar and CO in the installed CoolProp cite Gernert-Thesis-2013,
      with the departure functions CO2-H2O, GeneralizedAirWater and Ar-CO2, over the reference
      pure-fluid equations; that is the Gernert & Span (2016) model. Checked 2026-11-01. The 2016
      paper itself is paywalled; EOS-CG-2021 (Neumann et al. 2023, CC BY 4.0) is open but is a
      different parameter set, which CoolProp does not carry yet (PR 3281 open when checked).
  applicability:
    component_classes: [light_gas, inert, acid_gas, water]
    polar: true
    electrolyte: false
    T_K: [250.0, 1000.0]
    P_Pa: [1000.0, 100000000.0]
    phases: [V, L]
  status: validated
  validation:
  # 2026-11-04: measured CO2 vapour pressures (L1) and CO2 + N2 VLE (L2), Westman et al.
  # 2016 via the NIST TRC ThermoML archive (helmholtz/cases.yaml): Psat +0.01 / +0.06 %,
  # bubble -0.95 % at 270 K, dew -0.03 % at 298 K. Independent of the row: the EOS-CG
  # CO2-N2 parameters date from Gernert's 2013 thesis, before these measurements.
  - eoscg-co2-psat-298.174K
  - eoscg-co2-psat-303.158K
  - eoscg-co2n2-269.996K-9.582MPa-bubble
  - eoscg-co2n2-298.162K-7.099MPa-dew
  references:
  - 'Gernert, J., Span, R., ''EOS-CG: A Helmholtz energy mixture model for humid combustion
    gases and CCS mixtures'', J. Chem. Thermodyn. 93, 274-293, 2016'
  - Bell, I. H. et al., Ind. Eng. Chem. Res. 53(6), 2498-2508, 2014 (CoolProp)
  l0:
    pure_psat_limit:
      points: [["CO2", 250.0], ["H2O", 350.0]]
    phase_identification:
      points: [["CO2", 250.0], ["H2O", 350.0]]
    round_trip:
      z: {CO2: 1.0}
      states: [[350.0, 5000000.0]]
    dhdT_cp:
      z: {CO2: 0.9, N2: 0.1}
      state: [350.0, 5000000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {CO2: 0.9, N2: 0.1}
        T: 350.0
        P: 5000000.0
        phase: vapor
    single_liquid_limit:
      z: {CO2: 0.9, N2: 0.1}
      state: [250.0, 20000000.0]
    determinism:
      z: {CO2: 0.9, N2: 0.1}
      state: [350.0, 5000000.0]
  l0_excluded: {}
  l4_excluded:
    '*': the slate holds no hydrocarbons, so the L4 slice feed is refused by construction
  l0_note: >-
    The refusal this row used to carry said teqp and CoolProp ship no EOS-CG files; rechecking on
    2026-11-01 found the 2016 pairs in both. On CO2, H2O and N2 the row computes what coolprop_heos
    computes; it exists to admit O2, Ar and CO and to refuse everything else. The round trip runs on
    pure CO2 because CoolProp's PQ solver fails on CO2 + N2 at the bubble-temperature step of the
    shared PH/PS flash (measured at 350 K, 1 and 5 MPa); since 2026-11-04 a PH/PS flash with no
    reachable boundary at P falls back to inverting flash_pt. Known solver gap (2026-11-04):
    three near-critical Westman CO2 + N2 points (298.161 K/7.1003 MPa and 298.162 K/7.4191 MPa
    bubble, 269.997 K/9.5571 MPa dew) raise SaturationError in the shared CoolProp-path
    saturation solver on this row, coolprop_heos and gerg2008 alike; they are not bound.

- id: aga8_dc92
  name: AGA 8 DC92 detail equation of state (gas phase)
  family: helmholtz
  adapter: ngdesign.thermo.aga8:Aga8Dc92Package
  options: {}
  params:
    implementation: >-
      The DC92 detail method is ported as a standalone module (ngdesign.thermo.aga8:
      aga8_dc92_properties) behind a gas-phase Thermo adapter (Aga8Dc92Package) validated
      against the NIST reference's own printed check values (21-component example gas,
      400 K, 50 MPa; density and Z match to printed digits). flash_pt returns the single
      vapour phase the method supports. Saturation boundaries (bubble/dew, TVF/PVF),
      liquid-phase requests, H/S-driven flashes and fugacity derivatives refuse with the
      typed Aga8Dc92Error: DC92 has no liquid root and no ln-phi surface by construction.
      pure_psat and k_values return None. States whose DC92 pressure function has multiple
      density roots (two-phase/liquid) refuse at the density solve.
  applicability:
    component_classes: [hydrocarbon, light_gas, inert, acid_gas]
    polar: true
    electrolyte: false
    T_K: [143.15, 676.48]
    P_Pa: [100000.0, 280000000.0]
    phases: [V]
  status: validated
  validation:
  # T-16a: the NIST reference's printed check-gas values (density/Z/cp). These verify the
  # port against the reference code; they are not independent evidence for the model.
  - aga8-dc92-nist-check-gas-400K-50MPa
  # 2026-11-04: measured densities, Chamorro et al. 2006 (J. Chem. Thermodyn. 38, 916; NIST
  # ThermoML), single-sinker densimeter, after the 1992 DC92 fit. L1: pure N2 at 250, 300 and
  # 400 K (max |dev| 0.07 %). L2: CH4 + N2 at x_CH4 0.79998 and 0.89984, 240-400 K, 5-20 MPa
  # (max |dev| 0.14 %). All pass at the 3 % density tolerance (aga8/cases.yaml).
  - aga8-n2-density-249.959K-5.024MPa
  - aga8-n2-density-299.972K-10.974MPa
  - aga8-n2-density-399.99K-17.250MPa
  - aga8-c1n2-x0.79998-249.914K-5.016MPa
  - aga8-c1n2-x0.79998-299.909K-10.001MPa
  - aga8-c1n2-x0.89984-240.008K-10.029MPa
  - aga8-c1n2-x0.89984-299.999K-10.050MPa
  - aga8-c1n2-x0.89984-350.001K-19.983MPa
  - aga8-c1n2-x0.89984-400.005K-19.369MPa
  references:
  - Starling, K. E., Savidge, J. L., 'Compressibility Factors of Natural Gas and Other
    Related Hydrocarbon Gases', AGA Transmission Measurement Committee Report No. 8, 2nd
    ed., 1992 (coefficients as published in NIST''s public-domain reference implementation,
    github.com/usnistgov/AGA8 @ 3bdb9ab8ff317c618b0b59d1b704c2c86ddc5fce, AGA8CODE/C,
    retrieved 2026-10; the port reproduces Detail_test_01.cpp check values)
  l0:
    determinism:
      z: {C1: 0.9, N2: 0.05, CO2: 0.05}
      state: [350.0, 5000000.0]
    dhdT_cp:
      z: {C1: 0.9, N2: 0.05, CO2: 0.05}
      state: [350.0, 5000000.0]
      phase: vapor
  l0_excluded:
    pure_psat_limit: gas-only method - no vapour-pressure correlation exists in DC92
    phase_identification: >-
      the check anchors on the databank Psat, which pure_psat returns None for (no
      vapour-pressure correlation in the DC92 method)
    round_trip: >-
      the check iterates flash_ph/flash_ps, which the gas-only adapter refuses by design
      (no H/S-driven flashes are offered)
    gibbs_duhem: no fugacity coefficients - ln phi is not part of the DC92 surface
    single_liquid_limit: gas-only method - the adapter refuses liquid-phase requests
  l0_note: >-
    The declared checks exercise the gas surface the adapter offers (PT flash determinism,
    cp self-consistency); every excluded check exercises an operation the DC92 method
    structurally cannot provide, each refused with the typed Aga8Dc92Error.

- id: mbwr
  name: Modified BWR-32 (Younglove-Ely 1987, pure C1/C2/C3)
  family: helmholtz
  adapter: ngdesign.thermo.bwr:MBWR32Package
  options: {}
  params: {}
  applicability:
    component_classes: [hydrocarbon, light_gas]
    polar: false
    electrolyte: false
    T_K: [90.0, 600.0]
    P_Pa: [1000.0, 100000000.0]
    phases: [V, L]
  status: validated
  l2_not_applicable: >-
    pure-fluid only: Younglove-Ely (1987) publish no mixing rules for the 32-term
    coefficient tables and the adapter refuses mixtures, so no binary (L2) case can
    run on this row; validated on >= 2 L1 pure cases instead (ten saturation states
    of C1/C2/C3 against the independent reference equations via CoolProp 8.0.0,
    every bound property passing, re-measured 2026-11-04)
  validation:
  - pure-C1-95.3K
  - pure-C1-125.0K
  - pure-C1-155.0K
  - pure-C1-181.0K
  - pure-C2-110.0K
  - pure-C2-150.0K
  - pure-C2-230.0K
  - pure-C3-150.0K
  - pure-C3-231.0K
  - pure-C3-300.0K
  references:
  - 'Younglove, B. A., Ely, J. F., ''Thermophysical Properties of Fluids. Part II:
    Methane, Ethane, Propane, Isobutane, and Normal Butane'', J. Phys. Chem. Ref. Data
    16, 577-798, 1987 - the 32-term pressure-form coefficients transcribed from
    Appendix J (NIST-hosted reprint), methane p. 794, ethane p. 795, propane p. 796'
  l0:
    pure_psat_limit:
      points: [["C1", 160.0], ["C3", 300.0]]
    phase_identification:
      points: [["C1", 160.0], ["C3", 300.0]]
    round_trip:
      z: {C1: 1.0}
      # 150 K / 2.5 MPa is compressed-liquid methane below Tc — the saturation
      # crossing (~172 K) must land between two finite bracket-scan points, and
      # above ~3 MPa the scan hits the critical region before confirming a sign
      # change. PH/PS round-trip residual 2e-13 at this state.
      states: [[150.0, 2500000.0]]
    dhdT_cp:
      z: {C1: 1.0}
      state: [300.0, 1000000.0]
      phase: vapor
    single_liquid_limit:
      z: {C3: 1.0}
      state: [150.0, 3000000.0]
    determinism:
      z: {C1: 1.0}
      state: [300.0, 5000000.0]
  l0_excluded:
    gibbs_duhem: 'MBWR-32 is pure-fluid only: the Younglove-Ely report gives no mixing
      rules for these coefficient tables, so the mixture Gibbs-Duhem gate cannot apply.'
  l0_note: >-
    In-house MBWR-32: Younglove-Ely units (rho mol/l, P MPa) at the kernel, SI at the
    boundary; ideal-gas reference as for bwrs. Mixtures are refused by the adapter.
    Saturation verified against CoolProp 8.0.0 across the ten bound cases (worst
    sampled Psat deviation about 0.4 %). All 96 Appendix-J coefficients digit-verified
    against the printed tables: the ethane G(3) entry was found mistranscribed and
    corrected (finite-difference and consistency tests had passed on the wrong value).
    One source caveat, not resolved in this work: selected Younglove-Ely isobar
    cross-checks (propane 250 K, methane 100 K) disagree by several percent for
    reasons not resolved here.

- id: bwrs
  name: BWRS (Starling 1973) natural-gas components
  family: helmholtz
  adapter: ngdesign.thermo.helmholtz:BWRSPackage
  options: {}
  params: {}
  applicability:
    component_classes: [hydrocarbon, light_gas, inert, acid_gas]
    polar: true
    electrolyte: false
    T_K: [95.0, 600.0]
    P_Pa: [1000.0, 70000000.0]
    phases: [V, L]
  status: provisional
  validation:
  # 2026-11-04: L1 pure saturation states shared with bwr_ls (CoolProp 8.0.0 reference
  # values) and L2 methane-propane VLE (Reamer, Sage & Lacey 1950 via IUPAC SDS 27/28).
  - bwr_ls-C1-155.0K
  - bwr_ls-C2-230.0K
  - bwr_ls-C3-300.0K
  - bwrs-c1c3-277.59K-3.103MPa
  - bwrs-c1c3-294.26K-2.068MPa
  - bwrs-c1c3-310.93K-4.137MPa
  - bwrs-c1c3-327.59K-2.413MPa
  - bwrs-c1c3-344.26K-4.137MPa
  assessed:
    bwrs-c1c3-277.59K-3.103MPa: "bubble_P +7.16 % (3.3253 vs 3.103 MPa); y_C1 passes (0.7702 vs 0.7677) - k_ij = 0 BWRS (no C1-C3 interaction parameter in the shipped ORO-5249-2 set) overpredicts the methane-propane bubble pressure systematically; the vapour compositions and the pure-component saturation states pass, so this is the missing binary parameter (model limitation), not a solver fault. Measured 2026-11-04 after the SS-solver fix."
    bwrs-c1c3-294.26K-2.068MPa: "bubble_P +7.36 % (2.2202 vs 2.068 MPa); y_C1 passes (0.5392 vs 0.5338) - k_ij = 0 BWRS (no C1-C3 interaction parameter in the shipped ORO-5249-2 set) overpredicts the methane-propane bubble pressure systematically; the vapour compositions and the pure-component saturation states pass, so this is the missing binary parameter (model limitation), not a solver fault. Measured 2026-11-04 after the SS-solver fix."
    bwrs-c1c3-310.93K-4.137MPa: "bubble_P +8.87 % (4.5040 vs 4.137 MPa); y_C1 passes (0.5794 vs 0.5714) - k_ij = 0 BWRS (no C1-C3 interaction parameter in the shipped ORO-5249-2 set) overpredicts the methane-propane bubble pressure systematically; the vapour compositions and the pure-component saturation states pass, so this is the missing binary parameter (model limitation), not a solver fault. Measured 2026-11-04 after the SS-solver fix."
    bwrs-c1c3-344.26K-4.137MPa: "bubble_P +3.92 % (4.2993 vs 4.137 MPa); y_C1 passes (0.2449 vs 0.2392) - k_ij = 0 BWRS (no C1-C3 interaction parameter in the shipped ORO-5249-2 set) overpredicts the methane-propane bubble pressure systematically; the vapour compositions and the pure-component saturation states pass, so this is the missing binary parameter (model limitation), not a solver fault. Measured 2026-11-04 after the SS-solver fix."
  references:
  - Starling, K. E., 'Fluid Thermodynamic Properties for Light Petroleum Systems', Gulf
    Publishing, 1973 (the BWRS equation and parameter basis)
  - 'Starling, K. E., Cox, K. W., Kwok, Y. C., et al., ''Modified BWR Equation of State
    Parameters for Twenty-Seven Compounds'', ORO-5249-2 (U.S. ERDA report), Table 5, 1976 -
    the parameter table transcribed for the ten registry-reachable compounds (methane and
    nitrogen rows verified against the report; reported methane fits: vapor pressure 0.44%
    AAD, density 0.32% AAD)'
  l0:
    pure_psat_limit:
      points: [["C1", 160.0], ["N2", 110.0]]
    phase_identification:
      points: [["C1", 160.0], ["N2", 110.0]]
    round_trip:
      z: {N2: 0.05, C1: 0.9, CO2: 0.05}
      states: [[300.0, 5000000.0]]
    dhdT_cp:
      z: {C1: 1.0}
      state: [300.0, 1000000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.9, N2: 0.1}
        T: 300.0
        P: 5000000.0
        phase: vapor
      - z: {C1: 0.5, CO2: 0.5}
        T: 220.0
        P: 5000000.0
        phase: hc_liquid
    single_liquid_limit:
      z: {C3: 0.3, nC4: 0.7}
      state: [250.0, 2000000.0]
    determinism:
      z: {N2: 0.05, C1: 0.9, CO2: 0.05}
      state: [300.0, 5000000.0]
  l0_excluded: {}
  l0_note: >-
    In-house BWRS: imperial parameter evaluation, SI at the boundary. Ideal-gas
    reference H_ig(298.15 K) = 0, S_ig(298.15 K, 1 bar) = 0 (with ideal mixing entropy).
    2026-11-04 fixes: the departure enthalpy was returned in psia-ft3/lbmol and read as
    H/(RT) (saturated-liquid Cp came out ~ -4e4 J/(mol K)); the entropy departure lacked
    ln Z; the mixture dew SS stepped P the wrong way and the bubble incipient vapour was
    a one-step K at the feed. After the fixes the three pure saturation states pass every
    property (Cp within 2-3 %) and y_C1 passes at every C1/C3 point, while the k_ij = 0
    bubble pressure misses +3.9 to +8.9 % at four of six points (assessed). Held
    provisional deliberately: the rule's letter is met (L1 pass, two L2 points pass) but
    the passing new L2 point sits at 2.99 %, inside a systematic over-prediction; a
    C1-C3 interaction parameter is the follow-up. Low-Tr states (C1 95 K, C2 110 K) also
    miss (Psat -20 % at C2 110 K) and are not bound.

