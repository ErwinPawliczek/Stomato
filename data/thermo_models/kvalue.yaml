- id: braun-k10
  name: Braun K10 low-pressure limit (ideal-K asymptote of the K10 charts)
  family: kvalue
  adapter: ngdesign.thermo.kvalue:BraunK10Thermo
  options:
    k_model: braun_k10
  params:
    source: vapour pressures from the ChemSep databank Psat basis; the row refuses service
      above 0.7 MPa by construction
    provenance: Braun convergence-pressure K10 charts, Cajander, B. C., Hipkin, H. G. & Lenoir,
      J. M., 'Prediction of Equilibrium Ratios from Nomographs of Improved Accuracy', J. Chem.
      Eng. Data 5(3), 251-259, 1960; the digitised polynomial fits are blocked on a published
      parameter source (GitHub issue 139), so the row implements the charts' documented low-pressure
      asymptote K_i = Psat_i/P and refuses outside it (deviation recorded for the T-05 review)
  applicability:
    component_classes:
    - hydrocarbon
    polar: false
    electrolyte: false
    T_K: [200.0, 560.0]
    P_Pa: [1000.0, 700000.0]
    phases: [V, L, VLL]
  status: validated
  validation:
  - braun-k10-pureK-C1-125K
  - braun-k10-pureK-nC4-280K
  # 2026-11-04: measured normal boiling points (L1) and near-ideal toluene + o-xylene and
  # nonane + heptane VLE at 101.3 kPa (L2), Gupta & Lee 2013 via NIST ThermoML.
  - idealk-pure-toluene-101.3kPa
  - idealk-pure-o-xylene-101.3kPa
  - idealk-pure-heptane-101.3kPa
  - idealk-pure-nonane-101.3kPa
  - idealk-toluene-o-xylene-101.3kPa-x0.693
  - idealk-toluene-o-xylene-101.3kPa-x0.5
  - idealk-toluene-o-xylene-101.3kPa-x0.23
  - idealk-nonane-heptane-101.3kPa-x0.367
  - idealk-nonane-heptane-101.3kPa-x0.641
  assessed:
    idealk-toluene-o-xylene-101.3kPa-x0.693: "vapor_comp y_toluene 0.8548 vs 0.886 (abs 3.12e-2 > 0.02). Bubble T passes at the same point. Ideal K = Psat/P has no liquid non-ideality or vapour correction by construction; the measured vapour is richer in the light component than the vapour-pressure ratio allows. This is a model limitation; no solver fault was found. Measured 2026-11-04."
    idealk-toluene-o-xylene-101.3kPa-x0.5: "vapor_comp y_toluene 0.7187 vs 0.765 (abs 4.63e-2 > 0.02). Bubble T passes at the same point. Ideal K = Psat/P has no liquid non-ideality or vapour correction by construction; the measured vapour is richer in the light component than the vapour-pressure ratio allows. This is a model limitation; no solver fault was found. Measured 2026-11-04."
    idealk-nonane-heptane-101.3kPa-x0.367: "vapor_comp y_nonane 0.1099 vs 0.084 (abs 2.59e-2 > 0.02). Bubble T passes at the same point. Ideal K = Psat/P has no liquid non-ideality or vapour correction by construction; the measured vapour is richer in the light component than the vapour-pressure ratio allows. This is a model limitation; no solver fault was found. Measured 2026-11-04."
  references:
  - Cajander, B. C., Hipkin, H. G. & Lenoir, J. M., J. Chem. Eng. Data 5(3), 251-259, 1960
  l0:
    pure_psat_limit:
      points:
      - - C1
        - 125.0
      - - nC4
        - 280.0
    phase_identification:
      points:
      - - C1
        - 125.0
      - - nC4
        - 280.0
    round_trip:
      z: {C1: 0.5, C3: 0.5}
      states: [[300.0, 100000.0]]
    dhdT_cp:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
      phase: vapor

    single_liquid_limit:
      z: {nC5: 1.0}
      state: [300.0, 160000.0]
    determinism:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
  l0_excluded:
    gibbs_duhem: >-
      the Braun K10 asymptote K10_i(T, P) is composition-independent: the Gibbs-Duhem
      residual is identically zero by construction and the check's |sum x dlnphi| /
      sum |x dlnphi| normalisation degenerates to 0/0
  l0_note: 'the declared pure_psat_limit/phase_identification points stay inside the 0.7 MPa
    service cap (C1 and nC4); the propane/CO2 saturation points above the cap are refused by
    construction and covered by the applicability window instead'
