# Family ``kvalue`` — the classic refinery-era K-value correlations (spec T-05).
#
# Rows are correlations, not equations of state: K_i = nu_i gamma_i / phi_i with published
# components, sharing the KValuePackage adapter (flash on Rachford-Rice, enthalpies from
# the Lee-Kesler departures implemented in kvalue.py). Every row is provisional: the
# binary anchors bind only where the measured deviations are inside the case tolerances
# (see data/validation/kvalue/cases.yaml for the reconciliation notes).
#
# L0 declarations are inline per row (the schema owns no ``kvalue`` l0_defaults): the
# databank-Psat rows declare pure_psat_limit; the rows carrying their own vapour-pressure
# basis (nu0 charts, LK EOS, Antoine) exclude it with the measured deviation named.
- id: chao-seader
  name: Chao-Seader K-values (nu0 + regular solution + Redlich-Kwong)
  family: kvalue
  adapter: ngdesign.thermo.kvalue:ChaoSeaderThermo
  options:
    k_model: chao_seader
  params:
    source: nu0/regular-solution coefficient tables under data/thermo_params/kvalue/, critical
      constants and acentric factors from the ChemSep databank
    provenance: Chao, K. C. & Seader, J. D., 'A General Correlation of Vapor-Liquid Equilibria
      in Hydrocarbon Mixtures', AIChE J. 7(4), 598-605, 1961; nu0 coefficient sets verified
      against the DWSIM ChaoSeader implementation (commit 1abf72d) after re-transcription
      from the Rust DWSIM-kernel port; solubility parameters and molar volumes from Prausnitz,
      Lichtenthaler & de Azevedo, Molecular Thermodynamics of Fluid-Phase Equilibria, 3rd ed., 1999
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    polar: false
    electrolyte: false
    T_K: [200.0, 530.0]
    P_Pa: [1000.0, 14000000.0]
    phases: [V, L, VLL]
  status: provisional
  validation:
  - chao-seader-pureK-C3-300K
  - chao-seader-pureK-nC4-280K
  - chao-seader-pureK-CO2-265K
  - chao-seader-c1c3-277.59K-4.826MPa
  - chao-seader-c1c3-294.26K-4.137MPa
  references:
  - Chao, K. C. & Seader, J. D., AIChE J. 7(4), 598-605, 1961
  - Prausnitz, J. M., Lichtenthaler, R. N. & de Azevedo, E. G., Molecular Thermodynamics of
    Fluid-Phase Equilibria, 3rd ed., Prentice Hall, 1999
  l0:
    phase_identification:
      points:
      - - C1
        - 125.0
      - - C3
        - 300.0
      - - nC4
        - 280.0
    round_trip:
      z: {C1: 0.5, C3: 0.5}
      states: [[300.0, 100000.0]]
    dhdT_cp:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.5, C3: 0.5}
        T: 300.0
        P: 1000000.0
        phase: hc_liquid
    single_liquid_limit:
      z: {C3: 0.5, nC4: 0.5}
      state: [300.0, 2000000.0]
    determinism:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
  l0_excluded:
    pure_psat_limit: >-
      the row's own nu0/RK correlation is the vapour-pressure basis: the measured
      pure-component bubble at the databank-Psat state deviates +11.74 % (C1, 125 K),
      -4.87 % (C3, 300 K), -2.21 % (nC4, 280 K) and -3.28 % (CO2, 265 K); the 1e-6
      databank-equality limit is the databank-Psat rows' construction, and this row's
      correlation accuracy is measured by its pureK bubble cases instead
  l0_note: ''
