# Family ``kvalue`` — the classic refinery-era K-value correlations (spec T-05).
#
# Rows are correlations, not equations of state: K_i = nu_i gamma_i / phi_i with published
# components, sharing the KValuePackage adapter (flash on Rachford-Rice, enthalpies from
# the Lee-Kesler departures implemented in kvalue.py). Each row's status follows the audited rule; misses are bound and assessed
# per row (see data/validation/kvalue/cases.yaml for the reconciliation notes). The
# esso-tabular and braun-k10 rows are validated as what they implement (ideal K on the
# Antoine / databank Psat basis), not as the Esso charts or the Braun K10 nomographs.
#
# L0 declarations are inline per row (the schema owns no ``kvalue`` l0_defaults): the
# databank-Psat rows declare pure_psat_limit; the rows carrying their own vapour-pressure
# basis (nu0 charts, LK EOS, Antoine) exclude it with the measured deviation named.
- id: chao-seader
  name: Chao-Seader K-values (nu0 + regular solution + Redlich-Kwong)
  family: kvalue
  adapter: ngdesign.thermo.kvalue:ChaoSeaderThermo
  options:
    k_model: chao_seader
  params:
    source: nu0/regular-solution coefficient tables under data/thermo_params/kvalue/, critical
      constants and acentric factors from the ChemSep databank
    provenance: Chao, K. C. & Seader, J. D., 'A General Correlation of Vapor-Liquid Equilibria
      in Hydrocarbon Mixtures', AIChE J. 7(4), 598-605, 1961; nu0 coefficient sets verified
      against the DWSIM ChaoSeader implementation (commit 1abf72d) after re-transcription
      from the Rust DWSIM-kernel port; solubility parameters and molar volumes from Prausnitz,
      Lichtenthaler & de Azevedo, Molecular Thermodynamics of Fluid-Phase Equilibria, 3rd ed., 1999
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    polar: false
    electrolyte: false
    T_K: [200.0, 530.0]
    P_Pa: [1000.0, 14000000.0]
    phases: [V, L, VLL]
  # 2026-11-04 (csgs): demoted validated -> provisional. With methane omega_cs corrected to
  # 0 the C1/C3 K_C1 anchors that had passed now miss (+6.7 %, +7.4 %; both states lie outside
  # the correlation's recommended range, molal-average Tr 0.95 > 0.93, Henley & Seader 1981
  # p. 189), and the C1/nC5 bubble pressures miss at 4/5 points. Counting comparisons the
  # majority rule reads 8 ok / 6 miss (5 of the passes are y_C1, which is insensitive here).
  status: provisional
  validation:
  - chao-seader-pureK-C3-300K
  - chao-seader-pureK-nC4-280K
  - chao-seader-pureK-CO2-265K
  - chao-seader-c1c3-277.59K-4.826MPa
  - chao-seader-c1c3-294.26K-4.137MPa
  - gs-c1nc5-310.93K-1.379MPa
  - gs-c1nc5-310.93K-4.137MPa
  - gs-c1nc5-310.93K-6.895MPa
  - gs-c1nc5-344.26K-1.379MPa
  - gs-c1nc5-344.26K-2.758MPa
  assessed:
    chao-seader-c1c3-277.59K-4.826MPa: "K_C1 +6.7 % (3.063 vs 2.870); K_C3 passes (0.2490 vs 0.2602). The state lies outside the Chao-Seader recommended range (molal-average Tr 0.95 > 0.93 with methane present; Henley & Seader 1981 p. 189, restriction (d)). This K_C1 passed (2.889) only while methane carried omega_cs 0.011. Investigated 2026-11-04 (csgs): methane omega_cs corrected 0.011 -> 0 (Henley & Seader 1981 App. I p. 715); the implementation then reproduces an independent 1966 Chao-Seader implementation (Saxena thesis Table 5 p. 126, C1/nC5 at 310.93 K: K_C1 5.47 vs 5.49 at 3.447 MPa, 3.03 vs 3.04 at 6.895 MPa), so the deviation is the published correlation's. Model limitation, not a bug."
    chao-seader-c1c3-294.26K-4.137MPa: "K_C1 +7.4 % (3.805 vs 3.542); K_C3 passes (0.3564 vs 0.3696). Molal-average Tr 0.945 > 0.93, outside the recommended range (Henley & Seader 1981 p. 189 (d)). This K_C1 passed (3.484) only while methane carried omega_cs 0.011. Investigated 2026-11-04 (csgs): methane omega_cs corrected 0.011 -> 0 (Henley & Seader 1981 App. I p. 715); the implementation then reproduces an independent 1966 Chao-Seader implementation (Saxena thesis Table 5 p. 126, C1/nC5 at 310.93 K: K_C1 5.47 vs 5.49 at 3.447 MPa, 3.03 vs 3.04 at 6.895 MPa), so the deviation is the published correlation's. Model limitation, not a bug."
    gs-c1nc5-310.93K-1.379MPa: "bubble_P -10.9 % (1.229 vs 1.379 MPa); y_C1 passes (0.8967 vs 0.8940). Investigated 2026-11-04 (csgs): methane omega_cs corrected 0.011 -> 0 (Henley & Seader 1981 App. I p. 715); the implementation then reproduces an independent 1966 Chao-Seader implementation (Saxena thesis Table 5 p. 126, C1/nC5 at 310.93 K: K_C1 5.47 vs 5.49 at 3.447 MPa, 3.03 vs 3.04 at 6.895 MPa), so the deviation is the published correlation's. Saxena's own comparison shows the same published CS prediction 7 % below the measured K_C1 at 3.447 MPa (5.49 vs 5.88). At 4.137 MPa K_C1 4.66 vs 4.93 (-5.6 %), K_nC5 0.0626 vs 0.0705 (-11 %, the Redlich-Kwong vapour fugacity of nC5, phi_V 0.526 vs PR 0.476). Model limitation, not a bug."
    gs-c1nc5-310.93K-4.137MPa: "bubble_P -7.3 % (3.837 vs 4.137 MPa); y_C1 passes (0.9495 vs 0.9430). Before the 2026-11-04 fixes this point returned 1.574 MPa with y_C1 0.318: the bubble search was seeded with K evaluated at y = z, where the RK cubic has only a liquid root, and converged on a liquid-density 'vapour' (Z 0.08); fixed (incipient-phase seeding, tests/thermo/test_kvalue_cs_gs_methane.py). Investigated 2026-11-04 (csgs): methane omega_cs corrected 0.011 -> 0 (Henley & Seader 1981 App. I p. 715); the implementation then reproduces an independent 1966 Chao-Seader implementation (Saxena thesis Table 5 p. 126, C1/nC5 at 310.93 K: K_C1 5.47 vs 5.49 at 3.447 MPa, 3.03 vs 3.04 at 6.895 MPa), so the deviation is the published correlation's. K_C1 4.66 vs 4.93 (-5.6 %), K_nC5 0.0626 vs 0.0705 (-11 %, RK vapour fugacity of nC5). Model limitation, not a bug."
    gs-c1nc5-344.26K-1.379MPa: "bubble_P -6.2 % (1.294 vs 1.379 MPa); y_C1 passes (0.7469 vs 0.7568). Investigated 2026-11-04 (csgs): methane omega_cs corrected 0.011 -> 0 (Henley & Seader 1981 App. I p. 715); the implementation then reproduces an independent 1966 Chao-Seader implementation (Saxena thesis Table 5 p. 126, C1/nC5 at 310.93 K: K_C1 5.47 vs 5.49 at 3.447 MPa, 3.03 vs 3.04 at 6.895 MPa), so the deviation is the published correlation's. Model limitation, not a bug."
    gs-c1nc5-344.26K-2.758MPa: "bubble_P -4.9 % (2.623 vs 2.758 MPa); y_C1 passes (0.8505 vs 0.8485). Investigated 2026-11-04 (csgs): methane omega_cs corrected 0.011 -> 0 (Henley & Seader 1981 App. I p. 715); the implementation then reproduces an independent 1966 Chao-Seader implementation (Saxena thesis Table 5 p. 126, C1/nC5 at 310.93 K: K_C1 5.47 vs 5.49 at 3.447 MPa, 3.03 vs 3.04 at 6.895 MPa), so the deviation is the published correlation's. Model limitation, not a bug."
  references:
  - Chao, K. C. & Seader, J. D., AIChE J. 7(4), 598-605, 1961
  - Prausnitz, J. M., Lichtenthaler, R. N. & de Azevedo, E. G., Molecular Thermodynamics of
    Fluid-Phase Equilibria, 3rd ed., Prentice Hall, 1999
  l0:
    phase_identification:
      points:
      - - C1
        - 125.0
      - - C3
        - 300.0
      - - nC4
        - 280.0
    round_trip:
      z: {C1: 0.5, C3: 0.5}
      states: [[300.0, 100000.0]]
    dhdT_cp:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.5, C3: 0.5}
        T: 300.0
        P: 100000.0
        phase: vapor
    single_liquid_limit:
      z: {C3: 0.5, nC4: 0.5}
      state: [300.0, 2000000.0]
    determinism:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
  l0_excluded:
    pure_psat_limit: >-
      the row's own nu0/RK correlation is the vapour-pressure basis: the measured
      pure-component bubble at the databank-Psat state deviates +15.85 % (C1, 125 K),
      -4.87 % (C3, 300 K), -2.21 % (nC4, 280 K) and -3.28 % (CO2, 265 K); the 1e-6
      databank-equality limit is the databank-Psat rows' construction, and this row's
      correlation accuracy is measured by its pureK bubble cases instead
  l0_note: ''
- id: grayson-streed
  name: Grayson-Streed K-values (GS nu0 sets, original RK vapour phase)
  family: kvalue
  adapter: ngdesign.thermo.kvalue:GraysonStreedThermo
  options:
    k_model: grayson_streed
  params:
    source: nu0/regular-solution coefficient tables under data/thermo_params/kvalue/, critical
      constants and acentric factors from the ChemSep databank
    provenance: Grayson, H. G. & Streed, C. W., 'Vapor-Liquid Equilibria for High Temperature,
      High Pressure Hydrogen-Hydrocarbon Systems', Proc. 6th World Pet. Congr., Frankfurt,
      Sect. III, 233-245, 1963; coefficient sets verified against the DWSIM ChaoSeader
      implementation (commit 1abf72d)
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    polar: false
    electrolyte: false
    T_K: [255.0, 533.0]
    P_Pa: [1000.0, 13800000.0]
    phases: [V, L, VLL]
  status: provisional
  validation:
  - grayson-streed-pureK-C3-300K
  - grayson-streed-pureK-nC4-280K
  - grayson-streed-pureK-CO2-265K
  # 2026-11-04: methane + n-pentane VLE inside the GS window (Sage et al. 1942 via IUPAC
  # SDS 27/28 p. 306); every point misses bubble_P by -10 to -20 % (assessed).
  - gs-c1nc5-310.93K-1.379MPa
  - gs-c1nc5-310.93K-4.137MPa
  - gs-c1nc5-310.93K-6.895MPa
  - gs-c1nc5-344.26K-1.379MPa
  - gs-c1nc5-344.26K-2.758MPa
  assessed:
    gs-c1nc5-310.93K-1.379MPa: "bubble_P -20.1 % (1.103 vs 1.379 MPa); y_C1 passes (0.8909 vs 0.8940) - Investigated 2026-11-04 (csgs): two data bugs fixed - methane omega_cs 0.011 -> 0 (Henley & Seader 1981 App. I p. 715; it had cut K_C1 by 11 %) and the GS simple-fluid A1 -2.10889 -> -2.10899 (H&S p. 188) - after which the implementation reproduces an independent 1966 Grayson-Streed implementation to its printed digits (Saxena thesis Table 5 p. 129, C1/nC4 at 310.93 K / 2.758 MPa: K_C1 5.73 vs 5.74, K_nC4 0.193 vs 0.193), and that published GS prediction is itself 15 % below the measured K_C1 6.75. At 310.93 K / 4.137 MPa both K stay low: K_C1 4.29 vs 4.93 (-13 %), K_nC5 0.0572 vs 0.0705 (-19 %); the GS pure-liquid nu0 of nC5 (0.0300) equals the PR pure-liquid f/P (0.0297), so the nC5 deficit is the correlation's Redlich-Kwong vapour fugacity of the heavy component (phi_V 0.526 vs PR 0.476). Model limitation of a correlation fitted for hydrogen-rich hydrotreater service, not a bug; lee-kesler-ploecker reproduces the 4.137 MPa point (+1.2 %)."
    gs-c1nc5-310.93K-4.137MPa: "bubble_P -16.5 % (3.454 vs 4.137 MPa); y_C1 passes (0.9526 vs 0.9430) - Investigated 2026-11-04 (csgs): two data bugs fixed - methane omega_cs 0.011 -> 0 (Henley & Seader 1981 App. I p. 715; it had cut K_C1 by 11 %) and the GS simple-fluid A1 -2.10889 -> -2.10899 (H&S p. 188) - after which the implementation reproduces an independent 1966 Grayson-Streed implementation to its printed digits (Saxena thesis Table 5 p. 129, C1/nC4 at 310.93 K / 2.758 MPa: K_C1 5.73 vs 5.74, K_nC4 0.193 vs 0.193), and that published GS prediction is itself 15 % below the measured K_C1 6.75. At 310.93 K / 4.137 MPa both K stay low: K_C1 4.29 vs 4.93 (-13 %), K_nC5 0.0572 vs 0.0705 (-19 %); the GS pure-liquid nu0 of nC5 (0.0300) equals the PR pure-liquid f/P (0.0297), so the nC5 deficit is the correlation's Redlich-Kwong vapour fugacity of the heavy component (phi_V 0.526 vs PR 0.476). Model limitation of a correlation fitted for hydrogen-rich hydrotreater service, not a bug; lee-kesler-ploecker reproduces the 4.137 MPa point (+1.2 %)."
    gs-c1nc5-310.93K-6.895MPa: "bubble_P -11.3 % (6.117 vs 6.895 MPa); y_C1 passes (0.9614 vs 0.9470) - Investigated 2026-11-04 (csgs): two data bugs fixed - methane omega_cs 0.011 -> 0 (Henley & Seader 1981 App. I p. 715; it had cut K_C1 by 11 %) and the GS simple-fluid A1 -2.10889 -> -2.10899 (H&S p. 188) - after which the implementation reproduces an independent 1966 Grayson-Streed implementation to its printed digits (Saxena thesis Table 5 p. 129, C1/nC4 at 310.93 K / 2.758 MPa: K_C1 5.73 vs 5.74, K_nC4 0.193 vs 0.193), and that published GS prediction is itself 15 % below the measured K_C1 6.75. At 310.93 K / 4.137 MPa both K stay low: K_C1 4.29 vs 4.93 (-13 %), K_nC5 0.0572 vs 0.0705 (-19 %); the GS pure-liquid nu0 of nC5 (0.0300) equals the PR pure-liquid f/P (0.0297), so the nC5 deficit is the correlation's Redlich-Kwong vapour fugacity of the heavy component (phi_V 0.526 vs PR 0.476). Model limitation of a correlation fitted for hydrogen-rich hydrotreater service, not a bug; lee-kesler-ploecker reproduces the 4.137 MPa point (+1.2 %)."
    gs-c1nc5-344.26K-1.379MPa: "bubble_P -10.9 % (1.228 vs 1.379 MPa); y_C1 passes (0.7398 vs 0.7568) - Investigated 2026-11-04 (csgs): two data bugs fixed - methane omega_cs 0.011 -> 0 (Henley & Seader 1981 App. I p. 715; it had cut K_C1 by 11 %) and the GS simple-fluid A1 -2.10889 -> -2.10899 (H&S p. 188) - after which the implementation reproduces an independent 1966 Grayson-Streed implementation to its printed digits (Saxena thesis Table 5 p. 129, C1/nC4 at 310.93 K / 2.758 MPa: K_C1 5.73 vs 5.74, K_nC4 0.193 vs 0.193), and that published GS prediction is itself 15 % below the measured K_C1 6.75. At 310.93 K / 4.137 MPa both K stay low: K_C1 4.29 vs 4.93 (-13 %), K_nC5 0.0572 vs 0.0705 (-19 %); the GS pure-liquid nu0 of nC5 (0.0300) equals the PR pure-liquid f/P (0.0297), so the nC5 deficit is the correlation's Redlich-Kwong vapour fugacity of the heavy component (phi_V 0.526 vs PR 0.476). Model limitation of a correlation fitted for hydrogen-rich hydrotreater service, not a bug; lee-kesler-ploecker reproduces the 4.137 MPa point (+1.2 %)."
    gs-c1nc5-344.26K-2.758MPa: "bubble_P -9.6 % (2.493 vs 2.758 MPa); y_C1 passes (0.8519 vs 0.8485) - Investigated 2026-11-04 (csgs): two data bugs fixed - methane omega_cs 0.011 -> 0 (Henley & Seader 1981 App. I p. 715; it had cut K_C1 by 11 %) and the GS simple-fluid A1 -2.10889 -> -2.10899 (H&S p. 188) - after which the implementation reproduces an independent 1966 Grayson-Streed implementation to its printed digits (Saxena thesis Table 5 p. 129, C1/nC4 at 310.93 K / 2.758 MPa: K_C1 5.73 vs 5.74, K_nC4 0.193 vs 0.193), and that published GS prediction is itself 15 % below the measured K_C1 6.75. At 310.93 K / 4.137 MPa both K stay low: K_C1 4.29 vs 4.93 (-13 %), K_nC5 0.0572 vs 0.0705 (-19 %); the GS pure-liquid nu0 of nC5 (0.0300) equals the PR pure-liquid f/P (0.0297), so the nC5 deficit is the correlation's Redlich-Kwong vapour fugacity of the heavy component (phi_V 0.526 vs PR 0.476). Model limitation of a correlation fitted for hydrogen-rich hydrotreater service, not a bug; lee-kesler-ploecker reproduces the 4.137 MPa point (+1.2 %)."
  references:
  - Grayson, H. G. & Streed, C. W., Proc. 6th World Pet. Congr., Sect. III, 233-245, 1963
  - Prausnitz, J. M., Lichtenthaler, R. N. & de Azevedo, E. G., Molecular Thermodynamics of
    Fluid-Phase Equilibria, 3rd ed., Prentice Hall, 1999
  l0:

    round_trip:
      z: {C1: 0.5, C3: 0.5}
      states: [[300.0, 100000.0]]
    dhdT_cp:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
      phase: vapor
    gibbs_duhem:
      binaries:
      - z: {C1: 0.5, C3: 0.5}
        T: 300.0
        P: 100000.0
        phase: vapor
    single_liquid_limit:
      z: {C3: 0.5, nC4: 0.5}
      state: [300.0, 2000000.0]
    determinism:
      z: {C1: 0.5, C3: 0.5}
      state: [300.0, 100000.0]
  l0_excluded:
    pure_psat_limit: >-
      the row's own GS nu0/RK correlation is the vapour-pressure basis: the measured
      pure-component bubble at the databank-Psat state deviates +110.90 % (C1, 125 K,
      the GS methane set outside its fitted range at Tr = 0.66), -2.57 % (C3, 300 K),
      -2.17 % (nC4, 280 K) and +0.82 % (CO2, 265 K); the databank-equality limit is the
      databank-Psat rows' construction, and this row's correlation accuracy is measured
      by its pureK bubble cases instead
    phase_identification: >-
      the row's own GS nu0 vapour-pressure basis overestimates the methane saturation
      pressure by up to +111 % (documented under pure_psat_limit), placing the check's
      own-Psat anchors at states where the Lee-Kesler departure enthalpy basis has no
      vapour root; the phase classification itself is exercised at the row's binary
      bubble and dew anchors instead
  l0_note: 'no binary anchor passes inside the case tolerances (the Reamer-Sage-Lacey methane-propane
    states miss by -6 to -35 %, see data/validation/kvalue/cases.yaml); the row stays provisional
    on the pureK bubble evidence'
