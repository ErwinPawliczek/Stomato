- id: depg_henry
  name: Physical solvent (DEPG Selexol-type) Henry solubility at 25 C
  family: kvalue
  adapter: ngdesign.thermo.kvalue:DepgHenryThermo
  options:
    k_model: physical_solvent
    enthalpy: ideal
  params:
    source: data/thermo_params/kvalue/depg.yaml
    provenance: Burr & Lyddon solubilities of CO2, H2S, CH4, CO, H2 and N2 in DEPG (Bucklin & Schendel
      1984 data) at 25 C and 1 atm, read as Henry constants; gamma = 1. Tetraglyme is the stream
      component standing in for the DEPG mixture. No temperature dependence is available openly,
      so the flash refuses outside 293.15-303.15 K
  applicability:
    component_classes:
    - acid_gas
    - light_gas
    - polar_organic
    polar: true
    electrolyte: false
    T_K: [293.15, 303.15]
    P_Pa: [10000.0, 10000000.0]
    phases: [V, L]
  status: provisional
  validation:
  # 2026-11-04: L2 gas solubility in tetraglyme at 298.15 K / 101.33 kPa (de la Iglesia et al.
  # 2003 via NIST ThermoML). C1 passes (-4.0 %); N2 and H2 miss (assessed). No L1 exists for
  # this row: it refuses gas-free feeds and the solvent Psat (~0.1 Pa) is below its window, so
  # the row cannot reach validated under the current rule (gap reported to the orchestrator).
  - depg-tetraglyme-C1-298.15K
  - depg-tetraglyme-N2-298.15K
  - depg-tetraglyme-H2-298.15K
  assessed:
    depg-tetraglyme-N2-298.15K: "K_N2 1240.8 vs 1748.6 (-29.0 %). N2 and H2 are both 29 % low while C1 is 4 % low, which points to the data basis rather than a code fault. The row's DEPG relative solubilities (Burr & Lyddon / Bucklin & Schendel 1984, read at 1 atm on the 280 g/mol DEPG mole basis) are applied to tetraglyme (222 g/mol) as the stand-in, and the sparingly soluble gases are the most sensitive to that mapping. Model/data-basis limitation; no code fault found. Measured 2026-11-04."
    depg-tetraglyme-H2-298.15K: "K_H2 1908.3 vs 2683.8 (-28.9 %). N2 and H2 are both 29 % low while C1 is 4 % low, which points to the data basis rather than a code fault. The row's DEPG relative solubilities (Burr & Lyddon / Bucklin & Schendel 1984, read at 1 atm on the 280 g/mol DEPG mole basis) are applied to tetraglyme (222 g/mol) as the stand-in, and the sparingly soluble gases are the most sensitive to that mapping. Model/data-basis limitation; no code fault found. Measured 2026-11-04."
  references:
  - Burr, B. & Lyddon, L., A Comparison of Physical Solvents for Acid Gas Removal, Bryan Research
    & Engineering
  l0:
    round_trip:
      z: {143-24-8: 0.95, CO2: 0.05}
      states: [[298.15, 2000000.0]]
    dhdT_cp:
      z: {143-24-8: 0.5, CO2: 0.5}
      state: [298.15, 100000.0]
      phase: vapor
    single_liquid_limit:
      z: {143-24-8: 0.95, CO2: 0.05}
      state: [298.15, 2000000.0]
    determinism:
      z: {143-24-8: 0.9, CO2: 0.1}
      state: [298.15, 1000000.0]
  l0_excluded:
    pure_psat_limit: the row refuses a feed with no gas solubility data and the solvent's Psat is about 0.1 Pa, below its pressure window; the claimed surface is gas in solvent
    phase_identification: same basis as pure_psat_limit
    gibbs_duhem: the K-values are composition-independent, so the residual is identically zero and the check's normalisation degenerates to 0/0, as for braun-k10
