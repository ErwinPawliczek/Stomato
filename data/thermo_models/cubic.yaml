  - kabadi-danner-srk-pure-nC4-280K
  - kabadi-danner-srk-pure-CO2-265K
  - kabadi-danner-srk-c1c3-294.26K-6.895MPa
  - kabadi-danner-srk-c1co2-277.15K-5.97MPa
  - kabadi-danner-srk-ng-dew-morch-243.4K-0.30MPa
  - kabadi-danner-srk-ng-dew-morch-254.6K-0.68MPa
  - kabadi-danner-srk-ng-dew-morch-260.8K-1.04MPa
  references:
