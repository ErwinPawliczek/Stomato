- id: kabadi-danner-free-water
  name: Water/hydrocarbon free-water method (Kabadi-Danner + NBS)
  family: cubic
  adapter: ngdesign.thermo.cubic:KabadiDannerFreeWaterThermo
  options:
    eos: SRKMIXKD
    kij_table: ChemSep PR
    free_water: iapws95
    mixing: kabadi_danner
  params:
    source: thermo IPDB (ChemSep) for the EOS; chemicals.iapws for IAPWS-95
    provenance: Kabadi-Danner SRK as the kabadi-danner-srk row. The free-water phase uses IAPWS-95, which superseded the NBS/NRC 1984 steam tables the plan names; the Haar-Gallagher-Kell formulation itself is not implemented
    free_water: water-rich liquid only (x_w > 0.5), Lewis-Randall on pure water from IAPWS-95 in fugacity, enthalpy, entropy and volume. The aqueous phase is what the flash finds, not forced pure; solutes keep their EOS fugacities
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    - water
    polar: false
    electrolyte: false
    T_K:
    - 273.16
    - 640.0
    P_Pa:
    - 1000.0
    - 100000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  l4_excluded:
    '*': >-
      The L4 slice feed carries 0.3 % water, so its dew point at 293.15 K is the water dew point,
      which is what the free-water method moves: with the steam-table water fugacity the row's water
      dew lands at 933084 Pa against 615000-724000 Pa for the rows on EOS water, outside the 20 % band by
      construction. Measured on methane + 0.3 % water at 293.15 K, pr gives 709 kPa and pr-free-water
      862 kPa, with an ideal-gas estimate of 780 kPa. The row still carries the EOS vapour phi of water.
  validation:
  - cubicopt-pure-C1-125K
  - cubicopt-pure-C3-300K
  - cubicopt-pure-nC4-280K
  - cubicopt-pure-CO2-265K
  - cubicopt-c1c3-294.26K-6.895MPa
  - cubicopt-c1co2-277.15K-5.97MPa
  assessed:
    cubicopt-pure-C1-125K: "Cp +6.9% (61.7209 vs 57.7411) - host-EOS limit shared with the srk row (srk on this point: Cp 61.7209): liquid Cp from the cubic residual (second T-derivative of a*alpha) (measured 2026-11-04, val-cubic-mixing)"
    cubicopt-pure-C3-300K: "rho_L -8.4% (448.204 vs 489.447); Cp +6.7% (128.942 vs 120.805) - host-EOS limit shared with the srk row (srk on this point: Cp 128.942, rho_L 448.204): liquid Cp from the cubic residual (second T-derivative of a*alpha); saturated-liquid density of the untranslated two-constant cubic (measured 2026-11-04, val-cubic-mixing)"
    cubicopt-pure-CO2-265K: "rho_L -11.8% (857.989 vs 973.254); Cp +12.2% (115.671 vs 103.056) - host-EOS limit shared with the srk row (srk on this point: Cp 115.671, rho_L 857.989): liquid Cp from the cubic residual (second T-derivative of a*alpha); saturated-liquid density of the untranslated two-constant cubic (measured 2026-11-04, val-cubic-mixing)"
    cubicopt-c1co2-277.15K-5.97MPa: "bubble_P -3.3% (5.77391e+06 vs 5.97e+06) - host-EOS limit shared with the srk row (srk on this point: bubble_P 5.77391e+06): bubble pressure (measured 2026-11-04, val-cubic-mixing)"
  references:
  - Wagner, W.; Pruss, A. J. Phys. Chem. Ref. Data 2002, 31, 387
  - Kabadi, V. N.; Danner, R. P. Ind. Eng. Chem. Process Des. Dev. 1985, 24, 537
