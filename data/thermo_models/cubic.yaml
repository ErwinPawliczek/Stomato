- id: kabadi-danner-srk
  name: SRK, Kabadi-Danner water-hydrocarbon mixing
  # T-15 solubility-case finding (2026-10-22): the row's water/hydrocarbon strength is
  # most directly validated by mutual-solubility points (e.g. Tsonopoulos & Wilson,
  # AIChE J. 29(6), 993-996, 1983 - open access, benzene/cyclohexane/n-hexane measured
  # 311-482 K at three-phase pressure), but (a) those compounds are not among the 18
  # curated components, and (b) water-in-hydrocarbon / hydrocarbon-in-water mole
  # fractions are 1e-4 to 1e-5, four orders below the fixed 0.02-absolute composition
  # tolerance, so any solubility case bound under the current tolerance vocabulary
  # would pass or fail vacuously. Binding needs either light-hydrocarbon (C1-C5)
  # solubility anchors (NIST IUPAC SDS-24 for propane) or a relative liquid_comp
  # tolerance - recorded for the harness follow-up (issue #167).
  family: cubic
  adapter: ngdesign.thermo.cubic:KabadiDannerSrkThermo
  options:
    eos: SRKMIXKD
    kij_table: ChemSep PR
    mixing: kabadi_danner
  params:
    source: thermo IPDB (ChemSep)
    provenance: Kooijman & Taylor, ChemSep IPDB; critical constants and acentric factors from the
      ChemSep pure-component database; binary interaction parameters from the 'ChemSep PR' table,
      0 where the table has no pair
    a_prime_terms: a''_j = G_j a_w(T)[1-(T/Tcw)^0.8] with published group contributions (g_CH4 1.3580,
      g_CH3 0.9822, g_CH2 1.0780; G_i by group sum) for methane through n-hexane; components outside
      the published paraffinic groups carry no a'' term
    coverage_note: >-
      The Kabadi-Danner water interaction is exercised by the family L0 checks (H2O sits in the
      pure_psat_limit and phase_identification probe sets) but by no mixture validation case in
      this PR: the C1/water two-phase flash at 410.9 K / 13.10 MPa shows the unphysical cubic
      water/methane split flagged for the plain rows (issue #136), so a water/hydrocarbon case
      for this row lands with the aqueous-phase work rather than a red or token case here.
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    - water
    polar: false
    electrolyte: false
    T_K:
    - 90.0
    - 700.0
    P_Pa:
    - 1000.0
    - 200000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation:
