- id: twu-sim-tassone
  name: Twu-Sim-Tassone cubic EOS
  family: cubic
  adapter: ngdesign.thermo.cubic:TwuSimTassoneThermo
  options:
    eos: TSTMIX
    kij_table: ChemSep PR
    alpha: twu_sim_tassone
  params:
    source: thermo IPDB (ChemSep)
    provenance: Kooijman & Taylor, ChemSep IPDB; critical constants and acentric factors from the
      ChemSep pure-component database; binary interaction parameters from the 'ChemSep PR' table,
      0 where the table has no pair
    eos_constants: a_c = 0.470507 R^2 Tc^2/Pc, b = 0.0740740 R Tc/Pc, denominator v^2 + 2.5 b v -
      1.5 b^2; alpha coefficients [L, M, N] from the paper's fitted normal-paraffin table (C1-C6),
      generalised Twu form for other components (documented fallback)
    implementation: >-
      EXPERIMENTAL — refuses at first use. TSTMIX reproduces the paper's alpha form but not the
      TST liquid-volume form or its mixture fugacity expressions, so measured volumes are wrong
      by an order of magnitude (PR #161 review). The validation cases stay bound above and are
      not run until the TST EOS form is implemented and the row returns to provisional.
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    - water
    polar: false
    electrolyte: false
    T_K:
    - 90.0
    - 700.0
    P_Pa:
    - 1000.0
    - 200000000.0
    phases:
    - V
    - L
    - VLL
  status: experimental
  validation:
  - twu-sim-tassone-pure-C1-125K
  - twu-sim-tassone-pure-C3-300K
  - twu-sim-tassone-pure-nC4-280K
  - twu-sim-tassone-pure-CO2-265K
  - twu-sim-tassone-c1c3-294.26K-6.895MPa
  - twu-sim-tassone-c1co2-277.15K-5.97MPa
  - twu-sim-tassone-ng-dew-morch-243.4K-0.30MPa
  - twu-sim-tassone-ng-dew-morch-254.6K-0.68MPa
  - twu-sim-tassone-ng-dew-morch-260.8K-1.04MPa
  references:
  - Twu, C. H.; Sim, W. D.; Tassone, V. A new cubic equation of state with a Twu-form alpha for hydrogen/hydrocarbon
    systems, 2002; constants and form as implemented in the Clapeyron.jl TSTEOS (github.com/ClapeyronThermo/Clapeyron.jl),
    retrieved 2026-10. Full journal citation unavailable offline; see PR body.
  - Twu, C. H.; Bluck, D.; Coon, J. E.; Cunningham, J. R. A Cubic Equation of State with a New Alpha
    Function and a New Mixing Rule. Fluid Phase Equilib. 1991, 69 (1), 33-50 (generalised alpha used
    for components outside the fitted table).
  l0_note: Fitted alpha table covers C1-nC6; CO2/N2/H2S in the slate use the generalised Twu alpha.
  l0_excluded:
    phase_identification: >-
      The TST alpha is fitted to hydrogen/hydrocarbon systems; for the probe components at
      300 K the internal vapour-pressure correlation deviates beyond the databank-anchored
      0.5x/2x bracket.
    gibbs_duhem: >-
      The C1/C3 hc_liquid probe at 250 K sits above the TST internal methane pseudo-critical
      line, so the liquid root switches along the composition path; the vapour probe passes.
  l4_excluded:
    "*": >-
      The TST EOS is fitted to hydrogen/hydrocarbon systems; on the natural-gas slice its dew pressure sits ~19x above the modern-EOS band (measured 1.38e7 vs 6.2e5-7.2e5 Pa) - the same limitation recorded in l0_excluded.
