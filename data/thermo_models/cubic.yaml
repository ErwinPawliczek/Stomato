  l0:
    phase_identification:
      points:
      - - nC4
        - 300.0
      - - C3
        - 300.0
      - - H2O
        - 600.0
    gibbs_duhem:
      binaries:
      - z:
          C1: 0.5
          C3: 0.5
        T: 250.0
        P: 2000000.0
        phase: hc_liquid
      - z:
          C1: 0.7
          CO2: 0.3
        T: 250.0
        P: 2000000.0
        phase: vapor
  l0_note: >-
    Two family-default L0 probes are moved, not excluded (measured 2026-11-04). phase_identification
    probes water at 600 K instead of 300 K: the check brackets the databank Psat by 0.5x/2x, and RK's
    own (Tr^-0.5 alpha) water vapour pressure at 300 K is 4.63x the databank value, so at 2x databank
    Psat the EOS-stable phase is correctly vapour; at 600 K the ratio is 1.15 and the bracket is a real
    classification test (nC4 300 K ratio 1.38, C3 300 K 1.15). gibbs_duhem probes the C1/C3 liquid at
    z(C1) = 0.5 instead of 0.6: RK's C1/C3 liquid root ceases to exist at z(C1) ~ 0.605 (250 K, 2 MPa),
    so the default loop over 0.59-0.61 integrated across a liquid/vapour root switch rather than
    along one root.
  l4_excluded:
    "*": >-
      RK's databank-anchored alpha overpredicts the 293.15 K slice dew pressure ~16x versus the modern-EOS band (measured 1.18e7 vs 6.2e5-7.2e5 Pa) - the documented RK crudeness recorded in l0_excluded, an EOS-accuracy difference rather than a catalogue inconsistency.
