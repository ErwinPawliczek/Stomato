  - vdw-c1c3-294.26K-6.895MPa
  - vdw-c1co2-277.15K-5.97MPa
  - vdw-ng-dew-morch-243.4K-0.30MPa
  - vdw-ng-dew-morch-254.6K-0.68MPa
  - vdw-ng-dew-morch-260.8K-1.04MPa
  references:
  - van der Waals, J. D. Over de Continuiteit van den Gas- en Vloeistoftoestand; thesis, Universiteit
    Leiden, 1873.
  l0_excluded:
    phase_identification: >-
      vdW's alpha = 1 misplaces the internal vapour-pressure correlation far above the
      databank value below Tc (nC4 and water at 300 K), so the databank-anchored 0.5x/2x
      classification bracket cannot straddle the offset; the C3 point passes.
    gibbs_duhem: >-
      The C1/C3 hc_liquid probe at 250 K sits where the vdW liquid root is mechanically
      unstable for methane-rich compositions, so the path integral crosses a root switch;
      the vapour probe passes.
  l4_excluded:
    "*": >-
      van der Waals' constant-alpha overpredicts the 293.15 K slice dew pressure ~14x versus the modern-EOS band (measured 1.02e7 vs 6.2e5-7.2e5 Pa) - the documented vdW crudeness recorded in l0_excluded.
