    - inert
    - water
    polar: false
    electrolyte: false
    T_K:
    - 90.0
    - 700.0
    P_Pa:
    - 1000.0
    - 200000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation:
  - rk-pure-C1-125K
  - rk-pure-C3-300K
  - rk-pure-nC4-280K
  - rk-pure-CO2-265K
  - rk-c1c3-294.26K-6.895MPa
  - rk-c1co2-277.15K-5.97MPa
  - rk-ng-dew-morch-243.4K-0.30MPa
  - rk-ng-dew-morch-254.6K-0.68MPa
  - rk-ng-dew-morch-260.8K-1.04MPa
  references:
  - Redlich, O.; Kwong, J. N. S. On the Thermodynamics of Solutions. V. An Equation of State. Fugacities
    of Gaseous Solutions. Chem. Rev. 1949, 44 (1), 233-244.
  l0_excluded:
    phase_identification: >-
      RK's Tr^-0.5 alpha misplaces the internal vapour-pressure correlation by orders of
      magnitude far below Tc (water at 300 K, Tr = 0.46), so the databank-anchored 0.5x/2x
      classification bracket cannot straddle the offset; the C3 and nC4 points pass.
    gibbs_duhem: >-
      The C1/C3 hc_liquid probe at 250 K lies above RK's methane pseudocritical temperature
      (a and b are fitted to the true critical point), so the liquid root does not exist
      along the whole composition path and the path integral crosses a root switch; the
      vapour probe passes at 2.4e-9.
  l4_excluded:
    "*": >-
      RK's databank-anchored alpha overpredicts the 293.15 K slice dew pressure ~16x versus the modern-EOS band (measured 1.18e7 vs 6.2e5-7.2e5 Pa) - the documented RK crudeness recorded in l0_excluded, an EOS-accuracy difference rather than a catalogue inconsistency.
  assessed:
    rk-c1c3-294.26K-6.895MPa: "bubble_P -7.6% (6.3692e+06 vs 6.895e+06); vapor_comp -3.3% (0.716679 vs 0.7497) - no attraction tuning (crudest EOS form): VLE and density outside bands by design (measured 2026-10-22, PR #161 table)"
    rk-ng-dew-morch-243.4K-0.30MPa: "dew_P +251.4% (1.05415e+06 vs 300000) - no attraction tuning (crudest EOS form): VLE and density outside bands by design (measured 2026-10-22, PR #161 table)"
