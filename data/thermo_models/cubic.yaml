- id: twu-sim-tassone
  name: Twu-Sim-Tassone cubic EOS
  family: cubic
  adapter: ngdesign.thermo.cubic:TwuSimTassoneThermo
  options:
    eos: TSTMIX
    kij_table: ChemSep PR
    alpha: twu_sim_tassone
  params:
    source: thermo IPDB (ChemSep)
    provenance: Kooijman & Taylor, ChemSep IPDB; critical constants and acentric factors from the
      ChemSep pure-component database; binary interaction parameters from the 'ChemSep PR' table,
      0 where the table has no pair
    eos_constants: a_c = 0.470507 R^2 Tc^2/Pc, b = 0.0740740 R Tc/Pc, denominator v^2 + 2.5 b v -
      1.5 b^2; alpha coefficients [L, M, N] from the paper's fitted normal-paraffin table (C1-C6),
      generalised Twu form for other components (documented fallback)
    implementation: >-
      TSTMIX over thermo's PRMIX with the TST constants (c1R2_c2R = c1*R/c2), delta = 2.5b,
      epsilon = -1.5b^2 re-pinned on __init__ and on thermo's to_TP_zs_fast clones, and the
      ln phi log term ln[(Z + 3B)/(Z - 0.5B)] (sqrt(delta^2 - 4 eps) = 3.5b). Two bugs fixed
      2026-11-04 (val-cubic-mixing): the log term used sqrt(8.5)b, and same-T flash clones
      reverted to PR's delta/epsilon; before the fix the C1/C3 Reamer bubble point was 3.91 MPa
      (-43%) and the Gibbs-Duhem L0 loop 0.23, after it 6.92 MPa (passes) and 1.9e-7.
      Saturation columns of pure cases short-circuit to the databank vapour pressure and are
      not EOS checks.
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    - water
    polar: false
    electrolyte: false
    T_K:
    - 90.0
    - 700.0
    P_Pa:
    - 1000.0
    - 200000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation:
  - twu-sim-tassone-pure-C1-125K
  - twu-sim-tassone-pure-C3-300K
  - twu-sim-tassone-pure-nC4-280K
  - twu-sim-tassone-pure-CO2-265K
  - twu-sim-tassone-c1c3-294.26K-6.895MPa
  - twu-sim-tassone-c1co2-277.15K-5.97MPa
  - twu-sim-tassone-ng-dew-morch-243.4K-0.30MPa
  - twu-sim-tassone-ng-dew-morch-254.6K-0.68MPa
  - twu-sim-tassone-ng-dew-morch-260.8K-1.04MPa
