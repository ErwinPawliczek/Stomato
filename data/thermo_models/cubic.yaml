- id: sour-srk
  name: Soave-Redlich-Kwong, sour-water correction
  family: cubic
  adapter: ngdesign.thermo.cubic:SourSrkThermo
  options:
    eos: SRKMIX
    kij_table: ChemSep PR
    sour: sour
  params:
    source: thermo IPDB (ChemSep)
    provenance: Kooijman & Taylor, ChemSep IPDB; critical constants and acentric factors from the
      ChemSep pure-component database; binary interaction parameters from the 'ChemSep PR' table,
      0 where the table has no pair
    sour_model: Wilson/API-955 ionisation apparent-fugacity correction on the aqueous phase; ionisation
      constants held at 298.15 K literature values (H2S pKa1 7.00, CO2 pKa1 6.35, NH4+ pKa 9.25),
      temperature correlations not implemented (documented deviation)
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    - water
    polar: false
    electrolyte: false
    T_K:
    - 90.0
    - 700.0
    P_Pa:
    - 1000.0
    - 200000000.0
    phases:
    - V
    - L
    - VLL
  status: provisional
  validation:
  - sour-srk-pure-C1-125K
  - sour-srk-pure-C3-300K
  - sour-srk-pure-nC4-280K
