- id: glycol_pr
  name: Glycol package (TEG dehydration, tuned PR)
  family: cubic
  adapter: ngdesign.thermo.cubic:GlycolPrThermo
  options:
    eos: PRMIXGlycol
    kij_table: ChemSep PR
    mixing: glycol_tuned
  params:
    source: data/thermo_params/glycol/teg_water_pr.yaml
    provenance: Gironi, Maschietti & Piemonte 2007, k12(T) linear in T and their Ambrose TEG constants,
      with per-entry provenance in the file. MEG refuses, its open CPA and k_ij values carry no
      primary citation; other pairs keep the ChemSep PR table
  applicability:
    component_classes:
    - water
    - glycol
    - light_gas
    - hydrocarbon
    polar: true
    electrolyte: false
    T_K:
    - 283.15
    - 480.0
    P_Pa:
    - 10000.0
    - 15000000.0
    phases:
    - V
    - L
  status: validated
  validation:
  - cubicopt-pure-C1-125K
  - cubicopt-pure-C3-300K
  - cubicopt-pure-nC4-280K
  - cubicopt-pure-CO2-265K
  - cubicopt-c1c3-294.26K-6.895MPa
  - cubicopt-c1co2-277.15K-5.97MPa
  - teg-h2o-85kPa-xw0.117
  - teg-h2o-85kPa-xw0.161
  - teg-h2o-85kPa-xw0.242
  - teg-h2o-85kPa-xw0.325
  - teg-h2o-85kPa-xw0.41
  - teg-h2o-85kPa-xw0.543
  - teg-h2o-85kPa-xw0.704
  - teg-h2o-85kPa-xw0.826
  - teg-h2o-85kPa-xw0.915
  assessed:
    cubicopt-pure-C1-125K: "rho_L +11.8% (449.652 vs 402.111) - host-EOS limit shared with the pr row (pr on this point: rho_L 449.652): saturated-liquid density of the untranslated two-constant cubic (measured 2026-11-04, val-cubic-mixing)"
    cubicopt-pure-CO2-265K: "Cp +8.1% (111.409 vs 103.056) - host-EOS limit shared with the pr row (pr on this point: Cp 111.409): liquid Cp from the cubic residual (second T-derivative of a*alpha) (measured 2026-11-04, val-cubic-mixing)"
    teg-h2o-85kPa-xw0.117: "bubble_T +7.2% (451.474 vs 421.25); vapor_comp -0.026 abs (0.956902 vs 0.9829) - TEG-rich end of the isobar: the single linear Gironi 2007 k12(T) (fitted elsewhere) under-predicts the TEG-water non-ideality at x_w < 0.45 (plain pr is -7..-12% low on every point of this set); note the source isobar is itself non-monotonic at x_w 0.161-0.251 (measured 2026-11-04, val-cubic-mixing)"
    teg-h2o-85kPa-xw0.161: "bubble_T +5.3% (438.295 vs 416.25) - TEG-rich end of the isobar: the single linear Gironi 2007 k12(T) (fitted elsewhere) under-predicts the TEG-water non-ideality at x_w < 0.45 (plain pr is -7..-12% low on every point of this set); note the source isobar is itself non-monotonic at x_w 0.161-0.251 (measured 2026-11-04, val-cubic-mixing)"
    teg-h2o-85kPa-xw0.242: "bubble_T +2.1% (422.07 vs 413.25) - TEG-rich end of the isobar: the single linear Gironi 2007 k12(T) (fitted elsewhere) under-predicts the TEG-water non-ideality at x_w < 0.45 (plain pr is -7..-12% low on every point of this set); note the source isobar is itself non-monotonic at x_w 0.161-0.251 (measured 2026-11-04, val-cubic-mixing)"
    teg-h2o-85kPa-xw0.325: "bubble_T +1.7% (410.69 vs 403.95) - TEG-rich end of the isobar: the single linear Gironi 2007 k12(T) (fitted elsewhere) under-predicts the TEG-water non-ideality at x_w < 0.45 (plain pr is -7..-12% low on every point of this set); note the source isobar is itself non-monotonic at x_w 0.161-0.251 (measured 2026-11-04, val-cubic-mixing)"
    teg-h2o-85kPa-xw0.41: "bubble_T +1.0% (401.841 vs 397.95) - TEG-rich end of the isobar: the single linear Gironi 2007 k12(T) (fitted elsewhere) under-predicts the TEG-water non-ideality at x_w < 0.45 (plain pr is -7..-12% low on every point of this set); note the source isobar is itself non-monotonic at x_w 0.161-0.251 (measured 2026-11-04, val-cubic-mixing)"
  references:
  - Gironi, F.; Maschietti, M.; Piemonte, V. Modelling triethylene glycol - water system for natural
    gas dehydration. ICheaP-8, 2007
  l0_note: The derivatives contract's dlnphi_dT and dlnphi_dP stay plain PR's and omit the tuned k_ij.
    Dry streams flash as pr does.
  l4_excluded:
    '*': the TEG constants replace the databank's only for TEG and the slice feed carries no glycol, so the row's slice point is the pr row's and adds no independent L4 information
- id: srk-kij0
  name: Soave-Redlich-Kwong, zero k_ij
  family: cubic
  adapter: ngdesign.thermo.cubic:SrkKij0Thermo
  options:
    eos: SRKMIX
    kij_table: none
    alpha: default
    translation: none
    enthalpy: eos
  params:
    source: thermo IPDB (ChemSep) pure-component constants; no binary table
    provenance: Kooijman & Taylor, ChemSep pure-component database for critical constants and acentric
      factors; every binary interaction parameter k_ij = 0. This is the zero-k_ij variant of the plain
      cubic EOS that textbook simulator examples ran (e.g. Seader, Henley & Roper, Separation Process
      Principles 3rd ed., Example 10.9, CHEMCAD SRK - its printed feed bubble point 123.5 F at 100 psia
      is reproduced with zero k_ij, not with the IPDB table). Use the IPDB-k_ij row for design work.
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    polar: false
    electrolyte: false
    T_K:
    - 90.0
    - 700.0
    P_Pa:
    - 1000.0
    - 200000000.0
    phases:
    - V
    - L
  status: provisional
  validation: []
  references:
  - Soave, G., 'Equilibrium Constants from a Modified Redlich-Kwong Equation of State', Chem. Eng. Sci. 27(6), 1197-1203, 1972
  l0: {}
  l0_excluded: {}
  l0_note: ''
  l4_excluded:
    zudkevitch-joffe-rk: >-
      The same slice dew gap the srk row declares against zudkevitch-joffe-rk (the
      Zudkevitch-Joffe alpha), unchanged by the zero k_ij: measured 614952 vs 872333 Pa
      (rel 0.295) at 293.15 K, srk itself 614969 Pa.
