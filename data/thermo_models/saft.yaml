- id: cpa_srk
  name: CPA-SRK (hand-rolled association kernel)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:CpaSrkThermo
  params:
    source: CPA-SRK, Kontogeorgis parameters (data/thermo_params/saft/pure.yaml)
    provenance: water 4C and methanol 2B CPA parameters from Kontogeorgis, Voutsas,
      Yakoumis & Tassios (1996) Ind. Eng. Chem. Res. 35, 4631-4642, retrieved and
      verified this session against Table 1 of Kontogeorgis et al. (1999) Fluid Phase
      Equilib. 158-160, 21-29; SRK cubic term closed-form, association term by
      successive substitution (Michelsen-Hendriks); k_ij = 0 — no verifiable open
      citation for the water-methanol CPA k_ij was found
  applicability:
    component_classes:
    - water
    - alcohol
    polar: true
    electrolyte: false
    T_K: [250.0, 620.0]
    P_Pa: [100.0, 1.0e+8]
    phases: [V, L]
  status: provisional
  validation: &cpa_srk_cases
  - pure-H2O-323.5K
  - pure-H2O-420.0K
  - pure-H2O-520.0K
  - pure-H2O-600.0K
  - pure-H2O-614.7K
  - pure-MeOH-256.3K
  - pure-MeOH-307.6K
  - pure-MeOH-358.8K
  - pure-MeOH-410.1K
  - pure-MeOH-461.3K
  - meohh2o-101.325kPa-353.25K
  - meohh2o-101.325kPa-349.05K
  - meohh2o-101.325kPa-346.20K
  - meohh2o-322.91K-15.932kPa
  - meohh2o-322.91K-26.131kPa
  - meohh2o-322.91K-31.544kPa
  - meohh2o-322.91K-40.850kPa
  - meohh2o-322.91K-46.450kPa
  - meohh2o-322.91K-52.142kPa
  references:
  - Kontogeorgis, Voutsas, Yakoumis & Tassios, "An Equation of State for Associating
    Fluids", Ind. Eng. Chem. Res. 35 (1996) 4631-4642
  - Kontogeorgis, Yakoumis, Meijer, Hendriks & Moorwood, "Multicomponent phase
    equilibrium calculations for water-methanol-alkane mixtures", Fluid Phase Equilib.
    158-160 (1999) 201-209
  l0:
    pure_psat_limit:
      points:
      - - H2O
        - 373.15
      - - H2O
        - 423.15
      - - MeOH
        - 337.7
      - - MeOH
        - 298.15
    phase_identification:
      points:
      - - H2O
        - 373.15
      - - MeOH
        - 320.0
    round_trip:
      z:
        H2O: 1.0
      states:
      # 350 K / 3e5 Pa: a compressed-liquid state well below the 3e5 Pa saturation
      # temperature (~407 K) so the PH inversion classifies trial temperatures via
      # the cheap Wilson band instead of an exact psat solve per trial; at 373.15 K
      # the trials clustered inside the near-saturation band and the check cost
      # ~200 s of exact saturation solves.
      - - 350.0
        - 3.0e+5
    dhdT_cp:
      state: [400.0, 1.0e+5]
      phase: vapor
      z:
        H2O: 1.0
    gibbs_duhem:
      # 30 midpoint steps: the association kernel evaluates ~100x slower than a
      # closed-form EOS and the integral is smooth; the 1e-6 bar is unchanged.
      steps: 30
      binaries:
      - z:
          MeOH: 0.5
          H2O: 0.5
        phase: vapor
        T: 400.0
        P: 1.0e+5
      - z:
          MeOH: 0.5
          H2O: 0.5
        phase: aqueous
        T: 350.0
        P: 3.0e+5
    single_liquid_limit:
      state: [373.15, 3.0e+5]
      z:
        H2O: 1.0
    determinism:
      state: [400.0, 1.0e+5]
      z:
        MeOH: 0.4
        H2O: 0.6
  l0_excluded: {}
  l0_note: >-
    teqp 0.23.2's own CPA engine NaNs its fugacity coefficients at liquid-like
    densities and collapses the water saturation line with the published Kontogeorgis
    parameters, so this row runs the bridge's hand-rolled CPA-SRK kernel instead
    (measured in the T-07 exploration). T-15c promoted the row to provisional on
    2026-10-22 (teqp CI-runnable, L0 declaration present): the 16 runnable bound cases
    measured 40/62 comparisons pass, and every miss is declared per case in `assessed:`
    with the measured values — saturated-liquid Cp 5-21 % low (no residual-Cp term in
    the cubic + association EOS), saturated-vapour density at the 8 % vapour-tolerance
    edge, and MeOH/H2O bubble_P up to +22.5 % with k_ij = 0. The three 101.325 kPa
    cases stay pending: they crash on the Wilson seed (SaturationError) and crashes
    are not declarable.

  assessed:
    pure-H2O-323.5K: "Cp -8.9 % (75.333 vs 68.614) — CPA-SRK with published Kontogeorgis
      (1996) parameters has no residual liquid-Cp contribution, the same class of
      limitation the amine and gamma-phi rows assessed (parameters verified T-07)
      (measured 2026-10-22, PR table)"
    pure-H2O-600.0K: "Cp -13.5 % (125.264 vs 108.307); rho_V -6.0 % (72.842 vs 68.447) —
      same no-residual-Cp limitation; vapour density deteriorates on the critical
      approach (Tc 647.1 K) (measured 2026-10-22, PR table)"
    pure-H2O-614.7K: "Cp -21.2 % (151.747 vs 119.659); rho_V -10.2 % (95.588 vs 85.874)
      — critical-region divergence at 33 K below Tc: the cubic term's density and its
      Cp derivative both degrade (measured 2026-10-22, PR table)"
    pure-MeOH-256.3K: "Cp -17.5 % (74.762 vs 61.682) — no residual liquid-Cp
      contribution, worst at the cold end of the 2B association range (measured
      2026-10-22, PR table)"
    pure-MeOH-307.6K: "Cp -9.4 % (83.169 vs 75.342); rho_V +5.0 % (0.3523 vs 0.3699) —
      no-residual-Cp limitation; saturated-vapour density at the 8 % vapour-tolerance
      edge (pure-component cubic-term density) (measured 2026-10-22, PR table)"
    pure-MeOH-358.8K: "Cp -5.2 % (96.783 vs 91.775); rho_V +6.9 % (2.5650 vs 2.7408) —
      same cubic-term vapour-density limitation (measured 2026-10-22, PR table)"
    pure-MeOH-410.1K: "rho_V +5.2 % (11.431 vs 12.022) — same cubic-term vapour-density
      limitation (Cp passes here) (measured 2026-10-22, PR table)"
    pure-MeOH-461.3K: "Cp -7.6 % (152.324 vs 140.714) — no residual liquid-Cp
      contribution (measured 2026-10-22, PR table)"
    meohh2o-322.91K-15.932kPa: "bubble_P +22.5 % (15932 vs 19509); vapor_comp 0.129
      abs above the 0.02 band (0.2741 vs 0.4029) — k_ij = 0: no verifiable open citation
      for the water-methanol CPA k_ij and tuning against the validation points is
      forbidden, so the cross-association is mispredicted and the methanol-lean end
      suffers worst (Gao 2012 isotherm; measured 2026-10-22, PR table)"
    meohh2o-322.91K-26.131kPa: "bubble_P +20.5 % (26131 vs 31474); vapor_comp 0.038 abs
      above the 0.02 band (0.6294 vs 0.6672) — same k_ij = 0 limitation (measured
      2026-10-22, PR table)"
    meohh2o-322.91K-31.544kPa: "bubble_P +12.6 % (31544 vs 35503); vapor_comp 0.034 abs
      above the 0.02 band (0.7580 vs 0.7243) — same k_ij = 0 limitation, decaying
      toward the methanol-rich end (measured 2026-10-22, PR table)"
    meohh2o-322.91K-40.850kPa: "bubble_P +7.1 % (40850 vs 43755); vapor_comp 0.029 abs
      above the 0.02 band (0.8654 vs 0.8364) — same k_ij = 0 limitation (measured
      2026-10-22, PR table)"
    meohh2o-322.91K-46.450kPa: "bubble_P +4.8 % (46450 vs 48675); vapor_comp 0.032 abs
      above the 0.02 band (0.9406 vs 0.9083) — same k_ij = 0 limitation (measured
      2026-10-22, PR table)"

