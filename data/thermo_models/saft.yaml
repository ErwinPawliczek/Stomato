      0.23.2 has no soft-SAFT factory or teqp.saft module)
    dhdT_cp: row is not implemented — no soft-SAFT engine exists (measured — teqp 0.23.2
      has no soft-SAFT factory or teqp.saft module)
    gibbs_duhem: row is not implemented — no soft-SAFT engine exists (measured — teqp
      0.23.2 has no soft-SAFT factory or teqp.saft module)
    single_liquid_limit: row is not implemented — no soft-SAFT engine exists (measured —
