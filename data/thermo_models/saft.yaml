  #   pure-MeOH-307.6K-pr, -358.8K-pr, -410.1K-pr pass all five comparisons (CoolProp);
  #   Sorensen (2018) fitted Psat, rho_L and mutual solubilities, so rho_V and Cp are
  #   the independent part. L2: meohh2o-322.91K-46.450kPa-pr and -52.142kPa-pr (Bayer
  #   1927) pass; independent of the fit — the paper's Table 7 MeOH/H2O k_ij was
