      Leekumjorn & Herslund, "Peng-Robinson Equation of State Extended to Handle
      Aqueous Components Using CPA Concept", J. Nat. Gas Eng. 6 (2018), DOI
      10.7569/JNGE.2018.692501, Table 6, retrieved and typed this session
      (2026-10-23) from the open-access copy at https://d-nb.info/136523830X/34
      with a constant-vs-source check against the printed table; the temperature-
      dependent water-methanol k_ij is the paper's Table 7 fit; PR cubic term
      closed-form, association term by the shared successive-substitution solver
      (Michelsen-Hendriks) with the paper's simplified-CPA radial distribution
      function (Appendix A eq. A14) and CR-1 combining rules
  applicability:
    component_classes:
    - water
