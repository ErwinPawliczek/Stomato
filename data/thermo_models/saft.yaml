  - pure-MeOH-307.6K-ps
  - pure-MeOH-358.8K-ps
  - pure-MeOH-410.1K-ps
  - pure-MeOH-461.3K-ps
  - pure-EtOH-300.0K-ps
  - pure-EtOH-351.45K-ps
  - pure-EtOH-420.0K-ps
  - pure-EtOH-480.0K-ps
  - meohh2o-322.91K-15.932kPa-ps
  - meohh2o-322.91K-26.131kPa-ps
  - meohh2o-322.91K-31.544kPa-ps
  - meohh2o-322.91K-40.850kPa-ps
  - meohh2o-322.91K-46.450kPa-ps
  - meohh2o-322.91K-52.142kPa-ps
  - meohh2o-101.325kPa-353.25K-ps
  - meohh2o-101.325kPa-349.05K-ps
  - meohh2o-101.325kPa-346.20K-ps
  - meohh2o-323.15K-x0.9785-bern
  - meohh2o-323.15K-x0.9340-bern
  - meohh2o-323.15K-x0.8674-bern
  - meohh2o-323.15K-x0.7484-bern
  - meohh2o-323.15K-x0.6408-bern
  - meohh2o-323.15K-x0.5564-bern
  - meohh2o-323.15K-x0.4482-bern
  - meohh2o-323.15K-x0.3274-bern
  - meohh2o-323.15K-x0.2589-bern
  - meohh2o-323.15K-x0.1788-bern
  - meohh2o-323.15K-x0.1123-bern
  - meohh2o-323.15K-x0.0621-bern
  references:
