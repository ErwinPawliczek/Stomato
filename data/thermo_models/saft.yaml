  family: saft
  adapter: ngdesign.thermo.teqp_bridge:SoftSaftThermo
  params:
    source: teqp 0.23.2 SoftSAFT kind, explicit coefficients (data/thermo_params/saft/pure.yaml)
    provenance: >-
      m, sigma, epsilon/k from J. C. Pamies, "Bulk and interfacial properties of chain
      fluids: a molecular modelling approach", PhD thesis, Universitat Rovira i Virgili
      (2003), open access (repositori.urv.cat TDX:304; TDX handle 10803/8522): Table 4.1
      (PV set, methane to n-octane; Pamies & Vega, Ind. Eng. Chem. Res. 40 (2001) 2532),
      Table 4.6 (H2, n-C10, n-C16) and Table 4.10 (CO2, non-associating). The engine is
      teqp's SoftSAFT kind: Johnson, Zollweg & Gubbins (1993) LJ MBWR reference (teqp's
      x_1..x_32 checked against the paper's Table 10; the EOS reproduces the paper's
      imposed critical point T* = 1.313, rho* = 0.310) plus the TPT1 chain term with the
      Johnson, Muller & Gubbins (1994) contact-value fit, the equations of the thesis
      (eqs 2.2-2.7, A.20-A.26). Unlike pairs use Lorentz-Berthelot with eta = xi = 1
      (teqp exposes no binary parameter for this kind); no association.
      Licences deferred (orchestrator, 2026-11-04); recorded anyway —
      LICENCE NOT VERIFIED (orchestrator, 2026-11-03): the thesis PDF carries no rights
      statement and tdx.cat refused automated access (HTTP 403), so the TDX terms of use
      were not read; TDX theses are commonly limited to private research and teaching
      use. The Table 4.1 set is also the published Pamies & Vega (2001) set. Review the
      licence before this row ships in a commercial build.
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - acid_gas
    polar: false
    electrolyte: false
    T_K: [90.0, 800.0]
    P_Pa: [1000.0, 1.0e+8]
    phases: [V, L]
  # Promotion evidence:
  #   Promoted 2026-11-04 (val-saft). L1: cpv-nC4-300.0K and cpv-nC6-350.0K-ss pass all
  #   five comparisons (CoolProp); the PV set was fitted to n-butane (NIST Webbook) and
  #   n-hexane (Smith & Srivastava) saturation densities and pressures (thesis Table 4.1
  #   caption), so rho_V and Cp are the independent part. L2: ss-c1c3-294.26K-6.895MPa
  #   (Reamer 1950) and ss-c1co2-293.130K-6.135MPa / -303.145K-7.306MPa (Petropoulou
  #   2018) pass with Lorentz-Berthelot (no binary parameter fitted).
  status: validated
  validation:
  - cpv-C1-125.0K
  - cpv-C1-155.0K
  - cpv-CO2-240.0K
  - cpv-CO2-265.0K
  - cpv-nC4-300.0K
  - cpv-nC6-350.0K-ss
  - cpv-nC10-400.0K
  - ss-c1c3-277.59K-1.724MPa
  - ss-c1c3-294.26K-6.895MPa
  - ss-c1c3-310.93K-2.068MPa
  - ss-c1co2-293.130K-6.135MPa
  - ss-c1co2-303.145K-7.306MPa
  assessed:
    cpv-C1-125.0K: "bubble_P/dew_P +11.8 % (268758 vs 300428) — the PV parameter set
      was fitted to saturated densities more accurately than to vapour pressures
      (Pamies 2003 thesis p. 33-34, Table 4.1 text, read 2026-11-04); the light-alkane
      Psat excess is the one tests/thermo/test_soft_saft.py records (measured
      2026-11-04, val-saft)"
    cpv-C1-155.0K: "bubble_P/dew_P +7.0 % (1295003 vs 1385690); rho_V -3.7 % (20.419 vs
      19.657) — same PV-set Psat bias plus classical-EOS vapour density on the
      critical approach (measured 2026-11-04)"
    cpv-CO2-240.0K: "rho_V -3.3 % (33.295 vs 32.212) — classical (non-crossover)
      vapour density; Psat, rho_L, Cp pass (measured 2026-11-04)"
    cpv-CO2-265.0K: "rho_V -6.9 % (75.471 vs 70.293) — same, steeper toward Tc
      (measured 2026-11-04)"
    cpv-nC10-400.0K: "bubble_P/dew_P -16.2 % (25513.5 vs 21386.3) — n-C10 parameters
      come from the PV correlation (thesis Table 4.6), not a fit; rho_L, rho_V, Cp
      pass (measured 2026-11-04)"
    ss-c1c3-277.59K-1.724MPa: "bubble_P -3.4 % (1724000 vs 1666100); vapor_comp -0.055
      abs (0.6382 vs 0.5836) — Lorentz-Berthelot with eta = xi = 1 (teqp's SoftSAFT
      kind exposes no binary parameter) plus the PV-set methane Psat bias (Reamer 1950;
      measured 2026-11-04)"
    ss-c1c3-310.93K-2.068MPa: "bubble_P +6.3 % (2068000 vs 2199100); vapor_comp -0.040
      abs (0.3255 vs 0.2856) — same (measured 2026-11-04)"
  references:
  - >-
    Blas & Vega, "Thermodynamic behaviour of homonuclear and heteronuclear Lennard-Jones
    chains with association sites from simulation and theory", Mol. Phys. 92 (1997) 135;
    Blas & Vega, "Prediction of binary and ternary diagrams using the statistical
    associating fluid theory (SAFT) equation of state", Ind. Eng. Chem. Res. 37 (1998)
    660 (citations as listed in the Pamies thesis, refs 19 and 101)
  - >-
    J. C. Pamies, PhD thesis, Universitat Rovira i Virgili (2003),
    https://repositori.urv.cat/repositori/getDocument/TDX%3A304?ds=Memoria&mime=application/pdf
  - >-
    Johnson, Zollweg & Gubbins, "The Lennard-Jones equation of state revisited",
    Mol. Phys. 78 (1993) 591-618, doi:10.1080/00268979300100411
  - >-
    Johnson, Muller & Gubbins, "Equation of state for Lennard-Jones chains",
    J. Phys. Chem. 98 (1994) 6413
  - teqp 0.23 (Bell et al.), https://github.com/usnistgov/teqp, MIT licence
  l0:
    pure_psat_limit:
      points:
      - - nC4
        - 300.0
      - - nC6
        - 350.0
      - - CO2
        - 250.0
    phase_identification:
      points:
      - - nC4
        - 300.0
      - - nC8
        - 400.0
    round_trip:
      z:
        nC4: 1.0
      states:
      - - 300.0
        - 2.0e+6
      - - 350.0
        - 2.0e+5
    dhdT_cp:
      state: [350.0, 2.0e+5]
      phase: vapor
      z:
        nC4: 1.0
    gibbs_duhem:
      binaries:
      - z:
          C1: 0.5
          nC4: 0.5
        phase: vapor
        T: 300.0
        P: 5.0e+5
      - z:
          C3: 0.5
          nC6: 0.5
        phase: hc_liquid
        T: 300.0
        P: 5.0e+6
    single_liquid_limit:
      state: [300.0, 5.0e+6]
      z:
        nC6: 1.0
    determinism:
      state: [300.0, 3.0e+6]
      z:
        C1: 0.5
        nC4: 0.5
  l0_excluded: {}
  l0_note: >-
    L1/L2 cases bound 2026-11-04 (val-saft, data/validation/saft/cases-val.yaml) once
    data/validation/ was opened. The row is also checked by
    tests/thermo/test_soft_saft.py against the source's own published soft-SAFT
    numbers (Pamies 2003 Tables 4.4 and 4.5: critical temperatures and densities of
    n-C12..n-C48) and against CoolProp saturation, with the measured deviations
    recorded there: the PV parameters overpredict the vapour pressure of methane,
    ethane and propane by 5-24 % (Tr 0.6-0.9; liquid density within 1 %), n-butane to
    n-octane are within 5 % (Psat) and 2.5 % (rho_L), CO2 within 3 % (240-280 K), H2
    within 5 % (20-30 K); n-C10 (correlation-derived, not fitted) runs 10-20 % low.
    Critical pressures of Table 4.4 are not reproduced (1-4 % high with the thesis's
    rounded PVrP correlation; temperatures match to 0.1 K). The bridge PT flash has no
    stability test: an asymmetric feed whose only density root is liquid-like (e.g.
    20 % H2 in n-C10 at 400 K, 5 MPa) is returned as one liquid, not split.
