- id: saft_vr_mie
  name: SAFT-VR Mie (teqp)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:SaftVrMieThermo
  params:
    source: teqp SAFT-VR-Mie, explicit coefficients (data/thermo_params/saft/pure.yaml)
    provenance: m, sigma, lambda_r, lambda_a from Lafitte, Apostolakis, Essmann & Muller
      (2013) J. Chem. Phys. 139, 154504 (DOI 10.1063/1.4819786), cross-checked against
      teqp 0.23.2's compiled parameter values to printed precision (methane, ethane,
      propane); CO2 from the same Table III (p. 154504-25), typed and checked
      digit-for-digit against the paper PDF in T-18. N2 stays absent — Lafitte (2013)
      Table III carries no nitrogen row and no other verified citable table was found
      (secondary sources attribute an N2 set to this table that it does not contain);
      k_ij = 0 for the pairs in scope
  applicability:
    component_classes:
    - hydrocarbon
    - acid_gas
    polar: false
    electrolyte: false
    T_K: [90.0, 420.0]
    P_Pa: [1000.0, 1.0e+8]
    phases: [V, L]
  # Promotion evidence:
  #   Promoted 2026-11-04 (val-saft). L1: pure-C1-95.3K and pure-C1-125.0K pass all five
  #   comparisons (CoolProp CH4); Lafitte (2013) fitted Psat, rho_L and speed of sound, so
  #   rho_V and Cp are the independent part. L2: five Petropoulou (2018) C1/CO2 bubble
  #   points pass at k_ij = 0 (293.13-303.14 K; the 303.14 K pair binds since the
  #   2026-11-04 bridge fixes; 298.142K-7.508MPa still raises near the mixture critical
  #   point and stays unbound).
  status: validated
  validation:
  - pure-C1-95.3K
  - pure-C1-125.0K
  - pure-C1-155.0K
  - pure-C1-172.0K
  - pure-C1-181.0K
  - pure-CO2-216.7K
  - pure-CO2-240.0K
  - pure-CO2-265.0K
  - pure-CO2-285.0K
  - pure-CO2-288.9K
  - c1co2-293.130K-6.135MPa
  - c1co2-293.130K-6.976MPa
  - c1co2-298.142K-6.976MPa
  - c1co2-303.145K-7.306MPa
  - c1co2-303.144K-7.361MPa
  assessed:
    pure-C1-155.0K: "rho_V -4.4% (19.526 vs 20.419 mol/l) — SAFT-VR-Mie vapour densities
      fall below the CoolProp reference as T rises toward methane's critical region"
    pure-C1-172.0K: "rho_V -7.9% (39.163 vs 42.514) — same trend, steeper near Tc"
    pure-C1-181.0K: "rho_V -11.3% (57.240 vs 64.523) and Cp -11.6% (109.738 vs
      124.139 J/mol/K) — the point sits 4.5 K below methane's critical temperature,
      where the paper's fit residuals are largest"
    pure-CO2-216.7K: "Cp -7.1% (79.885 vs 85.971 J/mol/K) — saturation heat capacity
      just above CO2's triple point"
    pure-CO2-240.0K: "rho_V -3.3% (32.205 vs 33.295 mol/l)"
    pure-CO2-265.0K: "rho_V -4.8% (71.815 vs 75.471 mol/l)"
    pure-CO2-285.0K: "rho_V -6.8% (134.205 vs 143.923 mol/l)"
    pure-CO2-288.9K: "rho_V -7.4% (152.984 vs 165.146 mol/l) — the Table III CO2 set
      undershoots saturation vapour densities by 3-8% against the CoolProp reference;
      pressures and liquid densities stay inside case tolerances at all five temperatures"
  references:
