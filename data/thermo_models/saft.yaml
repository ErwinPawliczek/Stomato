# SAFT / CPA / multi-fluid Helmholtz family (spec T-07). Every row loads without teqp
# (lazy import); the teqp-backed builds require `uv sync --extra saft` (teqp>=0.22).
# Registered but non-building row (soft_saft)
# refuses in _validate_kind with the named reason, so a feed selecting it fails loudly
# instead of silently dropping the physics it stands for. pc_saft and cpa_srk were
# promoted to provisional in T-15c (teqp 0.23.2 confirmed CI-runnable on cp312 wheels);
# cpa_pr joined them in T-17 (hand-rolled PR physical term + the shared saft_assoc
# association solver, Sorensen 2018 parameters); every other row stays `experimental`
# until its physics lands. Parameters live in
# data/thermo_params/saft/pure.yaml.
#
# The reference cases listed under `validation:` currently run against the pc_saft /
# cpa_srk packages (data/validation/saft/cases.yaml). gerg2008_teqp carries the
# c1n2-130.079K-0.614MPa cross-check bound in the T-07 follow-up (issue #164); the
# other four former pending:teqp-gerg2008 cases stay pending — measured this session,
# three have strictly monotone isotherms (no two-phase solution exists in the shipped
# parameters) and one has a sub-per-mille loop the density scan cannot resolve, so
# binding them would crash rather than miss, and crashes are not declarable.

- id: pc_saft
  name: PC-SAFT (teqp)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:PCSaftThermo
  params:
    source: teqp PC-SAFT, explicit coefficients (data/thermo_params/saft/pure.yaml)
    provenance: m, sigma, epsilon/k from Gross & Sadowski (2001) Ind. Eng. Chem. Res. 40,
      1244-1257 (methane, ethane, propane, n-butane, n-pentane, n-hexane) and Gross &
      Sadowski (2001) as reported in teqp's compiled library (CO2, cross-checked to
      teqp's compiled values to printed precision); k_ij = 0 — no verifiable open
      citation for the cited pairs' interaction parameters was found, and tuning k_ij
      against the validation points is forbidden
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - acid_gas
    polar: false
    electrolyte: false
    T_K: [95.0, 600.0]
    P_Pa: [1000.0, 1.0e+8]
    phases: [V, L]
  status: provisional
  validation: &pc_saft_cases
  - pure-C1-95.3K
  - pure-C1-125.0K
  - pure-C1-155.0K
  - pure-C1-172.0K
  - pure-C1-181.0K
  - pure-CO2-216.7K
  - pure-CO2-240.0K
  - pure-CO2-265.0K
  - pure-CO2-285.0K
  - pure-CO2-288.9K
  - c1co2-293.130K-6.135MPa
  - c1co2-293.130K-6.976MPa
  - c1co2-298.142K-6.976MPa
  - c1co2-298.142K-7.508MPa
  - c1co2-303.145K-7.306MPa
  - c1co2-303.144K-7.361MPa
  references:
  - >-
    Gross & Sadowski, "Perturbed-Chain SAFT: An Equation of State Based on a Perturbation
    Theory for Chain Molecules", Ind. Eng. Chem. Res. 40 (2001) 1244-1257
  - teqp 0.23 (Thol & Bell), https://teqp.readthedocs.io, MIT licence
  l0:
    pure_psat_limit:
      points:
      - - C1
        - 150.0
      - - C2
        - 200.0
      - - nC4
        - 250.0
      - - CO2
        - 240.0
    phase_identification:
      points:
      - - C1
        - 150.0
      - - nC4
        - 300.0
      - - CO2
        - 250.0
    round_trip:
      z:
        C1: 1.0
      states:
      - - 150.0
        - 4.0e+6
      - - 250.0
        - 2.0e+5
    dhdT_cp:
      state: [250.0, 2.0e+5]
      phase: vapor
      z:
        C1: 1.0
    gibbs_duhem:
      binaries:
      - z:
          C1: 0.5
          CO2: 0.5
        phase: vapor
        T: 250.0
        P: 5.0e+5
      - z:
          C1: 0.5
          C2: 0.5
        phase: hc_liquid
        T: 150.0
        P: 5.0e+6
    single_liquid_limit:
      state: [150.0, 5.0e+6]
      z:
        C1: 1.0
    determinism:
      state: [250.0, 5.0e+5]
      z:
        C1: 0.8
        CO2: 0.2
  l0_excluded: {}
  l0_note: >-
    T-15 disposition: teqp 0.23.2 ships cp312 wheels and CI runs Python 3.12, so the
    pending SAFT cases are runnable in CI (the local py3.13 gap is a sandbox fact, not a
    CI one). Promotion stays blocked on the measured misses: pure saturated-liquid Cp and
    CO2 saturation pressure outside tolerance (Gross & Sadowski 2001 parameters verified;
    T-07), and the MeOH/H2O crash. T-15c confirmed the CI-runnability on 2026-10-22 and
    promoted the row to provisional: all 16 bound cases measured, 44/62 comparisons
    pass, and every miss is declared per case in `assessed:` with the measured values —
    saturated-liquid Cp on all pure fluids (no explicit residual-Cp term in the chain
    EOS), CO2 saturation pressure 4.0-9.5 % high without a quadrupole term, and C1/CO2
    binary bubble_P 5.7-7.5 % low with k_ij = 0.

  assessed:
    pure-C1-95.3K: "Cp -6.0 % (54.315 vs 51.076) — PC-SAFT's derivative-based
      saturated-liquid Cp with Gross & Sadowski (2001) parameters carries no explicit
      residual-Cp fit and underpredicts at the triple-point end (CoolProp CH4 reference;
      parameters verified T-07) (measured 2026-10-22, PR table)"
    pure-C1-172.0K: "Cp +11.0 % (87.130 vs 96.690) — same no-residual-Cp limitation, now
      overpredicting on the warm approach to the critical point (measured 2026-10-22, PR table)"
    pure-C1-181.0K: "Cp +20.8 % (124.139 vs 149.979) — same no-residual-Cp limitation,
      diverging as T approaches Tc (190.6 K), where the chain EOS's derivative-based Cp
      is least reliable (measured 2026-10-22, PR table)"
    c1co2-293.130K-6.976MPa: "bubble_P -7.0 % (6975600 vs 6484482) — k_ij = 0 (no
      verifiable open citation for the C1-CO2 interaction parameter; tuning against the
      validation points is forbidden) underpredicts the cross-dispersion attraction —
      the opposite-sign twin of the k_ij = 0 limitation the NG-dew cubic cases carry
      (measured 2026-10-22, PR table)"
    c1co2-298.142K-7.508MPa: "bubble_P -7.5 % (7507900 vs 6946323) — same k_ij = 0
      limitation (measured 2026-10-22, PR table)"
    c1co2-303.144K-7.361MPa: "bubble_P -6.0 % (7361100 vs 6921345) — same k_ij = 0
      limitation (measured 2026-10-22, PR table)"
    c1co2-303.145K-7.306MPa: "bubble_P -5.7 % (7306400 vs 6889862) — same k_ij = 0
      limitation (measured 2026-10-22, PR table)"

- id: pc_saft_assoc
  name: PC-SAFT with association (hand-rolled kernel)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:PCSaftAssocThermo
  params:
    source: hand-rolled PC-SAFT + Wertheim association kernel, G&S 2002 parameters
      (data/thermo_params/saft/pure.yaml)
    provenance: physical term (hard chain + dispersion) reimplemented from Gross &
      Sadowski (2001) Ind. Eng. Chem. Res. 40, 1244-1257 with closed-form density
      and composition derivatives, pinned to teqp's PC-SAFT engine by a check-value
      test (alpha agreement 4.4e-15 relative over 300-500 K, 100-15000 mol/m3);
      association term (2B scheme for every fluid, G&S 2002 eqs. 2-3 combining
      rules) from Gross & Sadowski (2002) Ind. Eng. Chem. Res. 41, 5510-5515
      Table 1, retrieved and typed this session (2026-10-23); site fractions by
      the shared successive-substitution solver (Michelsen & Hendriks 2001);
      k_ij = 0 — the paper introduces no binary interaction parameter for
      associating-associating mixtures ("simple combining rules were used")
  applicability:
    component_classes:
    - water
    - alcohol
    polar: true
    electrolyte: false
    T_K: [250.0, 600.0]
    P_Pa: [1000.0, 1.0e+8]
    phases: [V, L]
  status: provisional
  validation:
  - pure-H2O-323.5K-ps
  - pure-H2O-420.0K-ps
  - pure-H2O-520.0K-ps
  - pure-H2O-600.0K-ps
  - pure-H2O-614.7K-ps
  - pure-MeOH-256.3K-ps
  - pure-MeOH-307.6K-ps
  - pure-MeOH-358.8K-ps
  - pure-MeOH-410.1K-ps
  - pure-MeOH-461.3K-ps
  - pure-EtOH-300.0K-ps
  - pure-EtOH-351.45K-ps
  - pure-EtOH-420.0K-ps
  - pure-EtOH-480.0K-ps
  - meohh2o-322.91K-15.932kPa-ps
  - meohh2o-322.91K-26.131kPa-ps
  - meohh2o-322.91K-31.544kPa-ps
  - meohh2o-322.91K-40.850kPa-ps
  - meohh2o-322.91K-46.450kPa-ps
  - meohh2o-322.91K-52.142kPa-ps
  references:
  - Gross & Sadowski, "Application of the Perturbed-Chain SAFT Equation of State
    to Associating Systems", Ind. Eng. Chem. Res. 41 (2002) 5510-5515
  - 'Gross & Sadowski, "Perturbed-Chain SAFT: An Equation of State Based on a
    Perturbation Theory for Chain Molecules", Ind. Eng. Chem. Res. 40 (2001)
    1244-1257'
  - Michelsen & Hendriks, "Physical properties from association models", Fluid
    Phase Equilib. 180 (2001) 165-174
  l0:
    pure_psat_limit:
      points:
      - - H2O
        - 373.15
      - - H2O
        - 423.15
      - - MeOH
        - 337.7
      - - EtOH
        - 351.45
    phase_identification:
      points:
      - - H2O
        - 373.15
      - - MeOH
        - 320.0
    round_trip:
      z:
        H2O: 1.0
      states:
      - - 350.0
        - 3.0e+5
    dhdT_cp:
      state: [400.0, 1.0e+5]
      phase: vapor
      z:
        H2O: 1.0
    gibbs_duhem:
      steps: 30
      binaries:
      - z:
          MeOH: 0.5
          H2O: 0.5
        phase: vapor
        T: 400.0
        P: 1.0e+5
      - z:
          MeOH: 0.5
          H2O: 0.5
        phase: aqueous
        T: 350.0
        P: 3.0e+5
    single_liquid_limit:
      state: [373.15, 3.0e+5]
      z:
        H2O: 1.0
    determinism:
      state: [400.0, 1.0e+5]
      z:
        MeOH: 0.4
        H2O: 0.6
  l0_excluded: {}
  l0_note: >-
    T-17 step B promoted the row from refusal to provisional on 2026-10-23: teqp's
    PC-SAFT factory carries no association-parameter fields, so the row runs the
    bridge's hand-rolled kernel — teqp-pinned PC-SAFT physical term plus the shared
    saft_assoc association solver with the G&S (2002) Table 1 two-site parameters
    and k_ij = 0 per the paper's own combining rule for associating-associating
    mixtures.

  assessed:
    pure-H2O-323.5K-ps: "rho_L -8.1 % (907.353 vs 987.838); Cp -22.8 % (58.134 vs
      75.334) — the G&S (2002) Table 1 water set underpredicts saturated-liquid
      density away from its fitting window and the derivative-based Cp carries no
      explicit residual-Cp fit, the same limitation the pc_saft row assessed
      (parameters verified T-17; CoolProp Water reference) (measured 2026-10-23,
      PR table)"
    pure-H2O-420.0K-ps: "Cp -12.3 % (67.883 vs 77.447) — same no-residual-Cp
      limitation (measured 2026-10-23, PR table)"
    pure-H2O-520.0K-ps: "rho_V -5.6 % (17.833 vs 18.900); Cp -7.8 % (80.383 vs
      87.149) — same no-residual-Cp limitation; vapour density starts to drift on
      the approach to the critical point (measured 2026-10-23, PR table)"
    pure-H2O-600.0K-ps: "rho_V -19.5 % (58.663 vs 72.842); Cp -16.6 % (104.520 vs
      125.264) — same limitations, diverging as T approaches Tc (647.1 K) where the
      chain EOS is least reliable (measured 2026-10-23, PR table)"
    pure-H2O-614.7K-ps: "rho_V -24.6 % (72.027 vs 95.588); rho_L +8.9 % (659.255 vs
      605.554); Cp -25.0 % (113.866 vs 151.747) — near-critical water is the worst
      window of the G&S (2002) parameter set (paper reports its largest AADs there);
      L0 checks (dH/dT vs Cp, Gibbs-Duhem, round trip) all pass, so the misses are
      parametric, not a kernel inconsistency (measured 2026-10-23, PR table)"
    pure-MeOH-256.3K-ps: "Cp -18.2 % (61.120 vs 74.762) — same no-residual-Cp
      limitation (measured 2026-10-23, PR table)"
    pure-MeOH-307.6K-ps: "bubble_P/dew_P -3.6 % (26292.6 vs 27285.7); rho_V +6.4 %
      (0.3748 vs 0.3523); Cp -15.7 % (70.111 vs 83.169) — Psat low at the cold end
      of the G&S (2002) 2B range plus the no-residual-Cp limitation (measured
      2026-10-23, PR table)"
    pure-MeOH-358.8K-ps: "rho_V +9.4 % (2.8066 vs 2.5650); Cp -13.7 % (83.564 vs
      96.783) — same limitations (measured 2026-10-23, PR table)"
    pure-MeOH-410.1K-ps: "rho_V +8.4 % (12.387 vs 11.431); Cp -11.7 % (102.747 vs
      116.399) — same limitations (measured 2026-10-23, PR table)"
    pure-MeOH-461.3K-ps: "Cp -9.9 % (137.195 vs 152.324) — same no-residual-Cp
      limitation (measured 2026-10-23, PR table)"
    pure-EtOH-420.0K-ps: "Cp -6.2 % (163.834 vs 174.588) — same no-residual-Cp
      limitation (measured 2026-10-23, PR table)"
    pure-EtOH-480.0K-ps: "rho_V -3.9 % (55.655 vs 57.899) — vapour density drift on
      the warm approach to the critical point (measured 2026-10-23, PR table)"
    meohh2o-322.91K-15.932kPa-ps: "bubble_P +54.5 % (24612.8 vs 15932); vapor_comp
      +0.242 abs (0.5165 vs 0.2741) — k_ij = 0 (the G&S 2002 paper introduces no
      binary interaction parameter for associating-associating mixtures and its own
      MeOH/H2O figures show the combining rules miss this isotherm badly; tuning
      against the validation points is forbidden) overstrengthens cross-association
      at the methanol-lean end (Bayer 1927 isotherm; measured 2026-10-23, PR table)"
    meohh2o-322.91K-26.131kPa-ps: "bubble_P +45.8 % (38106.9 vs 26131); vapor_comp
      +0.083 abs (0.7120 vs 0.6294) — same k_ij = 0 limitation (measured
      2026-10-23, PR table)"
    meohh2o-322.91K-31.544kPa-ps: "bubble_P +28.9 % (40652.8 vs 31544) — same
      k_ij = 0 limitation (measured 2026-10-23, PR table)"
    meohh2o-322.91K-40.850kPa-ps: "bubble_P +12.4 % (45931.2 vs 40850); vapor_comp
      -0.054 abs (0.8118 vs 0.8654) — same k_ij = 0 limitation (measured
      2026-10-23, PR table)"
    meohh2o-322.91K-46.450kPa-ps: "bubble_P +6.4 % (49414.6 vs 46450); vapor_comp
      -0.058 abs (0.8829 vs 0.9406) — same k_ij = 0 limitation (measured
      2026-10-23, PR table)"

- id: pc_saft_polar
  name: Polar PC-SAFT (hand-rolled kernel)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:PCSaftPolarThermo
  params:
    source: hand-rolled PC-SAFT + Gross & Vrabec dipolar kernel, feos-curated G&V
      2006 parameters (data/thermo_params/saft/pure.yaml)
    provenance: physical term (hard chain + dispersion) is the teqp-pinned reimplementation
      shared with pc_saft_assoc; dipolar term from Gross & Vrabec (2006) AIChE J. 52,
      1194-1204 eqs. 8-14 (Padé [2/3]) with closed-form density and composition
      derivatives; the a/b/c universal coefficients typed from the feos source
      (feos-org/feos, BSD-3, 11 printed digits, retrieved 2026-10-23) and cross-checked
      digit by digit against teqp's and CoolProp's 7-digit constants (all 45 agree);
      the Debye-to-reduced-unit conversion is computed from exact SI constants
      (1e-19/kB = 7242.9705...) matching teqp/feos, not CoolProp's hardcoded
      7242.7029... (37 ppm lower, inside the case bands); fluid parameters from
      feos's curated copy of the paper's Table 2 (gross2006.json — acetone and DME,
      both non-associating, one dipolar segment each); quadrupolar fluids (CO2, Gross
      2005) stay unbound pending resolution of an open-source sign discrepancy in the
      J_QQQ,3ijk c0[0] constant; k_ij = 0 (the paper introduces no binary interaction
      parameter for the bound slate)
  applicability:
    component_classes:
    - polar_organic
    polar: true
    electrolyte: false
    T_K: [230.0, 520.0]
    P_Pa: [1000.0, 1.0e+8]
    phases: [V, L]
  status: provisional
  validation:
  - pure-ACETONE-296.0K-ps
  - pure-ACETONE-350.0K-ps
  - pure-ACETONE-400.0K-ps
  - pure-ACETONE-450.0K-ps
  - pure-DME-248.0K-ps
  - pure-DME-280.0K-ps
  - pure-DME-320.0K-ps
  - pure-DME-360.0K-ps
  assessed:
    pure-ACETONE-350.0K-ps: "rho_V -3.3% (4.109 vs 4.249 kg/m3) — the published G&V 2006
      parameterization under-predicts saturated vapour density as T rises toward Tc"
    pure-ACETONE-400.0K-ps: "rho_V -5.8% (13.975 vs 14.830 kg/m3) — same trend"
    pure-ACETONE-450.0K-ps: "rho_V -9.9% (38.458 vs 42.672 kg/m3), the worst point — assessed
      as a parameterization limitation, not a transcription defect: teqp 0.23.2's own
      GrossVrabec model (PSAFTEOS + '(mu^*)^2': 2.6764, nmu 1) returns -3.31/-5.76/-9.87%
      at these exact states, and a dipole-strength sweep cannot close the gap (mu*^2 x1.5
      moves rho_V to about -2/+3% only at the cost of Psat -40 to -51%); the G&V 2006 fit
      targets Psat and saturated liquid density"
    pure-DME-360.0K-ps: "rho_V -5.1% (55.286 vs 58.253 kg/m3) — same acetone trend"
  references:
  - >-
    Gross & Vrabec, "An equation of state contribution for polar components: Dipolar
    molecules", AIChE J. 52 (2006) 1194-1204 (term background)
  l0:
    pure_psat_limit:
      points:
      - - ACETONE
        - 329.44
      - - ACETONE
        - 400.0
      - - DME
        - 248.0
      - - DME
        - 320.0
    phase_identification:
      points:
      - - ACETONE
        - 350.0
      - - DME
        - 280.0
    round_trip:
      z:
        ACETONE: 1.0
      states:
      - - 300.0
        - 3.0e+5
      - - 450.0
        - 1.0e+5
    dhdT_cp:
      state: [400.0, 1.0e+5]
      phase: vapor
      z:
        ACETONE: 1.0
    gibbs_duhem:
      steps: 30
      binaries:
      - z:
          ACETONE: 0.5
          DME: 0.5
        phase: vapor
        T: 350.0
        P: 3.0e+5
    single_liquid_limit:
      state: [300.0, 3.0e+5]
      z:
        ACETONE: 1.0
    determinism:
      state: [400.0, 1.0e+5]
      z:
        ACETONE: 0.4
        DME: 0.6
  l0_excluded: {}
  l0_note: ''

