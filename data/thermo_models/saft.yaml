- id: soft_saft
  name: soft-SAFT (registered refusal)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:SoftSaftThermo
  params:
    source: none — the row is not implemented
    provenance: >-
      Blas & Vega's (1997) soft-SAFT has no engine to run on. Checked:
      teqp 0.23.2, the family's only optional backend, ships no soft-SAFT
      kernel (its SAFT factories are the explicit-coefficient PC-SAFT and
      SAFT-VR-Mie engines). Unlike the three T-17 kernels, which extend the
      PC-SAFT hard-chain and dispersion terms already in the repo, soft-SAFT
      needs a different reference fluid: the Johnson, Zollweg & Gubbins (1993)
      33-constant MBWR Lennard-Jones EOS, plus the soft-SAFT chain and
      association terms and a curated, citable parameter set. No open,
      consolidated soft-SAFT parameter table was identified within T-17 (only
      the teqp factories above were checked). The row stays a registered
      refusal; implementing it needs a dedicated spec.
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    polar: false
    electrolyte: false
    T_K: [95.0, 600.0]
    P_Pa: [1000.0, 1.0e+8]
    phases: [V, L]
  status: experimental
  validation: []
  references:
  - >-
    Blas & Vega, "Prediction of binary and multicomponent vapor-liquid equilibria with
    the soft-SAFT equation of state" (association-free soft-SAFT formulation),
    Ind. Eng. Chem. Res. 37 (1998) 660-674; vega group soft-SAFT lineage
  l0: {}
  l0_excluded:
    pure_psat_limit: row is not implemented — no soft-SAFT engine exists (measured —
      teqp 0.23.2 has no soft-SAFT factory or teqp.saft module)
    phase_identification: row is not implemented — no soft-SAFT engine exists (measured —
      teqp 0.23.2 has no soft-SAFT factory or teqp.saft module)
