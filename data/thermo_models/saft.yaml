- id: gerg2008_teqp
  name: GERG-2008 (teqp multi-fluid, exact parameters)
  # T-18 promotion (2026-10-23): teqp wheel is CI-runnable (cp312), L0 sweep green on
  # all seven checks, bound cases measured and every miss assessed; the four former
  # pending:teqp-gerg2008 points stay pending (measured: three have strictly monotone
  # isotherms — no two-phase solution exists in the shipped parameters — and one has a
  # sub-per-mille loop the density scan cannot resolve, so binding them would crash
  # rather than miss, and crashes are not declarable).
