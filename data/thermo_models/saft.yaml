- id: cpa_srk
  name: CPA-SRK (hand-rolled association kernel)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:CpaSrkThermo
  params:
    source: CPA-SRK, Kontogeorgis parameters (data/thermo_params/saft/pure.yaml)
    provenance: water 4C and methanol 2B CPA parameters from Kontogeorgis, Voutsas,
      Yakoumis & Tassios (1996) Ind. Eng. Chem. Res. 35, 4631-4642, retrieved and
      verified this session against Table 1 of Kontogeorgis et al. (1999) Fluid Phase
      Equilib. 158-160, 21-29; SRK cubic term closed-form, association term by
      successive substitution (Michelsen-Hendriks); k_ij = 0 — no verifiable open
      citation for the water-methanol CPA k_ij was found
  applicability:
    component_classes:
    - water
    - alcohol
    polar: true
    electrolyte: false
    T_K: [250.0, 620.0]
    P_Pa: [100.0, 1.0e+8]
    phases: [V, L]
  # Promotion evidence:
  #   Promoted 2026-11-04 (val-saft). L1: pure-H2O-420.0K and pure-H2O-520.0K pass all
  #   five comparisons (CoolProp water); Kontogeorgis (1996) fitted Psat and rho_L, so
  #   rho_V and Cp are the independent part. L2: meohh2o-101.325kPa-346.20K (Gao 2012,
  #   bubble_T and y) and meohh2o-322.91K-52.142kPa (Bayer 1927) pass with k_ij = 0 (no
  #   binary parameter fitted).
  # Validation run 2026-11-04 (orchestrator): held provisional — bound L2 comparisons 6 pass / 12 miss;
  # validated needs a majority of bound L2 comparisons passing, not one passing point.
  # val-saft2 2026-11-09: no kernel bug. alpha_r matches teqp 0.23.2's independent CPA
  # (SRK, KG RDF, CR-1) to <= 7e-11 abs (tests/thermo/test_saft.py::TestCpaKernelsMatchTeqpCpa).
  # The 1927 Bayer pressures agree with the modern Bernatova, Aim & Wichterle (2006) 323.15 K
  # isotherm (12 points bound, *-bern); the misses repeat there (9 pass / 15 miss), so the
  # cause is k_ij = 0, not the old data. No published CPA-SRK water-methanol k_ij could be
  # retrieved (Kontogeorgis 1999 FPE closed; Folas 2005 IECR / 2006 thesis on DTU Orbit
  # behind a bot wall). Bound L2 now 15 pass / 27 miss: stays provisional.
  status: provisional
  validation: &cpa_srk_cases
  - pure-H2O-323.5K
  - pure-H2O-420.0K
  - pure-H2O-520.0K
  - pure-H2O-600.0K
