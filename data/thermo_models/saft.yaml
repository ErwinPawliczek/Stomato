        - 373.15
      - - MeOH
        - 320.0
    round_trip:
      z:
        H2O: 1.0
      states:
      # 350 K / 3e5 Pa: a compressed-liquid state well below the 3e5 Pa saturation
      # temperature (~407 K) so the PH inversion classifies trial temperatures via
      # the cheap Wilson band instead of an exact psat solve per trial; at 373.15 K
      # the trials clustered inside the near-saturation band and the check cost
      # ~200 s of exact saturation solves.
      - - 350.0
        - 3.0e+5
    dhdT_cp:
      state: [400.0, 1.0e+5]
      phase: vapor
      z:
        H2O: 1.0
    gibbs_duhem:
      # 30 midpoint steps: the association kernel evaluates ~100x slower than a
      # closed-form EOS and the integral is smooth; the 1e-6 bar is unchanged.
      steps: 30
      binaries:
      - z:
          MeOH: 0.5
          H2O: 0.5
        phase: vapor
        T: 400.0
        P: 1.0e+5
      - z:
          MeOH: 0.5
          H2O: 0.5
        phase: aqueous
        T: 350.0
        P: 3.0e+5
    single_liquid_limit:
      state: [373.15, 3.0e+5]
      z:
        H2O: 1.0
    determinism:
      state: [400.0, 1.0e+5]
      z:
        MeOH: 0.4
        H2O: 0.6
  l0_excluded: {}
  l0_note: >-
    T-17 promoted the row from refusal to provisional on 2026-10-23: teqp 0.23.2's
    own CPA engine stays unusable (fugacity NaNs at liquid-like densities, measured
    in the T-07 exploration), so the row runs the bridge's hand-rolled CPA-PR kernel
    (PR physical term + the shared saft_assoc association solver) with the Sorensen
    et al. (2018) Table 6 parameters and the paper's Table 7 temperature-dependent
    water-methanol k_ij — the k_ij cpa_srk could not carry.

