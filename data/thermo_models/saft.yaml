# SAFT / CPA / multi-fluid Helmholtz family (spec T-07). Every row loads without teqp
# (lazy import); the teqp-backed builds require `uv sync --extra saft` (teqp>=0.22).
# Registered but non-building rows (pc_saft_assoc, pc_saft_polar, cpa_pr) refuse in
# _build_kernel with the named reason, so a feed selecting them fails loudly instead of
# silently dropping the physics they stand for. All rows are `experimental` until CI runs
# the optional extra; parameters live in data/thermo_params/saft/pure.yaml.
#
# The reference cases listed under `validation:` currently run against the pc_saft /
# cpa_srk packages (data/validation/saft/cases.yaml). The other rows carry no case ids
# yet: no case names their package, and a validation id that does not run against the
# row would be claimed, not measured, evidence.

- id: pc_saft
  name: PC-SAFT (teqp)
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:PCSaftThermo
  params:
    source: teqp PC-SAFT, explicit coefficients (data/thermo_params/saft/pure.yaml)
    provenance: m, sigma, epsilon/k from Gross & Sadowski (2001) Ind. Eng. Chem. Res. 40,
      1244-1257 (methane, ethane, propane, n-butane, n-pentane, n-hexane) and Gross &
      Sadowski (2001) as reported in teqp's compiled library (CO2, cross-checked to
      teqp's compiled values to printed precision); k_ij = 0 — no verifiable open
      citation for the cited pairs' interaction parameters was found, and tuning k_ij
      against the validation points is forbidden
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - acid_gas
    polar: false
    electrolyte: false
    T_K: [95.0, 600.0]
    P_Pa: [1000.0, 1.0e+8]
    phases: [V, L]
  status: experimental
  validation: &pc_saft_cases
  - pure-C1-95.3K
  - pure-C1-125.0K
  - pure-C1-155.0K
  - pure-C1-172.0K
  - pure-C1-181.0K
  - pure-CO2-216.7K
  - pure-CO2-240.0K
  - pure-CO2-265.0K
  - pure-CO2-285.0K
  - pure-CO2-288.9K
  - c1co2-293.130K-6.135MPa
  - c1co2-293.130K-6.976MPa
  - c1co2-298.142K-6.976MPa
  - c1co2-298.142K-7.508MPa
  - c1co2-303.145K-7.306MPa
  - c1co2-303.144K-7.361MPa
  references:
  - >-
    Gross & Sadowski, "Perturbed-Chain SAFT: An Equation of State Based on a Perturbation
    Theory for Chain Molecules", Ind. Eng. Chem. Res. 40 (2001) 1244-1257
  - teqp 0.23 (Thol & Bell), https://teqp.readthedocs.io, MIT licence
  l0:
    pure_psat_limit:
      points:
      - - C1
        - 150.0
      - - C2
        - 200.0
      - - nC4
        - 250.0
      - - CO2
        - 240.0
    phase_identification:
      points:
      - - C1
        - 150.0
      - - nC4
        - 300.0
      - - CO2
        - 250.0
    round_trip:
      z:
        C1: 1.0
      states:
      - - 150.0
        - 4.0e+6
      - - 250.0
        - 2.0e+5
    dhdT_cp:
      state: [250.0, 2.0e+5]
      phase: vapor
      z:
        C1: 1.0
    gibbs_duhem:
      binaries:
      - z:
          C1: 0.5
          CO2: 0.5
        phase: vapor
        T: 250.0
        P: 5.0e+5
      - z:
          C1: 0.5
          C2: 0.5
        phase: hc_liquid
        T: 150.0
        P: 5.0e+6
    single_liquid_limit:
      state: [150.0, 5.0e+6]
      z:
        C1: 1.0
    determinism:
      state: [250.0, 5.0e+5]
      z:
        C1: 0.8
        CO2: 0.2
  l0_excluded: {}
  l0_note: ''

