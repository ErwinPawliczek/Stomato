  # Validation run 2026-11-04 (orchestrator): held provisional — bound L2 comparisons 5 pass / 13 miss;
  # validated needs a majority of bound L2 comparisons passing, not one passing point.
  # val-saft2 2026-11-09: no kernel bug. alpha_r at k_ij = 0 matches teqp 0.23.2's
