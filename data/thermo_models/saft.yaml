      formulation (data/thermo_params/saft/pure.yaml gerg2008_teqp alias table)
    provenance: GERG-2008's own pure-fluid residual equations plus its binary reducing
      and departure parameters, as implemented in teqp (verified 2026-11-04 to
      reproduce the NIST AGA8 GERG-2008 check value p(134.02 K, 1 mol/l, 50/50
      C1/N2) = 953319.19 Pa to 1e-6). Until 2026-11-04 the row ran teqp's multi-fluid
      builder over the CoolProp fluid library (reference-EOS pure fluids), i.e. not
      GERG-2008. This row is the exact-backend cross-check the T-04 `gerg2008` row
      (CoolProp's fitted pure-fluid tables) defers to (issue #164)
