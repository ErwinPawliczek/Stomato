- id: multifluid
  name: Multi-fluid Helmholtz (teqp CoolProp library)
  # Licensing ruling (orchestrator, 2026-10-23): the multi-fluid rows use the fluid
  # library shipped inside the installed teqp wheel at runtime; the repository never
  # copies, vendors or regenerates those fluid files. That is allowed; it replaces the
  # T-15c "not redistributable" note (issue #167).
  family: saft
  adapter: ngdesign.thermo.teqp_bridge:MultifluidThermo
  params:
    source: teqp multifluid over the CoolProp fluid library (data/thermo_params/saft/pure.yaml
      alias table)
    provenance: fluid names resolve to teqp's bundled CoolProp-32 fluid library (IAPWS,
      NIST REFPROP-derived and GERG Helmholtz formulations as shipped by teqp 0.23.2);
      binary pairs and departure functions from teqp's bundled mixture files. Water-bearing
      feeds are refused — teqp's bundled pair file has no water interaction data (bare
      Lorentz-Berthelot), which puts the slice dew 2x above the CoolProp with-water value
  applicability:
    component_classes:
    - hydrocarbon
    - light_gas
    - inert
    - acid_gas
    polar: false
    electrolyte: false
    T_K: [60.0, 800.0]
    P_Pa: [100.0, 1.0e+8]
    phases: [V, L]
  # Promotion evidence:
  #   Promoted 2026-11-04 (val-saft). L1: cpv-C1-125/155 K, cpv-CO2-240/265 K,
  #   cpv-nC4-300 K, cpv-nC6-350 K pass (CoolProp reference values of the same fluid
  #   library: an implementation check of the bridge's saturation solver, the accepted
  #   L1 class for reference-EOS rows). L2: Petropoulou (2018) C1/CO2 and Janisch (2007)
  #   C1/N2 measured bubble points pass, and the three AGA8 GERG-2008 C1/N2 dew points
  #   pass since the bridge's dew K-sum fix (the earlier +5.3 % at 153.41 K was the
  #   solver, not the parameters: 2658640 vs 2658444 Pa now).
  status: validated
  validation:
  - cpv-C1-125.0K
  - cpv-C1-155.0K
  - cpv-CO2-240.0K
  - cpv-CO2-265.0K
  - cpv-nC4-300.0K
  - cpv-nC6-350.0K
  - c1co2-293.130K-6.135MPa
  - c1n2-149.989K-2.908MPa
  - aga8-c1n2-134.02K-dew
  - aga8-c1n2-146.37K-dew
  - aga8-c1n2-153.41K-dew
  references:
  - teqp 0.23 (Thol & Bell), https://teqp.readthedocs.io, MIT licence
  - Huber, Lemmon, Diky, Smith & Brunner, "ThermoData Engine (TDE103b)", J. Chem. Eng.
    Data 61 (2016) 3382-3395 (CoolProp fluid data lineage)
  l0:
    pure_psat_limit:
      points:
      - - C1
        - 150.0
      - - C2
        - 200.0
      - - N2
        - 90.0
      - - CO2
        - 240.0
    phase_identification:
      points:
      - - C1
        - 150.0
      - - C3
        - 250.0
    round_trip:
      z:
        C1: 0.9
        N2: 0.1
      states:
      - - 150.0
        - 3.0e+6
      - - 200.0
        - 3.0e+5
    dhdT_cp:
      state: [200.0, 3.0e+5]
      phase: vapor
      z:
        C1: 0.9
        N2: 0.1
    gibbs_duhem:
      binaries:
      - z:
          C1: 0.5
          N2: 0.5
        phase: vapor
        T: 200.0
        P: 5.0e+5
      - z:
          C1: 0.9
          N2: 0.1
        phase: hc_liquid
        T: 150.0
        P: 3.0e+6
    single_liquid_limit:
      state: [150.0, 3.0e+6]
      z:
        C1: 0.9
        N2: 0.1
    determinism:
      state: [200.0, 5.0e+5]
      z:
        C1: 0.5
        N2: 0.5
  l0_excluded: {}
  l0_note: ''

