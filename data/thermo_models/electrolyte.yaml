- id: amine_ke
  name: MDEA Kent-Eisenberg (fixed loading)
  family: electrolyte
  adapter: ngdesign.amine.package:AmineKEPackage
  options: {}
  params:
    source: Kent-Eisenberg model, fixed CO2 loading (0.2 mol/mol MDEA)
    provenance: Kent, R. L. & Eisenberg, B., 'Better Data for Amine Treating', Hydrocarbon Process. 55(2),
      87-90, 1976; equilibrium constants and MDEA protonation data as fitted in the ngdesign amine databank;
      48.7 wt% MDEA aqueous solvent
  applicability:
    component_classes:
    - water
    - amine
    - acid_gas
    polar: true
    electrolyte: true
    T_K:
    - 273.15
    - 423.15
    P_Pa:
    - 100000.0
    - 8000000.0
    phases:
    - V
    - L
  status: validated
  validation: [pure-H2O-323.5K-amine-ke, pure-H2O-420K-amine-ke, pure-H2O-520K-amine-ke,
    pure-H2O-600K-amine-ke, amine-ke-co2-loading-0.10-313K, amine-ke-co2-loading-0.40-313K,
    amine-ke-h2s-loading-0.01-313K, amine-ke-h2s-loading-0.165-313K, amine-ke-h2s-loading-0.453-313K]
  references:
  - Kent, R. L. & Eisenberg, B., Hydrocarbon Process. 55(2), 87-90, 1976
  - Jou, F.-Y. et al., 'Equilibrium Partial Pressures of CO2 and H2S in Aqueous MDEA Solutions', Can.
    J. Chem. Eng. 71, 264-268, 1993
  l0: {}
  l0_excluded: &id001
    pure_psat_limit: applicability is the aqueous amine liquid; the pure-component saturation limits of
      the molecular databank components are not this package's claimed surface (the amine feed carries
      reactive acid-gas chemistry)
    phase_identification: 'same basis: the single-liquid limit replaces the vapour-pressure bracket for
      the reactive liquid (flash consistency y_i P == p_eq_i is pinned by the P1-04 amine tests)'
    dhdT_cp: the reactive-liquid cp is the carrier's databank cp plus the fixed-loading heat of absorption;
      its T-derivative is not part of the reported cp, so the dH/dT == Cp identity does not apply to this
      phase
    gibbs_duhem: the reactive liquid's ln_phi carries the speciation equilibrium (f_i == p_eq_i phi_i^V),
      not a Gibbs-excess composition derivative; the Gibbs-Duhem identity at fixed T, P is not the composition-consistency
      surface here — flash consistency is pinned by the P1-04 tests instead
  l0_note: validation case ids arrive with T-11..T-13 (loading-isotherm data); L0 round trips and the
    single-liquid limit run today
