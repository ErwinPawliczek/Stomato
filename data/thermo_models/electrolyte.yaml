      48.7 wt% MDEA aqueous solvent
  applicability:
    component_classes:
    - water
    - amine
    - acid_gas
    polar: true
    electrolyte: true
    T_K:
    - 273.15
    - 423.15
    P_Pa:
    - 100000.0
    - 8000000.0
    phases:
    - V
    - L
  status: provisional
  validation: [pure-H2O-323.5K-amine-enrtl, pure-H2O-420K-amine-enrtl, pure-H2O-520K-amine-enrtl,
    pure-H2O-600K-amine-enrtl]
  references:
  - Kent, R. L. & Eisenberg, B., Hydrocarbon Process. 55(2), 87-90, 1976
  - Jou, F.-Y. et al., 'Equilibrium Partial Pressures of CO2 and H2S in Aqueous MDEA Solutions', Can.
    J. Chem. Eng. 71, 264-268, 1993
