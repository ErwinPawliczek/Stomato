- id: pitzer_nacl_water
  name: Pitzer NaCl(aq) brine (25 C parameter set)
  family: electrolyte
  adapter: ngdesign.amine.electrolyte:ElectrolytePitzerNaCl
  options: {}
  params:
    source: data/thermo_params/electrolyte/pitzer.yaml
    provenance: >-
      Classic 25 C Pitzer NaCl parameter set (PHRQPITZ convention; beta0 0.0765, beta1 0.2664,
      Cphi 0.00127, Aphi 0.392) validated against Pitzer, Peiper & Busey (1984), J. Phys. Chem.
      Ref. Data 13(1): mean activity coefficients (Table A-8, 0.1-6 molal within 0.36 %), osmotic
      coefficients (Table A-9), and the 298.15 K saturation anchor (6.146 mol/kg at gamma 1.0065;
      the SLE solve lands 6.155, +0.14 %). Water activity a_w = exp(-2 m phi / 55.5084).
  applicability:
    component_classes:
    - water
    polar: true
    electrolyte: true
    T_K:
    - 293.15
    - 303.15
    P_Pa:
    - 2000.0
    - 10000000.0
    phases:
    - V
    - L
    notes: >-
      NaCl-H2O brines at 20-30 C; the parameter set is the 25 C one and temperature dependence
      enters only through Psat.  Molality clamped to the verified domain (6.15 mol/kg, the
      saturation anchor).  Na2SO4 is out of scope: no component record resolves in the open
      registry (documented, T-09).
  status: provisional
  validation: []
  references:
  - Pitzer, K. S., Peiper, J. C. & Busey, R. H., J. Phys. Chem. Ref. Data 13(1), 1-102, 1984
  - Plummer, L. N., Parkhurst, D. L. et al., PHRQPITZ, USGS Water-Resources Investigations Report 88-4153
  l0:
    single_liquid_limit:
      z:
        H2O: 0.95
        NaCl: 0.05
      state:
      - 298.15
      - 5000000.0
    round_trip:
      z:
        H2O: 0.95
        NaCl: 0.05
      states:
      - - 298.15
        - 5000000.0
    determinism:
      z:
        H2O: 0.95
        NaCl: 0.05
      state:
      - 298.15
      - 5000000.0
  l0_excluded: &id002
    pure_psat_limit: applicability is the aqueous electrolyte liquid; the pure-component saturation
      limits of the molecular databank components are not this package's claimed surface (the
      involatile salt has no vapour pressure)
    phase_identification: 'same basis: the single-liquid limit replaces the vapour-pressure bracket
      for the electrolyte liquid (flash consistency y_i P == p_eq_i is pinned by the T-09 tests)'
    dhdT_cp: the aqueous cp is the carrier's (no reaction-enthalpy correction is implemented; the
      spec's acceptance criteria carry no reactive cp), so the dH/dT == Cp identity rides the
      carrier surface unchanged
    gibbs_duhem: the aqueous ln_phi carries the electrolyte chemistry (f_w == a_w Psat, f_i ==
      p_eq_i phi_i^V), not a Gibbs-excess composition derivative; the Gibbs-Duhem identity at
      fixed T, P is not the composition-consistency surface here -- flash consistency is pinned
      by the T-09 tests instead
  l0_note: >-
    literature anchors run in tests/thermo/test_electrolyte.py — mean activity
    coefficients from Pitzer, Peiper & Busey 1984 Table A-8 reproduce 0.1-6 molal within
    0.36 % (spec points 0.1/1/3 m, tolerance 2 %); osmotic coefficient phi(1 m) = 0.9356
    and water activity a_w(3 m) = 0.8932 match the same tables; the solid-liquid
    saturation solve gives 6.1548 vs 6.146 mol/kg at 298.15 K (+0.14 %, tolerance 3 %).
    L0 round trips and the single-liquid limit run today
- id: sour_water
  name: Sour water (EPA-600/2-80-067 SWEQ, NH3-H2S-H2O)
  family: electrolyte
  adapter: ngdesign.amine.electrolyte:ElectrolyteSourWater
  options: {}
  params:
    source: data/thermo_params/electrolyte/reactions.yaml
    provenance: >-
      Wilson, G. M., 'Sour Water Equilibria', EPA-600/2-80-067 (1980): NH3-H2S-H2O speciation
      with the report's reaction polynomials (k3 association, k5/k6/k7 dissociation;
      ln k = A + B/T + C/T^2 + D/T^3 + E/T^4, T in degR, concentrations gmol/kg solution) and
      Henry correlations (psia per gmol/kg solution).  Constants character-verified against the
      report's printed worked examples (printed pp. 52-53) and cross-checked against DWSIM's
      transcription; the k5 D-coefficient keeps the report's 2.5551e11 (DWSIM carries 2.555e11,
      a dropped digit, -3.4 % on k5 at 100 C -- see docs/validation.md).
  applicability:
    component_classes:
    - water
    - acid_gas
    polar: true
    electrolyte: true
    T_K:
    - 293.15
    - 373.15
    P_Pa:
    - 2000.0
    - 10000000.0
    phases:
    - V
    - L
    notes: >-
      Aqueous NH3-H2S-H2O sour water, 20-100 C (the report's validated range).  The CO2/
      carbonate path of the model is data-side only this cycle: CO2 in a feed refuses at first
      use (no verified carbonate anchor; documented, T-09).  The report's own Table 19
      reproduction scatters on dilute/high-strength rows -- a known applicability limit
      (docs/validation.md).
  status: provisional
  validation: []
  references:
  - Wilson, G. M., 'Sour Water Equilibria', EPA-600/2-80-067, 1980
  - Shih, T. S. et al., H2S solubility in buffered aqueous solutions (as tabulated in
    EPA-600/2-80-067, Table 21)
  - Edwards, T. J. et al. 1978 (the report's API comparison column)
  l0:
    single_liquid_limit:
      z:
        H2O: 0.95
        NH3: 0.03
        H2S: 0.02
      state:
      - 311.15
      - 5000000.0
    round_trip:
      z:
        H2O: 0.95
        NH3: 0.03
        H2S: 0.02
      states:
      - - 311.15
        - 5000000.0
    determinism:
      z:
        H2O: 0.95
        NH3: 0.03
        H2S: 0.02
      state:
      - 311.15
      - 5000000.0
  l0_excluded: *id002
  l0_note: >-
    literature anchors run in tests/thermo/test_electrolyte.py — the six printed
    constants and both Henry correlations match the report's worked examples; H2S partial
    pressures over the pH-7.00 buffered 0.010-m solution vs Table 21 (API column):
    59.33/60.14/61.83/68.80 mmHg at 80/100/120/140 C vs 59.3/60.1/61.8/68.0 (+0.1 %,
    +0.1 %, +0.1 %, +1.2 %; tolerance 10 %); the spec's 90 C point uses the linearly
    interpolated API anchor 59.70 mmHg (the table has no 90 C row) against the model's
    59.89 mmHg, +0.32 %. Known applicability limit — EPA Table 19 (Terres) 28 C rows
    deviate up to +230 % on H2S while the 40 C rows reproduce within +15.7 % NH3 /
    +8.1 % H2S; the report's own VK and API calculated columns disagree by up to 65 % on
    the same rows and applying the report's ionic-strength correction to k5 over-corrects
    (-90 %), so the scatter is a declared limit of this implementation — rely on 40-100 C
    (the anchors below 40 C are the weak ones). L0 round trips and the single-liquid
    limit run today
- id: enrtl_nacl_water
  name: eNRTL NaCl(aq) brine (25 C parameter set)
  family: electrolyte
  adapter: ngdesign.amine.electrolyte:ElectrolyteENRTLNaCl
  options: {}
  params:
    source: data/thermo_params/electrolyte/enrtl.yaml
    provenance: >-
      eNRTL NaCl-H2O binary per Chen & Evans (1986), AIChE J. 32(3), 444-454 (tau_CA,w -4.5916,
      tau_w,CA 9.0234, alpha 0.2; transcribed from the open-access Kwaterski & Herri copy) with the
      Pitzer-Debye-Hueckel mole-fraction long-range term per Chen, Britt, Boston & Evans (1982),
      AIChE J. 28(4), 588-596 (A_phi 0.392, rho 14.9).  Salt-side composition derivatives are
      numeric central differences of n*G^E/RT; the unsymmetric molality-scale conversion
      (ln gamma+-(m) = ln gamma+-(x) - ln(1 + nu m M_w)) and a_w = gamma_w x_w follow Chen (1982).
  applicability:
    component_classes:
    - water
    polar: true
    electrolyte: true
    T_K:
    - 293.15
    - 303.15
    P_Pa:
    - 2000.0
    - 10000000.0
    phases:
    - V
    - L
    notes: >-
      NaCl-H2O brines at 20-30 C; the tau pair is the 25 C one and temperature dependence enters
      only through Psat.  Molality clamped to the verified domain (6.15 mol/kg, the saturation
      anchor).  Literature-faithful accuracy ~1-5 % vs experimental gamma+/phi (the source model's
      own fit quality); Pitzer NaCl is the high-accuracy row (0.36 %).  Na2SO4 out of scope
      (documented, T-09).
  status: provisional
  validation: []
  references:
  - Chen, C.-C. & Evans, L. B., AIChE J. 32(3), 444-454, 1986
  - Chen, C.-C., Britt, H. I., Boston, J. F. & Evans, L. B., AIChE J. 28(4), 588-596, 1982
  - Kwaterski, M. & Herri, J.-M. (open-access copy carrying the printed Chen & Evans NaCl tau table)
  l0:
    single_liquid_limit:
      z:
        H2O: 0.95
        NaCl: 0.05
      state:
      - 298.15
      - 5000000.0
    round_trip:
      z:
        H2O: 0.95
        NaCl: 0.05
      states:
      - - 298.15
        - 5000000.0
    determinism:
      z:
        H2O: 0.95
        NaCl: 0.05
      state:
      - 298.15
      - 5000000.0
  l0_excluded: *id002
  l0_note: >-
    literature anchors run in tests/thermo/test_electrolyte.py — mean activity coefficients vs
    Pitzer, Peiper & Busey 1984 Table A-8 (0.1-6 molal) miss the default 2 % band on four points,
    worst 4.99 % (6 m; the model's own published fit quality is ~1-5 %, sigma_phi 1.18 % per
    Kwaterski & Herri); osmotic coefficients vs Table A-9 miss the band once (6 m, -2.84 %); the
    SLE solve gives 6.8905 vs 6.146 mol/kg (+12.2 %, the flat gamma curve past the minimum).
    L0 round trips and the single-liquid limit run today
  assessed:
    ppb84-gamma-0.25m: "gamma+ -2.00 % (0.7056 vs 0.720) - model-inherent fit quality (Chen & Evans 1986 binary), measured 2026-10-22"
    ppb84-gamma-0.5m: "gamma+ -2.90 % (0.6612 vs 0.681) - model-inherent fit quality, measured 2026-10-22"
    ppb84-gamma-1.0m: "gamma+ -3.29 % (0.6354 vs 0.657) - model-inherent fit quality, measured 2026-10-22"
    ppb84-gamma-6.0m: "gamma+ -4.99 % (0.9377 vs 0.987) - model-inherent fit quality, worst point, measured 2026-10-22"
    ppb84-phi-6.0m: "phi -2.84 % (1.2359 vs 1.272) - model-inherent fit quality, measured 2026-10-22"
    ppb84-saturation: "SLE solve 6.8905 vs 6.146 mol/kg (+12.2 %) - the eNRTL gamma curve is too flat past the 1 m minimum for the 1.0065 saturation condition, measured 2026-10-22"
- id: ext_uniquac_nacl_water
  name: Extended UNIQUAC NaCl(aq) brine (Thomsen parameter set)
  family: electrolyte
  adapter: ngdesign.amine.electrolyte:ElectrolyteExtUNIQUAC
  options: {}
  params:
    source: data/thermo_params/electrolyte/ext_uniquac.yaml
    provenance: >-
      Extended UNIQUAC per Thomsen & Rasmussen (1999), Chem. Eng. Sci. 54, 1787-1802 and
      Thomsen, Rasmussen & Gani (1996), Chem. Eng. Sci. 51, 3675-3683; the r/q/u0/u1 set for
      Na+-Cl--H2O verified value-for-value against the open-access Leal et al. (2025),
      Applied Geochemistry 180, 106274 (Tables 1-2), formulation (eqs 15-24, 40-46:
      psi_ji = exp[(u_ii-u_ji)/T], S_j = sum theta_l psi_lj, infinite-dilution divisor psi_ww = 1,
      eq 45 unsymmetric molality assembly) read from the same open paper and
      finite-difference-verified to 6 decimals.  Reaktoro (LGPL-2.1) used as a verification
      cross-check only, no code copied.
  applicability:
    component_classes:
    - water
    polar: true
    electrolyte: true
    T_K:
    - 293.15
    - 303.15
    P_Pa:
    - 2000.0
    - 10000000.0
    phases:
    - V
    - L
    notes: >-
      NaCl-H2O brines at 20-30 C; the parameter set is the Thomsen 25 C one (u_ij carry the
      published linear T-dependence, but the verified anchor set is 25 C) and residual
      temperature dependence enters through Psat.  Molality clamped to the verified domain
      (6.15 mol/kg, the saturation anchor).  Literature-faithful accuracy a few % vs experimental
      gamma+/phi; Pitzer NaCl is the high-accuracy row (0.36 %).  Na2SO4 out of scope
      (documented, T-09).
  status: provisional
  validation: []
  references:
  - Thomsen, K. & Rasmussen, P., Chem. Eng. Sci. 54(13), 1787-1802, 1999
  - Thomsen, K., Rasmussen, P. & Gani, R., Chem. Eng. Sci. 51(16), 3675-3683, 1996
  - Leal, A. M. K. et al., Applied Geochemistry 180, 106274, 2025 (open-access formulation and parameter verification)
  l0:
    single_liquid_limit:
      z:
        H2O: 0.95
        NaCl: 0.05
      state:
      - 298.15
      - 5000000.0
    round_trip:
      z:
        H2O: 0.95
        NaCl: 0.05
      states:
      - - 298.15
        - 5000000.0
    determinism:
      z:
        H2O: 0.95
        NaCl: 0.05
      state:
      - 298.15
      - 5000000.0
  l0_excluded: *id002
  l0_note: >-
    literature anchors run in tests/thermo/test_electrolyte.py — mean activity coefficients vs
    Pitzer, Peiper & Busey 1984 Table A-8 (0.1-6 molal) miss the default 2 % band on six points,
    worst 4.26 % (1 m, at the characteristic gamma minimum the model reproduces); osmotic
    coefficients vs Table A-9 miss the band on three points, worst 3.68 % (4 m); the SLE solve
    gives 6.2358 vs 6.146 mol/kg (+1.5 %).  A few-percent-class fit is the Thomsen-type
    parameterisation's own published quality.  L0 round trips and the single-liquid limit run today
  assessed:
    ppb84-gamma-0.25m: "gamma+ -2.14 % (0.7046 vs 0.720) - model-inherent fit quality (Thomsen parameterisation), measured 2026-10-22"
    ppb84-gamma-0.5m: "gamma+ -3.49 % (0.6572 vs 0.681) - model-inherent fit quality, measured 2026-10-22"
    ppb84-gamma-1.0m: "gamma+ -4.26 % (0.6290 vs 0.657) - model-inherent fit quality, worst point, measured 2026-10-22"
    ppb84-gamma-2.0m: "gamma+ -2.00 % (0.6556 vs 0.669) - model-inherent fit quality, measured 2026-10-22"
    ppb84-gamma-4.0m: "gamma+ +3.03 % (0.8057 vs 0.782) - model-inherent fit quality, measured 2026-10-22"
