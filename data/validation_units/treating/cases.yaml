# V1 validation cases for the treating family (spec U-01 / U-G).
#
# Case schema: see scripts/validate_units.py. Every case carries a mandatory
# source citation and expected values with tolerances fixed before the run;
# a measured miss is explained in `assessed` rather than hidden by a widened
# tolerance.
- id: V1201-teg-regen-gpsa
  unit: teg_regen
  level: R0
  source: >-
    GPSA Engineering Data Book, 14th ed., Sect. 20 regeneration example
    (Ex. 20-12 basis: rich TEG 97.5 wt% at 300 F; Ex. 20-11 Fig. 20-56 read:
    98.8 wt% lean TEG at a 400 F reboiler, no stripping gas). 400 F reboiler
    = 477.594 K exactly, not the 477.15 K first assumed.
  params: {T_reboiler: 477.594, P: 101325.0}
  expected:
  - {quantity: info.lean_teg_mass_fraction, value: 0.988, tol_abs: 0.0015}
  assessed: >-
    Measured 0.99265 wt-fraction lean TEG (99.27 wt%) at the GPSA basis
    (400 F reboiler, 1 atm): 0.47 wt% above the Fig. 20-56 read of 98.8 wt%.
    The Parrish-Won-Baltatu water-activity correlation behind
    ngdesign.units.teg_activity was fitted over 300-380 K; the 400 F reboiler
    sits far outside the fit and the unit now flags this in
    info["activity_extrapolated"] (= 1.0 here), so the shortcut over-purifies
    by ~0.5 wt% absolute. The miss is documented here instead of widening the
    tolerance; the model reports the ideal-limit purity it can defend at R0.
    Published cross-checks put the 400 F no-stripping-gas value at 98.7-98.8
    wt% (Moshfeghian, Campbell Tip of the Month, May 2013), consistent with
    the GPSA figure.
- id: V1202-sulfur-recovery-gpsa
  unit: sulfur_recovery
  level: R0
  source: >-
    GPSA Engineering Data Book, Sect. 22, Example 22-1 "Claus Process
    Calculation" (printed inputs on a 100 LT/D sulfur basis: acid gas
    60.65 mol% H2S, 32.17 CO2, 6.20 H2O, 0.98 hydrocarbons as C1 at 110 F,
    20.7 psia; stoichiometric air for the one-third H2S burn plus full HC
    burn at 180 F with 0.0297 humidity; furnace outlet 19.1 psia; first
    condenser 350 F; first converter at equilibrium). Printed thermal-stage
    Claus extent x = 135.16 mol/hr of the 194.05 mol/hr H2S surviving the
    burn (Fig. 22-27 heat-balance intercept; the official GPSA Section22.xlsx
    workbook companion intercepts x = 135.555 at 2163.3 F). Printed
    first-converter Claus extent x = 38.0177 mol/hr H2S (workbook Step 5
    intercept; converter outlet 581 F read from Fig. 22-27, 582.7 F by the
    workbook Kp polynomial).
  feeds:
    acid_gas_in:
      T: 316.48          # 110 F
      P: 142721.5        # 20.7 psia
      molar_flow: 0.3442785   # printed burner mixture, 1239.4025 mol/hr:
      composition:       # H2S 291.0754; CO2 154.3924; H2O 51.6612
        H2S: 0.234835    # (29.7554 acid gas + 21.9058 humid air);
        CO2: 0.124559    # C1 4.7033; O2 154.9443; N2 582.6259
        H2O: 0.041684
        CH4: 0.0037945
        O2: 0.124998
        N2: 0.470129
  params:
    T_thermal: 1457.2    # 2163.3 F, workbook heat-balance intercept
    P: 131689.9          # 19.1 psia after the 1.6 psi furnace drop
    T_condenser: 449.82  # 350 F first condenser
    thermal_conversion: 0.69658   # 135.16 / 194.05, printed values
    catalytic_stages:
    - {T: 578.15, approach_K: 0.0}   # 581 F outlet, "At equilibrium"
  expected:
  - {quantity: info.stage_0_extent_mol_s, value: 0.00528, tol_abs: 0.0005}
  assessed: >-
    DOCUMENTED GAP - the example's printed overall recovery is not checked:
    no copy reachable to this repo reproduces the example's final recovery
    step. The official GPSA Section22.xlsx workbook companion ends at the
    first catalytic converter plus an incinerator sheet, and the Kohl &
    Nielsen, Gas Purification, 5th ed., ch. 8 copies found online expose only
    front matter. Searched: GPSA posted workbook (gspsa.org), pdfcoffee and
    Scribd Section 22 reproductions (previews truncate before pp. 22-20+),
    vdoc.pub Kohl & Nielsen. The case instead checks the PRINTED
    first-converter extent: 38.0177 mol/hr H2S consumed at equilibrium, on
    the S8 basis the workbook itself states is within 1% of total overall
    conversion. Inputs derived from printed values only (never back-solved):
    thermal_conversion = 135.16/194.05; unit extent = H2S mol/hr / 2 / 3600
    (the unit's extent is per mol SO2 consumed). Known adapter difference,
    documented not hidden: the R0 unit does not combust the 0.98 mol%
    hydrocarbons, so the 9.4 mol/hr of O2 meant for HC burn passes through
    unreacted and the tail gas carries CH4 + O2 where the book carries CO2 +
    H2O (~0.8% effect on total moles). Measured stage_0_extent_mol_s 0.0050169
    (36.1 mol/hr H2S consumed) vs the printed 38.0177: -5.0%, inside the
    tolerance fixed before the run (the JANAF Gibbs equilibrium behind
    ngdesign.units.reaction_set sits ~5% below the GPSA Fig. 22-27 chart read
    at the converter outlet temperature). Measured sulfur_recovery_fraction
    0.8827 — no printed value exists to check it against (the example's final
    recovery step is not accessible); recorded for transparency, on the R0
    basis of one thermal stage + one catalytic converter and no HC combustion.
