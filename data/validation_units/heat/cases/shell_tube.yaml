# V1 worked cases for shell_tube (per-unit case file).
- id: V1-shell-tube-kern-ex7-4
  unit: shell_tube
  level: R1
  source: >-
    Kern, D.Q., Process Heat Transfer, McGraw-Hill 1950, Example 7.4
    "Calculation of a Distilled-water-Raw-water Exchanger", pp. 155-158
    (archive.org OCR text
    https://archive.org/download/KERNProcessHeatTransfer/KERN%20-%20Process%20Heat%20Transfer_djvu.txt,
    read 2026-11-04): 175,000 lb/hr distilled water 93 -> 85 F in the
    shell, 280,000 lb/hr raw water from 75 F in the tubes; 15 1/4 in. ID
    shell, 160 tubes 3/4 in. OD 18 BWG (a't = 0.334 in2, ID 0.652 in), 16
    ft, 15/16 in. triangular pitch, two tube passes, baffles 12 in.; printed
    shell side De = 0.0458 ft, Re_s = 16,200, ho = 1010; tube side Re_t =
    36,400, hi = 1335, hio = 1155; clean Uc = 537 Btu/hr ft2 F; dPs = 7.7
    psi, dPt = 4.9 + 2.6 = 7.5 psi. SI: ho = 5735.1 W/m2K, Uc = 3049.2
    W/m2K, 7.7 psi = 53,089.6 Pa, 7.5 psi = 51,710.7 Pa. Flows 22.0499 and
    35.2798 kg/s (1223.97 / 1958.35 mol/s); 15 baffles (Kern's N + 1 = 12
    L/B = 16 crossings); both streams at 3 bar (not printed; liquid water,
    pressure-insensitive); the pr-free-water package carries the IAPWS liquid density and cp and a liquid viscosity (plain PR gives 844 kg/m3 for liquid water). No fouling and k_wall = 1e6 W/m K so the reported
    U is Kern's clean Uc (1/Uc = 1/hio + 1/ho, no wall term). Tolerances:
    the printed integer Btu values (+/-0.5 = +/-2.84 W/m2K) and 0.1 psi
    (+/-344.7 Pa), fixed before the run.
  thermo: pr-free-water
  feeds:
    inlet:
      T: 307.039
      P: 3.0e+5
      molar_flow: 1223.97
      composition: {H2O: 1.0}
  params:
    process_side: shell
    shell_ID_m: 0.38735
    n_tubes: 160
    tube_OD_m: 0.01905
    tube_ID_m: 0.016561
    tube_length_m: 4.8768
    pitch_m: 0.0238125
    layout: triangular30
    baffle_spacing_m: 0.3048
    n_baffles: 15
    tube_passes: 2
    n_shells: 1
    utility_composition: {H2O: 1.0}
    utility_T_K: 297.039
    utility_P_Pa: 3.0e+5
    utility_molar_flow: 1958.35
    k_wall_W_mK: 1.0e+6
    R_f_tube_m2K_W: 0.0
    R_f_shell_m2K_W: 0.0
  expected:
  - {quantity: info.h_shell_W_m2K, value: 5735.1, tol_abs: 2.84}
  - {quantity: info.U_W_m2K, value: 3049.2, tol_abs: 2.84}
  - {quantity: info.dP_shell_Pa, value: 53089.6, tol_abs: 344.7}
  - {quantity: info.dP_tube_Pa, value: 51710.7, tol_abs: 344.7}
  assessed: >-
    Measured h_shell 5842.7 W/m2K (+1.9% on ho = 1010 -> 5735.1), dP_shell
    54,850 Pa (+3.3% on 7.7 psi), dP_tube 52,456 Pa (+1.4% on 7.5 psi),
    Re_shell 16,366 (Kern 16,200) and Re_tube 38,882 (Kern 36,400 at his
    77.5 F viscosity) - the Kern shell-side method and the 4Ntp return-head
    tube dP track the book within the chart-reading and property spread
    (Kern reads mu, k from Fig. 14/Table 4 at the caloric temperatures),
    but not within the printed integer rounding. The clean U misses by
    +18.4% (3610.9 vs 3049.2 W/m2K): the unit's tube-side h_i = 10,874
    W/m2K (ID basis; Gnielinski duct correlation) against Kern's 1335 x 5.678
    = 7580 W/m2K read from his water chart (Fig. 25, Eagle & Ferguson
    1930), a dimensional water correlation ~30% below Gnielinski at Re
    3.9e4. A correlation-choice difference (Kern's chart vs the
    Gnielinski tube side the level declares), not a coding error; R1 stays
    provisional.

- id: V1-shell-tube-kern-ex12-1
  unit: shell_tube
  level: R2
  source: >-
    Kern, D.Q., Process Heat Transfer, McGraw-Hill 1950, Example 12.1
    "Calculation of a Horizontal n-Propanol Condenser", pp. 274-277
    (archive.org OCR text
    https://archive.org/download/KERNProcessHeatTransfer/KERN%20-%20Process%20Heat%20Transfer_djvu.txt,
    read 2026-11-04): 60,000 lb/hr of substantially pure n-propanol
    condensed at 15 psig (boils at 244 F) in the shell of a horizontal 1-4
    condenser, 488,000 lb/hr water 85 -> 120 F in the tubes, dirt factor
    0.003; 766 tubes 3/4 in. OD 16 BWG (a't = 0.302 in2, D = 0.62 in.), 8'0",
    15/16 in. triangular pitch, 31 in. ID shell, 4 passes, baffle space 31
    in. (2 baffles, 3 crosses); loading G'' = 89.3 lb/hr lin ft, tw = 125 F,
    tf = 184.5 F, condensing film ho = 172 Btu/hr ft2 F (Fig. 12.9 / Eq.
    12.42) = 976.7 W/m2K. Encoded: 7.55987 kg/s = 125.799 mol/s n-propanol
    fed as saturated vapour at 29.7 psia = 204,775 Pa, 0.32 K above the
    package dew point 390.18 K = 242.6 F (book 244 F; the PR PT flash
    still returns a liquid root up to 390.3 K); water 61.4876 kg/s =
    3413.05 mol/s at 85 F, 3 bar (not printed); D_o 0.01905 m, D_i 0.015748
    m, 2.4384 m, pitch 0.0238125 m; Rd 0.003 hr ft2 F/Btu = 5.2833e-4
    m2K/W, all on the shell (Kern's outside basis). tube_rows_vertical = 38,
    the centre-column count 31 in. / (15/16 in. x cos 30) = 38.2, is the
    unit's Nusselt-bank input; Kern's Eq. 12.42 has no row count (it loads
    on Nt^(2/3)), so this is a modelling choice stated before the run. The
    compared quantity is the condensing shell film (mean over the
    equal-duty zones), which depends on the water side only through the
    wall temperature (quarter power), not on Kern's chart water coefficient.
    Tolerance: the printed integer ho (+/-0.5 Btu = +/-2.84 W/m2K), fixed
    before the run.
  thermo: pr
  feeds:
    inlet:
      T: 390.5
      P: 204775.0
      molar_flow: 125.799
      composition: {1-PROPANOL: 1.0}
  params:
    process_side: shell
    shell_ID_m: 0.7874
    n_tubes: 766
    tube_OD_m: 0.01905
    tube_ID_m: 0.015748
    tube_length_m: 2.4384
    pitch_m: 0.0238125
    layout: triangular30
    baffle_spacing_m: 0.7874
    n_baffles: 2
    tube_passes: 4
    n_shells: 1
    utility_composition: {H2O: 1.0}
    utility_T_K: 302.594
    utility_P_Pa: 3.0e+5
    utility_molar_flow: 3413.05
    R_f_tube_m2K_W: 0.0
    R_f_shell_m2K_W: 5.2833e-4
    tube_rows_vertical: 38
    n_zones: 8
  expected:
  - {quantity: info.h_shell_mean_W_m2K, value: 976.7, tol_abs: 2.84}
  assessed: >-
    Measured mean condensing film 650.5 W/m2K (zones 660.8 -> 640.6) against
    Kern's ho = 172 Btu/hr ft2 F = 976.7 W/m2K, -33.4%; rated duty 3.975 MW
    with 18.4 mol% vapour left at the outlet (Kern: 17.1e6 Btu/hr = 5.01 MW,
    total condensation), zone-weighted U 450.5 W/m2K (Kern U_D = 101 Btu =
    573.5 W/m2K). The main cause is the bank model, not a coding error: the
    unit applies Nusselt with the Incropera eq. 10.47 row factor N_r^(-1/4)
    at the stated centre-column count N_r = 38 (factor 0.403), while Kern's
    Eq. 12.42 loads the film on Nt^(2/3) tubes (equivalent to a far milder
    row penalty); at N_r = Nt^(1/3) = 9.15 the same unit film would be ~1.43x
    higher (~930 W/m2K). Kern also takes k_f, s_f, mu_f from his tables at the
    184.5 F film temperature (0.094, 0.80, 0.62 cp) and the wall at 125 F from
    his chart water coefficient; the unit's films come from the PR package
    and its own wall balance. No N_r is printed, so the row count stays a
    stated modelling choice and the level stays provisional. Found while
    encoding this case and fixed (regression test in
    tests/units/heat/test_shell_tube_r2.py): R2's info U_W_m2K was
    Q/(F*sum(Q_k/LMTD_k)), a temperature; it now reports the zone-weighted U.
