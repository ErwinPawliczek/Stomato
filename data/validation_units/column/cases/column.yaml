# V1 worked case for column R2 (per-unit case file; units-b validation run).
- id: V1-column-seader-10-9
  unit: column
  level: R2
  thermo: srk-kij0
  source: >-
    Seader, Henley & Roper, "Separation Process Principles", 3rd ed. (Wiley
    2011), Example 10.9 "Inside-Out Method", p. 404, with the column of
    Figure 10.7, p. 384 (archive.org item
    separation-process-principles-chemical-a, PDF pages 412 and 432, read and
    retrieved 2026-11-04): total condenser (stage 1), three equilibrium
    stages, partial reboiler (stage 5), all at 100 psia; 100 lbmol/h
    saturated-liquid feed to stage 3 (C3 0.30, nC4 0.30, nC5 0.40); reflux
    ratio L1/U1 = 2.0; bottoms L5 = 50 lbmol/h; SRK equation of state
    (CHEMCAD TOWR). Converged (outer-loop iteration 3) results printed:
    T1 = 83.67 F, T5 = 192.43 F; bottoms C3 0.955, nC4 12.363, nC5 36.683
    lbmol/h of L5 = 50.001 lbmol/h. The book reports the feed bubble point
    as 123.5 F.
  notes: >-
    Unit mapping: the column's total condenser is hardware above stage 1, so
    the book's stages 2-4 are column stages 1-3 and the reboiler is stage 4
    (n_stages 4, feed_stage 2). Flows converted lbmol/h x 0.45359237/3600 to
    mol/s, 100 psia = 689475.729 Pa. Property package: srk-kij0 (SRK with
    every k_ij = 0). Evidence that the book ran SRK without k_ij: its printed
    feed bubble point at 100 psia, 123.5 F, is reproduced by srk-kij0
    (323.979 K = 123.49 F), while the IPDB-k_ij srk row (C3-nC4 0.0033, C3-nC5
    0.0267, nC4-nC5 0.0174) gives 321.672 K = 119.34 F. The feed T is the
    srk-kij0 bubble point (323.978 K) so the feed enters saturated liquid, as
    the book specifies. Expected bottoms mole fractions are the printed flows
    over 50.001. Tolerances are the printed rounding, fixed before the first
    run (on srk) and kept unchanged for srk-kij0: 0.005 F (0.003 K) on
    temperatures and 0.0005 lbmol/h on flows (1e-5 in mole fraction).
  feeds:
    feed:
      T: 323.978
      P: 689475.729
      molar_flow: 0.012599788
      composition: {C3: 0.30, nC4: 0.30, nC5: 0.40}
  params:
    n_stages: 4
    condenser: total
    reboiler: kettle
    feed_stage: 2
    pressure_profile: 689475.729
    specs: {reflux_ratio: 2.0, bottoms_rate: 0.006299894}
  expected:
  - {quantity: outlet.distillate.T, value: 301.856, tol_abs: 0.003}
  - {quantity: outlet.bottoms.T, value: 362.278, tol_abs: 0.003}
  - {quantity: outlet.bottoms.composition.C3, value: 0.019100, tol_abs: 0.00001}
  - {quantity: outlet.bottoms.composition.nC4, value: 0.247255, tol_abs: 0.00001}
  - {quantity: outlet.bottoms.composition.nC5, value: 0.733625, tol_abs: 0.00001}
  assessed: >-
    Measured miss on srk-kij0 (just outside the printed rounding): distillate
    T 301.861 vs 301.856 K (+0.005 K = +0.009 F), bottoms T 362.311 vs
    362.278 K (+0.033 K = +0.06 F); bottoms x_C3 0.019117 vs 0.019100
    (0.9560 vs 0.955 lbmol/h), x_nC4 0.247198 vs 0.247255, x_nC5 0.733685 vs
    0.733625. Root-cause investigation (CQ2, 2026-11-10; book text re-read
    from the archive.org djvu text of the same item, retrieved 2026-11-10):
    (1) Spec mapping checked against Figure 10.7 (p. 384): total condenser
    stage 1 with saturated-liquid reflux, feed to stage 3 as saturated liquid
    at 100 psia, L1/U1 = 2.0, L5 = 50 lbmol/h, all stages 100 psia. Matches.
    (2) The column solution is converged: an independent MESH check on the
    package's own phase_props gives |sum Kx - 1| <= 6e-9 on every stage,
    component balances <= 1.2e-11 mol/s, tray energy balances <= 6e-9
    relative, and bottoms/distillate T equal the bubble points of their own
    compositions to 1e-6 K. (3) The column meets its specs to the core's
    _SPEC_TOL (reflux ratio 2.000245, bottoms 50.006 lbmol/h; issue 248).
    Re-solved with the spec loop driven to 1e-9 (diagnostic only, not
    committed), the case still misses and moves slightly AWAY from the book:
    distillate T 301.864 K, bottoms T 362.315 K, x_C3 0.019111 (C3 0.9555
    lbmol/h of 50.000). So the spec tolerance is not the cause. (4) The book's
    printed temperatures are not the srk-kij0 bubble points of its own printed
    products: its bottoms (0.955/12.363/36.683 lbmol/h) bubbles at 192.49 F
    (362.311 K) at 100 psia, not the printed 192.43 F, and its distillate
    (29.045/17.637/3.317 by balance) at 83.685 F, not 83.67 F. Those bubble
    points equal what the column computes, so the T misses sit wholly in the
    property set, not in the MESH solution; an independent thermo FlashVL SRK
    build with the same constants reproduces them (123.492/83.685/192.491 F
    for feed/distillate/bottoms). (5) No single property set fits all three
    printed temperatures. CHEMCAD's own SRK constants are not available to
    us. Cited alternative constant sets (as tabulated in chemicals 1.5.2)
    move the bubble points of the book's compositions (feed/distillate/bottoms)
    as follows: REFPROP 'HEOS' (ours) 123.49/83.69/192.49 F;
    IUPAC Tc,Pc + Yaws omega 123.44/83.63/192.49 F; PSRK
    123.38/83.64/192.28 F; Passut-Danner 122.98/83.01/192.23 F. That spread (bottoms
    0.27 F, distillate 0.68 F) is several times the miss (0.06 F, 0.015 F). A pressure offset does not fit either: the
    printed bottoms T would need ~99.93 psia, the feed bubble 100.0 psia.
    (6) The book's printout is CHEMCAD's stopping iterate, not a solution
    converged to its last digit: from outer-loop iteration 2 to 3, T5 moved
    -0.10 F, T1 +0.09 F, L5 49.985 -> 50.001 and bottoms C3 0.947 -> 0.955
    lbmol/h. Interior profile vs the book's iteration 3: T2/T3/T4
    119.55/147.97/172.46 vs 119.54/147.95/172.43 F, L2/L3/L4 89.85/188.87/190.42
    vs 89.87/188.96/190.56 lbmol/h. Conclusion: no MESH, spec-mapping,
    pressure or k_ij defect. The residual comes from the CHEMCAD SRK
    constants and the book's unconverged-to-the-last-digit printout. The
    level stays provisional because the printed-rounding tolerance is not met.
