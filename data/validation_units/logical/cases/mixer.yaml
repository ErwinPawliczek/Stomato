# V1 worked cases for mixer (per-unit case file).
- id: V1-mixer-purdue-me200-steam-water
  unit: mixer
  level: R0
  source: >-
    Purdue University ME 200 Thermodynamics I lecture notes, Fall 2008, week 7
    (https://engineering.purdue.edu/CFDLAB/class/me200/filesFall2008/me200_notes_f08_week7.pdf),
    p. 7 "Mixing chambers" example, read 2026-11-04 (the Cengel & Boles
    mixing-chamber example): liquid water at 300 kPa and 20 C (1.8 kg/s) is
    heated in an adiabatic chamber by superheated steam at 300 kPa and 300 C;
    the mixture leaves at 60 C; printed h1 = 83.96, h2 = 3069.3, h3 = 251.13
    kJ/kg (compressed liquid taken as saturated liquid), answer m2 = 0.107
    kg/s. The case runs the solved flows forward (1.8 kg/s = 99.915 mol/s,
    0.107 kg/s = 5.9394 mol/s at M = 18.015268 g/mol) and checks the mixed
    outlet against the printed 60 C. Tolerance: the 3-decimal print of m2
    (+/-0.0005 kg/s) moves the mixed temperature by +/-0.18 K
    (0.0005 x (3069.3 - 251.13) kJ/s over 1.907 kg/s x 4.18 kJ/kg K),
    rounded up to 0.2 K before the run.
  thermo: iapws95
  feeds:
    inlet_1:
      T: 293.15
      P: 3.0e+5
      molar_flow: 99.915
      composition: {H2O: 1.0}
    inlet_2:
      T: 573.15
      P: 3.0e+5
      molar_flow: 5.9394
      composition: {H2O: 1.0}
    inlet_3:
      T: 293.15
      P: 3.0e+5
      molar_flow: 0.0
      composition: {H2O: 1.0}
  expected:
  - {quantity: outlet.outlet.T, value: 333.15, tol_abs: 0.2}
  - {quantity: outlet.outlet.P, value: 3.0e+5, tol_abs: 1.0}
