# V1 worked cases for pump (per-unit case file).
- id: V1-pump-gpsa-12-1
  unit: pump
  level: R0
  source: >-
    GPSA Engineering Data Book, 13th ed. (FPS), Section 12 Pumps & Hydraulic
    Turbines, Example 12-1, transcribed from the publisher's official
    calculation workbook (https://www.gpamidstream.org/wp-content/uploads/2025/08/DBCalculations-13thEdition-Section12.xlsx,
    sheet "Example 12-1", retrieved 2026-11-04): liquid propane at its
    bubble point pumped from a 200 psia reflux drum to a 220 psia
    depropanizer, 360 gpm maximum, 100 degF, SG 0.485; absolute total
    pressure at pump suction ATPS = 188.8 psig (185.3 + 4.2 static - 0.5
    piping - 0.2 valves), at discharge 250.0 psig; dP = 61.2 psi, H = 291.7
    ft, required H with 10% safety factor = 320.8 ft; efficiency from Fig.
    12-7 e = 0.62; hyd hp = 360 x 320.8 x 0.485 / 3960 = 14.1; bhp = 14.1 /
    0.62 = 22.8 (cell display 0.0). The book's bhp depends on the feed only
    through Q x dP (Q H SG / 3960 = Q dP / 1714), so the feed is the printed
    360 gpm at the suction state (310.928 K, 188.8 psig = 1.40308 MPa abs):
    243.0 mol/s at the package's 471.78 kg/m3. The pump is set to the
    required (safety-factored) head as a pressure rise, 1.1 x 61.2377 psi =
    67.3614 psi = 464,438 Pa, at the printed e = 0.62.
  thermo: coolprop_heos
  feeds:
    inlet:
      T: 310.928
      P: 1.403077e+6
      molar_flow: 243.0
      composition: {C3: 1.0}
  params:
    P_out: 1.867515e+6
    eta: 0.62
  expected:
  - {quantity: power_W, value: 17002.0, tol_rel: 0.0022}

- id: V1-pump-svna-ex7-10
  unit: pump
  level: R0
  source: >-
    Smith, Van Ness, Abbott, Swihart, Introduction to Chemical Engineering Thermodynamics, 9th ed., McGraw Hill 2022 (archive.org item text-book-introduction-to-chemical-engineering-thermodynamics-9e-by-j-m-smith, full text read 2026-11-04), Example 7.10, p. 296-297: water at 45 C and 10 kPa pumped
    adiabatically to 8600 kPa at pump efficiency 0.75; saturated-liquid V =
    1010 cm3/kg, beta = 425e-6 1/K, Cp = 4.178 kJ/kg K; Ws(isentropic) =
    8.676 kJ/kg, Ws = dH = 11.57 kJ/kg, dT = 0.97 K. 1 kg/s basis (55.50843
    mol/s). Tolerances: the printed 0.01 kJ/kg and 0.01 K, fixed before the
    run.
  thermo: iapws95
  feeds:
    inlet:
      T: 318.15
      P: 1.0e+4
      molar_flow: 55.50843
      composition: {H2O: 1.0}
  params:
    P_out: 8.6e+6
    eta: 0.75
  expected:
  - {quantity: power_W, value: 11570.0, tol_abs: 5.0}
  - {quantity: outlet.outlet.T, value: 319.12, tol_abs: 0.005}
  assessed: >-
    Power passes (11,567 W, -0.026%). Outlet 319.129 K misses the printed 319.12
    +/- 0.005 K by 0.009 K: the book's dT = 0.97 K comes from the constant-
    property formula Eq. (7.25) with saturated-liquid V, beta and Cp at 45 C,
    while the unit's PH flash integrates IAPWS-95 along the actual compression.
    The difference is the book's linearisation; the power, the level's main
    output, matches.
