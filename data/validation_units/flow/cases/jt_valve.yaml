# V1 worked cases for jt_valve (per-unit case file).
- id: V1-jt-valve-purdue-me200-steam
  unit: jt_valve
  level: R0
  source: >-
    Purdue University ME 200 Thermodynamics I lecture notes, Fall 2008, week 7
    (https://engineering.purdue.edu/CFDLAB/class/me200/filesFall2008/me200_notes_f08_week7.pdf),
    p. 6 "Throttling valves", Example 1, read 2026-11-04: a well-insulated
    valve throttles steam from 8 MPa and 500 C to 6 MPa; h1 = h2 = 3398.3
    kJ/kg (steam tables, Table A-6), printed T2 = 490.1 C. Tolerance: the
    one-decimal print, +/-0.05 K, fixed before the run.
  thermo: iapws95
  feeds:
    inlet:
      T: 773.15
      P: 8.0e+6
      molar_flow: 10.0
      composition: {H2O: 1.0}
  params:
    P_out: 6.0e+6
  expected:
  - {quantity: outlet.outlet.T, value: 763.25, tol_abs: 0.05}

- id: V1-jt-valve-svna-sec7-1-steam
  unit: jt_valve
  level: R0
  source: >-
    Smith, Van Ness, Abbott, Swihart, Introduction to Chemical Engineering Thermodynamics, 9th ed., McGraw Hill 2022 (archive.org item text-book-introduction-to-chemical-engineering-thermodynamics-9e-by-j-m-smith, full text read 2026-11-04), Sec. 7.1 (throttling processes), text p. 282: steam at 1000 kPa
    and 300 C throttled to 101.325 kPa, H2 = H1 = 3052.1 kJ/kg,
    interpolation in the steam tables gives a downstream temperature of
    288.8 C. Tolerance: the printed 0.1 C, fixed before the run.
  thermo: iapws95
  feeds:
    inlet:
      T: 573.15
      P: 1.0e+6
      molar_flow: 10.0
      composition: {H2O: 1.0}
  params:
    P_out: 1.01325e+5
  expected:
  - {quantity: outlet.outlet.T, value: 561.95, tol_abs: 0.05}
  assessed: >-
    Measured 561.771 K (288.62 C) against the printed 288.8 C. CoolProp 8.0.0
    IAPWS-95 gives H1 = 3051.63 kJ/kg (book 3052.1) and the isenthalpic outlet
    at 101.325 kPa = 288.62 C, identical to the unit. The 0.18 K miss is the
    book's steam-table values; level status rests on the passing Purdue case.
