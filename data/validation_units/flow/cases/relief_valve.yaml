# V1 worked cases for relief_valve (per-unit case file).
- id: V1-relief-valve-diers-rr-case-ia
  unit: relief_valve
  level: R1
  source: >-
    Leung, J.C., "Benchmark Flow Problems - A Round-Robin Exercise", DIERS
    Users Group Meeting, San Antonio TX, 20-22 Oct 2008
    (https://www.iomosaic.com/diersweb/docs/DUG%2042-850-1.pdf, read
    2026-11-04): critical (choked) homogeneous-equilibrium nozzle discharge,
    p. 2-3 case definitions, p. 10 table "100% c-C6, 10 bar, 182.3 C", Case
    Ia x_o = 0.0001 (bubble point): mean of the 12 participant results Gc =
    6070 kg/m2s (std. dev. 90), eta_c = 0.866 (std. dev. 0.008); the
    omega_0.9 (JL) row prints 6160 / 0.863. Tolerance: the printed
    participant standard deviation (the benchmark's own stated spread),
    fixed before the run; this tolerance basis for a round-robin mean was
    accepted by the orchestrator ruling of 2026-11-04. The inlet is saturated cyclohexane at 10 bar on
    the package's own saturation line (PR bubble point 455.132 K = 181.98 C
    against the printed 182.3 C), fed 0.002 K below it so the PT flash
    returns the liquid; the back pressure (1 bar) is far below eta_c P0 so
    the flow is choked as in the benchmark.
  thermo: pr
  feeds:
    inlet:
      T: 455.13
      P: 1.0e+6
      molar_flow: 10.0
      composition: {CYCLOHEXANE: 1.0}
  params:
    P_back: 1.0e+5
  expected:
  - {quantity: info.G_kg_m2s, value: 6070.0, tol_abs: 90.0}
  - {quantity: info.eta_c, value: 0.866, tol_abs: 0.008}

- id: V1-relief-valve-api520-d2-2-2-propane
  unit: relief_valve
  level: R1
  source: >-
    API RP 520 Part I, 7th ed. (January 2000), p. 73, Example D.2.2.2
    (subcooled liquid at the PRV inlet), as transcribed in FluidFlow
    knowledge-base article "Relief valve sizing verification", section 5
    (https://knowledge.fluidflowinfo.com/en/articles/13285154, read
    2026-11-04; secondary transcription of the API example): propane
    100 gal/min (pump blockage) at 60 F, set 260 psig, 10% accumulation,
    relieving pressure 300.7 psia, total back pressure 10 psig, Kd = 0.65,
    Kb = Kc = 1.0; printed mass flux G = 7560 lb/s ft2 (= 36,911 kg/m2s),
    required area 0.208 in2, orifice F (0.307 in2), inlet density 31.92
    lb/ft3. Mass flow from the printed 100 gal/min at the printed 31.92
    lb/ft3 = 7.1118 lb/s = 3.22587 kg/s = 73.156 mol/s. Tolerances: the
    printed 4-figure G (+/-5 lb/s ft2 = 24.4 kg/m2s) and 3-decimal area
    (+/-0.0005 in2), fixed before the run.
  thermo: coolprop_heos
  feeds:
    inlet:
      T: 288.706
      P: 2.073256e+6
      molar_flow: 73.156
      composition: {C3: 1.0}
  params:
    P_back: 1.70301e+5
    Kd: 0.65
    Kb: 1.0
    Kc: 1.0
  expected:
  - {quantity: info.G_kg_m2s, value: 36911.2, tol_abs: 24.4}
  - {quantity: info.required_area_in2, value: 0.208, tol_abs: 0.0005}
  - {quantity: info.selected_orifice_area_in2, value: 0.307, tol_abs: 0.0005}
  assessed: >-
    Orifice letter passes (F, 0.307 in2). G = 36,842.5 kg/m2s misses the
    printed 36,911 by -0.19% (tolerance 0.066%), and the required area
    0.20879 in2 misses 0.208 by +0.38% (+0.19% on the API's unrounded
    7.1118/(0.65 x 7560) = 0.20841 in2, the rest is the G gap). The unit
    takes the high-subcooling branch (regime 3, Psat = 742.7 kPa = 107.7
    psia from the package at 60 F; eta_s = 0.358), where G = sqrt(2 rho
    (P0 - Ps)): the package's inlet density is 510.07 kg/m3 = 31.84 lb/ft3
    (CoolProp 8.0.0 propane reference EOS) against the API's printed 31.92
    lb/ft3 (FluidFlow reports 31.64), which alone gives -0.13% on G; the
    remainder is the API's vapour pressure. A property-data difference in
    the example's chart inputs, not a defect in the omega-method branch;
    kept as a measured miss. Per the orchestrator ruling of 2026-11-04 a miss
    demonstrated to be the source's chart property data does not block R1,
    which passes the DIERS benchmark case cleanly.
