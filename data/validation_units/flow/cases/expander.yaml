# V1 worked cases for expander (per-unit case file).
- id: V1-expander-svna-ex7-6
  unit: expander
  level: R0
  source: >-
    Smith, Van Ness, Abbott, Swihart, Introduction to Chemical Engineering Thermodynamics, 9th ed., McGraw Hill 2022 (archive.org item text-book-introduction-to-chemical-engineering-thermodynamics-9e-by-j-m-smith, full text read 2026-11-04), Example 7.6, p. 287-288: steam turbine, inlet 8600 kPa and
    500 C, discharge 10 kPa, turbine efficiency 0.75; steam tables H1 =
    3391.6, S1 = 6.6858, isentropic x2' = 0.8047, dH = -955.6 kJ/kg, H2 =
    2436.0 kJ/kg, x2 = 0.9378. 1 kg/s basis (55.50843 mol/s; the molar
    vapour fraction of pure water equals the mass quality). Tolerances: the
    printed 0.1 kJ/kg and 4-decimal quality, fixed before the run.
  thermo: iapws95
  feeds:
    gas_in:
      T: 773.15
      P: 8.6e+6
      molar_flow: 55.50843
      composition: {H2O: 1.0}
  params:
    P_out: 1.0e+4
    eta_isentropic: 0.75
  expected:
  - {quantity: power_W, value: -955600.0, tol_abs: 50.0}
  - {quantity: outlet.gas_out.vapor_fraction, value: 0.9378, tol_abs: 0.00005}
  assessed: >-
    Measured power -956,218 W (-956.22 kJ/kg, +0.065% on -955.6) and outlet
    quality 0.938205 (book 0.9378). CoolProp 8.0.0 IAPWS-95 on the same path
    gives H1 = 3392.26 kJ/kg (book 3391.6), dH = -956.22 kJ/kg and x2 =
    0.938205, identical to the unit. The miss is the book's steam-table values
    and interpolation, not the expansion calculation; level stays provisional.
- id: V1-expander-perry-ex4-6
  unit: expander
  level: R0
  source: >-
    Perry's Chemical Engineers' Handbook, 9th ed., McGraw-Hill 2019, Section
    4, Example 4-6 "Turbine Process Design" (archive.org item
    perrys-chemical-engineers-handbook-9th-edition, full text read
    2026-11-04): steam expanded from 500 C and 1.4 MPa to 0.6 MPa at 75%
    efficiency, Elliott & Lira steam tables H1 = 3474.8 kJ/kg, S1 = 7.6047
    kJ/kg K, H2' = 3202.8 kJ/kg, W = (3202.8 - 3474.8)(0.75) = -204 kJ/kg.
    1 kg/s basis (55.50843 mol/s). Tolerance: the printed integer kJ/kg
    (+/-0.5 kJ/kg), fixed before the run.
  thermo: iapws95
  feeds:
    gas_in:
      T: 773.15
      P: 1.4e+6
      molar_flow: 55.50843
      composition: {H2O: 1.0}
  params:
    P_out: 6.0e+5
    eta_isentropic: 0.75
  expected:
  - {quantity: power_W, value: -204000.0, tol_abs: 500.0}
  assessed: >-
    Measured power -204,695 W (-204.70 kJ/kg) against the printed -204 +/- 0.5.
    CoolProp 8.0.0 IAPWS-95 gives H1 = 3474.78 kJ/kg (book 3474.8) and dH =
    -204.70 kJ/kg, identical to the unit; the book's interpolated H2' = 3202.8
    kJ/kg in the Elliott & Lira tables sits 0.9 kJ/kg above the IAPWS-95
    isentrope. Table-interpolation difference, not a unit error; level stays
    provisional.
