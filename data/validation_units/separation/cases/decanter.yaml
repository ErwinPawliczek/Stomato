# V1 worked case for decanter R1 (U-R2 per-unit case file).
- id: V1-decanter-sinnott-10-3
  unit: decanter
  level: R1
  source: >-
    Sinnott, "Coulson & Richardson's Chemical Engineering" Vol. 6, 4th ed.,
    Example 10.3 (decanter to separate a light oil from water, oil dispersed):
    oil 1000 kg/h at 900 kg/m3 and 3 mN s/m2, water 5000 kg/h at 1000 kg/m3
    and 1 mN s/m2, design droplet diameter 150e-6 m; printed Stokes droplet
    velocity 0.0012 m/s and required interfacial area 1.16 m2. The
    comparable quantity the unit reports is info.u_t_m_s (the book's settling
    velocity step). The book's densities cannot be passed to the unit (no
    density override param), so the anchor is expected to miss for
    equation-of-state reasons; the miss is recorded in `assessed` per the
    spec, and the level's validation field stays unset because the case does
    not pass.
  feeds:
    inlet:
      T: 293.15
      P: 1.0e+5
      molar_flow: 100.0
      composition: {H2O: 0.5, nC5: 0.5}
  params:
    dispersed_phase: light
    droplet_diameter_m: 150.0e-6
    continuous_viscosity_Pa_s: 1.0e-3
    interface_area_m2: 1.16
  expected:
  - {quantity: info.u_t_m_s, value: 0.0012, tol_abs: 5.0e-5}
  assessed: >-
    Measured miss (pr package, this case's feeds and params): u_t = 2.521e-3
    m/s, 2.10x the book's printed 0.0012 m/s. Cause: the unit takes the two
    liquid densities from the flashed pr phases (aqueous 851.4, hc-liquid
    645.7 kg/m3 at 293.15 K, 1 bar), so the driving gap is 205.7 kg/m3 versus
    the book's 900/1000 (gap 100); with the book's water viscosity passed
    through continuous_viscosity_Pa_s the Stokes step scales with that gap.
    The book's oil is a generic 900 kg/m3 oil that a pure-component pr feed
    cannot reproduce. Secondary difference: on this feed the dispersed phase
    holds 84.3 % of the two-liquid volume (the book's oil is the minor
    phase), so the Richardson-Zaki correction (n = 4.552 at Re_t = 0.322)
    and the Hazen efficiency (6.1e-4 at the book's required 1.16 m2) sit far
    from the book's design point; the settling velocity is the comparable
    anchor. The tolerance is the book's two-significant-digit print of
    0.0012 m/s. The level's validation field stays unset because the case
    does not pass.
