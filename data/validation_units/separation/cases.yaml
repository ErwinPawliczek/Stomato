# Worked V1 cases for the separation family (spec U-D).
#
# flash_drum / decanter / adsorption_bed R0 V1 candidates (Seader-Henley,
# SVA, GPSA Sect. 20 mol-sieve example) are not yet transcribed from a
# verified copy of the source — they are added when the numbers can be
# checked, not guessed. hydrate_check uses GPSA Example 20-10; the flash_drum
# case is Corripio's worked example (fully reproduced lecture notes); the
# membrane case is Geankoplis Ex. 13.4-2 (the Weller-Steiner compositions are
# complete-mixing algebra, so no equation-of-state gap applies). The Corripio
# PR-vs-ideal-K miss is recorded under `assessed`, never absorbed by the
# tolerance. Evidence gaps per row are documented in
# data/unit_models/separation.yaml.
- id: V-hydrate-gpsa-20-10
  unit: hydrate_check
  level: R0
  source: >-
    GPSA Engineering Data Book (SI), Sect. 20, Example 20-10 with the 2004 SI
    errata (K_H,MeOH = 1297; Hammerschmidt not to be used beyond 20-25 wt% MeOH,
    Nielsen-Bucklin preferred): a 14 degC hydrate-temperature depression needs
    27.5 wt% MeOH in the free-water phase (Hammerschmidt gives 25.5). The case
    fixes T_operating_K at hydrate_T - 14.0 K (hydrate_T from the catalogue
    hammerschmidt_formation at the case pressure) so the required aqueous mass
    fraction reproduces exactly that scenario. The feed carries 15 % water and
    a 1.5 mol/s methanol trim so the PR package returns a distinct water-rich
    liquid phase at the target T; the dose anchor itself is correlation-only
    (the required fraction comes from the Nielsen-Bucklin bisection).
  feeds:
    inlet:
      T: 288.15
      P: 7.0e+6
      molar_flow: 24.2449
      composition:
        N2: 0.00487
        CO2: 0.0146
        C1: 0.705
        C2: 0.06034
        C3: 0.03114
        iC4: 0.00681
        nC4: 0.00973
        iC5: 0.00389
        nC5: 0.00389
        C6+: 0.00973
        H2O: 0.15
    inhibitor_in:
      T: 288.15
      P: 7.0e+6
      molar_flow: 1.5
      composition: {MeOH: 1.0}
  params: {T_operating_K: 297.31}
  expected:
  - {quantity: info.required_inhibitor_mass_fraction, value: 0.275, tol_abs: 0.005}
- id: V-flash-corripio-2013
  unit: flash_drum
  level: R0
  source: >-
    Corripio, "Flash Distillation" lecture notes (2013), Example 1: 38 wt%
    propane / balance n-octane (z = 0.614 / 0.386 molar, 802 kmol/h = 222.78
    mol/s), drum at 3.5 atm with V/F = 0.61 gives T = 81.9 degC, y_C3 = 0.937
    by ideal-K (Antoine, Reid-Sherwood-Prausnitz). The tolerance is the book's
    rounding of 81.9 degC (+/- 0.1 K on 355.05 K), fixed before the run. The
    catalogue PR package is expected to sit above the book's ideal-K route;
    the measured miss is recorded in `assessed`, never absorbed by the
    tolerance.
  feeds:
    inlet:
      T: 303.15
      P: 4.25325e+5
      molar_flow: 222.78
      composition: {C3: 0.614, nC8: 0.386}
  params: {duty_W: null, outlet_P: 354637.5, vapor_fraction: 0.61}
  expected:
  - {quantity: outlet.gas_out.T, value: 355.05, tol_abs: 0.1}
  assessed: >-
    Measured miss (PR package, this case's feeds and params): T = 357.382 K
    (84.23 degC), 2.33 K above the book's 355.05 K; y_C3 = 0.9213 vs the
    printed 0.937. Cause: the book solves the Rachford-Rice isothermal flash
    with ideal K-values from Antoine constants (Reid-Sherwood-Prausnitz),
    while the catalogue package is Peng-Robinson, whose C3/nC8 K-values at
    these conditions are less ideal; the PVF spec then lands at a higher T.
    The book's own rounding (+/- 0.1 K) is kept as the tolerance; the miss is
    the model gap, reported here rather than absorbed.
- id: V-membrane-geankoplis-13-4-2
  unit: membrane
  level: R0
  source: >-
    Geankoplis, "Transport Processes and Separation Process Principles", 4th
    ed., Example 13.4-2 "Membrane Design for Separation of Air" (p. 767): an
    air feed (z_O2 = 0.209) at 190 cmHg with the permeate side at 19 cmHg
    (pressure ratio 10), alpha = 10 (O2 permeability / N2 permeability) and
    stage cut theta = 0.2 give a permeate y_O2 = 0.5068 and a reject
    x_O2 = 0.1345 by the Weller-Steiner complete-mixing model. Numbers read
    from the FOSSEE open transcription of Geankoplis Ch. 13
    (tbc-python.fossee.in, GeankoplisChapter13, Example 13.4-2). The
    compositions come from the complete-mixing algebra alone (thermo only
    sets the outlet states), so no equation-of-state gap applies; the
    tolerances are the book's four-decimal rounding.
  feeds:
    feed_in:
      T: 298.15
      P: 2.533125e+5
      molar_flow: 100.0
      composition: {O2: 0.209, N2: 0.791}
  params: {stage_cut: 0.2, perm_ratio: {O2: 10.0, N2: 1.0}, P_permeate: 2.533125e+4}
  expected:
  - {quantity: outlet.permeate.composition.O2, value: 0.5068, tol_abs: 0.0001}
  - {quantity: outlet.residue.composition.O2, value: 0.1345, tol_abs: 0.0001}
