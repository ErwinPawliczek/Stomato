# Method catalogue for calculation provenance (docs/provenance.md section 4).
#
# Every operation node in a trace names one of these keys. `references` is the literature
# for the method (first = the defining one); `structural: true` marks bookkeeping
# operations (copying a value, assembling a parameter set) that need no reference.
# An operation whose key is missing here, or that has no reference and is not
# structural, is flagged by the audit.

# ---------------------------------------------------------------- structural
identity:
  name: Reported value
  latex: 'y = x'
  structural: true
parameter_set:
  name: Model parameter set
  structural: true
tear_stream:
  name: Tear stream guess
  structural: true
not_applicable:
  name: Not applicable to this unit model
  latex: '0'
  structural: true
unrecorded:
  name: Unrecorded calculation
  # deliberately no reference: the audit flags every value this produces

unit_conversion:
  name: Unit conversion
  latex: 'y = c\,x + d'
  references:
    - source: bipm_si
      citation: "Bureau International des Poids et Mesures, The International System of Units (SI), 9th ed., 2019."
      url: https://www.bipm.org/en/publications/si-brochure

# ---------------------------------------------------------------- equations of state
peng_robinson_1976:
  name: Peng-Robinson EOS
  latex: 'P = \frac{RT}{v-b} - \frac{a\,\alpha(T)}{v(v+b)+b(v-b)},\quad \alpha = \left[1+\kappa\left(1-\sqrt{T/T_c}\right)\right]^2'
  references:
    - source: peng_robinson_1976
      citation: "Peng, D.-Y. and Robinson, D.B., A New Two-Constant Equation of State, Ind. Eng. Chem. Fundam. 15(1), 1976, 59-64."
      doi: 10.1021/i160057a011
peng_robinson_1978:
  name: Peng-Robinson 1978 EOS
  latex: 'P = \frac{RT}{v-b} - \frac{a\,\alpha(T)}{v(v+b)+b(v-b)},\quad \kappa_{\omega>0.491} = 0.379642 + 1.48503\,\omega - 0.164423\,\omega^2 + 0.016666\,\omega^3'
  references:
    - source: robinson_peng_1978
      citation: "Robinson, D.B. and Peng, D.-Y., The Characterization of the Heptanes and Heavier Fractions for the GPA Peng-Robinson Programs, GPA Research Report RR-28, 1978."
    - source: peng_robinson_1976
      citation: "Peng, D.-Y. and Robinson, D.B., A New Two-Constant Equation of State, Ind. Eng. Chem. Fundam. 15(1), 1976, 59-64."
      doi: 10.1021/i160057a011
soave_redlich_kwong_1972:
  name: Soave-Redlich-Kwong EOS
  latex: 'P = \frac{RT}{v-b} - \frac{a\,\alpha(T)}{v(v+b)}'
  references:
    - source: soave_1972
      citation: "Soave, G., Equilibrium Constants from a Modified Redlich-Kwong Equation of State, Chem. Eng. Sci. 27(6), 1972, 1197-1203."
      doi: 10.1016/0009-2509(72)80096-4
nrtl_1968:
  name: NRTL activity model
  latex: '\frac{G^E}{RT} = \sum_i x_i \frac{\sum_j \tau_{ji} G_{ji} x_j}{\sum_k G_{ki} x_k},\quad G_{ji} = e^{-\alpha_{ji}\tau_{ji}}'
  references:
    - source: renon_prausnitz_1968
      citation: "Renon, H. and Prausnitz, J.M., Local Compositions in Thermodynamic Excess Functions for Liquid Mixtures, AIChE J. 14(1), 1968, 135-144."
      doi: 10.1002/aic.690140124

# ---------------------------------------------------------------- flash and property calls
flash_pt:
  name: PT flash
  latex: '\sum_i \frac{z_i (K_i - 1)}{1 + \beta (K_i - 1)} = 0,\quad K_i = \hat\varphi_i^L/\hat\varphi_i^V'
  references:
    - source: michelsen_1982b
      citation: "Michelsen, M.L., The Isothermal Flash Problem. Part II. Phase-Split Calculation, Fluid Phase Equilib. 9(1), 1982, 21-40."
      doi: 10.1016/0378-3812(82)85002-4
    - source: michelsen_1982a
      citation: "Michelsen, M.L., The Isothermal Flash Problem. Part I. Stability, Fluid Phase Equilib. 9(1), 1982, 1-19."
      doi: 10.1016/0378-3812(82)85001-2
    - source: rachford_rice_1952
      citation: "Rachford, H.H. and Rice, J.D., Procedure for Use of Electronic Digital Computers in Calculating Flash Vaporization Hydrocarbon Equilibrium, J. Pet. Technol. 4(10), 1952, 19-3."
      doi: 10.2118/952327-G
flash_ph:
  name: PH flash
  latex: 'h(T, P, \mathbf{z}) = h_\mathrm{spec}\ \text{solved for}\ T'
  references:
    - source: michelsen_1999
      citation: "Michelsen, M.L., State Function Based Flash Specifications, Fluid Phase Equilib. 158-160, 1999, 617-626."
      doi: 10.1016/S0378-3812(99)00092-8
    - source: michelsen_1982b
      citation: "Michelsen, M.L., The Isothermal Flash Problem. Part II. Phase-Split Calculation, Fluid Phase Equilib. 9(1), 1982, 21-40."
      doi: 10.1016/0378-3812(82)85002-4
flash_ps:
  name: PS flash
  latex: 's(T, P, \mathbf{z}) = s_\mathrm{spec}\ \text{solved for}\ T'
  references:
    - source: michelsen_1999
      citation: "Michelsen, M.L., State Function Based Flash Specifications, Fluid Phase Equilib. 158-160, 1999, 617-626."
      doi: 10.1016/S0378-3812(99)00092-8
flash_tvf:
  name: T-vapour-fraction flash
  latex: '\beta(T, P, \mathbf{z}) = \beta_\mathrm{spec}\ \text{solved for}\ P'
  references:
    - source: michelsen_1980
      citation: "Michelsen, M.L., Calculation of Phase Envelopes and Critical Points for Multicomponent Mixtures, Fluid Phase Equilib. 4(1-2), 1980, 1-10."
      doi: 10.1016/0378-3812(80)80001-X
flash_pvf:
  name: P-vapour-fraction flash
  latex: '\beta(T, P, \mathbf{z}) = \beta_\mathrm{spec}\ \text{solved for}\ T'
  references:
    - source: michelsen_1980
      citation: "Michelsen, M.L., Calculation of Phase Envelopes and Critical Points for Multicomponent Mixtures, Fluid Phase Equilib. 4(1-2), 1980, 1-10."
      doi: 10.1016/0378-3812(80)80001-X
bubble_point:
  name: Bubble point
  latex: '\sum_i z_i K_i = 1'
  references:
    - source: michelsen_1980
      citation: "Michelsen, M.L., Calculation of Phase Envelopes and Critical Points for Multicomponent Mixtures, Fluid Phase Equilib. 4(1-2), 1980, 1-10."
      doi: 10.1016/0378-3812(80)80001-X
dew_point:
  name: Dew point
  latex: '\sum_i z_i / K_i = 1'
  references:
    - source: michelsen_1980
      citation: "Michelsen, M.L., Calculation of Phase Envelopes and Critical Points for Multicomponent Mixtures, Fluid Phase Equilib. 4(1-2), 1980, 1-10."
      doi: 10.1016/0378-3812(80)80001-X
k_values:
  name: K-values from a PT flash
  latex: 'K_i = y_i / x_i'
  references:
    - source: michelsen_1982b
      citation: "Michelsen, M.L., The Isothermal Flash Problem. Part II. Phase-Split Calculation, Fluid Phase Equilib. 9(1), 1982, 21-40."
      doi: 10.1016/0378-3812(82)85002-4
phase_props:
  name: Single-phase properties
  latex: 'h = h^{ig}(T) + h^{dep}(T, P, \mathbf{x})'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 6 (residual properties)."
derivatives:
  name: Fugacity-coefficient derivatives
  latex: '\partial \ln\hat\varphi_i / \partial T,\ \partial \ln\hat\varphi_i / \partial P'
  references:
    - source: michelsen_mollerup_2007
      citation: "Michelsen, M.L. and Mollerup, J.M., Thermodynamic Models: Fundamentals and Computational Aspects, 2nd ed., Tie-Line Publications, 2007."
pure_psat:
  name: Pure-component vapour pressure
  latex: 'P^{sat}_i(T)'
  structural: true  # the cited correlation is the parameter leaf feeding this operation

# ---------------------------------------------------------------- flowsheet solving
tear_wegstein:
  name: Tear stream converged (bounded Wegstein)
  latex: 'x_{k+1} = q\,x_k + (1-q)\,g(x_k),\quad q = \frac{s}{s-1},\ s = \frac{g(x_k)-g(x_{k-1})}{x_k - x_{k-1}}'
  references:
    - source: wegstein_1958
      citation: "Wegstein, J.H., Accelerating Convergence of Iterative Processes, Commun. ACM 1(6), 1958, 9-13."
      doi: 10.1145/368861.368871
tear_broyden:
  name: Tear stream converged (Broyden)
  latex: 'x_{k+1} = x_k - H_k\,f(x_k),\quad f(x) = g(x) - x'
  references:
    - source: broyden_1965
      citation: "Broyden, C.G., A Class of Methods for Solving Nonlinear Simultaneous Equations, Math. Comp. 19(92), 1965, 577-593."
      doi: 10.1090/S0025-5718-1965-0198670-6
tear_direct:
  name: Tear stream converged (direct substitution)
  latex: 'x_{k+1} = g(x_k)'
  references:
    - source: westerberg_1979
      citation: "Westerberg, A.W., Hutchison, H.P., Motard, R.L. and Winter, P., Process Flowsheeting, Cambridge University Press, 1979."

# ---------------------------------------------------------------- balances (unit operations)
steady_flow_energy_balance:
  name: Steady-flow energy balance
  latex: '\dot Q = F\,(h_\mathrm{out} - h_\mathrm{in})'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 2 (energy balances for steady-state flow processes)."
multi_stream_energy_balance:
  name: Steady-flow energy balance (several outlets)
  latex: '\dot Q = \sum_j F_j h_j - F_\mathrm{in} h_\mathrm{in}'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 2 (energy balances for steady-state flow processes)."
enthalpy_from_duty:
  name: Outlet enthalpy from specified duty
  latex: 'h_\mathrm{out} = h_\mathrm{in} + \dot Q / F'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 2 (energy balances for steady-state flow processes)."
adiabatic_mixing:
  name: Adiabatic mixing (energy balance)
  latex: 'h_\mathrm{mix} = \frac{\sum_i F_i h_i}{\sum_i F_i}'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 2 (energy balances for steady-state flow processes)."
mole_balance_mixing:
  name: Component mole balance (mixing)
  latex: 'F = \sum_i F_i,\quad z_j = \frac{\sum_i F_i z_{ij}}{F}'
  references:
    - source: felder_rousseau_2005
      citation: "Felder, R.M. and Rousseau, R.W., Elementary Principles of Chemical Processes, 3rd ed., Wiley, 2005, ch. 4 (material balances)."
mixer_pressure:
  name: Mixer outlet pressure = lowest inlet pressure
  latex: 'P_\mathrm{out} = \min_i P_i'
  structural: true
split_fraction:
  name: Stream split
  latex: 'F_k = s_k\,F_\mathrm{in}'
  references:
    - source: felder_rousseau_2005
      citation: "Felder, R.M. and Rousseau, R.W., Elementary Principles of Chemical Processes, 3rd ed., Wiley, 2005, ch. 4 (material balances)."
pressure_drop:
  name: Specified pressure drop
  latex: 'P_\mathrm{out} = P_\mathrm{in} - \Delta P'
  structural: true
phase_split:
  name: Equilibrium phase split into outlets
  latex: 'F_k = \beta_k F,\quad \mathbf{x}_k = \mathbf{x}^{(k)}'
  references:
    - source: michelsen_1982b
      citation: "Michelsen, M.L., The Isothermal Flash Problem. Part II. Phase-Split Calculation, Fluid Phase Equilib. 9(1), 1982, 21-40."
      doi: 10.1016/0378-3812(82)85002-4
isentropic_compression:
  name: Isentropic efficiency (compressor)
  latex: 'h_\mathrm{out} = h_\mathrm{in} + \frac{h_s(P_\mathrm{out}, s_\mathrm{in}) - h_\mathrm{in}}{\eta_s}'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 7 (compression processes)."
isentropic_expansion:
  name: Isentropic efficiency (expander/turbine)
  latex: 'h_\mathrm{out} = h_\mathrm{in} + \eta_s\,\left(h_s(P_\mathrm{out}, s_\mathrm{in}) - h_\mathrm{in}\right)'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 7 (turbines/expanders)."
shaft_power:
  name: Shaft power from enthalpy change
  latex: '\dot W = F\,(h_\mathrm{out} - h_\mathrm{in})'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 7 (compression processes)."
pump_hydraulic_power:
  name: Pump shaft power (incompressible liquid)
  latex: '\dot W = \frac{Q\,\Delta P}{\eta},\quad Q = \dot m / \rho'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 7 (pumps)."
volumetric_flow:
  name: Volumetric flow
  latex: 'Q = \dot m / \rho'
  structural: true
pump_head:
  name: Pump head
  latex: 'H = \frac{\Delta P}{\rho\,g_n}'
  references:
    - source: bipm_si
      citation: "Bureau International des Poids et Mesures, The International System of Units (SI), 9th ed., 2019 (standard acceleration of gravity g_n = 9.80665 m/s2)."
      url: https://www.bipm.org/en/publications/si-brochure
pressure_ratio:
  name: Pressure ratio
  latex: 'r = P_\mathrm{out} / P_\mathrm{in}'
  structural: true
isenthalpic_expansion:
  name: Isenthalpic (Joule-Thomson) expansion
  latex: 'h_\mathrm{out} = h_\mathrm{in}'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 7 (throttling processes)."
temperature_difference:
  name: Temperature change
  latex: '\Delta T = T_\mathrm{out} - T_\mathrm{in}'
  structural: true
lmtd:
  name: Log-mean temperature difference
  latex: '\Delta T_\mathrm{lm} = \frac{\Delta T_1 - \Delta T_2}{\ln(\Delta T_1/\Delta T_2)}'
  references:
    - source: kern_1950
      citation: "Kern, D.Q., Process Heat Transfer, McGraw-Hill, 1950, ch. 5."
ua_from_duty:
  name: Overall conductance from duty
  latex: 'UA = \dot Q / (F_t\,\Delta T_\mathrm{lm})'
  references:
    - source: kern_1950
      citation: "Kern, D.Q., Process Heat Transfer, McGraw-Hill, 1950, ch. 5."

# ---------------------------------------------------------------- reactions
reaction_extent:
  name: Reaction extent from conversion
  latex: '\xi = X\,F_{\mathrm{key,in}} / |\nu_\mathrm{key}|,\quad F_{i,\mathrm{out}} = F_{i,\mathrm{in}} + \sum_r \nu_{ir}\,\xi_r'
  references:
    - source: fogler_2006
      citation: "Fogler, H.S., Elements of Chemical Reaction Engineering, 4th ed., Prentice Hall, 2006, ch. 2-3 (conversion and stoichiometry)."
gibbs_minimization:
  name: Gibbs energy minimization
  latex: '\min_{\mathbf{n}} G = \sum_i n_i \mu_i\ \ \text{s.t.}\ \ A\mathbf{n} = \mathbf{b}'
  references:
    - source: white_johnson_dantzig_1958
      citation: "White, W.B., Johnson, S.M. and Dantzig, G.B., Chemical Equilibrium in Complex Mixtures, J. Chem. Phys. 28(5), 1958, 751-755."
      doi: 10.1063/1.1744264
equilibrium_constant:
  name: Equilibrium constant from Gibbs energy of reaction
  latex: 'K = \exp\left(-\Delta_r G^\circ / RT\right)'
  references:
    - source: svna_2005
      citation: "Smith, J.M., Van Ness, H.C. and Abbott, M.M., Introduction to Chemical Engineering Thermodynamics, 7th ed., McGraw-Hill, 2005, ch. 13 (chemical-reaction equilibria)."
cstr_design:
  name: CSTR design equation
  latex: 'F_{i,\mathrm{out}} = F_{i,\mathrm{in}} + V\sum_r \nu_{ir} r_r(\mathbf{c}_\mathrm{out}, T)'
  references:
    - source: fogler_2006
      citation: "Fogler, H.S., Elements of Chemical Reaction Engineering, 4th ed., Prentice Hall, 2006, ch. 1-2 (mole balances)."
pfr_design:
  name: PFR design equation
  latex: '\frac{dF_i}{dV} = \sum_r \nu_{ir} r_r'
  references:
    - source: fogler_2006
      citation: "Fogler, H.S., Elements of Chemical Reaction Engineering, 4th ed., Prentice Hall, 2006, ch. 1-2 (mole balances)."
yield_shift:
  name: Specified product yields
  latex: 'F_{i,\mathrm{out}} = Y_i\,F_\mathrm{basis}'
  structural: true

# ---------------------------------------------------------------- columns
column_inside_out:
  name: Rigorous column (inside-out)
  latex: '\text{MESH: } L_j x_{ij} + V_j y_{ij} = \ldots,\ y_{ij} = K_{ij} x_{ij},\ \sum x = \sum y = 1,\ H_j\ \text{balance}'
  references:
    - source: boston_sullivan_1974
      citation: "Boston, J.F. and Sullivan, S.L., A New Class of Solution Methods for Multicomponent, Multistage Separation Processes, Can. J. Chem. Eng. 52(1), 1974, 52-63."
      doi: 10.1002/cjce.5450520108
    - source: naphtali_sandholm_1971
      citation: "Naphtali, L.M. and Sandholm, D.P., Multicomponent Separation Calculations by Linearization, AIChE J. 17(1), 1971, 148-153."
      doi: 10.1002/aic.690170130
column_shortcut:
  name: Shortcut column (Fenske-Underwood-Gilliland)
  latex: 'N_\mathrm{min} = \frac{\ln\left[(x_{LK}/x_{HK})_D (x_{HK}/x_{LK})_B\right]}{\ln \alpha_{LK,HK}}'
  references:
    - source: fenske_1932
      citation: "Fenske, M.R., Fractionation of Straight-Run Pennsylvania Gasoline, Ind. Eng. Chem. 24(5), 1932, 482-485."
      doi: 10.1021/ie50269a003
    - source: underwood_1948
      citation: "Underwood, A.J.V., Fractional Distillation of Multicomponent Mixtures, Chem. Eng. Prog. 44(8), 1948, 603-614."
    - source: gilliland_1940
      citation: "Gilliland, E.R., Multicomponent Rectification: Estimation of the Number of Theoretical Plates as a Function of the Reflux Ratio, Ind. Eng. Chem. 32(9), 1940, 1220-1223."
      doi: 10.1021/ie50369a035
