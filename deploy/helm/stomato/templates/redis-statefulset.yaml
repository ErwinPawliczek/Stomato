{{- $fullname := include "stomato.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "stomato.componentLabels" (dict "component" "redis" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "stomato.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- if and .Values.redis.bundled (empty .Values.redis.url) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "stomato.componentLabels" (dict "component" "redis" "context" $) | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "stomato.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "stomato.componentLabels" (dict "component" "redis" "context" $) | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
{{- end }}
