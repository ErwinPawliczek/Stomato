{{- $fullname := include "stomato.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "stomato.componentLabels" (dict "component" "api" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
  selector:
    {{- include "stomato.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
