{{/* One config Secret: API tokens, CORS origins, database/queue URLs, and (when
     bundled) the generated Postgres password. Every workload references it via
     envFrom — see docs/deploy.md for the env reference. */}}
{{- $fullname := include "stomato.fullname" . -}}
{{- $pgBundled := and .Values.postgres.bundled (empty .Values.postgres.url) -}}
{{- $redisBundled := and .Values.redis.bundled (empty .Values.redis.url) -}}
{{- $pgPassword := "" -}}
{{- if $pgBundled -}}
  {{- if .Values.postgres.password -}}
    {{- $pgPassword = .Values.postgres.password -}}
  {{- else -}}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname -}}
    {{- if $existing -}}
      {{- $pgPassword = index $existing.data "stomato-postgres-password" | b64dec -}}
    {{- else -}}
      {{- $pgPassword = randAlphaNum 24 -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $dbUrl := .Values.postgres.url -}}
{{- if empty $dbUrl -}}
  {{- if $pgBundled -}}
    {{- $dbUrl = printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.user $pgPassword $fullname .Values.postgres.database -}}
  {{- else -}}
    {{- fail "postgres.url is empty and postgres.bundled is false: no database would be reachable" -}}
  {{- end -}}
{{- end -}}
{{- $redisUrl := .Values.redis.url -}}
{{- if empty $redisUrl -}}
  {{- if $redisBundled -}}
    {{- $redisUrl = printf "redis://%s-redis:6379/0" $fullname -}}
  {{- else -}}
    {{- fail "redis.url is empty and redis.bundled is false: no queue would be reachable" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "stomato.labels" . | nindent 4 }}
type: Opaque
stringData:
  STOMATO_DATABASE_URL: {{ $dbUrl | quote }}
  STOMATO_REDIS_URL: {{ $redisUrl | quote }}
  STOMATO_API_TOKENS: {{ .Values.auth.tokens | quote }}
  STOMATO_CORS_ORIGINS: {{ .Values.cors.origins | quote }}
  {{- if $pgBundled }}
  stomato-postgres-password: {{ $pgPassword | quote }}
  {{- end }}
