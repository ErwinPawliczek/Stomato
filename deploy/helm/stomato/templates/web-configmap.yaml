{{- $fullname := include "stomato.fullname" . -}}
{{- $apiPort := .Values.api.port -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "stomato.componentLabels" (dict "component" "web" "context" $) | nindent 4 }}
data:
  default.conf: |
    # Overrides the image's default config so /api proxies to the chart's api
    # Service (the image default points at the compose service name `api`).
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;
      location /api/ {
        proxy_pass http://{{ $fullname }}-api:{{ $apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived Server-Sent Events (solve-job progress): no buffering, no
        # short read timeout.
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
      location / {
        try_files $uri $uri/ /index.html;
      }
    }
