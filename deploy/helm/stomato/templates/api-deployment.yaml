{{- $fullname := include "stomato.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "stomato.componentLabels" (dict "component" "api" "context" $) | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stomato.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "stomato.componentLabels" (dict "component" "api" "context" $) | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api }}:{{ include "stomato.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
